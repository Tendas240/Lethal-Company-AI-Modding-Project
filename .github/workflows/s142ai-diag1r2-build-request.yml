name: Request canonical S1.42AI-DIAG1R2 build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1r2-build-request.yml'

permissions:
  contents: write
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and bind applicability-repaired DIAG1 successor
        shell: bash
        run: |
          python BuildSpecs/generate_s142ai_diag1_spec.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          current = json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          if current.get('enabled') is not False:
              raise RuntimeError('Build controller must be disabled before the R2 request')
          if current.get('build_id') != 'IDLE_AFTER_S1.42AI-DIAG1R1_APPLICABILITY_REPAIR_LANDED_AWAITING_SUCCESSOR_DETERMINATION':
              raise RuntimeError(f"Unexpected pre-R2 build controller state: {current.get('build_id')}")

          state = json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          if state.get('accepted_baseline', {}).get('build_id') != 'S1.42AH':
              raise RuntimeError('Accepted baseline drifted before R2 request')
          if state.get('active_candidate') is not None or state.get('runtime_test_outstanding') is not False:
              raise RuntimeError('R2 request requires no active candidate and no outstanding runtime test')
          repair = state.get('selected_scope', {}).get('applicability_repair', {})
          if repair.get('status') != 'LANDED_ON_MAIN_STATIC_AND_MATERIALIZED_VALIDATED':
              raise RuntimeError('Landed applicability repair is not canonical in CURRENT_STATE')
          if repair.get('dependency_guid') != 'kite.ZelevatorCode':
              raise RuntimeError('Unexpected EndlessElevator dependency GUID in CURRENT_STATE')

          evidence = json.loads(Path('AnalysisEvidence/S1.42AI-DIAG1R1/ENDLESS_ELEVATOR_APPLICABILITY.json').read_text(encoding='utf-8'))
          required_evidence = {
              'status': 'PROVEN_OPTIONAL_COMPAT_APPLICABILITY_CONTRACT',
              'applicability': 'NOT_APPLICABLE_DEPENDENCY_ABSENT',
              'dependency_guid': 'kite.ZelevatorCode',
              'provider_assembly': 'kite.ZelevatorCode',
              'provider_type': 'ElevatorMod.Patches.EndlessElevator',
              'owner_type': 'LethalMin.Compats.EndlessElevatorPatch',
              'owner_method': 'WaitRespawnPikmin',
              'dependency_gate': 'Chainloader.PluginInfos.ContainsKey(pluginGUID)',
          }
          for key, expected in required_evidence.items():
              actual = evidence.get(key)
              if actual != expected:
                  raise RuntimeError(f'Applicability evidence drift for {key}: {actual!r} != {expected!r}')
          contract = evidence.get('contract', {})
          if contract.get('generic_missing_target_fallback') is not False:
              raise RuntimeError('Generic missing-target fallback must remain false')

          source = Path('Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs').read_text(encoding='utf-8')
          required_source = [
              'using BepInEx.Bootstrap;',
              'AddEndlessElevatorCompatTarget(targets)',
              'EndlessElevatorDependencyGuid = "kite.ZelevatorCode"',
              'Chainloader.PluginInfos.TryGetValue(EndlessElevatorDependencyGuid',
              '[DIAG1_COMPLEX_TARGET_NOT_APPLICABLE]',
              '[DIAG1_COMPLEX_TARGET_APPLICABLE]',
          ]
          for needle in required_source:
              if needle not in source:
                  raise RuntimeError(f'Missing applicability-repair source marker: {needle}')
          if 'ResolveRequiredType("ElevatorMod.Patches.EndlessElevator")' in source:
              raise RuntimeError('Known-bad unconditional EndlessElevator resolver is present')

          draft_path = Path('BuildSpecs/S1.42AI-DIAG1_DRAFT.json')
          raw = draft_path.read_bytes()
          expected_draft_sha = '30450b982f33214699780724df06f0caff9d850710e890bf2a655538cdfa5087'
          actual_draft_sha = hashlib.sha256(raw).hexdigest()
          if actual_draft_sha != expected_draft_sha:
              raise RuntimeError(f'DIAG1 draft SHA mismatch: {actual_draft_sha} != {expected_draft_sha}')

          spec = json.loads(raw.decode('utf-8'))
          if spec.get('enabled') is not False:
              raise RuntimeError('Validated DIAG1 draft is not disabled')
          if spec.get('build_id') != 'S1.42AI-DIAG1':
              raise RuntimeError('Unexpected source DIAG1 build_id')
          if spec.get('base_profile') != 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z':
              raise RuntimeError('Unexpected DIAG1 base profile')
          if spec.get('base_sha256') != 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2':
              raise RuntimeError('Unexpected DIAG1 base SHA')
          if len(spec.get('config_patches', [])) != 235:
              raise RuntimeError('Unexpected DIAG1 config patch count')
          if len(spec.get('text_assertions', [])) != 47:
              raise RuntimeError('Unexpected DIAG1 assertion count')
          if spec.get('mod_state_changes') != [] or spec.get('mod_additions') != [] or spec.get('mod_removals') != []:
              raise RuntimeError('Unexpected DIAG1 package state delta')
          if len(spec.get('local_plugin_builds', [])) != 1:
              raise RuntimeError('Unexpected DIAG1 local plugin build count')

          output = Path('Profiles/LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair.r2z')
          snapshot = Path('ProfileSources/S1.42AI-DIAG1R2')
          if output.exists() or snapshot.exists():
              raise RuntimeError('R2 output identity already exists; refusing overwrite/reuse')

          spec['enabled'] = True
          spec['build_id'] = 'S1.42AI-DIAG1R2'
          spec['output_profile'] = str(output)
          spec['profile_name'] = 'LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair'
          spec['snapshot_dir'] = str(snapshot)
          Path('BuildSpecs/current.json').write_text(json.dumps(spec, indent=2) + '\n', encoding='utf-8')
          draft_path.unlink()
          PY

      - name: Remove completed one-shot request workflow
        run: git rm .github/workflows/s142ai-diag1r2-build-request.yml

      - name: Verify exact R2 controller transition diff
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              '.github/workflows/s142ai-diag1r2-build-request.yml',
              'BuildSpecs/current.json',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise RuntimeError(f'unexpected request diff: {sorted(actual)}')
          spec = json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          if spec.get('enabled') is not True or spec.get('build_id') != 'S1.42AI-DIAG1R2':
              raise RuntimeError('Build controller is not the exact enabled DIAG1R2 request')
          if spec.get('base_profile') != 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z':
              raise RuntimeError('Unexpected R2 base profile')
          if spec.get('base_sha256') != 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2':
              raise RuntimeError('Unexpected R2 base SHA')
          if spec.get('output_profile') != 'Profiles/LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair.r2z':
              raise RuntimeError('Unexpected R2 output profile')
          if spec.get('profile_name') != 'LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair':
              raise RuntimeError('Unexpected R2 profile name')
          if spec.get('snapshot_dir') != 'ProfileSources/S1.42AI-DIAG1R2':
              raise RuntimeError('Unexpected R2 snapshot dir')
          if len(spec.get('local_plugin_builds', [])) != 1:
              raise RuntimeError('R2 lost the exact diagnostic local-plugin build')
          PY
          git diff --check

      - name: Commit exact DIAG1R2 build request
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Request canonical S1.42AI-DIAG1R2 build'
          git push origin HEAD:main

      - name: Dispatch canonical profile build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run profile-build.yml --ref main
