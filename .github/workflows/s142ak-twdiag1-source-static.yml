name: S1.42AK TWDIAG1 source and pure static gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKTWDiag1/**'
      - 'AnalysisTools/validate_s142ak_twdiag1_source.py'
      - 'SourceEvidence/UniversalInteriorViability/TWDIAG1SourceStatic/**'
      - 'Current/303_S1.42AK_PHASE_C_TOWER_TWDIAG1_SOURCE_STATIC_IMPLEMENTATION_CHECKPOINT.md'
      - 'Knowledge/INTERIORS_AND_LLL.md'
      - '.github/workflows/s142ak-twdiag1-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test pure Tower fail-closed selection policy
        run: dotnet run --project Patches/S142AKTWDiag1/Tests/Policy.Tests.csproj -c Release
      - name: Compile diagnostic plugin source only
        working-directory: Patches/S142AKTWDiag1
        run: dotnet build S142AKTWDiag1.csproj -c Release
      - name: Verify source-only one-patch fail-closed contract and controller preservation
        run: python AnalysisTools/validate_s142ak_twdiag1_source.py
