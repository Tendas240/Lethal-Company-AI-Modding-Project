name: C3 validate BMAFR1 runtime compatibility reconciliation

on:
  push:
    branches:
      - c3-bmafr1-runtime-compatibility-pass

permissions:
  contents: write

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c3-bmafr1-runtime-compatibility-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact cumulative BMAFR1 runtime evidence and state
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          first_path = root / 'RuntimeEvidence/S1.42AK-BMAFR1/20261002T154834Z/raw/LogOutput.log'
          supp_path = root / 'RuntimeEvidence/S1.42AK-BMAFR1/20261002T164741Z/raw/LogOutput.log'

          first = first_path.read_bytes()
          supp = supp_path.read_bytes()
          assert hashlib.sha256(first).hexdigest() == '3113a1c9df2e1db231cf6aa0e7dc20699894a8646da3eaf7fd1ce0c3d89ac42b'
          assert hashlib.sha256(supp).hexdigest() == 'ca2d83a56115f66623c3dfb38d2cdd47085b3c0a368efc3ace29321a323b4d90'

          first_log = first.decode('utf-8', errors='replace')
          log = supp.decode('utf-8', errors='replace')

          for needle in (
              '[BMAFDIAG1] ARMED',
              '[BMAFDIAG1] SELECTED Black Mesa Abandoned Foundry / FoundryFlow; pre-reduction viable wrapper confirmed; normalized rarity=100; pool=32->1',
              '[BMAFDIAG1] TOPOLOGY_OK ids=0,1,2,3 uniqueOppositePairs=4',
              'Players finished generating the new floor',
          ):
              assert needle in log, needle

          for entrance_id in (0, 1, 2, 3):
              assert f'[BMAFDIAG1] TRAVERSED id={entrance_id} sourceSide=outside targetSide=inside' in log
              assert f'[BMAFDIAG1] TRAVERSED id={entrance_id} sourceSide=inside targetSide=outside' in log

          final_coverage = (
              '[BMAFDIAG1] COVERAGE '
              'id0=outside>inside:1,inside>outside:1;'
              'id1=outside>inside:1,inside>outside:1;'
              'id2=outside>inside:1,inside>outside:1;'
              'id3=outside>inside:1,inside>outside:1'
          )
          assert final_coverage in log

          for needle in (
              '[BMAFDIAG1] REFUSED',
              'TOPOLOGY_INCONCLUSIVE',
              'TRAVERSAL_INCONCLUSIVE',
              'OBSERVER_INCONCLUSIVE',
          ):
              assert needle not in log, needle

          array_sig = 'Array index (0) is out of bounds (size=0)'
          assert first_log.count(array_sig) == 0
          assert log.count(array_sig) == 6696

          state = json.loads((root / 'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert state['accepted_baseline']['build_id'] == 'S1.42AK'
          assert state['active_candidate']['build_id'] == 'S1.42AK-BMDSFIX1'
          assert state['runtime_test_outstanding'] is True
          assert state['controllers']['runtime_active_build'] == 'S1.42AK-BMDSFIX1'
          assert (root / 'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'

          scope = state['selected_scope']
          assert scope['status'] == 'PHASE_C3_BMAFR1_RUNTIME_COMPATIBILITY_PASS_PERFORMANCE_ATTRIBUTION_OUTSTANDING_BMDSFIX1_TARGET_PASSIVE_OUTSTANDING'
          assert scope['phase_c']['black_mesa_abandoned_foundry_status'] == 'PASS_RUNTIME_COMPATIBLE_BLACK_MESA_ABANDONED_FOUNDRY_DIAGNOSTIC_ONLY_PERFORMANCE_ATTRIBUTION_SEPARATE'
          assert scope['phase_c']['bmafr1_supplemental_runtime_log_sha256'] == 'ca2d83a56115f66623c3dfb38d2cdd47085b3c0a368efc3ace29321a323b4d90'
          assert scope['phase_c']['bmafr1_performance_attribution_status'] == 'OUTSTANDING_ARRAY_INDEX_FLOOD_USER_VISIBLE_FRAME_RATE_DEGRADATION_ROOT_CAUSE_NOT_ESTABLISHED'

          diag = scope['diagnostic_revision']
          assert diag['status'] == 'PUBLISHED_DIAGNOSTIC_RUNTIME_COMPATIBILITY_PASS_NOT_ACTIVE_NOT_ACCEPTED'
          assert diag['runtime_armed'] is False
          assert diag['runtime_log_sha256'] == 'ca2d83a56115f66623c3dfb38d2cdd47085b3c0a368efc3ace29321a323b4d90'
          assert diag['supplemental_run_status'] == 'COMPLETE_ID2_BIDIRECTIONAL_FINAL_IDS_0_1_2_3_BIDIRECTIONAL'
          assert diag['performance_attribution_status'] == 'OUTSTANDING_ARRAY_INDEX_FLOOD_USER_VISIBLE_FRAME_RATE_DEGRADATION_ROOT_CAUSE_NOT_ESTABLISHED'

          decision = root / 'Current/226_S1.42AK_BMAFR1_RUNTIME_COMPATIBILITY_PASS_AND_PERFORMANCE_FINDING.md'
          assert decision.is_file()

          integrity = json.loads((root / 'Current/ARTIFACT_EVIDENCE_INTEGRITY.json').read_text(encoding='utf-8'))
          completed = [x for x in integrity.get('profiles', []) if x.get('build_id') == 'S1.42AK-BMAFR1']
          pending = [x for x in integrity.get('pending_profiles', []) if x.get('build_id') == 'S1.42AK-BMAFR1']
          assert len(completed) == 1
          assert not pending
          assert completed[0]['role'] == 'RUNTIME_DIAGNOSTIC_PASS_NOT_GAMEPLAY_BASE'
          assert completed[0]['runtime_log_sha256'] == 'ca2d83a56115f66623c3dfb38d2cdd47085b3c0a368efc3ace29321a323b4d90'
          assert completed[0]['decision'] == 'Current/226_S1.42AK_BMAFR1_RUNTIME_COMPATIBILITY_PASS_AND_PERFORMANCE_FINDING.md'

      - name: Regenerate and verify protected current navigation
        run: |
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Validate canonical repository contracts
        run: |
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Verify bounded delta
        shell: python
        run: |
          import subprocess
          changed = []
          for line in subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.append(path)
          forbidden = ('Profiles/', 'ProfileSources/', 'BuildSpecs/', 'RuntimeEvidence/', 'SourceEvidence/', 'Patches/')
          bad = [p for p in changed if p.startswith(forbidden)]
          assert not bad, bad

      - name: Remove one-shot workflow
        run: rm .github/workflows/c3-bmafr1-runtime-pass-validation.yml

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Commit renderer outputs and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Finalize BMAFR1 runtime compatibility reconciliation"
          git push origin HEAD:c3-bmafr1-runtime-compatibility-pass
