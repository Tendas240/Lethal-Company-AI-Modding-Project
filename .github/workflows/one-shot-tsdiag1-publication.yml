name: One-shot TSDIAG1 exact-byte publication

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-tsdiag1-publication.yml'
      - 'Profiles/LC V1 S1.42AK-TS1.r2z'
      - 'ProfileSources/S1.42AK-TSDIAG1/**'

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'publish/s142ak-tsdiag1-exact-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_ID: '11615262607'
      ARTIFACT_SHA256: '010b84c1ffaea1d5cda2e14cdb9580c049da2cd1790e929491e44d13e2c4f39f'
      PROFILE_PATH: 'Profiles/LC V1 S1.42AK-TS1.r2z'
      PROFILE_SHA256: 'd6bf5e5c185945e6aad85ec0dc1c4cda5628ff7d9335b93f53f7097c5a19b57e'
      SNAPSHOT_PATH: 'ProfileSources/S1.42AK-TSDIAG1'
      DLL_SHA256: 'fff3b148fca3bc0bf6c175f38060a432a2992e7d6de4121df9a2556bb82ca201'
      PARENT_SHA256: '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publication boundary before transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main -- \
            BuildSpecs/current.json \
            RuntimeInbox/ACTIVE_BUILD.txt \
            Current/AUTO_BUILD_RESULT.json \
            Current/AUTO_BUILD_RESULT.md \
            Profiles/EXPECTED_HASHES.json
          python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-TSDIAG1.json

      - name: Download and validate frozen review artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .publication-artifact
          mkdir -p .publication-artifact/extracted
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" > .publication-artifact/metadata.json
          python - <<'PY'
          import json, os, pathlib
          m=json.loads(pathlib.Path('.publication-artifact/metadata.json').read_text())
          required={
              'id': int(os.environ['ARTIFACT_ID']),
              'expired': False,
              'digest': 'sha256:'+os.environ['ARTIFACT_SHA256'],
              'name': 'S1.42AK-TSDIAG1-review-24105017a0d98ccc05b878c809f84f93f4e87e37',
              'size_in_bytes': 537308,
          }
          for key, val in required.items():
              if m.get(key) != val:
                  raise SystemExit(f'original artifact metadata mismatch: {key}')
          run=m.get('workflow_run') or {}
          if run.get('id') != 37929246619 or run.get('head_sha') != '24105017a0d98ccc05b878c809f84f93f4e87e37':
              raise SystemExit('wrong original artifact producer run/head')
          PY
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o .publication-artifact/review.zip
          echo "${ARTIFACT_SHA256}  .publication-artifact/review.zip" | sha256sum --check --strict
          unzip -q .publication-artifact/review.zip -d .publication-artifact/extracted
          echo "${PROFILE_SHA256}  .publication-artifact/extracted/${PROFILE_PATH}" | sha256sum --check --strict
          echo "${DLL_SHA256}  .publication-artifact/extracted/DLL/S142AKTSDiag1.dll" | sha256sum --check --strict

          python - <<'PY'
          import hashlib, json, os, pathlib, shutil, zipfile

          outer_zip = pathlib.Path('.publication-artifact/review.zip')
          with zipfile.ZipFile(outer_zip) as outer:
              if outer.testzip() is not None:
                  raise SystemExit('outer Actions ZIP CRC failed')
              outer_names = outer.namelist()
              if len(outer_names) != 4 or len(set(outer_names)) != 4:
                  raise SystemExit('outer Actions ZIP four-member uniqueness mismatch')
          artifact = pathlib.Path('.publication-artifact/extracted')
          checkpoint = json.loads(pathlib.Path(
              'BuildSpecs/S1.42AK-TSDIAG1_BUILD_EVIDENCE/REVIEW_BUILD_CHECKPOINT.json'
          ).read_text(encoding='utf-8'))

          assert checkpoint['status'] == 'PASS_INACTIVE_REVIEW_BUILD_INDEPENDENTLY_REHASHED'
          assert checkpoint['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
          assert checkpoint['artifact_id'] == int(os.environ['ARTIFACT_ID'])
          assert checkpoint['artifact_name'] == 'S1.42AK-TSDIAG1-review-24105017a0d98ccc05b878c809f84f93f4e87e37'
          assert checkpoint['build_head'] == '24105017a0d98ccc05b878c809f84f93f4e87e37'
          assert checkpoint['build_workflow_run'] == 37929246619
          assert checkpoint['zip_sha256'] == os.environ['ARTIFACT_SHA256']
          assert checkpoint['profile_sha256'] == os.environ['PROFILE_SHA256']
          assert checkpoint['dll_sha256'] == os.environ['DLL_SHA256']
          assert checkpoint['parent_sha256'] == os.environ['PARENT_SHA256']
          assert checkpoint['independent_artifact_rehash_match'] is True
          assert checkpoint['parent_members'] == 337 and checkpoint['review_members'] == 338
          assert checkpoint['added_members'] == ['BepInEx/plugins/S142AKTSDiag1/S142AKTSDiag1.dll']
          assert checkpoint['changed_existing_members'] == ['export.r2x']
          assert checkpoint['removed_members'] == []
          assert checkpoint['package_changes'] == 0 and checkpoint['config_changes'] == 0
          assert checkpoint['negative_cases_passed'] == 8
          assert checkpoint['independent_parent_archive_redownloaded'] is False

          def sha(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          expected_members = {
              'DLL/S142AKTSDiag1.dll': 'fff3b148fca3bc0bf6c175f38060a432a2992e7d6de4121df9a2556bb82ca201',
              'Evidence/STATIC_VERIFICATION.json': '890e68c5995c7aabfecf6e45b784c49baf252b15ed92688dd17db0c66d5aeaa2',
              'Evidence/BUILD_RESULT.json': '9a34b7f1d7b5dd910913e1a39ed033de98f76d8542065f244e64e6f7f400235a',
              'Profiles/LC V1 S1.42AK-TS1.r2z': 'd6bf5e5c185945e6aad85ec0dc1c4cda5628ff7d9335b93f53f7097c5a19b57e',
          }
          actual_files = sorted(
              p.relative_to(artifact).as_posix()
              for p in artifact.rglob('*') if p.is_file()
          )
          if actual_files != sorted(expected_members):
              raise SystemExit(f'artifact file set mismatch: {actual_files!r}')
          for rel, expected in expected_members.items():
              actual = sha((artifact / rel).read_bytes())
              if actual != expected:
                  raise SystemExit(f'artifact member SHA mismatch: {rel}: {actual}')

          profile = artifact / os.environ['PROFILE_PATH']
          with zipfile.ZipFile(profile) as z:
              bad = z.testzip()
              if bad is not None:
                  raise SystemExit(f'profile ZIP CRC failed at {bad}')
              infos = z.infolist()
              names = [i.filename for i in infos]
              if len(names) != 338 or len(names) != len(set(names)):
                  raise SystemExit(f'unexpected review archive members: {len(names)} / {len(set(names))}')

              parent_profile = pathlib.Path('Profiles/LC V1 S1.42AK-BMDSFIX1 Black Mesa Deep Sewers Size Fix.r2z')
              parent_bytes = parent_profile.read_bytes()
              if sha(parent_bytes) != os.environ['PARENT_SHA256']:
                  raise SystemExit('actual checked-out BMDSFIX1 parent bytes differ from pinned SHA')
              with zipfile.ZipFile(parent_profile) as parent_zip:
                  if parent_zip.testzip() is not None:
                      raise SystemExit('actual parent CRC failed')
                  parent_names = parent_zip.namelist()
                  if len(parent_names) != 337 or len(parent_names) != len(set(parent_names)):
                      raise SystemExit('actual parent member count/uniqueness mismatch')
                  if names[:337] != parent_names:
                      raise SystemExit('actual parent path order differs')
                  for member in parent_names:
                      if member == 'export.r2x':
                          continue
                      if parent_zip.read(member) != z.read(member):
                          raise SystemExit(f'actual parent member byte drift: {member}')
                  actual_parent_export = parent_zip.read('export.r2x')

              parent_index = json.loads(pathlib.Path(
                  'ProfileSources/S1.42AK-BMDSFIX1/FILE_INDEX.json'
              ).read_text(encoding='utf-8'))
              parent_result = json.loads(pathlib.Path(
                  'ProfileSources/S1.42AK-BMDSFIX1/PROFILE_INDEX_RESULT.json'
              ).read_text(encoding='utf-8'))
              if parent_result['sha256'] != os.environ['PARENT_SHA256']:
                  raise SystemExit('parent profile-index SHA mismatch')
              parent_paths = [row['path'] for row in parent_index]
              if len(parent_paths) != 337:
                  raise SystemExit(f'parent snapshot row count mismatch: {len(parent_paths)}')

              added = 'BepInEx/plugins/S142AKTSDiag1/S142AKTSDiag1.dll'
              if names[:337] != parent_paths or names[337:] != [added]:
                  raise SystemExit('review member order/delta differs from exact indexed parent')

              for row in parent_index:
                  path = row['path']
                  if path == 'export.r2x':
                      continue
                  actual = sha(z.read(path))
                  if actual != row['sha256']:
                      raise SystemExit(f'parent member drift: {path}: {actual}')

              parent_export = pathlib.Path(
                  'ProfileSources/S1.42AK-BMDSFIX1/export.r2x'
              ).read_bytes()
              parent_export_hash = sha(parent_export)
              expected_parent_export_hash = next(
                  row['sha256'] for row in parent_index if row['path'] == 'export.r2x'
              )
              if parent_export_hash != expected_parent_export_hash:
                  raise SystemExit('parent export snapshot is not byte-exact')
              if actual_parent_export != parent_export:
                  raise SystemExit('actual BMDSFIX1 export differs from canonical byte snapshot')

              old = b'profileName: LC V1 S1.42AK-BMDSFIX1 Black Mesa Deep Sewers Size Fix'
              new = b'profileName: LC V1 S1.42AK-TS1'
              if parent_export.count(old) != 1:
                  raise SystemExit('parent profileName multiplicity mismatch')
              expected_export = parent_export.replace(old, new, 1)
              if z.read('export.r2x') != expected_export:
                  raise SystemExit('review export differs beyond exact profileName replacement')

              dll = z.read(added)
              if sha(dll) != os.environ['DLL_SHA256']:
                  raise SystemExit('TSDIAG1 DLL SHA mismatch inside profile')
              if dll != (artifact / 'DLL/S142AKTSDiag1.dll').read_bytes():
                  raise SystemExit('profile DLL differs from separately frozen DLL')
              for label, needle in (
                  ('assembly', b'S142AKTSDiag1'),
                  ('GUID', b'tendas.lethalcompany.s142aktsdiag1'),
                  ('version', b'1.0.0'),
                  ('marker', '[TSDIAG1]'.encode('utf-16le')),
              ):
                  if needle not in dll:
                      raise SystemExit(f'compiled DLL identity missing: {label}')
              for inherited, pinned in (
                  ('BepInEx/plugins/S142AKBMDSFix1/S142AKBMDSFix1.dll', 'f337da49f4a0e75bf2753e17e3abc52cdbea56ba37eddec5f1065b17f4d75a92'),
                  ('BepInEx/plugins/S142ABInteriorWeightNormalization/S142ABInteriorWeightNormalization.dll', '901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'),
              ):
                  if sha(z.read(inherited)) != pinned:
                      raise SystemExit(f'Inherited DLL drift: {inherited}')

              first_line = z.read('export.r2x').decode('utf-8-sig').splitlines()[0]
              if first_line != 'profileName: LC V1 S1.42AK-TS1':
                  raise SystemExit(f'profile identity mismatch: {first_line!r}')

              snapshot = pathlib.Path(os.environ['SNAPSHOT_PATH'])
              if snapshot.exists():
                  shutil.rmtree(snapshot)
              snapshot.mkdir(parents=True)
              index = []
              text_count = 0
              for i, info in enumerate(infos):
                  data = b'' if info.is_dir() else z.read(info)
                  rec = {
                      'index': i,
                      'path': info.filename,
                      'size': len(data),
                      'sha256': sha(data),
                      'text_snapshot': False,
                  }
                  if not info.is_dir():
                      candidate = (
                          info.filename == 'export.r2x'
                          or info.filename.startswith('BepInEx/config/')
                          or info.filename.lower().endswith(
                              ('.txt', '.md', '.json', '.yml', '.yaml', '.cfg', '.ini', '.xml')
                          )
                      )
                      if candidate:
                          try:
                              text = data.decode('utf-8-sig')
                          except UnicodeDecodeError:
                              pass
                          else:
                              dest = snapshot / pathlib.PurePosixPath(info.filename)
                              dest.parent.mkdir(parents=True, exist_ok=True)
                              dest.write_text(text, encoding='utf-8')
                              rec['text_snapshot'] = True
                              text_count += 1
                  index.append(rec)

              (snapshot / 'FILE_INDEX.json').write_text(
                  json.dumps(index, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )
              if len(index) != 338 or text_count != 331:
                  raise SystemExit(f'snapshot count mismatch: entries={len(index)} text={text_count}')
              if (snapshot / 'PROFILE_INDEX_RESULT.json').exists():
                  raise SystemExit('publication snapshot must not contain PROFILE_INDEX_RESULT.json')
          PY

      - name: Materialize exact reviewed profile bytes without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Profiles
          cp -- ".publication-artifact/extracted/${PROFILE_PATH}" "${PROFILE_PATH}"
          echo "${PROFILE_SHA256}  ${PROFILE_PATH}" | sha256sum --check --strict
          test -f "${SNAPSHOT_PATH}/FILE_INDEX.json"
          test ! -e "${SNAPSHOT_PATH}/PROFILE_INDEX_RESULT.json"
          git diff --exit-code origin/main -- \
            BuildSpecs/current.json \
            RuntimeInbox/ACTIVE_BUILD.txt \
            Current/AUTO_BUILD_RESULT.json \
            Current/AUTO_BUILD_RESULT.md \
            Profiles/EXPECTED_HASHES.json

      - name: Commit exact publication bytes to publication branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publication-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${PROFILE_PATH}" "${SNAPSHOT_PATH}"
          if git diff --cached --quiet; then
            echo "Exact publication bytes already materialized; no commit required."
            exit 0
          fi
          git commit -m "Publish exact reviewed TSDIAG1 bytes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
