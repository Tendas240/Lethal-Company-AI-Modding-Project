name: Diagnose S1.42AH candidate commit

on:
  push:
    branches:
      - build/s142ah-mouthdog-dual-prevention
    paths:
      - ".github/workflows/atomic-build-s142ah-v6-diagnostic.yml"

permissions:
  contents: write

concurrency:
  group: atomic-build-s142ah-v6-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/s142ah-mouthdog-dual-prevention
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce validated candidate working tree
        run: python RepositoryTools/_temporary_build_s142ah_v2.py
      - name: Persist promotion diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf Patches/S139CompatibilityFixes/bin Patches/S139CompatibilityFixes/obj
          rm -f .github/workflows/atomic-build-s142ah.yml
          rm -f .github/workflows/atomic-build-s142ah-v2.yml
          rm -f .github/workflows/atomic-build-s142ah-v3.yml
          rm -f .github/workflows/atomic-build-s142ah-v4.yml
          rm -f .github/workflows/atomic-build-s142ah-v5.yml
          rm -f .github/workflows/atomic-build-s142ah-v6-diagnostic.yml
          rm -f RepositoryTools/_temporary_build_s142ah.py
          rm -f RepositoryTools/_temporary_build_s142ah_v2.py
          rm -f RepositoryTools/_temporary_rerun_s142ah.py
          git add -A
          REPORT=/tmp/s142ah-promotion-diagnostic.txt
          {
            echo "S1.42AH PROMOTION DIAGNOSTIC"
            echo "HEAD=$(git rev-parse HEAD)"
            echo
            echo "== git status --short =="
            git status --short
            echo
            echo "== staged name/status =="
            git diff --cached --name-status
            echo
            echo "== staged stat =="
            git diff --cached --stat
            echo
            echo "== diff --check =="
            set +e
            git diff --cached --check
            rc=$?
            set -e
            echo "DIFF_CHECK_EXIT=$rc"
            echo
            echo "== staged file sizes =="
            git diff --cached --name-only -z | while IFS= read -r -d '' f; do
              if [ -f "$f" ]; then printf '%s\t%s\n' "$(wc -c < "$f")" "$f"; else printf 'DELETED\t%s\n' "$f"; fi
            done
            echo
            echo "== commit dry-run =="
            set +e
            git commit --dry-run
            rc=$?
            set -e
            echo "COMMIT_DRY_RUN_EXIT=$rc"
          } > "$REPORT" 2>&1
          git reset
          mkdir -p Current
          cp "$REPORT" Current/TEMP_S1.42AH_PROMOTION_DIAGNOSTIC.txt
          git add Current/TEMP_S1.42AH_PROMOTION_DIAGNOSTIC.txt
          git commit -m "Record temporary S1.42AH promotion diagnostic"
          git push origin HEAD:build/s142ah-mouthdog-dual-prevention
