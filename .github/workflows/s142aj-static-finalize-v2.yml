name: Finalize S1.42AJ static validation v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142aj-static-finalize-v2.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute verified S1.42AJ finalization block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/s142aj-static-finalize.yml').read_text(encoding='utf-8')
          opener = "          python - <<'PY'\n"
          closer = "\n          PY\n"
          start = source.index(opener) + len(opener)
          end = source.index(closer, start)
          raw = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in raw.splitlines()) + '\n'
          Path('/tmp/finalize_s142aj.py').write_text(code, encoding='utf-8')
          PY
          python /tmp/finalize_s142aj.py

      - name: Render generated current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate static lifecycle transition
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python BuildSystem/test_profile_builder.py

      - name: Commit static validation and idle controller state
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- README.md START_HERE_ChatGPT_Masterprompt.txt Current Knowledge BuildSpecs/current.json
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
            exit 1
          fi
          git commit -m 'Record S1.42AJ static validation and idle controller'
          git push origin HEAD:main
