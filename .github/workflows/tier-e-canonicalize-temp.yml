name: Canonicalize Tier-E S1.42AI review

on:
  push:
    branches:
      - analysis/s142ai-tier-e-exact
    paths:
      - 'AnalysisTools/canonicalize_tier_e_plan_temp.py'
      - '.github/workflows/tier-e-canonicalize-temp.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update exact S1.42AI planning checkpoint
        run: python AnalysisTools/canonicalize_tier_e_plan_temp.py
      - name: Commit bounded canonical plan update
        shell: bash
        run: |
          git diff --check
          git diff -- BuildSpecs/S1.42AI_PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuildSpecs/S1.42AI_PLAN.md
          git commit -m 'Update S1.42AI plan after Tier-E exact review'
          git push
