name: Diagnose S1.42AH candidate promotion v7

on:
  push:
    branches:
      - build/s142ah-mouthdog-dual-prevention
    paths:
      - ".github/workflows/atomic-build-s142ah-v7-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/s142ah-mouthdog-dual-prevention
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reproduce validated S1.42AH candidate
        run: python RepositoryTools/_temporary_build_s142ah_v2.py
      - name: Capture exact staged checkpoint diagnostics
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf Patches/S139CompatibilityFixes/bin Patches/S139CompatibilityFixes/obj
          rm -f .github/workflows/atomic-build-s142ah.yml
          rm -f .github/workflows/atomic-build-s142ah-v2.yml
          rm -f .github/workflows/atomic-build-s142ah-v3.yml
          rm -f .github/workflows/atomic-build-s142ah-v4.yml
          rm -f .github/workflows/atomic-build-s142ah-v5.yml
          rm -f .github/workflows/atomic-build-s142ah-v6-diagnostic.yml
          rm -f .github/workflows/atomic-build-s142ah-v7-diagnostic.yml
          rm -f RepositoryTools/_temporary_build_s142ah.py
          rm -f RepositoryTools/_temporary_build_s142ah_v2.py
          rm -f RepositoryTools/_temporary_rerun_s142ah.py
          rm -f Current/TEMP_S1.42AH_PROMOTION_DIAGNOSTIC.txt
          git add -A
          REPORT=/tmp/s142ah-promotion-diagnostic-v7.txt
          : > "$REPORT"
          echo "S1.42AH PROMOTION DIAGNOSTIC V7" >> "$REPORT"
          echo "HEAD=$(git rev-parse HEAD)" >> "$REPORT"
          echo "PROFILE_SIZE=$(wc -c < 'Profiles/LC V1 S1.42AH Mouth Dog Fix.r2z')" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "== git status --short ==" >> "$REPORT"
          git status --short >> "$REPORT" 2>&1
          echo "" >> "$REPORT"
          echo "== staged name/status ==" >> "$REPORT"
          git diff --cached --name-status >> "$REPORT" 2>&1
          echo "" >> "$REPORT"
          echo "== staged stat ==" >> "$REPORT"
          git diff --cached --stat >> "$REPORT" 2>&1
          echo "" >> "$REPORT"
          echo "== diff --check ==" >> "$REPORT"
          git diff --cached --check >> "$REPORT" 2>&1
          echo "DIFF_CHECK_EXIT=$?" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "== profile index state ==" >> "$REPORT"
          git ls-files --stage -- "Profiles/LC V1 S1.42AH Mouth Dog Fix.r2z" >> "$REPORT" 2>&1
          echo "PROFILE_INDEX_EXIT=$?" >> "$REPORT"
          echo "" >> "$REPORT"
          echo "== commit dry-run ==" >> "$REPORT"
          git commit --dry-run >> "$REPORT" 2>&1
          echo "COMMIT_DRY_RUN_EXIT=$?" >> "$REPORT"
          git reset --hard HEAD
          git clean -fdx
          mkdir -p Current
          cp "$REPORT" Current/TEMP_S1.42AH_PROMOTION_DIAGNOSTIC_V7.txt
          git add Current/TEMP_S1.42AH_PROMOTION_DIAGNOSTIC_V7.txt
          git commit -m "Record exact S1.42AH promotion diagnostic v7"
          git push origin HEAD:build/s142ah-mouthdog-dual-prevention
