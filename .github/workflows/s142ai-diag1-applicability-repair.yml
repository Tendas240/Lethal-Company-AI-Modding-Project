name: Apply S1.42AI-DIAG1 EndlessElevator applicability repair

on:
  push:
    branches:
      - work/s142ai-diag1-implementation
    paths:
      - .github/workflows/s142ai-diag1-applicability-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DIAG1_VALIDATION_PROFILE: ValidationArtifacts/S1.42AI-DIAG1.applicability.validation.r2z
      DIAG1_VALIDATION_RESULT: ValidationArtifacts/diag1-applicability-validation-result.json
      DIAG1_STATIC_OUT: ValidationArtifacts/applicability-static-out
      DIAG1_MATERIALIZED_PROFILE: ValidationArtifacts/S1.42AI-DIAG1.applicability.validation.r2z
      DIAG1_MATERIALIZED_APPLICABILITY_OUT: ValidationArtifacts/applicability-materialized.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s142ai-diag1-implementation
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply exact repair
        run: python RepositoryTools/apply_s142ai_diag1_applicability_repair.py

      - name: Python syntax check
        run: |
          python -m py_compile AnalysisTools/validate_s142ai_diag1_static.py
          python -m py_compile AnalysisTools/validate_s142ai_diag1_static_bound.py
          python -m py_compile AnalysisTools/validate_s142ai_diag1_materialized_applicability.py

      - name: Restore exact DIAG1 compile dependencies
        run: dotnet restore Patches/S142AIDiag1Isolation/S142AIDiag1Isolation.csproj --configfile Patches/S142AIDiag1Isolation/NuGet.Config

      - name: Compile repaired diagnostic plugin
        run: dotnet build Patches/S142AIDiag1Isolation/S142AIDiag1Isolation.csproj -c Release --no-restore

      - name: Install pinned project decompiler
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375

      - name: Generate disabled DIAG1 draft
        run: python BuildSpecs/generate_s142ai_diag1_spec.py

      - name: Prepare ephemeral validation spec
        run: |
          mkdir -p ValidationArtifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          spec = json.loads(Path('BuildSpecs/S1.42AI-DIAG1_DRAFT.json').read_text(encoding='utf-8'))
          if spec.get('enabled') is not False or spec.get('build_id') != 'S1.42AI-DIAG1':
              raise RuntimeError('Unexpected regenerated DIAG1 draft identity')
          spec['enabled'] = True
          spec['output_profile'] = os.environ['DIAG1_VALIDATION_PROFILE']
          spec['snapshot_dir'] = 'ValidationArtifacts/applicability-snapshot'
          spec['result_json'] = os.environ['DIAG1_VALIDATION_RESULT']
          spec['result_md'] = 'ValidationArtifacts/diag1-applicability-validation-result.md'
          spec['overwrite'] = False
          Path('ValidationArtifacts/applicability-validation-spec.json').write_text(json.dumps(spec, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build ephemeral validation profile
        run: python BuildSystem/profile_builder.py ValidationArtifacts/applicability-validation-spec.json

      - name: Run exact repaired static gate
        run: python AnalysisTools/validate_s142ai_diag1_static_bound.py

      - name: Run repaired materialized applicability gate
        run: python AnalysisTools/validate_s142ai_diag1_materialized_applicability.py

      - name: Commit validated repair
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs
          git add AnalysisTools/validate_s142ai_diag1_static.py
          git add AnalysisTools/validate_s142ai_diag1_materialized_applicability.py
          git add AnalysisEvidence/S1.42AI-DIAG1R1/ENDLESS_ELEVATOR_APPLICABILITY.json
          git add AnalysisEvidence/S1.42AI-DIAG1R1/ENDLESS_ELEVATOR_APPLICABILITY.md
          git add .github/workflows/s142ai-diag1-static-validation.yml
          git add -u .github/workflows/s142ai-diag1-applicability-repair.yml RepositoryTools/apply_s142ai_diag1_applicability_repair.py
          git commit -m 'Repair DIAG1 optional EndlessElevator applicability contract'
          git push origin HEAD:work/s142ai-diag1-implementation
