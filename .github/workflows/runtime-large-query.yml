name: Query temporary large runtime evidence

on:
  push:
    branches:
      - main
    paths:
      - "RuntimeAnalysis/QUERY.json"
      - "BuildSystem/runtime_log_query.py"
      - ".github/workflows/runtime-large-query.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: runtime-large-query
  cancel-in-progress: false

jobs:
  query:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read query controller
        id: q
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          q = json.loads(Path('RuntimeAnalysis/QUERY.json').read_text(encoding='utf-8'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"enabled={'true' if q.get('enabled') else 'false'}\n")
              if q.get('enabled'):
                  out.write(f"run_id={q['artifact_run_id']}\n")
                  out.write(f"artifact_name={q['artifact_name']}\n")
          PY

      - name: Download temporary raw artifact
        if: steps.q.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/runtime-artifact
          mkdir -p /tmp/runtime-artifact
          gh run download "${{ steps.q.outputs.run_id }}" \
            -n "${{ steps.q.outputs.artifact_name }}" \
            -D /tmp/runtime-artifact

      - name: Extract requested evidence
        if: steps.q.outputs.enabled == 'true'
        run: python BuildSystem/runtime_log_query.py RuntimeAnalysis/QUERY.json /tmp/runtime-artifact .

      - name: Commit query result and disarm controller
        if: steps.q.outputs.enabled == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('RuntimeAnalysis/QUERY.json')
          q = json.loads(p.read_text(encoding='utf-8'))
          q['enabled'] = False
          q['last_completed_request_id'] = q.get('request_id')
          p.write_text(json.dumps(q, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RuntimeAnalysis/QUERY.json RuntimeEvidence
          git commit -m "Materialize large runtime query [skip ci]"
          git push
