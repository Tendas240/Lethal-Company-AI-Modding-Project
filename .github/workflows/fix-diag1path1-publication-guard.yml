name: Fix DIAG1PATH1 publication guard

on:
  push:
    branches:
      - c3f18-bmdsfix1-diag1path1-exact-publication
    paths:
      - '.github/workflows/fix-diag1path1-publication-guard.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f18-bmdsfix1-diag1path1-exact-publication
          fetch-depth: 0
      - name: Replace only the faulty profileName parser and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/s142ak-bmdsfix1-diag1path1-publish-reviewed.yml')
          text = p.read_text(encoding='utf-8')
          old_lines = [
              "          def get_profile_name(data):",
              "              text = data.decode('utf-8-sig').replace('\\r\\n', '\\n').replace('\\r', '\\n')",
              "              match = re.fullmatch(r'.*?^profileName:\\s*(.*?)\\s*$', text, flags=re.M | re.S)",
              "              require(match is not None, 'profileName missing')",
              "              return match.group(1)",
          ]
          new_lines = [
              "          def get_profile_name(data):",
              "              text = data.decode('utf-8-sig').replace('\\r\\n', '\\n').replace('\\r', '\\n')",
              "              names = [line[len('profileName:'):].strip() for line in text.splitlines() if line.startswith('profileName:')]",
              "              require(len(names) == 1, f'profileName count mismatch: {len(names)}')",
              "              return names[0]",
          ]
          old = '\n'.join(old_lines) + '\n'
          new = '\n'.join(new_lines) + '\n'
          if text.count(old) != 1:
              raise RuntimeError(f'expected exactly one faulty parser block, got {text.count(old)}')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/fix-diag1path1-publication-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No guard fix staged.' >&2; exit 1; }
          git commit -m 'Fix DIAG1PATH1 exact-publication profileName guard'
          git push origin HEAD:c3f18-bmdsfix1-diag1path1-exact-publication
