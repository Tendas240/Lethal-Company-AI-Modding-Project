name: Publish exact reviewed S1.42AK-BMGHDIAG1 artifact

on:
  push:
    branches:
      - scope/universal-interior-phase-c3a-dawn-tags
    paths:
      - '.github/workflows/s142ak-bmghdiag1-publish-reviewed.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: s142ak-bmghdiag1-exact-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact C3 working branch
        uses: actions/checkout@v4
        with:
          ref: scope/universal-interior-phase-c3a-dawn-tags
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact reviewed PR artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/s142ak-bmghdiag1-reviewed"
          mkdir -p "$work/extracted"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10745290545/zip" \
            -o "$work/review.zip"
          echo 'f34ee6dcf06d2f803159554c1cef2e9f587ca0e38f837f96e287c28c13151947  '"$work/review.zip" | sha256sum -c -
          unzip -q "$work/review.zip" -d "$work/extracted"

      - name: Revalidate exact reviewed artifact and publication boundary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path

          root = Path('.')
          src = Path(os.environ['RUNNER_TEMP']) / 's142ak-bmghdiag1-reviewed' / 'extracted'
          base = root / 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z'
          reviewed = src / 'Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z'
          index_path = src / 'ProfileSources/S1.42AK-BMGHDIAG1/FILE_INDEX.json'
          source_export = src / 'ProfileSources/S1.42AK-BMGHDIAG1/export.r2x'
          build_result = src / 'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.json'
          static_result = src / 'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/STATIC_VERIFICATION.json'
          current_spec = root / 'BuildSpecs/current.json'
          active_build = root / 'RuntimeInbox/ACTIVE_BUILD.txt'
          current_state = root / 'Current/CURRENT_STATE.json'
          auto_result = root / 'Current/AUTO_BUILD_RESULT.json'

          BASE_SHA = 'b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee'
          PROFILE_SHA = '7f494640f47210bf230a2f0950bd836d65b969a47be2af1252fc564463bc6d90'
          DIAG_SHA = '4a1f304a716bf7cacb6496f5047bb0e498ed68bde00fc9f4128fa001adaa30b2'
          NORMALIZER_SHA = '901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'
          LLL_SHA = 'b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c'
          DIAG = 'BepInEx/plugins/S142AKBMGHDiag1/S142AKBMGHDiag1.dll'
          NORMALIZER = 'BepInEx/plugins/S142ABInteriorWeightNormalization/S142ABInteriorWeightNormalization.dll'

          def sha_bytes(data): return hashlib.sha256(data).hexdigest()
          def sha_file(path): return sha_bytes(path.read_bytes())
          def require(ok, msg):
              if not ok: raise RuntimeError(msg)
          def members(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  require(len(names) == len(set(names)), f'duplicate archive members: {path}')
                  return names, {name: z.read(name) for name in names}
          def stable_export(data):
              text = data.decode('utf-8-sig').replace('\r\n','\n').replace('\r','\n')
              require(len(re.findall(r'(?m)^profileName:.*$', text)) == 1, 'profileName count mismatch')
              return re.sub(r'(?m)^profileName:.*$', 'profileName: <identity>', text).rstrip('\n')

          require(sha_file(base) == BASE_SHA, 'accepted S1.42AK parent SHA mismatch')
          require(reviewed.is_file() and sha_file(reviewed) == PROFILE_SHA, 'reviewed profile SHA mismatch')
          require(not (root / 'Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z').exists(), 'diagnostic profile is already published on this branch')
          require(not (root / 'ProfileSources/S1.42AK-BMGHDIAG1').exists(), 'diagnostic ProfileSources already exist on this branch')
          require(not (root / 'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE').exists(), 'diagnostic build evidence already exists on this branch')

          base_names, base_map = members(base)
          review_names, review_map = members(reviewed)
          require(len(base_names) == 336 and len(review_names) == 337, 'archive member-count contract mismatch')
          require(set(review_names) - set(base_names) == {DIAG}, 'reviewed added-member delta mismatch')
          require(set(base_names) - set(review_names) == set(), 'reviewed archive removed members')
          changed = [name for name in base_names if base_map[name] != review_map[name]]
          require(changed == ['export.r2x'], f'unexpected existing-member delta: {changed!r}')
          require(stable_export(base_map['export.r2x']) == stable_export(review_map['export.r2x']), 'package/config export drift')
          require('LethalLevelLoaderUpdated' not in review_map['export.r2x'].decode('utf-8-sig'), 'forbidden alternate LLL owner')
          require(sha_bytes(review_map[DIAG]) == DIAG_SHA, 'reviewed diagnostic DLL SHA mismatch')
          require(sha_bytes(review_map[NORMALIZER]) == NORMALIZER_SHA, 'accepted normalizer SHA mismatch')
          require(source_export.read_bytes() == review_map['export.r2x'], 'ProfileSources export differs from reviewed profile')

          index = json.loads(index_path.read_text(encoding='utf-8'))
          require(len(index) == len(review_names), 'FILE_INDEX row count mismatch')
          for i, rec in enumerate(index):
              require(rec['index'] == i and rec['path'] == review_names[i], f'FILE_INDEX order mismatch at {i}')
              data = review_map[review_names[i]]
              require(rec['size'] == len(data), f'FILE_INDEX size mismatch: {review_names[i]}')
              require(rec['sha256'] == sha_bytes(data), f'FILE_INDEX SHA mismatch: {review_names[i]}')

          br = json.loads(build_result.read_text(encoding='utf-8'))
          require(br['build_id'] == 'S1.42AK-BMGHDIAG1', 'BUILD_RESULT build_id mismatch')
          require(br['base_profile'] == 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z' and br['base_sha256'] == BASE_SHA, 'BUILD_RESULT parent binding mismatch')
          require(br['output_profile'] == 'Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z' and br['output_sha256'] == PROFILE_SHA, 'BUILD_RESULT output binding mismatch')
          require(br['added_members'] == [DIAG] and br['changed_existing_members'] == ['export.r2x'], 'BUILD_RESULT delta mismatch')

          sv = json.loads(static_result.read_text(encoding='utf-8'))
          require(sv['status'] == 'STATIC_BUILD_PASS_REVIEW_ARTIFACT_NOT_ARMED', 'STATIC_VERIFICATION status mismatch')
          require(sv['output_sha256'] == PROFILE_SHA and sv['diagnostic_dll_sha256'] == DIAG_SHA, 'STATIC_VERIFICATION artifact binding mismatch')
          require(sv['lll_dll_sha256'] == LLL_SHA and sv['normalizer_sha256'] == NORMALIZER_SHA, 'STATIC_VERIFICATION dependency binding mismatch')
          require(sv['runtime_armed'] is False, 'review artifact unexpectedly claims runtime arming')

          spec = json.loads(current_spec.read_text(encoding='utf-8'))
          state = json.loads(current_state.read_text(encoding='utf-8'))
          auto = json.loads(auto_result.read_text(encoding='utf-8'))
          require(spec['enabled'] is False and spec['build_id'] == 'IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS', 'live build controller drift before publication')
          require(active_build.read_text(encoding='utf-8').strip() == 'S1.42AK', 'ACTIVE_BUILD drift before publication')
          require(state['accepted_baseline']['build_id'] == 'S1.42AK' and state['active_candidate'] is None and state['runtime_test_outstanding'] is False, 'live lifecycle drift before publication')
          require(state['controllers']['runtime_active_build'] == 'S1.42AK', 'CURRENT_STATE runtime pointer drift before publication')
          require(auto['build_id'] == 'S1.42AK', 'AUTO_BUILD_RESULT must remain the accepted/latest normal build')
          print('PASS: exact reviewed BMGHDIAG1 artifact and inactive publication boundary verified.')
          PY

      - name: Publish exact reviewed bytes without arming runtime
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/s142ak-bmghdiag1-reviewed/extracted"
          cp "$src/Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z" "Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z"
          cp -a "$src/ProfileSources/S1.42AK-BMGHDIAG1" "ProfileSources/S1.42AK-BMGHDIAG1"
          mkdir -p BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.json" BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.json
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.md" BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.md
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/STATIC_VERIFICATION.json" BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/STATIC_VERIFICATION.json

          cat > BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/PUBLICATION_VERIFICATION.md <<'MD'
          # S1.42AK-BMGHDIAG1 reviewed-artifact publication verification

          - Source PR: #138.
          - Reviewed branch head: `f01b6d4f456d3ee133b30ac62f432de75ef3830b`.
          - Reviewed PR synthetic merge SHA: `d3ba56820a8bbcf2aca545fd4005ae3f03e90ffa`; it has the same tree as the reviewed branch head.
          - Static/build gate: run `35849491391` (#2).
          - Review artifact: `S1.42AK-BMGHDIAG1-review-d3ba56820a8bbcf2aca545fd4005ae3f03e90ffa`, artifact ID `10745290545`.
          - Artifact ZIP SHA-256: `f34ee6dcf06d2f803159554c1cef2e9f587ca0e38f837f96e287c28c13151947`.
          - Published profile SHA-256: `7f494640f47210bf230a2f0950bd836d65b969a47be2af1252fc564463bc6d90`.
          - Published diagnostic DLL SHA-256: `4a1f304a716bf7cacb6496f5047bb0e498ed68bde00fc9f4128fa001adaa30b2`.
          - LethalLevelLoader 1.7.12 DLL SHA-256: `b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c`.
          - Accepted S1.42AB normalizer SHA-256: `901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06`.
          - The reviewed profile was revalidated against exact accepted S1.42AK, all 337 FILE_INDEX rows, the exact one-DLL archive delta, package/config stability, diagnostic DLL identity, LLL identity and normalizer identity immediately before publication.
          - Separate CI rebuilds are not byte-identical for the locally compiled diagnostic DLL; publication therefore pins these exact reviewed artifact bytes rather than rebuilding.
          - `Current/AUTO_BUILD_RESULT.*`, `BuildSpecs/current.json`, `Current/CURRENT_STATE.json` and `RuntimeInbox/ACTIVE_BUILD.txt` are intentionally unchanged.
          - This publication exists on the open C3 PR branch only. It is not merged to `main`, not a current Gale runtime target, not accepted, and not runtime-armed.

          Status: `PUBLISHED_STATIC_PASS_NOT_RUNTIME_ARMED`.
          MD

          cat > SourceEvidence/UniversalInteriorViability/PhaseC3F17/C3F17_4_PUBLICATION_FINDINGS.md <<'MD'
          # C3F17.4 — BMGHDIAG1 exact reviewed-artifact publication findings

          **Status:** EXACT REVIEWED ARTIFACT PUBLISHED ON C3 PR / STATIC PASS / NOT RUNTIME ARMED

          The exact reviewed artifact from build/archive gate run `35849491391` is published byte-for-byte on PR #138 rather than rebuilt. The bound profile SHA-256 is `7f494640f47210bf230a2f0950bd836d65b969a47be2af1252fc564463bc6d90`; the injected diagnostic DLL SHA-256 is `4a1f304a716bf7cacb6496f5047bb0e498ed68bde00fc9f4128fa001adaa30b2`.

          Publication preserves exact accepted S1.42AK as parent and changes only `export.r2x` profile identity metadata plus the single new `BepInEx/plugins/S142AKBMGHDiag1/S142AKBMGHDiag1.dll` archive member. The accepted normalizer, LLL 1.7.12 identity, package state, config state, Black Mesa ownership and Greenhouse availability remain unchanged.

          The publication is deliberately PR-local. `Current/AUTO_BUILD_RESULT.*`, `BuildSpecs/current.json`, `Current/CURRENT_STATE.json` and `RuntimeInbox/ACTIVE_BUILD.txt` remain unchanged. Therefore no candidate is active, no runtime test is outstanding, the canonical Gale helper still resolves S1.42AK from `main`, and no gameplay/Gale action is authorized by this checkpoint.

          A later separate atomic main/lifecycle transition may only arm this diagnostic after the exact published profile/build_result/static/publication identities are made visible on `main` consistently with `CURRENT_STATE.selected_scope.diagnostic_revision` and `RuntimeInbox/ACTIVE_BUILD.txt`.
          MD

          test "$(tr -d '\r\n' < RuntimeInbox/ACTIVE_BUILD.txt)" = 'S1.42AK'
          python - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('BuildSpecs/current.json').read_text())
          state=json.loads(Path('Current/CURRENT_STATE.json').read_text())
          auto=json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text())
          assert spec['enabled'] is False and spec['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert state['active_candidate'] is None and state['runtime_test_outstanding'] is False
          assert state['controllers']['runtime_active_build']=='S1.42AK'
          assert auto['build_id']=='S1.42AK'
          PY

      - name: Remove one-shot publisher and enforce publication diff
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/s142ak-bmghdiag1-publish-reviewed.yml
          git add -A -- \
            'Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z' \
            'ProfileSources/S1.42AK-BMGHDIAG1' \
            'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE' \
            'SourceEvidence/UniversalInteriorViability/PhaseC3F17/C3F17_4_PUBLICATION_FINDINGS.md'
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--cached','--name-only','HEAD'], text=True).splitlines()
          required_exact = {
              '.github/workflows/s142ak-bmghdiag1-publish-reviewed.yml',
              'Profiles/LC V1 S1.42AK-BMGHDIAG1 Black Mesa Greenhouse Diagnostic.r2z',
              'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.json',
              'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/BUILD_RESULT.md',
              'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/STATIC_VERIFICATION.json',
              'BuildSpecs/S1.42AK-BMGHDIAG1_BUILD_EVIDENCE/PUBLICATION_VERIFICATION.md',
              'SourceEvidence/UniversalInteriorViability/PhaseC3F17/C3F17_4_PUBLICATION_FINDINGS.md',
          }
          profile_sources = [p for p in changed if p.startswith('ProfileSources/S1.42AK-BMGHDIAG1/')]
          other = set(changed) - set(profile_sources)
          if other != required_exact:
              raise RuntimeError(f'unexpected publication paths: {sorted(other ^ required_exact)}')
          if len(profile_sources) != 331:
              raise RuntimeError(f'expected 331 published ProfileSources files, got {len(profile_sources)}')
          forbidden_prefixes=('Current/','RuntimeInbox/')
          if any(p.startswith(forbidden_prefixes) for p in changed) or 'BuildSpecs/current.json' in changed:
              raise RuntimeError('publication attempted to mutate live lifecycle/controller state')
          print(f'PASS: bounded publication diff contains {len(changed)} paths; no live controller/lifecycle path changed.')
          PY

      - name: Run permanent repository validation on staged publication
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py

      - name: Commit exact reviewed publication to C3 PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact reviewed S1.42AK-BMGHDIAG1 artifact [skip ci]'
          git push origin HEAD:scope/universal-interior-phase-c3a-dawn-tags
