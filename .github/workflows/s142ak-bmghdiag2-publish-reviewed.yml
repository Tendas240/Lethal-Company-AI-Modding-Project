name: Publish exact reviewed S1.42AK-BMGHDIAG2 artifact

on:
  push:
    branches:
      - c3f18-bmghdiag2-exact-publication
    paths:
      - '.github/workflows/s142ak-bmghdiag2-publish-reviewed.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: s142ak-bmghdiag2-exact-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: c3f18-bmghdiag2-exact-publication
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/s142ak-bmghdiag2-reviewed"
          mkdir -p "$work/extracted"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10803912824/zip" \
            -o "$work/review.zip"
          echo '265ebfae87ad3c48a6dbb57d0b3dce81a4c4d1c2e4872357f970354974da7a62  '"$work/review.zip" | sha256sum -c -
          unzip -q "$work/review.zip" -d "$work/extracted"

      - name: Revalidate and reconstruct exact readable snapshot
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, sys, zipfile
          from pathlib import Path

          root = Path('.')
          src = Path(os.environ['RUNNER_TEMP']) / 's142ak-bmghdiag2-reviewed' / 'extracted'
          reviewed = src / 'Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z'
          base = root / 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z'
          uploaded_index_path = src / 'ProfileSources/S1.42AK-BMGHDIAG2/FILE_INDEX.json'
          build_result = src / 'BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/BUILD_RESULT.json'
          static_result = src / 'BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/STATIC_VERIFICATION.json'
          lll_provenance = src / 'c3f17-4-s142ak-lll-provenance-output/LLL_PROVENANCE.json'
          reconstructed = Path(os.environ['RUNNER_TEMP']) / 'S1.42AK-BMGHDIAG2-reconstructed'

          BASE_SHA = 'b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee'
          PROFILE_SHA = '56884f84bf90b1d8038b6aa1ee12de4548aedf76603134acbd5a91ad74233ef2'
          DIAG_SHA = '51de493e340a2e0c0422e9816b5c2f592113e12a71cf1be7081631b3c9520775'
          NORMALIZER_SHA = '901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'
          LLL_SHA = 'b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c'
          HIDDEN_SHA = '0093bae709cec57fd3f4f3bc5af22231b16944a666768e7ecf879430693f73a2'
          DIAG = 'BepInEx/plugins/S142AKBMGHDiag2/S142AKBMGHDiag2.dll'
          NORMALIZER = 'BepInEx/plugins/S142ABInteriorWeightNormalization/S142ABInteriorWeightNormalization.dll'
          HIDDEN = 'BepInEx/config/.LCMaxSoundsFix.cfg'

          def sha_bytes(data): return hashlib.sha256(data).hexdigest()
          def sha_file(path): return sha_bytes(path.read_bytes())
          def require(ok, msg):
              if not ok: raise RuntimeError(msg)
          def members(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  require(len(names) == len(set(names)), f'duplicate archive members: {path}')
                  return names, {name: z.read(name) for name in names}
          def stable_export(data):
              text = data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
              require(len(re.findall(r'(?m)^profileName:.*$', text)) == 1, 'profileName count mismatch')
              return re.sub(r'(?m)^profileName:.*$', 'profileName: <identity>', text).rstrip('\n')

          require(sha_file(base) == BASE_SHA, 'accepted S1.42AK parent SHA mismatch')
          require(reviewed.is_file() and sha_file(reviewed) == PROFILE_SHA, 'reviewed profile SHA mismatch')
          require(not (root / 'Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z').exists(), 'BMGHDIAG2 profile already exists on publication branch')
          require(not (root / 'ProfileSources/S1.42AK-BMGHDIAG2').exists(), 'BMGHDIAG2 ProfileSources already exist on publication branch')

          base_names, base_map = members(base)
          review_names, review_map = members(reviewed)
          require(len(base_names) == 336 and len(review_names) == 337, 'archive member-count contract mismatch')
          require(set(review_names) - set(base_names) == {DIAG}, 'reviewed added-member delta mismatch')
          require(set(base_names) - set(review_names) == set(), 'reviewed archive removed members')
          changed = [name for name in base_names if base_map[name] != review_map[name]]
          require(changed == ['export.r2x'], f'unexpected existing-member delta: {changed!r}')
          require(stable_export(base_map['export.r2x']) == stable_export(review_map['export.r2x']), 'package/profile metadata drift beyond identity')
          require(sha_bytes(review_map[DIAG]) == DIAG_SHA, 'reviewed diagnostic DLL SHA mismatch')
          require(sha_bytes(review_map[NORMALIZER]) == NORMALIZER_SHA, 'accepted normalizer SHA mismatch')
          require(len(review_map[HIDDEN]) == 621 and sha_bytes(review_map[HIDDEN]) == HIDDEN_SHA, 'hidden config archive identity mismatch')

          uploaded_index = json.loads(uploaded_index_path.read_text(encoding='utf-8'))
          require(len(uploaded_index) == 337, 'reviewed FILE_INDEX row count mismatch')
          for i, rec in enumerate(uploaded_index):
              require(rec['index'] == i and rec['path'] == review_names[i], f'reviewed FILE_INDEX order mismatch at {i}')
              data = review_map[review_names[i]]
              require(rec['size'] == len(data), f'reviewed FILE_INDEX size mismatch: {review_names[i]}')
              require(rec['sha256'] == sha_bytes(data), f'reviewed FILE_INDEX SHA mismatch: {review_names[i]}')

          br = json.loads(build_result.read_text(encoding='utf-8'))
          require(br['build_id'] == 'S1.42AK-BMGHDIAG2', 'BUILD_RESULT build_id mismatch')
          require(br['base_profile'] == 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z' and br['base_sha256'] == BASE_SHA, 'BUILD_RESULT parent binding mismatch')
          require(br['output_profile'] == 'Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z' and br['output_sha256'] == PROFILE_SHA, 'BUILD_RESULT output binding mismatch')
          require(br['zip_members'] == 337 and br['snapshot'] == {'entries': 337, 'text_entries': 331}, 'BUILD_RESULT snapshot contract mismatch')
          require(br['added_members'] == [DIAG] and br['changed_existing_members'] == ['export.r2x'], 'BUILD_RESULT delta mismatch')
          require(br['mod_state_changes'] == [] and br['mod_additions'] == [] and br['mod_removals'] == [], 'BUILD_RESULT package drift')

          sv = json.loads(static_result.read_text(encoding='utf-8'))
          require(sv['status'] == 'STATIC_BUILD_PASS_REVIEW_ARTIFACT_NOT_ARMED', 'STATIC_VERIFICATION status mismatch')
          require(sv['output_sha256'] == PROFILE_SHA and sv['diagnostic_dll_sha256'] == DIAG_SHA, 'STATIC_VERIFICATION artifact binding mismatch')
          require(sv['lll_dll_sha256'] == LLL_SHA and sv['normalizer_sha256'] == NORMALIZER_SHA, 'STATIC_VERIFICATION dependency binding mismatch')
          require(sv['archive_members_verified'] == 337 and sv['package_changes'] == 0 and sv['config_changes'] == 0, 'STATIC_VERIFICATION archive/package/config drift')
          require(sv['runtime_armed'] is False, 'review artifact unexpectedly claims runtime arming')

          lp = json.loads(lll_provenance.read_text(encoding='utf-8'))
          require(lp['result'] == 'PASS' and lp['dependency_version'] == '1.7.12', 'LLL provenance status/version mismatch')
          require(lp['dll_sha256'] == LLL_SHA and lp['dll_hash_match'] is True, 'LLL provenance DLL identity mismatch')
          require(lp['profile_sha256'] == BASE_SHA and lp['profile_export_byte_identical'] is True, 'LLL provenance parent binding mismatch')
          require(lp['alternate_lll_owner_present'] is False, 'alternate LLL owner present')

          spec = json.loads((root / 'BuildSpecs/current.json').read_text(encoding='utf-8'))
          state = json.loads((root / 'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          auto = json.loads((root / 'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          require(spec['enabled'] is False and spec['build_id'] == 'IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS', 'live build controller drift')
          require((root / 'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK', 'ACTIVE_BUILD drift')
          require(state['accepted_baseline']['build_id'] == 'S1.42AK' and state['active_candidate'] is None and state['runtime_test_outstanding'] is False, 'live lifecycle drift')
          require(state['controllers']['runtime_active_build'] == 'S1.42AK', 'CURRENT_STATE runtime pointer drift')
          require(auto['build_id'] == 'S1.42AK', 'AUTO_BUILD_RESULT drift')

          sys.path.insert(0, str(root))
          from BuildSystem.profile_builder import read_zip, snapshot
          if reconstructed.exists(): shutil.rmtree(reconstructed)
          summary = snapshot(read_zip(reviewed), reconstructed)
          require(summary == {'entries': 337, 'text_entries': 331}, f'reconstructed snapshot summary mismatch: {summary!r}')
          reconstructed_index = json.loads((reconstructed / 'FILE_INDEX.json').read_text(encoding='utf-8'))
          require(reconstructed_index == uploaded_index, 'reconstructed FILE_INDEX differs from reviewed 337-row index')
          hidden_snapshot = reconstructed / HIDDEN
          require(hidden_snapshot.is_file(), 'reconstructed hidden config missing')
          require(len(hidden_snapshot.read_bytes()) == 621 and sha_file(hidden_snapshot) == HIDDEN_SHA, 'reconstructed hidden config identity mismatch')
          print('PASS: exact BMGHDIAG2 reviewed bytes, archive delta, dependencies, controllers and reconstructed snapshot verified.')
          PY

      - name: Publish exact reviewed bytes without runtime arming
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/s142ak-bmghdiag2-reviewed/extracted"
          reconstructed="$RUNNER_TEMP/S1.42AK-BMGHDIAG2-reconstructed"
          cp "$src/Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z" "Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z"
          cp -a "$reconstructed" "ProfileSources/S1.42AK-BMGHDIAG2"
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/BUILD_RESULT.json" BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/BUILD_RESULT.json
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/BUILD_RESULT.md" BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/BUILD_RESULT.md
          cp "$src/BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/STATIC_VERIFICATION.json" BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/STATIC_VERIFICATION.json
          cp "$src/c3f17-4-s142ak-lll-provenance-output/LLL_PROVENANCE.json" BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/LLL_PROVENANCE.json

          cat > BuildSpecs/S1.42AK-BMGHDIAG2_BUILD_EVIDENCE/PUBLICATION_VERIFICATION.md <<'MD'
          # S1.42AK-BMGHDIAG2 exact reviewed-artifact publication verification

          **Status:** EXACT REVIEWED BYTES PUBLISHED ON WORKING BRANCH / STATIC PASS / NOT RUNTIME ARMED / NOT ACCEPTED
          **Date:** 2026-09-24
          **Review PR:** #142
          **Reviewed head:** `e45c695a5f75dd8e304f0434cd21bce3e0a30da3`
          **Review synthetic merge:** `569cbbb184a4f81085999a802c9a695ba3a9f3f2`
          **Review workflow run:** `35990294162`
          **Actions artifact ID:** `10803912824`
          **Artifact name:** `S1.42AK-BMGHDIAG2-review-569cbbb184a4f81085999a802c9a695ba3a9f3f2`
          **Artifact ZIP SHA-256:** `265ebfae87ad3c48a6dbb57d0b3dce81a4c4d1c2e4872357f970354974da7a62`

          ## Published exact identities

          - exact accepted S1.42AK parent SHA-256: `b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee`;
          - published profile SHA-256: `56884f84bf90b1d8038b6aa1ee12de4548aedf76603134acbd5a91ad74233ef2`;
          - published `S142AKBMGHDiag2.dll` SHA-256: `51de493e340a2e0c0422e9816b5c2f592113e12a71cf1be7081631b3c9520775`;
          - LethalLevelLoader 1.7.12 DLL SHA-256: `b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c`;
          - accepted S1.42AB normalizer SHA-256: `901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06`.

          ## Exact archive and readable snapshot contract

          The published `.r2z` is copied byte-for-byte from the reviewed Actions artifact; no profile or DLL rebuild occurs. All 337 archive members were rechecked against the already reviewed 337-row `FILE_INDEX.json`. The only added member is `BepInEx/plugins/S142AKBMGHDiag2/S142AKBMGHDiag2.dll`; the only changed existing member is `export.r2x`, limited to profile identity metadata. There are zero package changes, zero config changes and no removed members.

          `ProfileSources/S1.42AK-BMGHDIAG2/` was reconstructed from the exact reviewed `.r2z` with `BuildSystem/profile_builder.py` snapshot semantics rather than copied from the incomplete Actions upload. The reconstructed `FILE_INDEX.json` is data-identical to the reviewed 337-row index. `BepInEx/config/.LCMaxSoundsFix.cfg` is present at index 1 with size 621 and SHA-256 `0093bae709cec57fd3f4f3bc5af22231b16944a666768e7ecf879430693f73a2`.

          Fresh LLL provenance from the review artifact is persisted as `LLL_PROVENANCE.json` and confirms LethalLevelLoader 1.7.12 byte identity, exact accepted-parent binding, byte-identical parent export metadata and absence of an alternate LLL owner.

          ## Lifecycle boundary

          `Current/AUTO_BUILD_RESULT.*`, `BuildSpecs/current.json`, `Current/CURRENT_STATE.json` and `RuntimeInbox/ACTIVE_BUILD.txt` are intentionally unchanged by publication. S1.42AK remains accepted/latest, `active_candidate = null`, `runtime_test_outstanding = false`, and `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AK`.

          This publication exists only on the dedicated working branch until later PR/CI/merge handling. It does not authorize Gale import, gameplay, runtime arming or acceptance. Runtime activation remains a separate atomic lifecycle step.
          MD

          rm .github/workflows/s142ak-bmghdiag2-publish-reviewed.yml

      - name: Verify publication output and unchanged controllers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          profile = Path('Profiles/LC V1 S1.42AK-BMGHDIAG2 Black Mesa Greenhouse Diagnostic.r2z')
          assert hashlib.sha256(profile.read_bytes()).hexdigest() == '56884f84bf90b1d8038b6aa1ee12de4548aedf76603134acbd5a91ad74233ef2'
          index = json.loads(Path('ProfileSources/S1.42AK-BMGHDIAG2/FILE_INDEX.json').read_text(encoding='utf-8'))
          assert len(index) == 337
          assert index[1]['path'] == 'BepInEx/config/.LCMaxSoundsFix.cfg'
          assert index[1]['size'] == 621 and index[1]['sha256'] == '0093bae709cec57fd3f4f3bc5af22231b16944a666768e7ecf879430693f73a2'
          hidden = Path('ProfileSources/S1.42AK-BMGHDIAG2/BepInEx/config/.LCMaxSoundsFix.cfg')
          assert hidden.is_file() and hashlib.sha256(hidden.read_bytes()).hexdigest() == index[1]['sha256']
          with zipfile.ZipFile(profile) as z: assert len(z.infolist()) == 337
          spec=json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          state=json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          auto=json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert spec['enabled'] is False and spec['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()=='S1.42AK'
          assert state['accepted_baseline']['build_id']=='S1.42AK' and state['active_candidate'] is None and state['runtime_test_outstanding'] is False
          assert state['controllers']['runtime_active_build']=='S1.42AK'
          assert auto['build_id']=='S1.42AK'
          print('PASS: publication output is exact and live controllers remain inactive.')
          PY

      - name: Commit exact publication to working branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish exact reviewed S1.42AK-BMGHDIAG2 artifact [skip ci]'
          git push origin HEAD:c3f18-bmghdiag2-exact-publication
