name: C3F19 activate BMAFR1 runtime diagnostic

on:
  push:
    branches:
      - activate/s142ak-bmafr1-runtime
    paths:
      - '.github/workflows/c3f19-activate-bmafr1-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/s142ak-bmafr1-runtime
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and verify protected current navigation
        run: |
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Validate canonical repository contracts
        run: |
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/gale_profile_path_length_guard.py --self-test
          python RepositoryTools/gale_profile_path_length_guard.py
          python RepositoryTools/overhaul_contract_validator.py

      - name: Verify exact BMAFR1 activation and bounded delta
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          root=Path('.')
          build='S1.42AK-BMAFR1'
          profile_rel='Profiles/LC V1 S1.42AK-BMAFR1.r2z'
          profile_sha='8607a022e83304b473e7327ce5644141212a697fb8dffa210c58e02e5caafba5'
          accepted='S1.42AK'
          accepted_sha='b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee'
          candidate='S1.42AK-BMDSFIX1'
          candidate_sha='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          dll_sha='c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1'
          cfg_sha='d2a01df4829623ef3dcbacf8c09e98a9c6a72b0885f9302502da2bcb91b31b68'
          normalizer_sha='901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'
          lll_sha='b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c'
          activation='Current/224_S1.42AK_BMAFR1_RUNTIME_ACTIVATION.md'
          build_result='BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/BUILD_RESULT.json'
          static_path='BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/STATIC_VERIFICATION.json'
          index_path='ProfileSources/S1.42AK-BMAFR1/PROFILE_INDEX_RESULT.json'
          cfg_path='ProfileSources/S1.42AK-BMAFR1/BepInEx/config/LethalLevelLoader.cfg'

          def sha(path):
              return hashlib.sha256((root/path).read_bytes()).hexdigest()

          assert sha(profile_rel)==profile_sha
          assert sha(cfg_path)==cfg_sha
          cfg=(root/cfg_path).read_text(encoding='utf-8')
          raw='[' + ('\u200b'*9) + 'Custom Dungeon:  Abandoned Foundry]'
          plain='[Custom Dungeon:  Abandoned Foundry]'
          assert cfg.count(raw)==1
          assert plain not in cfg

          idx=json.loads((root/index_path).read_text(encoding='utf-8'))
          assert idx['build_id']==build
          assert idx['profile_path']==profile_rel
          assert idx['sha256']==profile_sha
          assert idx['zip_members']==337
          assert idx['snapshot']=={'entries':337,'text_entries':331}
          assert idx['build_id_resolution']=='EXPECTED_HASHES'

          br=json.loads((root/build_result).read_text(encoding='utf-8'))
          assert br['build_id']==build
          assert br['profile_name']=='LC V1 S1.42AK-BMAFR1'
          assert br['base_sha256']==accepted_sha
          assert br['output_profile']==profile_rel and br['output_sha256']==profile_sha
          assert br['zip_members']==337
          assert br['changed_existing_members']==['BepInEx/config/LethalLevelLoader.cfg','export.r2x']
          assert br['added_members']==['BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll']

          st=json.loads((root/static_path).read_text(encoding='utf-8'))
          assert st['status']=='STATIC_REVIEW_PASS_EXACT_BYTES_PUBLISHED_INDEXED_PRE_RUNTIME_ACTIVATION'
          assert st['output_sha256']==profile_sha
          assert st['diagnostic_dll_sha256']==dll_sha
          assert st['foundry_lll_config_sha256']==cfg_sha
          assert st['lll_dll_sha256']==lll_sha
          assert st['normalizer_sha256']==normalizer_sha
          assert st['foundry_raw_section_u200b_count']==9
          assert st['foundry_plain_section_present'] is False
          assert st['foundry_visible_equivalent_section_count']==1
          assert st['canonical_projected_runtime_paths']==[217,219]
          assert st['published'] is True and st['indexed'] is True

          state=json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          scope=state['selected_scope']
          diag=scope['diagnostic_revision']
          assert state['accepted_baseline']['build_id']==accepted
          assert state['accepted_baseline']['sha256']==accepted_sha
          assert state['active_candidate']['build_id']==candidate
          assert state['active_candidate']['status']=='ACTIVE_RUNTIME_CANDIDATE_NOT_ACCEPTED'
          assert state['active_candidate']['sha256']==candidate_sha
          assert state['latest_built_artifact']['build_id']==candidate
          assert state['runtime_test_outstanding'] is True
          assert scope['phase_c']['bmdsfix1_target_status'].startswith('OUTSTANDING_PASSIVE')
          assert state['controllers']['runtime_active_build']==build
          assert (root/'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()==build

          current=json.loads((root/'BuildSpecs/current.json').read_text(encoding='utf-8'))
          assert current['enabled'] is False
          assert current['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert current['base_sha256']==candidate_sha
          auto=json.loads((root/'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert auto['build_id']==candidate and auto['output_sha256']==candidate_sha

          assert diag['build_id']==build
          assert diag['status']=='PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED'
          assert diag['classification']=='DIAGNOSTIC_ONLY_NEVER_ACCEPT'
          assert diag['base_build_id']==accepted
          assert diag['base_profile']==state['accepted_baseline']['profile']
          assert diag['base_sha256']==accepted_sha
          assert diag['profile']==profile_rel
          assert diag['sha256']==profile_sha
          assert diag['profile_index_result']==index_path
          assert diag['build_result']==build_result
          assert diag['static_evidence']==static_path
          assert diag['diagnostic_dll_sha256']==dll_sha
          assert diag['foundry_lll_config_sha256']==cfg_sha
          assert diag['runtime_armed'] is True and diag['indexed'] is True and diag['published'] is True

          path1=scope['diagnostic_successor_revision']
          assert path1['build_id']=='S1.42AK-BMAFDIAG1PATH1'
          assert path1['status']=='PUBLISHED_DIAGNOSTIC_RUNTIME_REFUSED_DO_NOT_RERUN_NOT_ACCEPTED'
          assert path1['runtime_armed'] is False

          gale=(root/'RuntimeTools/ReplaceActiveGaleProfileV24.ps1').read_text(encoding='utf-8')
          for token in (
              '2026-10-01-import-uia-v2.4.5-one-hop-accepted-baseline-parent-chain',
              "elseif(([string]$diag.base_build_id) -eq ([string]$state.accepted_baseline.build_id))",
              'Direct accepted-baseline diagnostic runtime target',
          ):
              assert token in gale, token

          act=(root/activation).read_text(encoding='utf-8')
          for token in (
              build, profile_sha, cfg_sha, dll_sha, '[BMAFDIAG1]', 'FoundryFlow',
              'ReplaceActiveGaleProfileV24.ps1', 'NEVER ACCEPT', candidate,
              "RuntimeInbox/ACTIVE_BUILD.txt = S1.42AK-BMAFR1"
          ):
              assert token in act, token

          exp=json.loads((root/'Profiles/EXPECTED_HASHES.json').read_text(encoding='utf-8'))
          main_exp=json.loads(subprocess.check_output(
              ['git','show','origin/main:Profiles/EXPECTED_HASHES.json'], text=True))
          key=profile_rel
          assert exp[key]['build_id']==build and exp[key]['sha256']==profile_sha
          current_note=exp[key].pop('note')
          main_note=main_exp[key].pop('note')
          assert exp==main_exp
          assert current_note!=main_note
          assert 'active runtime target' in current_note

          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines())
          forbidden={
              'BuildSpecs/current.json',
              'Current/AUTO_BUILD_RESULT.json',
              profile_rel,
              'Profiles/LC V1 S1.42AK-BMAFD1P1.r2z',
          }
          assert not (forbidden & changed), f'Forbidden mutation: {sorted(forbidden & changed)}'
          assert not any(p.startswith('ProfileSources/') for p in changed), 'ProfileSources mutation forbidden'
          assert not any(p.startswith('RuntimeTools/') for p in changed), 'Gale/runtime helper mutation forbidden'
          assert not any(p.endswith('.dll') or p.endswith('.r2z') for p in changed), 'Profile/DLL byte mutation forbidden'
          buildspec_changes={p for p in changed if p.startswith('BuildSpecs/')}
          assert buildspec_changes=={
              'BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/BUILD_RESULT.json',
              'BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/STATIC_VERIFICATION.json',
          }, f'Unexpected BuildSpecs delta: {sorted(buildspec_changes)}'
          allowed={
              '.github/workflows/c3f19-activate-bmafr1-runtime.yml',
              'BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/BUILD_RESULT.json',
              'BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/STATIC_VERIFICATION.json',
              'Current/00_CURRENT_STATE.md',
              'Current/224_S1.42AK_BMAFR1_RUNTIME_ACTIVATION.md',
              'Current/ARTIFACT_EVIDENCE_INTEGRITY.json',
              'Current/ARTIFACT_EVIDENCE_INTEGRITY.md',
              'Current/CURRENT_STATE.json',
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              'Knowledge/CURRENT_LIFECYCLE.md',
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
              'Profiles/EXPECTED_HASHES.json',
              'RuntimeInbox/ACTIVE_BUILD.txt',
          }
          unexpected=sorted(changed-allowed)
          assert not unexpected, f'Unexpected activation delta: {unexpected}'
          print('PASS: exact BMAFR1 direct-accepted activation + raw Foundry binding + bounded delta verified')
          PY
          git diff --check -- . ':(exclude)README.md' ':(exclude)START_HERE_ChatGPT_Masterprompt.txt' ':(exclude)Current/00_CURRENT_STATE.md' ':(exclude)Current/01_HANDOVER_CORE.md'

      - name: Remove one-shot machinery and commit validated activation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/c3f19-activate-bmafr1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated or cleanup delta to commit'
          else
            git diff --cached --check -- . ':(exclude)README.md' ':(exclude)START_HERE_ChatGPT_Masterprompt.txt' ':(exclude)Current/00_CURRENT_STATE.md' ':(exclude)Current/01_HANDOVER_CORE.md'
            git commit -m 'Validate exact BMAFR1 runtime diagnostic activation'
            git push origin HEAD:activate/s142ak-bmafr1-runtime
          fi
