name: Add deferred pending candidate integrity role

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag1-deferred-pending-role-schema.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extend pending-profile role schema narrowly
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('RepositoryTools/artifact_byte_integrity_validator.py')
          text = path.read_text(encoding='utf-8')
          old = 'PENDING_ROLE = "ACTIVE_RUNTIME_CANDIDATE_PENDING"\n'
          new = '''PENDING_ROLES = {\n    "ACTIVE_RUNTIME_CANDIDATE_PENDING",\n    "DEFERRED_FULL_NORMAL_RUNTIME_GATE_NOT_WAIVED",\n}\n'''
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one PENDING_ROLE declaration')
          text = text.replace(old, new)
          old = '''        if entry.get("role") != PENDING_ROLE:\n            errors.append(f"{build_id}: pending_profiles entry must use role {PENDING_ROLE}")\n'''
          new = '''        if entry.get("role") not in PENDING_ROLES:\n            errors.append(\n                f"{build_id}: pending_profiles entry role {entry.get('role')!r} is not one of "\n                f"{sorted(PENDING_ROLES)}"\n            )\n'''
          if text.count(old) != 1:
              raise RuntimeError('Expected exactly one pending role validation block')
          path.write_text(text.replace(old, new), encoding='utf-8')

          registry_path = Path('Current/ARTIFACT_EVIDENCE_INTEGRITY.json')
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          policy = registry.setdefault('runtime_evidence_policy', {})
          if policy.get('pending_candidate_role') != 'ACTIVE_RUNTIME_CANDIDATE_PENDING':
              raise RuntimeError('Unexpected active pending role policy')
          policy['deferred_pending_candidate_role'] = 'DEFERRED_FULL_NORMAL_RUNTIME_GATE_NOT_WAIVED'
          registry_path.write_text(json.dumps(registry, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Remove one-shot schema workflow
        run: git rm .github/workflows/diag1-deferred-pending-role-schema.yml

      - name: Validate exact integrity schema change
        run: |
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py

      - name: Commit integrity schema
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Support deferred pending runtime candidate evidence'
          git push origin HEAD:main
