name: Validate S1.42AI-DIAG1R3 canonical materialization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1r3-postbuild-validation.yml'
      - 'BuildSpecs/S1.42AI-DIAG1R3_POSTBUILD_VALIDATION.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1r3-postbuild-validation.yml'
      - 'BuildSpecs/S1.42AI-DIAG1R3_POSTBUILD_VALIDATION.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s142ai-diag1r3-postbuild-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R3_BUILD_COMMIT: 19914cff25cb768cffe22694e93df150e45bdd2f
      R3_PROFILE: Profiles/LC V1 S1.42AI-DIAG1R3 ShyGuy Identity Repair.r2z
      R3_PROFILE_SHA256: 13d73d8aa1b651bccfb80d8b242efe63eae7def3639df1ad949bfdf724424768
      R3_PLUGIN_SHA256: 98b464e559120dc43e8041f163ceab038506e045f4b3cd4c71be8687e9c5da7a
      DIAG1_VALIDATION_PROFILE: ValidationArtifacts/S1.42AI-DIAG1R3.sdk8.validation.r2z
      DIAG1_VALIDATION_RESULT: ValidationArtifacts/diag1r3-sdk8-validation-result.json
      DIAG1_STATIC_OUT: ValidationArtifacts/diag1r3-static-out
      DIAG1_MATERIALIZED_APPLICABILITY_OUT: ValidationArtifacts/diag1r3-materialized-applicability.json

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fail closed on exact pre-validation repository state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          workflow = '.github/workflows/s142ai-diag1r3-postbuild-validation.yml'
          request = 'BuildSpecs/S1.42AI-DIAG1R3_POSTBUILD_VALIDATION.md'
          build_commit = os.environ['R3_BUILD_COMMIT']
          profile = Path(os.environ['R3_PROFILE'])
          expected_profile_sha = os.environ['R3_PROFILE_SHA256']
          expected_plugin_sha = os.environ['R3_PLUGIN_SHA256']

          subprocess.run(['git', 'merge-base', '--is-ancestor', build_commit, 'HEAD'], check=True)
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', build_commit, 'HEAD'], text=True
          ).splitlines())
          if changed != {workflow, request}:
              raise RuntimeError(f'Unexpected repository drift since R3 build commit: {sorted(changed)}')

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          state = json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          if state.get('accepted_baseline', {}).get('build_id') != 'S1.42AH':
              raise RuntimeError('Accepted baseline drifted before R3 post-build validation')
          if state.get('active_candidate') is not None or state.get('runtime_test_outstanding') is not False:
              raise RuntimeError('R3 post-build validation requires no active candidate and no outstanding runtime test')
          revision = state.get('selected_scope', {}).get('diagnostic_revision', {})
          if revision.get('build_id') != 'S1.42AI-DIAG1R3':
              raise RuntimeError('CURRENT_STATE no longer identifies R3 as prepared successor')

          controller = json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          expected_controller = {
              'enabled': True,
              'build_id': 'S1.42AI-DIAG1R3',
              'base_profile': 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z',
              'base_sha256': 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2',
              'output_profile': os.environ['R3_PROFILE'],
              'profile_name': 'LC V1 S1.42AI-DIAG1R3 ShyGuy Identity Repair',
          }
          for key, expected in expected_controller.items():
              if controller.get(key) != expected:
                  raise RuntimeError(f'R3 controller drift for {key}: {controller.get(key)!r} != {expected!r}')

          active = Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()
          if active != 'S1.42AI-DIAG1R2':
              raise RuntimeError(f'Runtime attribution moved before R3 validation: {active!r}')

          result = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          expected_result = {
              'build_id': 'S1.42AI-DIAG1R3',
              'base_profile': 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z',
              'base_sha256': 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2',
              'output_profile': os.environ['R3_PROFILE'],
              'output_sha256': expected_profile_sha,
              'snapshot_dir': 'ProfileSources/S1.42AI-DIAG1R3',
          }
          for key, expected in expected_result.items():
              if result.get(key) != expected:
                  raise RuntimeError(f'AUTO_BUILD_RESULT drift for {key}: {result.get(key)!r} != {expected!r}')
          if result.get('zip_members') != 337 or result.get('snapshot', {}).get('entries') != 337:
              raise RuntimeError('Unexpected R3 archive/snapshot entry count')
          if result.get('snapshot', {}).get('text_entries') != 331:
              raise RuntimeError('Unexpected R3 readable snapshot count')
          if result.get('mod_state_changes') != [] or result.get('mod_additions') != [] or result.get('mod_removals') != []:
              raise RuntimeError('R3 unexpectedly changes package state')

          if not profile.is_file():
              raise RuntimeError(f'R3 profile is missing: {profile}')
          actual_sha = sha(profile)
          if actual_sha != expected_profile_sha:
              raise RuntimeError(f'R3 profile SHA mismatch: {actual_sha} != {expected_profile_sha}')

          index_path = Path('ProfileSources/S1.42AI-DIAG1R3/FILE_INDEX.json')
          if not index_path.is_file():
              raise RuntimeError('R3 readable ProfileSources snapshot/index is missing')
          index = json.loads(index_path.read_text(encoding='utf-8'))
          plugin_path = 'BepInEx/plugins/Tendas-S142AIDiag1Isolation/S142AIDiag1Isolation.dll'
          matches = [x for x in index if x.get('path') == plugin_path]
          if len(matches) != 1 or matches[0].get('sha256') != expected_plugin_sha:
              raise RuntimeError(f'R3 diagnostic DLL FILE_INDEX binding mismatch: {matches!r}')
          if matches[0].get('text_snapshot') is not False:
              raise RuntimeError('R3 diagnostic DLL is unexpectedly marked as a text snapshot')

          if Path('AnalysisEvidence/S1.42AI-DIAG1R3').exists():
              raise RuntimeError('R3 validation evidence already exists; refusing overwrite/reuse')
          PY

      - name: Restore exact DIAG1 compile dependencies
        run: dotnet restore Patches/S142AIDiag1Isolation/S142AIDiag1Isolation.csproj --configfile Patches/S142AIDiag1Isolation/NuGet.Config

      - name: Install pinned project decompiler
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375

      - name: Regenerate disabled DIAG1 draft
        run: python BuildSpecs/generate_s142ai_diag1_spec.py

      - name: Prepare SDK8 ephemeral validation profile
        shell: bash
        run: |
          mkdir -p ValidationArtifacts
          python - <<'PY'
          import json, os
          from pathlib import Path
          src = Path('BuildSpecs/S1.42AI-DIAG1_DRAFT.json')
          spec = json.loads(src.read_text(encoding='utf-8'))
          if spec.get('enabled') is not False or spec.get('build_id') != 'S1.42AI-DIAG1':
              raise RuntimeError('Unexpected regenerated DIAG1 draft identity')
          if spec.get('base_profile') != 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z':
              raise RuntimeError('Unexpected regenerated DIAG1 base profile')
          if spec.get('base_sha256') != 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2':
              raise RuntimeError('Unexpected regenerated DIAG1 base SHA')
          spec['enabled'] = True
          spec['output_profile'] = os.environ['DIAG1_VALIDATION_PROFILE']
          spec['snapshot_dir'] = 'ValidationArtifacts/diag1r3-sdk8-snapshot'
          spec['result_json'] = os.environ['DIAG1_VALIDATION_RESULT']
          spec['result_md'] = 'ValidationArtifacts/diag1r3-sdk8-validation-result.md'
          spec['overwrite'] = False
          Path('ValidationArtifacts/diag1r3-sdk8-validation-spec.json').write_text(
              json.dumps(spec, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Build SDK8 ephemeral profile through canonical builder
        run: python BuildSystem/profile_builder.py ValidationArtifacts/diag1r3-sdk8-validation-spec.json

      - name: Re-run exact DIAG1 static gate against SDK8 materialization
        run: python AnalysisTools/validate_s142ai_diag1_static_bound.py

      - name: Prove materialized applicability against canonical R3 profile
        env:
          DIAG1_MATERIALIZED_PROFILE: ${{ env.R3_PROFILE }}
        run: python AnalysisTools/validate_s142ai_diag1_materialized_applicability.py

      - name: Prove canonical R3 equivalence to exact repaired green gate
        shell: bash
        run: |
          python - <<'PY'
          import difflib
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          canonical = Path(os.environ['R3_PROFILE'])
          ephemeral = Path(os.environ['DIAG1_VALIDATION_PROFILE'])
          result = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          static = json.loads((Path(os.environ['DIAG1_STATIC_OUT']) / 'STATIC_VALIDATION.json').read_text(encoding='utf-8'))
          applicability = json.loads(Path(os.environ['DIAG1_MATERIALIZED_APPLICABILITY_OUT']).read_text(encoding='utf-8'))
          expected_sha = os.environ['R3_PROFILE_SHA256']
          expected_plugin_sha = os.environ['R3_PLUGIN_SHA256']
          plugin = 'BepInEx/plugins/Tendas-S142AIDiag1Isolation/S142AIDiag1Isolation.dll'
          config = 'BepInEx/config/tendas.s142ai.diag1.isolation.cfg'

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def run_text(args):
              p = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if p.returncode != 0:
                  raise RuntimeError(
                      f"{args[0]} failed ({p.returncode}) for {' '.join(args[1:])}: "
                      + p.stderr.decode('utf-8', errors='replace')[-3000:]
                  )
              return p.stdout.decode('utf-8', errors='replace').replace('\r\n', '\n').replace('\r', '\n')

          def normalize_il(text):
              text = re.sub(r'(?mi)^\s*//\s*MVID\s*:.*$', '// MVID: <NORMALIZED>', text)
              text = re.sub(r'(?mi)^\s*//\s*(?:PE|COFF)?\s*Timestamp\s*:.*$', '// Timestamp: <NORMALIZED>', text)
              text = re.sub(r'(?mi)^\s*//\s*Checksum\s*:.*$', '// Checksum: <NORMALIZED>', text)
              text = re.sub(r'(?mi)^\s*//\s*PDB.*$', '// PDB: <NORMALIZED>', text)
              return text

          actual_sha = sha(canonical)
          if actual_sha != expected_sha or result.get('output_sha256') != expected_sha:
              raise RuntimeError(f'Canonical DIAG1R3 SHA mismatch: file={actual_sha}, result={result.get("output_sha256")}')
          if result.get('build_id') != 'S1.42AI-DIAG1R3':
              raise RuntimeError('AUTO_BUILD_RESULT build_id mismatch')
          if static.get('status') != 'PASS_PREBUILD_STATIC_GATE':
              raise RuntimeError(f'Exact SDK8 static gate not green: {static.get("status")}')
          identity = static.get('checks', {}).get('plugin_source', {}).get('shyguy_identity_contract')
          expected_identity = {
              'asset': 'ShyGuyDef',
              'enemyName': 'Shy guy',
              'aiType': 'ShyGuy.AI.ShyGuyAI',
              'comparison': 'StringComparison.Ordinal',
          }
          if identity != expected_identity:
              raise RuntimeError(f'Unexpected exact ShyGuy identity contract: {identity!r}')
          if applicability.get('status') != 'PASS_MATERIALIZED_ENDLESS_ELEVATOR_APPLICABILITY':
              raise RuntimeError(f'Canonical applicability gate not green: {applicability.get("status")}')
          if applicability.get('materialized_profile_sha256') != expected_sha:
              raise RuntimeError('Applicability report is not bound to the exact canonical R3 profile')

          with zipfile.ZipFile(canonical) as z:
              c = {n: z.read(n) for n in z.namelist() if not n.endswith('/')}
          with zipfile.ZipFile(ephemeral) as z:
              e = {n: z.read(n) for n in z.namelist() if not n.endswith('/')}
          if set(c) != set(e):
              raise RuntimeError(f'Canonical/ephemeral member-set mismatch: only-canonical={sorted(set(c)-set(e))}, only-ephemeral={sorted(set(e)-set(c))}')
          if len(c) != 337:
              raise RuntimeError(f'Unexpected canonical member count: {len(c)}')

          differing = [n for n in sorted(c) if c[n] != e[n]]
          unexpected = sorted(set(differing) - {'export.r2x', plugin})
          if unexpected:
              raise RuntimeError(f'Unexpected canonical/green-gate byte differences: {unexpected}')

          def normalize_export(data):
              text = data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
              hits = [line for line in text.split('\n') if re.match(r'^\s*profileName\s*:', line)]
              if len(hits) != 1:
                  raise RuntimeError(f'Expected exactly one profileName, found {len(hits)}')
              normalized = re.sub(r'(?m)^(\s*)profileName\s*:.*$', r'\1profileName: <NORMALIZED>', text)
              return normalized, hits[0].strip()

          cn, cname = normalize_export(c['export.r2x'])
          en, ename = normalize_export(e['export.r2x'])
          if cn != en:
              raise RuntimeError('export.r2x differs by more than profileName')
          if cname != 'profileName: LC V1 S1.42AI-DIAG1R3 ShyGuy Identity Repair':
              raise RuntimeError(f'Unexpected canonical profileName line: {cname}')
          if ename != 'profileName: LC V1 S1.42AI-DIAG1 ShyGuy Isolation':
              raise RuntimeError(f'Unexpected green-gate profileName line: {ename}')

          out = Path('ValidationArtifacts/diag1r3-materialized')
          out.mkdir(parents=True, exist_ok=True)
          canonical_dll = out / 'canonical.dll'
          ephemeral_dll = out / 'green-gate.dll'
          canonical_dll.write_bytes(c[plugin])
          ephemeral_dll.write_bytes(e[plugin])
          plugin_sha = hashlib.sha256(c[plugin]).hexdigest()
          ephemeral_plugin_sha = hashlib.sha256(e[plugin]).hexdigest()
          if plugin_sha != expected_plugin_sha:
              raise RuntimeError(f'Canonical R3 plugin SHA mismatch: {plugin_sha} != {expected_plugin_sha}')
          static_plugin_sha = static['checks']['ephemeral_profile']['plugin_sha256']
          if ephemeral_plugin_sha != static_plugin_sha:
              raise RuntimeError(
                  f'Green-gate plugin/result SHA mismatch: profile={ephemeral_plugin_sha}, static={static_plugin_sha}'
              )

          canonical_types = run_text(['ilspycmd', '-l', 'c', str(canonical_dll)])
          ephemeral_types = run_text(['ilspycmd', '-l', 'c', str(ephemeral_dll)])
          if canonical_types != ephemeral_types:
              raise RuntimeError('Canonical/green-gate diagnostic DLL class inventories differ')
          type_names = []
          for line in canonical_types.splitlines():
              stripped = line.strip()
              if stripped.startswith('Class '):
                  type_names.append(stripped[6:].strip())
          if not type_names:
              raise RuntimeError('Diagnostic DLL class inventory is empty')

          semantic_type_hashes = {}
          decompiled_sources = []
          for type_name in type_names:
              canonical_cs = run_text(['ilspycmd', '-t', type_name, str(canonical_dll)])
              ephemeral_cs = run_text(['ilspycmd', '-t', type_name, str(ephemeral_dll)])
              if canonical_cs != ephemeral_cs:
                  diff = ''.join(difflib.unified_diff(
                      ephemeral_cs.splitlines(True), canonical_cs.splitlines(True),
                      fromfile='green-gate.cs', tofile='canonical.cs', n=3
                  ))[:12000]
                  raise RuntimeError(f'Decompiled C# semantic mismatch for {type_name}:\n{diff}')
              decompiled_sources.append(canonical_cs)

              canonical_il = normalize_il(run_text(['ilspycmd', '--ilcode', '-t', type_name, str(canonical_dll)]))
              ephemeral_il = normalize_il(run_text(['ilspycmd', '--ilcode', '-t', type_name, str(ephemeral_dll)]))
              if canonical_il != ephemeral_il:
                  diff = ''.join(difflib.unified_diff(
                      ephemeral_il.splitlines(True), canonical_il.splitlines(True),
                      fromfile='green-gate.il', tofile='canonical.il', n=3
                  ))[:12000]
                  raise RuntimeError(f'Normalized IL semantic mismatch for {type_name}:\n{diff}')
              semantic_type_hashes[type_name] = hashlib.sha256(canonical_il.encode('utf-8')).hexdigest()

          all_canonical_source = '\n'.join(decompiled_sources)
          forbidden = [
              'ResolveRequiredType("LethalMin.PikminType")',
              'ResolveRequiredType("ElevatorMod.Patches.EndlessElevator")',
              'Shy Guy',
          ]
          for marker in forbidden:
              if marker in all_canonical_source:
                  raise RuntimeError(f'Canonical DLL decompiles with known-bad marker/resolver: {marker}')
          required_markers = [
              '[DIAG1_OWNER_TYPE_DERIVED]',
              '[DIAG1_COMPLEX_TARGET_NOT_APPLICABLE]',
              '[DIAG1_COMPLEX_TARGET_APPLICABLE]',
              'kite.ZelevatorCode',
              'ShyGuyDef',
              'Shy guy',
              'ShyGuy.AI.ShyGuyAI',
              'StringComparison.Ordinal',
          ]
          for marker in required_markers:
              if marker not in all_canonical_source:
                  raise RuntimeError(f'Canonical DLL is missing repaired runtime marker/binding: {marker}')

          cfg = c[config].decode('utf-8-sig')
          if 'S1.42AI-DIAG1 Enabled = true' not in cfg:
              raise RuntimeError('Canonical DIAG1 diagnostic config is not enabled')

          owner_contract = static['checks']['lethalmin_withdraw_clr_contract']
          if owner_contract.get('parameter_0_generic_argument') != 'LethalMin.Pikmin.PikminType':
              raise RuntimeError(f'Unexpected metadata-derived PikminType: {owner_contract.get("parameter_0_generic_argument")}')
          if owner_contract.get('parameter_0_generic_argument_same_assembly') is not True:
              raise RuntimeError('LethalMin generic argument same-assembly proof missing')

          compat_contract = static['checks']['endless_elevator_applicability']
          expected_compat = {
              'applicability': 'NOT_APPLICABLE_DEPENDENCY_ABSENT',
              'dependency_guid': 'kite.ZelevatorCode',
              'provider_assembly': 'kite.ZelevatorCode',
              'provider_type': 'ElevatorMod.Patches.EndlessElevator',
              'required_when_dependency_present': True,
              'missing_or_drifted_target_when_applicable': 'FAIL_CLOSED',
          }
          for key, expected in expected_compat.items():
              if compat_contract.get(key) != expected:
                  raise RuntimeError(f'Unexpected static applicability contract for {key}: {compat_contract.get(key)!r}')

          report = {
              'schema_version': 1,
              'status': 'PASS_CANONICAL_DIAG1R3_MATERIALIZED_IDENTITY_APPLICABILITY_EQUIVALENCE',
              'build_id': 'S1.42AI-DIAG1R3',
              'canonical_profile': str(canonical),
              'canonical_profile_sha256': actual_sha,
              'canonical_build_commit': os.environ['R3_BUILD_COMMIT'],
              'validation_head_sha': os.environ.get('GITHUB_SHA'),
              'validation_workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'static_gate_status': static['status'],
              'materialized_applicability_status': applicability['status'],
              'shyguy_identity_contract': expected_identity,
              'canonical_plugin_sha256': plugin_sha,
              'green_gate_plugin_sha256': ephemeral_plugin_sha,
              'plugin_byte_identical': plugin_sha == ephemeral_plugin_sha,
              'plugin_class_inventory_identical': True,
              'plugin_decompiled_csharp_identical_per_type': True,
              'plugin_normalized_il_identical_per_type': True,
              'plugin_semantic_type_hashes': semantic_type_hashes,
              'zip_members': len(c),
              'byte_identical_members_excluding_plugin_and_export': len(c) - 2,
              'allowed_nonidentical_members': sorted(set(differing)),
              'export_difference': 'profileName only',
              'metadata_derived_pikmin_type': owner_contract['parameter_0_generic_argument'],
              'metadata_derived_pikmin_type_same_assembly': True,
              'endless_elevator_applicability': expected_compat,
              'canonical_runtime_markers_verified': required_markers,
              'known_bad_markers_absent_from_canonical_dll': forbidden,
              'runtime_state_modified': False,
          }
          (out / 'MATERIALIZED_VALIDATION.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          (out / 'MATERIALIZED_VALIDATION.md').write_text(
              '# S1.42AI-DIAG1R3 materialized validation\n\n'
              f"- Status: **{report['status']}**\n"
              f"- Canonical profile SHA-256: `{actual_sha}`\n"
              f"- Canonical diagnostic DLL SHA-256: `{plugin_sha}`\n"
              f"- Green-gate diagnostic DLL SHA-256: `{ephemeral_plugin_sha}`\n"
              f"- Exact ShyGuy identity: `ShyGuyDef` / `Shy guy` / `ShyGuy.AI.ShyGuyAI` / `StringComparison.Ordinal`\n"
              f"- Static gate: **{static['status']}**\n"
              f"- Materialized EndlessElevator applicability: **{applicability['status']}**\n"
              f"- Plugin decompiled C# identical for all {len(type_names)} classes: **true**\n"
              f"- Plugin normalized IL identical for all {len(type_names)} classes: **true**\n"
              f"- ZIP members: **{len(c)}**\n"
              f"- All non-plugin members except `export.r2x`: byte-identical to the repaired SDK8 green-gate materialization\n"
              f"- `export.r2x`: profileName-only difference\n"
              f"- Metadata-derived PikminType: `{owner_contract['parameter_0_generic_argument']}`\n"
              f"- EndlessElevator dependency GUID: `{expected_compat['dependency_guid']}`\n",
              encoding='utf-8'
          )
          canonical_dll.unlink()
          ephemeral_dll.unlink()
          print(json.dumps(report, indent=2))
          PY

      - name: Assert validation did not mutate live controllers
        run: git diff --exit-code -- BuildSpecs/current.json RuntimeInbox/ACTIVE_BUILD.txt Current/CURRENT_STATE.json Current/AUTO_BUILD_RESULT.json Current/AUTO_BUILD_RESULT.md

      - name: Persist exact R3 validation evidence and self-delete
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p AnalysisEvidence/S1.42AI-DIAG1R3
          cp ValidationArtifacts/diag1r3-materialized/MATERIALIZED_VALIDATION.json AnalysisEvidence/S1.42AI-DIAG1R3/MATERIALIZED_VALIDATION.json
          cp ValidationArtifacts/diag1r3-materialized/MATERIALIZED_VALIDATION.md AnalysisEvidence/S1.42AI-DIAG1R3/MATERIALIZED_VALIDATION.md
          cp ValidationArtifacts/diag1r3-materialized-applicability.json AnalysisEvidence/S1.42AI-DIAG1R3/ENDLESS_ELEVATOR_MATERIALIZED_APPLICABILITY.json
          git rm .github/workflows/s142ai-diag1r3-postbuild-validation.yml
          git add AnalysisEvidence/S1.42AI-DIAG1R3
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/s142ai-diag1r3-postbuild-validation.yml',
              'AnalysisEvidence/S1.42AI-DIAG1R3/MATERIALIZED_VALIDATION.json',
              'AnalysisEvidence/S1.42AI-DIAG1R3/MATERIALIZED_VALIDATION.md',
              'AnalysisEvidence/S1.42AI-DIAG1R3/ENDLESS_ELEVATOR_MATERIALIZED_APPLICABILITY.json',
          }
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if paths != expected:
              raise RuntimeError(f'Unexpected persistence diff: {sorted(paths)}')
          PY
          git diff --cached --check
