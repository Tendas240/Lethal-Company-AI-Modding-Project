name: C3F18 reconcile BMGHDIAG3 frozen overhaul guard

on:
  push:
    branches:
      - activate/s142ak-bmghdiag3-runtime
    paths:
      - '.github/workflows/c3f18-bmghdiag3-overhaul-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/s142ak-bmghdiag3-runtime
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extend exact accepted-baseline diagnostic runtime guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('RepositoryTools/overhaul_contract_validator.py')
          text=p.read_text(encoding='utf-8')
          start_marker='    diagnostic_direct_accepted = bool(\n'
          end_marker='    diagnostic_one_hop = bool(\n'
          assert text.count(start_marker)==1, 'frozen overhaul direct-accepted start drift'
          start=text.index(start_marker)
          end=text.index(end_marker,start)
          replacement='\n'.join([
              '    diagnostic_direct_accepted_with_candidate = bool(',
              '        diagnostic_common',
              '        and candidate_id',
              '        and diagnostic.get("base_build_id") == a.get("build_id")',
              '        and diagnostic.get("base_profile") == a.get("profile")',
              '        and diagnostic.get("base_sha256") == a.get("sha256")',
              '    )',
              '    diagnostic_direct_accepted_without_candidate = bool(',
              '        diagnostic_common',
              '        and not candidate_id',
              '        and a.get("build_id") == latest.get("build_id")',
              '        and a.get("profile") == latest.get("profile")',
              '        and a.get("sha256") == latest.get("sha256")',
              '        and diagnostic.get("base_build_id") == a.get("build_id")',
              '        and diagnostic.get("base_profile") == a.get("profile")',
              '        and diagnostic.get("base_sha256") == a.get("sha256")',
              '    )',
              '    diagnostic_direct_accepted = (',
              '        diagnostic_direct_accepted_with_candidate or diagnostic_direct_accepted_without_candidate',
              '    )',
              '',
          ])
          p.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY

      - name: Validate exact guard and repository contracts
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python - <<'PY'
          from pathlib import Path
          text=Path('RepositoryTools/overhaul_contract_validator.py').read_text(encoding='utf-8')
          assert 'diagnostic_direct_accepted_with_candidate' in text
          assert 'diagnostic_direct_accepted_without_candidate' in text
          assert 'diagnostic_direct_accepted = (' in text
          assert 'diagnostic_direct_candidate or diagnostic_direct_accepted or diagnostic_one_hop' in text
          PY
          git diff --check

      - name: Commit permanent guard and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/c3f18-bmghdiag3-overhaul-guard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Support accepted-baseline diagnostic in frozen overhaul guard'
          git push origin HEAD:activate/s142ak-bmghdiag3-runtime
