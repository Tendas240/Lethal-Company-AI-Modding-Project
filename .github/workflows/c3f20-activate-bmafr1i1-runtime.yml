name: One-shot S1.42AK-BMAFR1I1 runtime activation

on:
  push:
    branches:
      - activate/s142ak-bmafr1i1-runtime
    paths:
      - '.github/workflows/c3f20-activate-bmafr1i1-runtime.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact activation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: activate/s142ak-bmafr1i1-runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize bounded runtime activation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import copy, hashlib, json, re, zipfile
          from pathlib import Path

          ROOT = Path(".")
          EXPECTED_MAIN = "65bbc85c3159aa9368be63e661763e0bb5499270"
          BUILD = "S1.42AK-BMAFR1I1"
          PROFILE = "Profiles/LC V1 S1.42AK-BMAFR1I1.r2z"
          PROFILE_NAME = "LC V1 S1.42AK-BMAFR1I1"
          PROFILE_SHA = "734dbe491b4f4fb77704472a303e386058e976325e0595dc4795af1940d1cb07"
          DLL_SHA = "d9e09b20a889260d5cc8b4970d023a76d5b7af77ad677077b9718dfa8a150b6a"
          PARENT = "S1.42AK-BMAFR1"
          PARENT_PROFILE = "Profiles/LC V1 S1.42AK-BMAFR1.r2z"
          PARENT_SHA = "8607a022e83304b473e7327ce5644141212a697fb8dffa210c58e02e5caafba5"
          ACCEPTED = "S1.42AK"
          ACCEPTED_PROFILE = "Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z"
          ACCEPTED_SHA = "b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee"
          ACTIVE_GAMEPLAY = "S1.42AK-BMDSFIX1"
          REV_OLD = "2026-10-01-import-uia-v2.4.5-one-hop-accepted-baseline-parent-chain"
          REV_NEW = "2026-10-04-import-uia-v2.4.6-one-hop-runtime-pass-accepted-parent-chain"
          ACTIVATION = "Current/238_S1.42AK_BMAFR1I1_RUNTIME_ACTIVATION.md"

          def loadj(p):
              return json.loads((ROOT / p).read_text(encoding="utf-8"))
          def dumpj(p, o):
              (ROOT / p).write_text(json.dumps(o, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          def sha256(p):
              return hashlib.sha256((ROOT / p).read_bytes()).hexdigest()
          def must(cond, msg):
              if not cond:
                  raise SystemExit(msg)
          def replace_once(text, old, new, label):
              count = text.count(old)
              must(count == 1, f"{label}: expected exactly one replacement target, found {count}")
              return text.replace(old, new, 1)

          # Exact immutable-byte preflight.
          must(sha256(PROFILE) == PROFILE_SHA, "BMAFR1I1 profile SHA mismatch")
          idx = loadj("ProfileSources/S1.42AK-BMAFR1I1/PROFILE_INDEX_RESULT.json")
          must(idx.get("build_id") == BUILD, "BMAFR1I1 index build_id mismatch")
          must(idx.get("profile_path") == PROFILE and idx.get("sha256") == PROFILE_SHA, "BMAFR1I1 index profile/SHA mismatch")
          must(idx.get("zip_members") == 338, "BMAFR1I1 index zip-member mismatch")
          must(idx.get("snapshot", {}).get("entries") == 338 and idx.get("snapshot", {}).get("text_entries") == 331, "BMAFR1I1 index snapshot mismatch")
          must(idx.get("build_id_resolution") == "EXPECTED_HASHES", "BMAFR1I1 index resolution mismatch")
          with zipfile.ZipFile(ROOT / PROFILE) as z:
              dll = z.read("BepInEx/plugins/S142AKBMAFR1I1/S142AKBMAFR1I1.dll")
              must(hashlib.sha256(dll).hexdigest() == DLL_SHA, "BMAFR1I1 instrumentation DLL SHA mismatch")
              must(len(z.infolist()) == 338, "BMAFR1I1 live ZIP member count mismatch")
          must(sha256(PARENT_PROFILE) == PARENT_SHA, "BMAFR1 parent SHA mismatch")

          buildspec_before = (ROOT / "BuildSpecs/current.json").read_bytes()
          auto_before = (ROOT / "Current/AUTO_BUILD_RESULT.json").read_bytes()
          profile_before = (ROOT / PROFILE).read_bytes()
          parent_before = (ROOT / PARENT_PROFILE).read_bytes()

          state = loadj("Current/CURRENT_STATE.json")
          must(state["accepted_baseline"]["build_id"] == ACCEPTED, "accepted baseline drift")
          must(state["accepted_baseline"]["profile"] == ACCEPTED_PROFILE and state["accepted_baseline"]["sha256"] == ACCEPTED_SHA, "accepted baseline byte identity drift")
          must(state["active_candidate"]["build_id"] == ACTIVE_GAMEPLAY, "active gameplay candidate drift")
          must(state["active_candidate"]["status"] != "ACCEPTED", "BMDSFIX1 unexpectedly accepted")
          must(state["controllers"]["runtime_active_build"] == ACTIVE_GAMEPLAY, "pre-activation runtime controller drift")
          old_diag = copy.deepcopy(state["selected_scope"]["diagnostic_revision"])
          must(old_diag["build_id"] == PARENT and old_diag["sha256"] == PARENT_SHA, "expected BMAFR1 diagnostic parent is not current")
          must(old_diag.get("runtime_validation_status", "").startswith("RUNTIME_COMPATIBILITY_PASS"), "BMAFR1 parent is not runtime-compatibility PASS evidence")

          parent = old_diag
          parent["status"] = "PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED"
          parent["classification"] = "DIAGNOSTIC_ONLY_NEVER_ACCEPT"
          parent["runtime_armed"] = False

          diag = {
              "build_id": BUILD,
              "status": "PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED",
              "classification": "DIAGNOSTIC_ONLY_NEVER_ACCEPT",
              "base_build_id": PARENT,
              "base_profile": PARENT_PROFILE,
              "base_sha256": PARENT_SHA,
              "profile_name": PROFILE_NAME,
              "profile": PROFILE,
              "profile_sources": "ProfileSources/S1.42AK-BMAFR1I1/",
              "file_index": "ProfileSources/S1.42AK-BMAFR1I1/FILE_INDEX.json",
              "profile_index_result": "ProfileSources/S1.42AK-BMAFR1I1/PROFILE_INDEX_RESULT.json",
              "profile_sha256": PROFILE_SHA,
              "sha256": PROFILE_SHA,
              "diagnostic_dll_sha256": DLL_SHA,
              "inherited_bmaf_diagnostic_dll_sha256": "c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1",
              "foundry_lll_config_sha256": "d2a01df4829623ef3dcbacf8c09e98a9c6a72b0885f9302502da2bcb91b31b68",
              "archive_members_verified": 338,
              "changed_existing_members": ["export.r2x"],
              "added_members": ["BepInEx/plugins/S142AKBMAFR1I1/S142AKBMAFR1I1.dll"],
              "removed_members": [],
              "package_changes": 0,
              "config_changes": 0,
              "build_plan": "BuildSpecs/S1.42AK-BMAFR1I1_PLAN.md",
              "build_result": "BuildSpecs/S1.42AK-BMAFR1I1_BUILD_EVIDENCE/BUILD_RESULT.json",
              "static_evidence": "Current/231_S1.42AK_BMAFR1I1_SOURCE_STATIC_INTEGRATION_RECONCILIATION.md",
              "publication_evidence": "Current/236_S1.42AK_BMAFR1I1_PUBLICATION_INTEGRATION_RECONCILIATION.md",
              "review_checkpoint": "BuildSpecs/S1.42AK-BMAFR1I1_BUILD_EVIDENCE/REVIEW_BUILD_CHECKPOINT.json",
              "publication_checkpoint": "Current/235_S1.42AK_BMAFR1I1_EXACT_BYTE_PUBLICATION_CHECKPOINT.md",
              "profile_index_reconciliation": "Current/237_S1.42AK_BMAFR1I1_PROFILE_INDEX_RECONCILIATION.md",
              "published": True,
              "indexed": True,
              "runtime_armed": True,
              "activation_record": ACTIVATION,
              "runtime_role": "DIAGNOSTIC_ONLY_BMAFR1_PERFORMANCE_ATTRIBUTION_OBSERVATION_NEVER_ACCEPT",
              "runtime_validation_status": "RUNTIME_ATTRIBUTION_EVIDENCE_OUTSTANDING_DIAGNOSTIC_ONLY_NEVER_ACCEPT"
          }

          state["updated"] = "2026-10-04"
          state["controllers"]["runtime_active_build"] = BUILD
          state["selected_scope"]["diagnostic_parent_revision"] = parent
          state["selected_scope"]["diagnostic_revision"] = diag
          phase = state["selected_scope"]["phase_c"]
          phase["bmafr1_instrumentation_runtime_activation"] = ACTIVATION
          phase["bmafr1_instrumentation_runtime_activation_status"] = "RUNTIME_ARMED_DIAGNOSTIC_ONLY_NEVER_ACCEPT_RUNTIME_EVIDENCE_OUTSTANDING"
          phase["bmafr1_instrumentation_review_gale_imported"] = False
          phase["bmafr1_instrumentation_review_runtime_armed"] = True
          phase["bmafr1_instrumentation_review_runtime_test_authorized"] = True
          phase["bmafr1_instrumentation_profile_index_status"] = "PROFILE_INDEX_GREEN_CANONICALLY_INDEXED_RUNTIME_ACTIVE_DIAGNOSTIC_ONLY_NEVER_ACCEPT"
          state["selected_scope"]["analysis_contract"] = (
              "S1.42AK-BMAFR1I1 is the active runtime/evidence diagnostic target solely for bounded BMAFR1 performance attribution. "
              "Require exact published/indexed profile SHA-256 " + PROFILE_SHA + " and exact instrumentation DLL SHA-256 " + DLL_SHA + ". "
              "The authority chain is BMAFR1I1 -> completed BMAFR1 runtime-compatibility-PASS diagnostic -> accepted S1.42AK; "
              "BMAFR1I1 remains DIAGNOSTIC ONLY / NEVER ACCEPT. Preserve the BMAFR1 compatibility PASS, keep S1.42AK-BMDSFIX1 NOT ACCEPTED, "
              "keep its regular Black Mesa x DeepSewersFlow gate passive/outstanding/unwaived, and infer no emitter/root cause from absence or correlation alone."
          )
          next_action = (
              "After this BMAFR1I1 runtime activation is integrated to main and permanent exact-main-head Knowledge Architecture is green, "
              "replace/import the exact repository-authorized S1.42AK-BMAFR1I1 Gale profile and execute one bounded Black Mesa x Abandoned Foundry "
              "performance-attribution runtime run. Require the [BMAFR1I1] ARMED marker and preserve the inherited BMAFDIAG1 Foundry diagnostic environment; "
              "collect the resulting LogOutput.log with the build-specific uploader. Do not accept BMAFR1I1 or S1.42AK-BMDSFIX1, do not waive the passive "
              "BMDSFIX1 Black Mesa x DeepSewersFlow gate, and do not treat correlation or a missing recurrence as emitter/root-cause proof."
          )
          state["next_action"] = next_action
          state["selected_scope"]["next_action"] = next_action
          dumpj("Current/CURRENT_STATE.json", state)

          # Runtime target metadata overlay: add only canonical identity/routing fields.
          br_path = "BuildSpecs/S1.42AK-BMAFR1I1_BUILD_EVIDENCE/BUILD_RESULT.json"
          br = loadj(br_path)
          must(br["build_id"] == BUILD and br["profile_sha256"] == PROFILE_SHA and br["parent_sha256"] == PARENT_SHA, "BMAFR1I1 build evidence identity drift")
          br.update({
              "profile_name": PROFILE_NAME,
              "base_build_id": PARENT,
              "base_profile": PARENT_PROFILE,
              "base_sha256": PARENT_SHA,
              "output_profile": PROFILE,
              "output_sha256": PROFILE_SHA,
              "zip_members": 338,
              "changed_existing_members": ["export.r2x"],
              "added_members": ["BepInEx/plugins/S142AKBMAFR1I1/S142AKBMAFR1I1.dll"],
              "removed_members": [],
              "package_changes": 0,
              "config_changes": 0,
              "snapshot_dir": "ProfileSources/S1.42AK-BMAFR1I1",
              "snapshot": {"entries": 338, "text_entries": 331},
              "runtime_target_metadata": {
                  "activation_record": ACTIVATION,
                  "classification": "DIAGNOSTIC_ONLY_NEVER_ACCEPT",
                  "authority_parent_build_id": PARENT,
                  "authority_parent_runtime_status": "RUNTIME_COMPATIBILITY_PASS",
                  "authority_parent_sha256": PARENT_SHA
              }
          })
          dumpj(br_path, br)

          # Active runtime attribution controller only; build controller remains byte-identical.
          (ROOT / "RuntimeInbox/ACTIVE_BUILD.txt").write_text(BUILD + "\n", encoding="utf-8")

          # EXPECTED_HASHES is lifecycle metadata only; exact hash remains unchanged.
          exp = loadj("Profiles/EXPECTED_HASHES.json")
          e = exp[PROFILE]
          must(e["build_id"] == BUILD and e["sha256"] == PROFILE_SHA, "EXPECTED_HASHES BMAFR1I1 mapping drift")
          e["note"] = (
              "Diagnostic-only active runtime target for bounded BMAFR1 performance attribution; exact reviewed bytes are published/indexed and "
              "the canonical readable snapshot is ProfileSources/S1.42AK-BMAFR1I1/. DIAGNOSTIC ONLY / NEVER ACCEPT and never a gameplay base. "
              "Runtime activation changes only repository runtime/evidence authority; profile/DLL/config/package bytes remain frozen."
          )
          dumpj("Profiles/EXPECTED_HASHES.json", exp)

          # Add BMAFR1I1 as pending diagnostic bytes in the canonical integrity index.
          integrity = loadj("Current/ARTIFACT_EVIDENCE_INTEGRITY.json")
          pending = integrity.setdefault("pending_profiles", [])
          must(not any(x.get("build_id") == BUILD for x in pending), "BMAFR1I1 already present in pending integrity registry")
          pending.append({
              "build_id": BUILD,
              "role": "ACTIVE_RUNTIME_DIAGNOSTIC_PENDING",
              "profile": PROFILE,
              "profile_sha256": PROFILE_SHA,
              "profile_sources": "ProfileSources/S1.42AK-BMAFR1I1/",
              "file_index": "ProfileSources/S1.42AK-BMAFR1I1/FILE_INDEX.json",
              "export": "ProfileSources/S1.42AK-BMAFR1I1/export.r2x",
              "build_plan": "BuildSpecs/S1.42AK-BMAFR1I1_PLAN.md",
              "activation_record": ACTIVATION,
              "runtime_evidence_required": False,
              "partial_runtime_evidence_present": False,
              "note": "Exact published/indexed BMAFR1I1 bytes are runtime-armed solely for bounded BMAFR1 performance attribution through exact BMAFR1 runtime-PASS parent -> accepted S1.42AK. DIAGNOSTIC ONLY / NEVER ACCEPT; BMDSFIX1 remains separate and unaccepted."
          })
          integrity["updated"] = "2026-10-04"
          integrity["last_validated"] = "2026-10-04"
          dumpj("Current/ARTIFACT_EVIDENCE_INTEGRITY.json", integrity)

          integrity_md_path = ROOT / "Current/ARTIFACT_EVIDENCE_INTEGRITY.md"
          imd = integrity_md_path.read_text(encoding="utf-8")
          if "**Last-Validated:**" in imd:
              imd = re.sub(r"\*\*Last-Validated:\*\* \d{4}-\d{2}-\d{2}", "**Last-Validated:** 2026-10-04", imd, count=1)
          anchor = "- **S1.42AK-BMAFR1** —"
          pos = imd.find(anchor)
          must(pos >= 0, "artifact integrity human index lacks BMAFR1 anchor")
          end = imd.find("\n", pos)
          addition = (
              "\n- **S1.42AK-BMAFR1I1** — active diagnostic instrumentation runtime/evidence target over completed BMAFR1; "
              "profile SHA-256 `" + PROFILE_SHA + "`; instrumentation DLL SHA-256 `" + DLL_SHA + "`; "
              "**DIAGNOSTIC ONLY / NEVER ACCEPT**; BMDSFIX1 remains separate / NOT ACCEPTED and its passive Deep Sewers gate remains unwaived."
          )
          imd = imd[:end] + addition + imd[end:]
          integrity_md_path.write_text(imd, encoding="utf-8")

          # Narrow Gale authority extension: one-hop runtime-PASS diagnostic parent -> exact accepted baseline.
          helper_path = ROOT / "RuntimeTools/ReplaceActiveGaleProfileV24.ps1"
          helper = helper_path.read_text(encoding="utf-8")
          must(helper.count(REV_OLD) >= 1, "expected v2.4.5 helper revision absent")
          helper = helper.replace(REV_OLD, REV_NEW)
          old = "$parentAnchoredToAccepted=([string]$parent.status) -eq 'PUBLISHED_DIAGNOSTIC_PRELOADER_PATH_LENGTH_BLOCKED_DO_NOT_RERUN_NOT_ACCEPTED'\n        if(!$parentAnchoredToAuto -and !$parentAnchoredToAccepted){throw \"Diagnostic parent '$($parent.build_id)' has no authorized parent status: '$($parent.status)'\"}"
          new = "$parentAnchoredToAccepted=([string]$parent.status) -eq 'PUBLISHED_DIAGNOSTIC_PRELOADER_PATH_LENGTH_BLOCKED_DO_NOT_RERUN_NOT_ACCEPTED'\n        $parentRuntimePassToAccepted=([string]$parent.status) -eq 'PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED' -and ([string]$parent.classification) -eq 'DIAGNOSTIC_ONLY_NEVER_ACCEPT' -and ([string]$parent.runtime_validation_status) -eq 'RUNTIME_COMPATIBILITY_PASS_DIAGNOSTIC_ONLY_NEVER_ACCEPT_PERFORMANCE_ATTRIBUTION_OUTSTANDING'\n        if(!$parentAnchoredToAuto -and !$parentAnchoredToAccepted -and !$parentRuntimePassToAccepted){throw \"Diagnostic parent '$($parent.build_id)' has no authorized parent status: '$($parent.status)'\"}"
          helper = replace_once(helper, old, new, "Gale parent status extension")
          helper = helper.replace("v2.4.5 fail-closed runtime path-budget", "v2.4.6 fail-closed runtime path-budget")
          helper = helper.replace("one-hop parent-to-AUTO-or-accepted-baseline chain", "one-hop parent-to-AUTO-or-approved-accepted-baseline chain")
          helper_path.write_text(helper, encoding="utf-8")

          validator_path = ROOT / "RepositoryTools/gale_import_helper_validator.py"
          gv = validator_path.read_text(encoding="utf-8")
          gv = replace_once(gv, 'V24_REVISION = "' + REV_OLD + '"', 'V24_REVISION = "' + REV_NEW + '"', "validator revision")
          gv = replace_once(
              gv,
              '        "PUBLISHED_DIAGNOSTIC_PRELOADER_PATH_LENGTH_BLOCKED_DO_NOT_RERUN_NOT_ACCEPTED",\n        "$parentAnchoredToAuto",',
              '        "PUBLISHED_DIAGNOSTIC_PRELOADER_PATH_LENGTH_BLOCKED_DO_NOT_RERUN_NOT_ACCEPTED",\n        "PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED",\n        "$parentRuntimePassToAccepted",\n        "RUNTIME_COMPATIBILITY_PASS_DIAGNOSTIC_ONLY_NEVER_ACCEPT_PERFORMANCE_ATTRIBUTION_OUTSTANDING",\n        "$parentAnchoredToAuto",',
              "validator required target tokens"
          )
          gv = gv.replace(
              'print("PASS: Gale import helper v2.4.5 runtime path-budget + direct AUTO/accepted-baseline + one-hop parent-to-AUTO-or-accepted-baseline chain + fail-closed materialization regression contract validated")',
              'print("PASS: Gale import helper v2.4.6 runtime path-budget + direct AUTO/accepted-baseline + one-hop parent-to-AUTO-or-approved-accepted-baseline chain + fail-closed materialization regression contract validated")'
          )
          validator_path.write_text(gv, encoding="utf-8")

          # Keep the permanent architecture validator aligned with the same exact fail-closed authority shape.
          ka_path = ROOT / "RepositoryTools/knowledge_architecture_validator.py"
          ka = ka_path.read_text(encoding="utf-8")
          ka_anchor = "    diagnostic_one_hop = diagnostic_one_hop_candidate or diagnostic_one_hop_accepted"
          must(ka.count(ka_anchor) == 1, "knowledge architecture diagnostic one-hop anchor drift")
          ka_lines = [
              "    diagnostic_one_hop_runtime_pass_accepted = bool(",
              "        diagnostic_common",
              "        and candidate_id",
              "        and diagnostic.get(\\"base_build_id\\") != candidate_id",
              "        and parent_id == diagnostic.get(\\"base_build_id\\")",
              "        and parent_diagnostic.get(\\"status\\") == \\"PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED\\"",
              "        and parent_diagnostic.get(\\"classification\\") == \\"DIAGNOSTIC_ONLY_NEVER_ACCEPT\\"",
              "        and parent_diagnostic.get(\\"runtime_validation_status\\") == \\"RUNTIME_COMPATIBILITY_PASS_DIAGNOSTIC_ONLY_NEVER_ACCEPT_PERFORMANCE_ATTRIBUTION_OUTSTANDING\\"",
              "        and diagnostic.get(\\"base_profile\\") == parent_diagnostic.get(\\"profile\\")",
              "        and diagnostic.get(\\"base_sha256\\") == parent_diagnostic.get(\\"sha256\\")",
              "        and parent_diagnostic.get(\\"base_build_id\\") == accepted.get(\\"build_id\\")",
              "        and parent_diagnostic.get(\\"base_profile\\") == accepted.get(\\"profile\\")",
              "        and parent_diagnostic.get(\\"base_sha256\\") == accepted.get(\\"sha256\\")",
              "        and parent_diagnostic.get(\\"build_result\\")",
              "        and parent_diagnostic.get(\\"static_evidence\\")",
              "        and parent_diagnostic.get(\\"publication_evidence\\")",
              "        and parent_diagnostic.get(\\"runtime_decision\\")",
              "    )",
          ]
          ka_insert = "\\n".join(ka_lines) + "\\n"
          ka_replacement = ka_insert + "    diagnostic_one_hop = diagnostic_one_hop_candidate or diagnostic_one_hop_accepted or diagnostic_one_hop_runtime_pass_accepted"
          ka = ka.replace(ka_anchor, ka_replacement, 1)
          ka_path.write_text(ka, encoding="utf-8")

          gale_path = ROOT / "Knowledge/GALE_PROFILE_WORKFLOW.md"
          gale = gale_path.read_text(encoding="utf-8")
          old_hardened = "**Last-Hardened:** 2026-10-01 (`" + REV_OLD + "`; preserves the runtime path-length budget and adds only an exact one-hop blocked-diagnostic-parent -> accepted-baseline authority edge for BMAFDIAG1PATH1)"
          new_hardened = "**Last-Hardened:** 2026-10-04 (`" + REV_NEW + "`; preserves all v2.4.5 guards and adds only an exact one-hop completed-runtime-PASS diagnostic-parent -> accepted-baseline authority edge for BMAFR1I1)"
          gale = replace_once(gale, old_hardened, new_hardened, "Gale Last-Hardened")
          old_anchor = "The parent must then use exactly one reviewed anchor: status `PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_EVIDENCE_INGESTED_NOT_ACCEPTED` with a direct exact bind to `AUTO_BUILD_RESULT`, or status `PUBLISHED_DIAGNOSTIC_PRELOADER_PATH_LENGTH_BLOCKED_DO_NOT_RERUN_NOT_ACCEPTED` with a direct exact build/profile/SHA bind to `CURRENT_STATE.accepted_baseline`."
          new_anchor = old_anchor[:-1] + ", or status `PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED` with classification `DIAGNOSTIC_ONLY_NEVER_ACCEPT`, exact BMAFR1 compatibility-PASS runtime status, and a direct exact build/profile/SHA bind to `CURRENT_STATE.accepted_baseline`."
          gale = replace_once(gale, old_anchor, new_anchor, "Gale authority anchor documentation")
          insert_marker = "## Critical package-root contract"
          must(insert_marker in gale, "Gale critical contract marker missing")
          v246 = """## v2.4.6 exact completed runtime-PASS parent -> accepted-baseline anchor
          
          `S1.42AK-BMAFR1I1` is a separately versioned observational successor of exact `S1.42AK-BMAFR1`. Its parent is not a blocked diagnostic: BMAFR1 has completed the bounded Black Mesa x Abandoned Foundry runtime-compatibility PASS and remains `DIAGNOSTIC ONLY / NEVER ACCEPT`, while its separate performance-attribution finding is unresolved. BMAFR1 itself derives directly from accepted S1.42AK; `AUTO_BUILD_RESULT` correctly remains the separate BMDSFIX1 gameplay candidate.
          
          Revision `""" + REV_NEW + """` adds exactly this authority edge. The active successor must match its own canonical build-result profile/base identity; its one-hop parent must match the exact BMAFR1 build-result; the parent status must be exactly `PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_COMPATIBILITY_PASS_NOT_ACCEPTED`, classification exactly `DIAGNOSTIC_ONLY_NEVER_ACCEPT`, and runtime validation status exactly `RUNTIME_COMPATIBILITY_PASS_DIAGNOSTIC_ONLY_NEVER_ACCEPT_PERFORMANCE_ATTRIBUTION_OUTSTANDING`; and the parent's base build/profile/SHA must bind exactly to `CURRENT_STATE.accepted_baseline`. Existing direct-AUTO, direct accepted-baseline, completed-parent -> AUTO and blocked-parent -> accepted-baseline shapes remain unchanged. No recursion, arbitrary-length chain or generic status fallback is introduced.
          
          """
          gale = gale.replace(insert_marker, v246 + insert_marker, 1)
          gale_path.write_text(gale, encoding="utf-8")

          # Activation record: authority/routing transition only.
