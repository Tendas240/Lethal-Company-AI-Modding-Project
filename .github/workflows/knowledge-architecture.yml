name: Knowledge Architecture

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'START_HERE_ChatGPT_Masterprompt.txt'
      - 'OVERHAUL_START_HERE_ChatGPT.txt'
      - 'Current/**'
      - 'Knowledge/**'
      - 'RepositoryTools/**'
      - 'BuildSpecs/**'
      - 'RuntimeInbox/ACTIVE_BUILD.txt'
      - 'Profiles/**'
      - 'ProfileSources/**'
      - 'RuntimeEvidence/**'
      - 'Patches/**'
      - 'BuildSystem/**'
      - 'RuntimeTools/**'
      - 'ExecutionCheckpoints/**'
      - '.github/workflows/knowledge-architecture.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'START_HERE_ChatGPT_Masterprompt.txt'
      - 'OVERHAUL_START_HERE_ChatGPT.txt'
      - 'Current/**'
      - 'Knowledge/**'
      - 'RepositoryTools/**'
      - 'BuildSpecs/**'
      - 'RuntimeInbox/ACTIVE_BUILD.txt'
      - 'Profiles/**'
      - 'ProfileSources/**'
      - 'RuntimeEvidence/**'
      - 'Patches/**'
      - 'BuildSystem/**'
      - 'RuntimeTools/**'
      - 'ExecutionCheckpoints/**'
      - '.github/workflows/knowledge-architecture.yml'

permissions:
  contents: read

jobs:
  validate-knowledge-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full provenance history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check generated current navigation
        run: python RepositoryTools/render_current_navigation.py --check

      - name: Validate repository knowledge architecture
        run: python RepositoryTools/knowledge_architecture_validator.py

      - name: Validate actual artifact and runtime bytes
        run: python RepositoryTools/artifact_byte_integrity_validator.py

      - name: Validate repository-wide integrity registry and authority
        run: python RepositoryTools/repository_integrity_guard.py

      - name: Validate S1.42AC runtime SHA provenance
        run: python RepositoryTools/runtime_sha_provenance_validator.py

      - name: Validate future multi-phase checkpoints
        run: python RepositoryTools/phase_checkpoint_validator.py

      - name: Validate original overhaul contract
        run: python RepositoryTools/overhaul_contract_validator.py

      - name: Run answerability routing regression
        run: python RepositoryTools/answerability_regression.py

      - name: Run validator negative self-tests
        run: python RepositoryTools/validator_selftest.py
