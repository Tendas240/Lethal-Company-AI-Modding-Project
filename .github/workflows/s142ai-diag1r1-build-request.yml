name: Request canonical S1.42AI-DIAG1R1 build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1r1-build-request.yml'

permissions:
  contents: write
  actions: write

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate and bind repaired DIAG1 draft
        shell: bash
        run: |
          python BuildSpecs/generate_s142ai_diag1_spec.py
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          draft_path = Path('BuildSpecs/S1.42AI-DIAG1_DRAFT.json')
          raw = draft_path.read_bytes()
          expected = '30450b982f33214699780724df06f0caff9d850710e890bf2a655538cdfa5087'
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected:
              raise RuntimeError(f'DIAG1 draft SHA mismatch: {actual} != {expected}')

          source = Path('Patches/S142AIDiag1Isolation/PackageOwnerGuards.cs').read_text(encoding='utf-8')
          bad = 'ResolveRequiredType("LethalMin.PikminType")'
          if bad in source:
              raise RuntimeError('Known-bad LethalMin.PikminType resolver is present')
          if 'ResolveLethalMinWithdrawPikminContract' not in source or '[DIAG1_OWNER_TYPE_DERIVED]' not in source:
              raise RuntimeError('Metadata-bound LethalMin owner type-resolution repair is missing')

          spec = json.loads(raw.decode('utf-8'))
          if spec.get('enabled') is not False:
              raise RuntimeError('Validated DIAG1 draft is not disabled')
          if spec.get('build_id') != 'S1.42AI-DIAG1':
              raise RuntimeError('Unexpected source DIAG1 build_id')
          if spec.get('base_profile') != 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z':
              raise RuntimeError('Unexpected DIAG1 base profile')
          if spec.get('base_sha256') != 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2':
              raise RuntimeError('Unexpected DIAG1 base SHA')
          if len(spec.get('config_patches', [])) != 235:
              raise RuntimeError('Unexpected DIAG1 config patch count')
          if len(spec.get('text_assertions', [])) != 47:
              raise RuntimeError('Unexpected DIAG1 assertion count')
          if spec.get('mod_state_changes') != [] or spec.get('mod_additions') != [] or spec.get('mod_removals') != []:
              raise RuntimeError('Unexpected DIAG1 package state delta')
          if len(spec.get('local_plugin_builds', [])) != 1:
              raise RuntimeError('Unexpected DIAG1 local plugin build count')

          spec['enabled'] = True
          spec['build_id'] = 'S1.42AI-DIAG1R1'
          spec['output_profile'] = 'Profiles/LC V1 S1.42AI-DIAG1R1 ShyGuy Isolation Repair.r2z'
          spec['profile_name'] = 'LC V1 S1.42AI-DIAG1R1 ShyGuy Isolation Repair'
          spec['snapshot_dir'] = 'ProfileSources/S1.42AI-DIAG1R1'
          Path('BuildSpecs/current.json').write_text(json.dumps(spec, indent=2) + '\n', encoding='utf-8')
          draft_path.unlink()
          PY

      - name: Remove completed one-shot request workflow
        run: git rm .github/workflows/s142ai-diag1r1-build-request.yml

      - name: Verify controller transition diff
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = {
              '.github/workflows/s142ai-diag1r1-build-request.yml',
              'BuildSpecs/current.json',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise RuntimeError(f'unexpected request diff: {sorted(actual)}')
          spec = json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          if spec.get('enabled') is not True or spec.get('build_id') != 'S1.42AI-DIAG1R1':
              raise RuntimeError('Build controller is not the exact enabled DIAG1R1 request')
          if spec.get('output_profile') != 'Profiles/LC V1 S1.42AI-DIAG1R1 ShyGuy Isolation Repair.r2z':
              raise RuntimeError('Unexpected DIAG1R1 output profile')
          if spec.get('snapshot_dir') != 'ProfileSources/S1.42AI-DIAG1R1':
              raise RuntimeError('Unexpected DIAG1R1 snapshot dir')
          PY
          git diff --check

      - name: Commit exact DIAG1R1 build request
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Request canonical S1.42AI-DIAG1R1 build'
          git push origin HEAD:main

      - name: Dispatch canonical profile build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run profile-build.yml --ref main
