name: Overhaul Post-Audit Remediation

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/overhaul-post-audit-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add historical/completion banners and authority classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          banners = {
              'Current/02_TECHNICAL_BASELINE.md': "> **HISTORICAL MIXED SNAPSHOT — NOT GLOBAL CURRENT AUTHORITY**\n> This file preserves older S1.41/S1.42-era wording for provenance. Live global state is `Current/00_CURRENT_STATE.md`; current topic authority lives in `Knowledge/`; patch-safety authority is `Current/68_PROJECT_LOCAL_PATCH_SAFETY_AND_REGRESSION_POLICY.md`. Historical `current` wording below must not override those sources.\n\n",
              'Current/07_FUTURE_ROADMAP_BCMER_INTERIORS.md': "> **HISTORICAL ROADMAP SNAPSHOT — NOT CURRENT AUTHORITY**\n> The `Current progress` block below is preserved chronology and is no longer live state. Current BCMER authority: `Knowledge/BCMER.md`; current Interiors/LLL authority: `Knowledge/INTERIORS_AND_LLL.md`; live deferred roadmap: `Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md`.\n\n",
              'Current/104_REPOSITORY_OVERHAUL_INFORMATION_ARCHITECTURE_PLAN.md': "> **EXECUTED CONTRACT SNAPSHOT — OVERHAUL COMPLETE / VALIDATED**\n> This document preserves the original binding overhaul plan. Its original `PLANNED / BINDING / NOT YET EXECUTED` wording below is historical text, not live state. Completion authority: `Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md`; machine result: `Current/OVERHAUL_VALIDATION_RESULTS.json`.\n\n",
              'Current/105_REPOSITORY_OVERHAUL_EXECUTION_PLAYBOOK.md': "> **EXECUTED CONTRACT SNAPSHOT — OVERHAUL COMPLETE / VALIDATED**\n> This document preserves the original execution playbook. Its original `PLANNED / NOT YET EXECUTED` wording below is historical text, not live state. Completion authority: `Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md`; machine result: `Current/OVERHAUL_VALIDATION_RESULTS.json`.\n\n",
          }

          for name, banner in banners.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              marker = banner.splitlines()[0]
              if marker not in text[:1200]:
                  p.write_text(banner + text, encoding='utf-8')

          p = Path('OVERHAUL_START_HERE_ChatGPT.txt')
          text = p.read_text(encoding='utf-8')
          marker = 'EXECUTED CONTRACT SNAPSHOT — OVERHAUL COMPLETE / VALIDATED'
          if marker not in text[:1600]:
              banner = "======================================================================\nEXECUTED CONTRACT SNAPSHOT — OVERHAUL COMPLETE / VALIDATED\n======================================================================\nThe instructions below are the preserved one-time execution contract from the pre-overhaul repository. They are NOT a claim that the overhaul is still pending.\n\nCurrent completion authority: Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md\nMachine validation: Current/OVERHAUL_VALIDATION_RESULTS.json\nRequirements status: Current/REPOSITORY_KNOWLEDGE_ARCHITECTURE_REQUIREMENTS.json\nOrdinary takeover starts at START_HERE_ChatGPT_Masterprompt.txt.\n\nDo not rerun phases 0-11 or create another pre-overhaul backup unless the user explicitly requests a new repository migration/audit.\n======================================================================\nPRESERVED ORIGINAL EXECUTION CONTRACT\n======================================================================\n\n"
              p.write_text(banner + text, encoding='utf-8')

          auth_path = Path('Current/DOCUMENT_AUTHORITY.json')
          auth = json.loads(auth_path.read_text(encoding='utf-8'))
          hist = auth.setdefault('historical_or_superseded', [])
          additions = [
              {
                  'path': 'OVERHAUL_START_HERE_ChatGPT.txt',
                  'classification': 'COMPLETED_EXECUTION_CONTRACT_SNAPSHOT',
                  'reason': 'One-time pre-overhaul execution entry point retained as the binding historical contract; the overhaul is complete and must not be re-run merely because the original instructions remain below the completion banner.',
                  'current_targets': ['Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md', 'Current/OVERHAUL_VALIDATION_RESULTS.json', 'START_HERE_ChatGPT_Masterprompt.txt']
              },
              {
                  'path': 'Current/104_REPOSITORY_OVERHAUL_INFORMATION_ARCHITECTURE_PLAN.md',
                  'classification': 'COMPLETED_EXECUTION_CONTRACT_SNAPSHOT',
                  'reason': 'Preserved original binding information-architecture plan; its planned/not-yet-executed status line is historical after Phase 11 completion.',
                  'current_targets': ['Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md', 'Current/OVERHAUL_VALIDATION_RESULTS.json']
              },
              {
                  'path': 'Current/105_REPOSITORY_OVERHAUL_EXECUTION_PLAYBOOK.md',
                  'classification': 'COMPLETED_EXECUTION_CONTRACT_SNAPSHOT',
                  'reason': 'Preserved original execution playbook; its planned/not-yet-executed status line is historical after Phase 11 completion.',
                  'current_targets': ['Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md', 'Current/OVERHAUL_VALIDATION_RESULTS.json']
              },
          ]
          existing = {x.get('path') for x in hist if isinstance(x, dict)}
          for item in additions:
              if item['path'] not in existing:
                  hist.append(item)
          auth['last_validated'] = '2026-09-04'
          auth_path.write_text(json.dumps(auth, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md_path = Path('Current/DOCUMENT_AUTHORITY.md')
          md = md_path.read_text(encoding='utf-8')
          heading = '## Completed overhaul execution-contract snapshots'
          if heading not in md:
              md += "\n\n## Completed overhaul execution-contract snapshots\n\nThe following files are preserved as the original one-time overhaul contract, but their old `PLANNED` / `NOT YET EXECUTED` wording is **historical** and must not be interpreted as live state:\n\n- `OVERHAUL_START_HERE_ChatGPT.txt`\n- `Current/104_REPOSITORY_OVERHAUL_INFORMATION_ARCHITECTURE_PLAN.md`\n- `Current/105_REPOSITORY_OVERHAUL_EXECUTION_PLAYBOOK.md`\n\nCurrent completion authority is `Current/110_REPOSITORY_OVERHAUL_FINAL_ACCEPTANCE.md` with machine validation in `Current/OVERHAUL_VALIDATION_RESULTS.json`. Ordinary project takeover starts at `START_HERE_ChatGPT_Masterprompt.txt`.\n"
              md_path.write_text(md, encoding='utf-8')
          PY

      - name: Commit remediation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No remediation changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OVERHAUL_START_HERE_ChatGPT.txt Current/02_TECHNICAL_BASELINE.md Current/07_FUTURE_ROADMAP_BCMER_INTERIORS.md Current/104_REPOSITORY_OVERHAUL_INFORMATION_ARCHITECTURE_PLAN.md Current/105_REPOSITORY_OVERHAUL_EXECUTION_PLAYBOOK.md Current/DOCUMENT_AUTHORITY.json Current/DOCUMENT_AUTHORITY.md
          git commit -m 'Resolve post-overhaul stale authority banners'
          git push origin HEAD:main
