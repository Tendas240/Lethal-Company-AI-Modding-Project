name: One-shot BMAFR1I1 handover reconciliation

on:
  push:
    branches:
      - handover/reconcile-bmafr1i1-runtime

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: handover/reconcile-bmafr1i1-runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Run permanent Knowledge Architecture validators
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/state_neutral_authority_validator.py --self-test
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/gale_profile_path_length_guard.py --self-test
          python RepositoryTools/gale_profile_path_length_guard.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          git diff --check

      - name: Commit generated navigation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/c3f20-handover-reconcile.yml"
          git add README.md START_HERE_ChatGPT_Masterprompt.txt Current/00_CURRENT_STATE.md Current/01_HANDOVER_CORE.md
          if git diff --cached --quiet; then
            echo "::error::Expected one-shot workflow removal or generated navigation changes"
            exit 1
          fi
          git commit -m "Validate BMAFR1I1 runtime handover reconciliation"
          git push origin HEAD:handover/reconcile-bmafr1i1-runtime
