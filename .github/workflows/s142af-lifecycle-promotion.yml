name: S1.42AF lifecycle promotion one-shot

on:
  push:
    branches:
      - chatgpt/s142af-lifecycle-promotion

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/s142af-lifecycle-promotion
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply S1.42AF lifecycle promotion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          AF_ID = 'S1.42AF'
          AF_TITLE = 'Path-Length-Safe Microwave Packaging'
          AF_PROFILE = 'Profiles/LC V1 S1.42AF Microwave Fix.r2z'
          AF_PROFILE_NAME = 'LC V1 S1.42AF Microwave Fix'
          AF_SHA = '6a82a42bfe010767f4f39aab4d108fa45268407d9658a3e2410162cf9f6f47d0'
          AF_DLL_SHA = '41ae2442983d89d9b317b3930f1f53aefaa63e56bfeae0cdb198f43b0bac089f'
          AF_RUN = 33993880634
          AF_BUILD_COMMIT = '2cab9044579e74739669440699c763a32f0fe379'
          AF_CANDIDATE = 'Current/126_S1.42AF_BUILD_CANDIDATE_PATH_LENGTH_SAFE_MICROWAVE_PACKAGING.md'
          AF_DECISION = 'Current/127_S1.42AE_PATH_LENGTH_SUPERSESSION_AND_S1.42AF_PROMOTION.md'
          AF_PROJECT_STATUS = 'Current/Projektstatus_S1.42AF_CANDIDATE.json'
          AF_PLAN = 'BuildSpecs/S1.42AF_PLAN.md'
          AC_PROFILE = 'Profiles/LC V1 S1.42AC BCMER EventType Equal Distribution.r2z'
          AC_SHA = '0ce58ab1fa0f0d76d6fbe1a4bff1dce9defc92e3d4b70cfb3056306e617e47d9'
          IMPORT_CMD = "$u='https://raw.githubusercontent.com/Tendas240/Lethal-Company-AI-Modding-Project/main/RuntimeTools/ReplaceActiveGaleProfileV24.ps1?cb='+[DateTime]::UtcNow.Ticks;iex (iwr -UseBasicParsing $u).Content"
          UPLOAD_CMD = "$src=Join-Path $env:APPDATA 'com.kesomannen.gale\\lethal-company\\profiles\\LC V1 S1.42AF Microwave Fix\\BepInEx\\LogOutput.log';if(!(Test-Path -LiteralPath $src)){throw \"Log not found: $src\"};$gh=(Get-Command gh -ErrorAction SilentlyContinue).Source;if(!$gh){$gh=@(\"$env:ProgramFiles\\GitHub CLI\\gh.exe\",\"$env:LOCALAPPDATA\\Programs\\GitHub CLI\\gh.exe\",\"${env:ProgramFiles(x86)}\\GitHub CLI\\gh.exe\")|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1};if(!$gh){winget install --id GitHub.cli -e --source winget --accept-package-agreements --accept-source-agreements;$gh=(Get-Command gh -ErrorAction SilentlyContinue).Source;if(!$gh){$gh=@(\"$env:ProgramFiles\\GitHub CLI\\gh.exe\",\"$env:LOCALAPPDATA\\Programs\\GitHub CLI\\gh.exe\",\"${env:ProgramFiles(x86)}\\GitHub CLI\\gh.exe\")|Where-Object{$_ -and (Test-Path -LiteralPath $_)}|Select-Object -First 1}};if(!$gh){throw 'GitHub CLI gh.exe could not be found after resolution/install attempt'};& $gh auth status --hostname github.com *> $null;if($LASTEXITCODE -ne 0){& $gh auth login --hostname github.com --git-protocol https --web;if($LASTEXITCODE -ne 0){throw 'GitHub authentication failed'}};$repo='Tendas240/Lethal-Company-AI-Modding-Project';$dst='RuntimeInbox/Current/LogOutput.log';$sha=(& $gh api \"repos/$repo/contents/$dst\" --jq '.sha' 2>$null);$p=@{message='Upload S1.42AF runtime log';content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($src));branch='main'};if($sha){$p['sha']=$sha};($p|ConvertTo-Json -Compress)|& $gh api --method PUT \"repos/$repo/contents/$dst\" --input -;if($LASTEXITCODE -ne 0){throw 'Runtime log upload failed'}"

          def write_json(path, obj):
              Path(path).write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Atomic machine-state promotion.
          state_path = ROOT / 'Current/CURRENT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['latest_built_artifact'] = {
              'build_id': AF_ID,
              'title': AF_TITLE,
              'status': 'BUILD_PASS_RUNTIME_VALIDATION_OPEN_NOT_ACCEPTED',
              'profile': AF_PROFILE,
              'sha256': AF_SHA,
              'candidate_record': AF_CANDIDATE,
              'analysis': AF_DECISION,
              'project_status': AF_PROJECT_STATUS,
              'build_plan': AF_PLAN,
              'profile_sources': 'ProfileSources/S1.42AF/',
              'file_index': 'ProfileSources/S1.42AF/FILE_INDEX.json',
              'workflow_run': AF_RUN,
              'build_commit': AF_BUILD_COMMIT,
              'plugin_dll_sha256': AF_DLL_SHA,
          }
          state['active_candidate'] = {
              'build_id': AF_ID,
              'title': AF_TITLE,
              'profile': AF_PROFILE,
              'sha256': AF_SHA,
              'status': 'RUNTIME_VALIDATION_OUTSTANDING',
              'candidate_record': AF_CANDIDATE,
              'project_status': AF_PROJECT_STATUS,
          }
          state['runtime_test_outstanding'] = True
          state['selected_scope'] = {
              'build_id': AF_ID,
              'title': 'Path-length-safe Functional Microwave runtime validation',
              'status': 'BUILT_RUNTIME_VALIDATION_OPEN',
              'user_authorized_spawn_scale': 0.5,
              'target_authority_status': 'USER_CONFIRMED_HALF_FREQUENCY_REMAINS_TARGET',
              'rejected_build': 'S1.42AD',
              'rejection': 'Current/121_S1.42AD_RUNTIME_REJECTION_FUNCTIONAL_MICROWAVE_PROVIDER_CONTRACT_DRIFT.md',
              'functional_contract_analysis': 'Current/122_S1.42AE_PROVIDER_CONTRACT_CORRECTION_ANALYSIS.md',
              'superseded_candidate': 'S1.42AE',
              'supersession': AF_DECISION,
              'corrected_contract': 'Reuse unchanged S1.42AE source: validate exact 18 Moon and 18 Interior curves, scale only the 18 Moon/tag curves by 0.5; Interior curves validation-only; shorten only Gale profile identity to avoid the 262-character nested SoundAPI path.'
          }
          state['next_action'] = (
              'Import S1.42AF with RuntimeTools/ReplaceActiveGaleProfileV24.ps1. Proceed only after v2.4 positively verifies non-empty export.r2x plus exactly one non-empty base SoundAPI DLL and one non-empty LethalCompany binding DLL. Confirm the shortened nested binding path is below the legacy 260-character boundary, then start Lethal Company, require preloader/main-menu success, play one normal run far enough for ordinary moon/interior generation, and upload the complete fresh S1.42AF LogOutput.log with the exact uploader in Current/126_S1.42AF_BUILD_CANDIDATE_PATH_LENGTH_SAFE_MICROWAVE_PACKAGING.md. Evaluate the preserved S1.42AE plugin markers, dependency versions, PrioritiseMoons=true MoonCurves=18 InteriorCurves=18, both keysets, the 18 Moon curves x0.5 / 18 Interior validation-only marker, and regression/fatal markers before accepting or rejecting S1.42AF.'
          )
          state['controllers'] = {
              'buildspec': 'BuildSpecs/current.json',
              'build_enabled': False,
              'build_id': 'IDLE_AFTER_S1.42AF_BUILD_AWAITING_RUNTIME_VALIDATION',
              'build_base_profile': AF_PROFILE,
              'build_base_sha256': AF_SHA,
              'runtime_active_build_file': 'RuntimeInbox/ACTIVE_BUILD.txt',
              'runtime_active_build': AF_ID,
          }
          write_json(state_path, state)
          (ROOT / 'RuntimeInbox/ACTIVE_BUILD.txt').write_text(AF_ID + '\n', encoding='utf-8')

          # Project-status mirror for the active candidate.
          project_status = {
              'schema_version': 3,
              'date': '2026-09-05',
              'repository_is_source_of_truth': True,
              'accepted_baseline': {
                  'build_id': 'S1.42AC',
                  'profile': AC_PROFILE,
                  'sha256': AC_SHA,
                  'status': 'ACCEPTED_FULL_NORMAL_STACK',
                  'acceptance_record': 'Current/118_S1.42AC_RUNTIME_ACCEPTANCE_CORRECTED_BCMER_EVENTTYPE_EQUAL_DISTRIBUTION.md',
                  'runtime_evidence': 'RuntimeEvidence/S1.42AC/20260904T235720Z/'
              },
              'active_runtime_candidate': {
                  'build_id': AF_ID,
                  'title': AF_TITLE,
                  'profile': AF_PROFILE,
                  'profile_name': AF_PROFILE_NAME,
                  'sha256': AF_SHA,
                  'status': 'BUILD_PASS_GAMEPLAY_RUNTIME_VALIDATION_OPEN_NOT_ACCEPTED',
                  'successful_build_run': AF_RUN,
                  'automated_build_commit': AF_BUILD_COMMIT,
                  'candidate_record': AF_CANDIDATE,
                  'promotion_record': AF_DECISION,
                  'plan': AF_PLAN,
                  'patch_source': 'Patches/S142AECodeRebirthMicrowaveSpawnTuning/',
                  'snapshot': 'ProfileSources/S1.42AF/',
                  'zip_members': 335,
                  'changed_existing_members': ['export.r2x'],
                  'added_members': ['BepInEx/plugins/S142AECodeRebirthMicrowaveSpawnTuning/S142AECodeRebirthMicrowaveSpawnTuning.dll'],
                  'removed_members': [],
                  'mod_state_changes': [],
                  'mod_additions': [],
                  'mod_removals': [],
                  'config_changes': [],
                  'plugin_dll_sha256': AF_DLL_SHA,
                  'user_authorized_spawn_scale': 0.5,
                  'expected_runtime_plugin_identity': 'S1.42AE CodeRebirth Microwave Spawn Tuning 1.0.0',
                  'target_semantics': 'Validate exact 18 Moon and 18 Interior Functional Microwave tables, then scale only the 18 effective Moon/tag curves to 50 percent amplitude.'
              },
              'superseded_runtime_candidate': {
                  'build_id': 'S1.42AE',
                  'status': 'SUPERSEDED_FOR_PATH_LENGTH_SAFE_PACKAGING_NOT_GAMEPLAY_REJECTED',
                  'provider_contract_executed': False,
                  'nested_binding_file_size_bytes': 40960,
                  'nested_binding_path_length': 262,
                  'accepted_control_path_length': 247,
                  'classification': 'PRELOADER_PATH_LENGTH_COMPATIBILITY_BLOCKER_LEADING_ROOT_CAUSE',
                  'decision_record': AF_DECISION
              },
              'functional_contract': {
                  'coderebirth': '1.6.9',
                  'dawnlib': '0.9.25',
                  'dusk': '0.9.25',
                  'map_object_key': 'code_rebirth:functional_microwave',
                  'prioritise_moons': True,
                  'moon_curve_count': 18,
                  'interior_curve_count': 18,
                  'scaled_table': 'CurvesByMoonOrTagName',
                  'interior_table_action': 'VALIDATE_ONLY_NO_MUTATION',
                  'spawn_scale': 0.5,
                  'fail_closed': True
              },
              'runtime_gate': {
                  'gale_v24_import_proof': 'REQUIRED',
                  'shortened_binding_path_below_260': 'REQUIRED',
                  'startup_main_menu_lobby': 'OPEN',
                  'dependency_validation': 'OPEN',
                  'provider_contract_marker': 'MUST_SHOW_PRIORITISE_MOONS_TRUE_MOONCURVES_18_INTERIORCURVES_18',
                  'moon_keyset_marker': 'MUST_BE_PRESENT',
                  'interior_keyset_marker': 'MUST_BE_PRESENT',
                  'scale_application_marker': 'MUST_SHOW_18_MOON_CURVES_X0_5_AND_18_INTERIOR_VALIDATION_ONLY',
                  'contract_refusal': 'MUST_BE_0',
                  'normal_round_generation': 'OPEN',
                  'fatal': 'MUST_BE_0',
                  'accepted_s1_42ac_regression_check': 'OPEN'
              },
              'controllers': {
                  'buildspec_current_enabled': False,
                  'buildspec_current_id': 'IDLE_AFTER_S1.42AF_BUILD_AWAITING_RUNTIME_VALIDATION',
                  'buildspec_base_profile': AF_PROFILE,
                  'buildspec_base_sha256': AF_SHA,
                  'runtime_active_build': AF_ID,
                  'successor_armed': False
              },
              'exact_next_step': state['next_action']
          }
          write_json(ROOT / AF_PROJECT_STATUS, project_status)

          # Build lineage machine mirror.
          lineage_path = ROOT / 'Current/BUILD_LINEAGE.json'
          lineage = json.loads(lineage_path.read_text(encoding='utf-8'))
          lineage['active_candidate_build_id'] = AF_ID
          lineage['latest_built_artifact_id'] = AF_ID
          builds = lineage.get('builds', [])
          ae = next((b for b in builds if b.get('id') == 'S1.42AE'), None)
          if ae is None:
              raise RuntimeError('S1.42AE lineage entry missing')
          ae['status'] = 'superseded-path-length-blocked'
          ae['decision_record'] = AF_DECISION
          ae['safe_as_gameplay_base'] = False
          ae['principal_feature'] = 'correct Functional Microwave provider source contract; superseded because 262-character nested SoundAPI path blocked BepInEx/Mono before provider execution'
          builds[:] = [b for b in builds if b.get('id') != AF_ID]
          builds.append({
              'id': AF_ID,
              'title': AF_TITLE,
              'status': 'runtime-candidate',
              'parent': 'S1.42AC',
              'profile': AF_PROFILE,
              'sha256': AF_SHA,
              'build_plan': AF_PLAN,
              'candidate_record': AF_CANDIDATE,
              'analysis': AF_DECISION,
              'project_status': AF_PROJECT_STATUS,
              'workflow_run': AF_RUN,
              'build_commit': AF_BUILD_COMMIT,
              'safe_as_gameplay_base': False,
              'principal_feature': 'path-length-safe packaging successor preserving the corrected Functional Microwave 18 Moon / 18 Interior contract and scaling only 18 Moon/tag curves x0.5'
          })
          feature_index = lineage.setdefault('feature_index', {})
          feature_index['Functional_Microwave_half_frequency_target'] = 'S1.42AF_RUNTIME_CANDIDATE'
          feature_index['Functional_Microwave_corrected_18_Moon_18_Interior_contract'] = 'S1.42AE_SOURCE_REUSED_BY_S1.42AF'
          feature_index['Functional_Microwave_path_length_safe_packaging'] = AF_ID
          invariants = lineage.setdefault('lineage_invariants', [])
          for text in [
              'S1.42AE was built directly from accepted S1.42AC and its provider code was never reached during the preloader failures. It is superseded for packaging/path-length reasons, not runtime-rejected for Microwave logic.',
              'S1.42AF was built directly from accepted S1.42AC, not from S1.42AE. It reuses the unchanged S1.42AE plugin source while shortening only the Gale profile identity and remains unsafe as a gameplay base until explicit runtime acceptance.'
          ]:
              if text not in invariants:
                  invariants.append(text)
          write_json(lineage_path, lineage)

          # Human lineage mirror: bounded exact replacements plus AF section.
          human_path = ROOT / 'Current/BUILD_LINEAGE.md'
          human = human_path.read_text(encoding='utf-8')
          replacements = [
              ('- **Latest built artifact:** S1.42AE — Functional Microwave Provider Contract Correction — build pass, runtime validation outstanding, not accepted.', '- **Latest built artifact:** S1.42AF — Path-Length-Safe Microwave Packaging — build pass, runtime validation outstanding, not accepted.'),
              ('- **Active candidate:** S1.42AE.', '- **Active candidate:** S1.42AF.'),
              ('- **Next build:** none armed; controller is idle awaiting S1.42AE runtime validation.', '- **Next build:** none armed; controller is idle awaiting S1.42AF runtime validation.'),
              ('| S1.42AE | **ACTIVE RUNTIME CANDIDATE** | Corrected Functional Microwave contract: validate exact 18 Moon/tag + 18 Interior/tag curves and scale only the 18 Moon/tag curves by `0.5`. Built directly from S1.42AC; runtime validation is pending. |', '| S1.42AE | **SUPERSEDED — PATH-LENGTH BLOCKED, NOT GAMEPLAY-REJECTED** | Corrected provider code was never reached; v2.4 plus direct filesystem checks proved the 40,960-byte LC SoundAPI binding existed while its full path measured 262 characters and BepInEx/Mono still failed before chainloader startup. |\n| S1.42AF | **ACTIVE RUNTIME CANDIDATE** | One-variable path-length-safe packaging successor built directly from S1.42AC. Reuses unchanged S1.42AE source contract with short Gale profile name `LC V1 S1.42AF Microwave Fix`; runtime validation pending. |'),
              ('### S1.42AE — active Functional Microwave correction candidate', '### S1.42AE — superseded Functional Microwave correction candidate'),
              ('- Status: build pass; runtime validation outstanding; not accepted.', '- Status: superseded for path-length-safe packaging; provider code never executed; not accepted and not classified as a Microwave gameplay/runtime rejection.\n- Supersession: `Current/127_S1.42AE_PATH_LENGTH_SUPERSESSION_AND_S1.42AF_PROMOTION.md`'),
              ('| Functional Microwave half-frequency target | S1.42AE runtime candidate; not accepted yet |', '| Functional Microwave half-frequency target | S1.42AF runtime candidate; not accepted yet |'),
              ('| Functional Microwave corrected 18 Moon / 18 Interior fail-closed contract | S1.42AE |', '| Functional Microwave corrected 18 Moon / 18 Interior fail-closed contract | S1.42AE source, reused unchanged in S1.42AF |'),
              ('- S1.42AE was built **directly from accepted S1.42AC**, not from rejected S1.42AD. It is not a safe gameplay base until the open runtime gate is explicitly accepted.', '- S1.42AE was built **directly from accepted S1.42AC**, not from rejected S1.42AD. Its provider code was never reached during the preloader failures; it is superseded for packaging/path-length reasons and is not a safe gameplay base.\n- S1.42AF was built **directly from accepted S1.42AC**, not from S1.42AE. It reuses the unchanged S1.42AE plugin source under a path-length-safe Gale profile identity and is not a safe gameplay base until its runtime gate is explicitly accepted.')
          ]
          for old, new in replacements:
              if old not in human:
                  raise RuntimeError('Human lineage expected text missing: ' + old[:100])
              human = human.replace(old, new, 1)
          af_section = f'''### S1.42AF — active path-length-safe Microwave candidate

- Profile: `{AF_PROFILE}`
- Gale profile name: `{AF_PROFILE_NAME}`
- SHA-256: `{AF_SHA}`
- Candidate: `{AF_CANDIDATE}`
- Supersession/promotion analysis: `{AF_DECISION}`
- Project status: `{AF_PROJECT_STATUS}`
- Plan: `{AF_PLAN}`
- Build workflow run: `{AF_RUN}`
- Build commit: `{AF_BUILD_COMMIT}`
- DLL SHA-256: `{AF_DLL_SHA}`
- Parent: accepted S1.42AC, not S1.42AE.
- Status: build pass; runtime validation outstanding; not accepted.
- One-variable packaging change: short Gale profile identity reduces the previously failing nested SoundAPI LC-binding path from 262 characters to approximately 226 on the validated runtime host; functional plugin source is unchanged from S1.42AE.

'''
          marker = '## Feature/fix lookup\n'
          if af_section not in human:
              human = human.replace(marker, af_section + marker, 1)
          human_path.write_text(human, encoding='utf-8')

          # Candidate record becomes the exact ready-to-test authority.
          candidate_path = ROOT / AF_CANDIDATE
          candidate = candidate_path.read_text(encoding='utf-8')
          candidate = candidate.replace('**Status:** BUILD PASS / LIFECYCLE PROMOTION PENDING / NOT ACCEPTED', '**Status:** ACTIVE RUNTIME CANDIDATE / BUILD PASS / RUNTIME VALIDATION OUTSTANDING / NOT ACCEPTED')
          ready_block = f'''\n## Exact ready-to-test commands\n\nCanonical Gale v2.4 replacement/import one-liner:\n\n```powershell\n{IMPORT_CMD}\n```\n\nAfter a successful normal runtime test, upload the complete fresh S1.42AF log with this exact self-contained one-liner:\n\n```powershell\n{UPLOAD_CMD}\n```\n\nDo not use the old S1.42AE uploader for S1.42AF because the local Gale profile path and runtime evidence attribution are now S1.42AF.\n'''
          if '## Exact ready-to-test commands' not in candidate:
              candidate += ready_block
          candidate_path.write_text(candidate, encoding='utf-8')

          # S1.42AE supersession / S1.42AF promotion decision.
          Path(AF_DECISION).write_text(f'''# 127 — S1.42AE Path-Length Supersession and S1.42AF Promotion\n\n**Date:** 2026-09-05  \n**Status:** CURRENT LIFECYCLE DECISION  \n**Accepted baseline:** S1.42AC — BCMER EventType Equal Distribution  \n**Superseded candidate:** S1.42AE — Functional Microwave Provider Contract Correction  \n**Active candidate:** S1.42AF — Path-Length-Safe Microwave Packaging\n\n## Decision\n\nS1.42AE is superseded for packaging/path-length reasons and is **not** classified as a Functional Microwave gameplay/runtime rejection. Its provider-contract code never executed during the failing launches. S1.42AF is promoted as the active runtime candidate and is built directly from accepted S1.42AC.\n\n## Evidence that changed the lifecycle\n\nAfter the v2.4 Gale importer succeeded, it derived both SoundAPI critical contracts and positively verified the nested LC binding. A direct local filesystem check immediately before launch showed `me.loaforc.soundapi.lethalcompany.dll` present at the exact runtime-consumed nested path with size `40960` bytes. The game still failed in `AutoHookGenPatcher` / `FixPluginTypesSerialization` before chainloader startup with `DirectoryNotFoundException` / `FileNotFoundException` for that same path. A second direct filesystem check immediately after the failed launch again showed the package root, nested directory and DLL present, with the DLL still `40960` bytes.\n\nThe exact S1.42AE nested binding path measured **262 characters** on the runtime host. The accepted S1.42AC control had previously passed the same SoundAPI dependency family and its corresponding nested path measured **247 characters**. The combination of physically present bytes, persistent post-failure presence, legacy BepInEx/Mono path access failure, and the 260-character boundary makes path-length compatibility the leading root-cause classification. The S1.42AF runtime test is the controlled confirmation.\n\n## S1.42AF one-variable design\n\nS1.42AF uses Gale profile name `{AF_PROFILE_NAME}` and profile `{AF_PROFILE}` with SHA-256 `{AF_SHA}`. It was built by workflow `{AF_RUN}` / commit `{AF_BUILD_COMMIT}` directly from S1.42AC `{AC_SHA}`. Automated archive QC found exactly one changed existing member (`export.r2x`) and exactly one added member (`BepInEx/plugins/S142AECodeRebirthMicrowaveSpawnTuning/S142AECodeRebirthMicrowaveSpawnTuning.dll`), with no mod/package/config drift.\n\nThe S1.42AE source project is reused unchanged. The fresh S1.42AF DLL SHA-256 is `{AF_DLL_SHA}`; it is not byte-identical to the prior AE build, so binary identity is not claimed. Runtime plugin/log markers intentionally retain the `S1.42AE CodeRebirth Microwave Spawn Tuning 1.0.0` identity.\n\nThe shortened profile name is expected to reduce the previously failing nested binding path to approximately **226 characters** on the validated host.\n\n## Runtime boundary\n\nS1.42AF remains unaccepted until a valid run proves: v2.4 import/materialization success; shortened binding path below 260; healthy BepInEx preloader/main menu/lobby; expected unchanged plugin marker; CodeRebirth 1.6.9 and DawnLib/Dusk 0.9.25 validation; `PrioritiseMoons=true, MoonCurves=18, InteriorCurves=18`; both exact keysets; final 18 Moon/tag curves x0.5 marker with 18 Interior/tag curves validation-only; normal moon/interior generation; and no new fatal/project-critical regression.\n\nS1.42AC remains the accepted rollback/full-normal-stack baseline. No successor after S1.42AF is armed.\n''', encoding='utf-8')

          # Update the build plan from pre-build language to current build state.
          plan_path = ROOT / AF_PLAN
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('**Status:** READY TO ARM', '**Status:** BUILT / ACTIVE RUNTIME CANDIDATE / RUNTIME VALIDATION OUTSTANDING')
          plan_path.write_text(plan, encoding='utf-8')

          # Current lifecycle authority.
          Path('Knowledge/CURRENT_LIFECYCLE.md').write_text(f'''# Current Project Lifecycle\n\n**Status:** CURRENT / CANONICAL TOPIC  \n**Authority:** current lifecycle router; detailed acceptance/rejection remains in build-specific evidence  \n**Canonical-For:** accepted baseline, active candidate, pending test/build state, exact next project action  \n**Topics:** `accepted_baseline`, `active_candidate_and_next_test`  \n**Evidence:** `Current/118_S1.42AC_RUNTIME_ACCEPTANCE_CORRECTED_BCMER_EVENTTYPE_EQUAL_DISTRIBUTION.md`, `Current/121_S1.42AD_RUNTIME_REJECTION_FUNCTIONAL_MICROWAVE_PROVIDER_CONTRACT_DRIFT.md`, `Current/122_S1.42AE_PROVIDER_CONTRACT_CORRECTION_ANALYSIS.md`, `Current/125_S1.42AE_V23_FALSE_POSITIVE_AND_S1.42AC_CONTROL_CONFIRMATION.md`, `{AF_CANDIDATE}`, `{AF_DECISION}`, `{AF_PROJECT_STATUS}`  \n**Related:** `BuildSpecs/current.json`, `{AF_PLAN}`, `RuntimeInbox/ACTIVE_BUILD.txt`, `Knowledge/CODEREBIRTH.md`, `Knowledge/ITEM_TUNING.md`, `Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md`, `Knowledge/GALE_PROFILE_WORKFLOW.md`  \n**Last-Validated:** 2026-09-05\n\n## Accepted baseline\n\n**S1.42AC — BCMER EventType Equal Distribution — ACCEPTED FULL NORMAL STACK**\n\n- Profile: `{AC_PROFILE}`\n- SHA-256: `{AC_SHA}`\n- Acceptance: `Current/118_S1.42AC_RUNTIME_ACCEPTANCE_CORRECTED_BCMER_EVENTTYPE_EQUAL_DISTRIBUTION.md`\n- Fresh acceptance runtime evidence: `RuntimeEvidence/S1.42AC/20260904T235720Z/`\n\nS1.42AC remains the accepted full-normal-stack gameplay/rollback baseline.\n\n## Rejected predecessor\n\n**S1.42AD — Functional Microwave Spawn Rarity Reduction — RUNTIME REJECTED / NOT ACCEPTED.**\n\nS1.42AD failed closed because it expected `InteriorCurves=0`, while runtime exposed 18 Interior/tag curves. No `0.5` mutation executed. Rejection authority: `Current/121_S1.42AD_RUNTIME_REJECTION_FUNCTIONAL_MICROWAVE_PROVIDER_CONTRACT_DRIFT.md`.\n\n## Superseded S1.42AE candidate\n\n**S1.42AE — Functional Microwave Provider Contract Correction — SUPERSEDED FOR PATH-LENGTH-SAFE PACKAGING / NOT GAMEPLAY-REJECTED.**\n\nThe corrected provider code was never reached during the failing launches. v2.4 positively verified both SoundAPI materialization contracts, and direct pre-launch plus post-failure filesystem checks showed the exact nested `me.loaforc.soundapi.lethalcompany.dll` still present and non-empty at `40960` bytes. The full S1.42AE binding path measured `262` characters. BepInEx/Mono nevertheless failed before chainloader startup with `DirectoryNotFoundException` / `FileNotFoundException` for that path.\n\nAccepted S1.42AC passed the same SoundAPI dependency family with a corresponding path length of `247`. Path-length compatibility is therefore the leading root-cause classification. This is packaging/preloader evidence, not a rejection of the corrected Microwave provider logic. Decision: `{AF_DECISION}`.\n\n## Active candidate\n\n**{AF_ID} — {AF_TITLE} — BUILD PASS / RUNTIME VALIDATION OUTSTANDING / NOT ACCEPTED.**\n\n- Profile: `{AF_PROFILE}`\n- Gale profile name: `{AF_PROFILE_NAME}`\n- Profile SHA-256: `{AF_SHA}`\n- DLL SHA-256: `{AF_DLL_SHA}`\n- Build workflow run: `{AF_RUN}` — SUCCESS\n- Automated build commit: `{AF_BUILD_COMMIT}`\n- Candidate record: `{AF_CANDIDATE}`\n- Project status: `{AF_PROJECT_STATUS}`\n- Plan: `{AF_PLAN}`\n- Snapshot: `ProfileSources/S1.42AF/`\n\nS1.42AF was built directly from accepted S1.42AC, not from S1.42AE. The only intended packaging variable is the shorter Gale profile identity. Automated QC reports exactly `export.r2x` changed and exactly the unchanged-source Microwave plugin DLL added, with no package/config drift.\n\nThe source contract is unchanged from S1.42AE: validate CodeRebirth `1.6.9`, DawnLib/Dusk `0.9.25`, one Functional Microwave `MapObjectSpawnMechanics` provider, `PrioritiseMoons=true`, exact 18 Moon/tag curves and exact 18 Interior/tag curves, then scale only the 18 Moon/tag curves by `0.5`; Interior curves are validation-only. Runtime plugin markers intentionally still identify `S1.42AE CodeRebirth Microwave Spawn Tuning 1.0.0`.\n\n## Current controllers\n\n- `RuntimeInbox/ACTIVE_BUILD.txt = {AF_ID}`\n- `BuildSpecs/current.json` is disabled.\n- Controller id: `IDLE_AFTER_S1.42AF_BUILD_AWAITING_RUNTIME_VALIDATION`.\n- Guarded base: `{AF_PROFILE}` / `{AF_SHA}`.\n- No successor is armed.\n\n## Exact next project action\n\n1. Import S1.42AF with the canonical v2.4 Gale launcher and require the final positive import/materialization proof.\n2. Confirm the nested LC-binding DLL is non-empty under the short S1.42AF profile path and that the full path is below 260 characters.\n3. Start the game. The path-length hypothesis passes its first gate only if BepInEx reaches normal preloader/chainloader/main-menu/lobby startup.\n4. Play one normal run far enough for ordinary moon/interior generation.\n5. Upload the complete fresh S1.42AF `LogOutput.log` with the exact uploader in `{AF_CANDIDATE}`.\n6. Evaluate the preserved S1.42AE plugin marker, dependency versions, `PrioritiseMoons=true, MoonCurves=18, InteriorCurves=18`, both keysets, final 18 Moon curves x0.5 / 18 Interior validation-only marker, and fatal/project-critical regressions before ACCEPT or REJECT.\n\nCanonical Gale one-liner:\n\n```powershell\n{IMPORT_CMD}\n```\n\nExact S1.42AF log uploader is frozen in `{AF_CANDIDATE}` and must be used after the run.\n''', encoding='utf-8')

          # CodeRebirth canonical topic.
          Path('Knowledge/CODEREBIRTH.md').write_text(f'''# CodeRebirth and DawnLib Tuning\n\n**Status:** CURRENT / CANONICAL TOPIC  \n**Authority:** accepted CodeRebirth ownership/tuning rules plus current Functional Microwave candidate boundary  \n**Canonical-For:** `coderebirth`  \n**Evidence:** `Current/03_PROJECT_CHRONOLOGY.md`, `Current/90_S1.42Z_RUNTIME_ACCEPTANCE_JETPACK_PIKMIN_RETUNE.md`, `Current/121_S1.42AD_RUNTIME_REJECTION_FUNCTIONAL_MICROWAVE_PROVIDER_CONTRACT_DRIFT.md`, `Current/122_S1.42AE_PROVIDER_CONTRACT_CORRECTION_ANALYSIS.md`, `{AF_CANDIDATE}`, `{AF_DECISION}`  \n**Related:** `Knowledge/PIKMIN_ENEMY_COMPATIBILITY.md`, `Knowledge/ITEM_TUNING.md`, `Knowledge/CURRENT_LIFECYCLE.md`, `Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md`  \n**Last-Validated:** 2026-09-05\n\n## Package architecture\n\nModern project stack uses CodeRebirth with DawnLib. **Do not reinstall CodeRebirthLib**; it is a historical removed/forbidden dependency. Current owner versions remain CodeRebirth `1.6.9`, DawnLib `0.9.25`, DawnLib.Dusk `0.9.25`.\n\n## Natural Currency / Flash Turret control\n\nS1.40B established the accepted native-owner solution: keep `Clean Unusued Configs = false`; Coin/Crisp Dollar Bill/Wallet/Flash Turret editable; Currency inside moon/interior weights blank; Flash Turret inside weights blank with `Is Inside Hazard = false`. Do not blank `Money | Enemy Drop Rates`.\n\n## CodeRebirth -> Pikmin utility protection\n\nThe cumulative compatibility plugin retains the direct utility-kill shield for Pikmin/Puffmin because config toggles alone did not cover every Autonomous Crane kill path.\n\n## Accepted aerial-defense tuning\n\nS1.42Z accepted transactional scaling of exactly `code_rebirth:air_control_unit` and `code_rebirth:gunslinger_greg`: all 18 Moon/tag curves x `0.5`; no other provider is modified. Accepted aerial-defense DLL SHA-256: `7313501540c3945ee3782903b8bb328574a87587859fce30faa2a301b7f1d98b`.\n\n## Functional Microwave rarity\n\nAuthorized target remains `SpawnScale = 0.5f` for `code_rebirth:functional_microwave` through `DawnMapObjectInfo.InsideInfo.SpawnWeights -> ProviderTable -> Dusk.MapObjectSpawnMechanics`.\n\nS1.42AD is rejected history because its zero-Interior assumption drifted; runtime exposed 18 Interior/tag curves and the patch correctly refused mutation. The corrected contract established for S1.42AE and reused unchanged in S1.42AF is: one `MapObjectSpawnMechanics`, `PrioritiseMoons=true`, exactly 18 Moon/tag curves, exactly 18 Interior/tag curves, all curves valid. With Dusk 0.9.25 Moon priority, selection is exact Moon -> exact Interior fallback -> matching Moon tags; the tables are not combined. Scale only `CurvesByMoonOrTagName` x0.5 including values/tangents; validate but do not mutate `CurvesByInteriorOrTagName`.\n\n### S1.42AE supersession\n\nS1.42AE's functional code was never reached because BepInEx/Mono failed on the physically present nested SoundAPI binding at a 262-character full path. It is superseded for packaging/path-length reasons, not rejected for provider behavior. Authority: `{AF_DECISION}`.\n\n### Current S1.42AF candidate\n\n- Profile: `{AF_PROFILE}`\n- Gale profile name: `{AF_PROFILE_NAME}`\n- Profile SHA-256: `{AF_SHA}`\n- DLL SHA-256: `{AF_DLL_SHA}`\n- Build run: `{AF_RUN}` — SUCCESS\n- Build commit: `{AF_BUILD_COMMIT}`\n- Candidate record: `{AF_CANDIDATE}`\n- Status: **BUILD PASS / RUNTIME VALIDATION OUTSTANDING / NOT ACCEPTED**\n\nS1.42AF is built directly from accepted S1.42AC and reuses the unchanged S1.42AE source project. Expected runtime plugin identity therefore remains `S1.42AE CodeRebirth Microwave Spawn Tuning 1.0.0`. Archive delta remains isolated to Gale `export.r2x` metadata plus the plugin DLL, with no mod-state or config change.\n\nRuntime acceptance requires healthy preloader/main menu/lobby under the short profile path, exact dependency validation, `PrioritiseMoons=true, MoonCurves=18, InteriorCurves=18`, both keysets, the final 18 Moon/tag curves x0.5 and 18 Interior validation-only marker, ordinary round generation/gameplay, and no new fatal/project-critical regression. S1.42AC remains the rollback baseline until explicit AF acceptance.\n''', encoding='utf-8')

          # Item tuning canonical topic.
          Path('Knowledge/ITEM_TUNING.md').write_text(f'''# Functional Microwave and Immortal Snail\n\n**Status:** CURRENT / CANONICAL TOPIC  \n**Authority:** accepted item/enemy tuning values plus current Microwave correction boundary  \n**Canonical-For:** `functional_microwave`, `immortal_snail`  \n**Evidence:** `Current/90_S1.42Z_RUNTIME_ACCEPTANCE_JETPACK_PIKMIN_RETUNE.md`, `Current/121_S1.42AD_RUNTIME_REJECTION_FUNCTIONAL_MICROWAVE_PROVIDER_CONTRACT_DRIFT.md`, `Current/122_S1.42AE_PROVIDER_CONTRACT_CORRECTION_ANALYSIS.md`, `{AF_CANDIDATE}`, `{AF_DECISION}`  \n**Related:** `Knowledge/CODEREBIRTH.md`, `Knowledge/CURRENT_LIFECYCLE.md`, `Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md`  \n**Last-Validated:** 2026-09-05\n\n## Functional Microwave\n\nAccepted audio value remains `Volume = 0.15`. The user-authorized spawn target remains **half as often**, represented by `SpawnScale = 0.5f`; this is a proportional curve-amplitude target, not an absolute replacement rarity.\n\nS1.42AD is rejected because its fail-closed provider contract assumed zero Interior curves while runtime exposed 18. The desired 0.5 target was not rejected.\n\nS1.42AE corrected the functional provider model to exact 18 Moon/tag + 18 Interior/tag curves and scale only the Moon/tag table, but its code never executed because the long Gale profile name pushed the nested SoundAPI LC-binding path to 262 characters and BepInEx/Mono failed before chainloader startup despite the DLL being physically present. S1.42AE is therefore superseded for packaging, not rejected for Microwave logic.\n\nCurrent active candidate is **S1.42AF — Path-Length-Safe Microwave Packaging**: `{AF_PROFILE}`, SHA-256 `{AF_SHA}`. It was built directly from accepted S1.42AC, uses short Gale name `{AF_PROFILE_NAME}`, and reuses the unchanged S1.42AE provider source. Runtime validation is outstanding. See `{AF_CANDIDATE}` and `{AF_DECISION}`.\n\nHistorical volume proposals such as `0.7` or `0.5` are superseded by accepted Volume `0.15`; those old volume values must not be confused with the current spawn-scale target `0.5`.\n\n## Immortal Snail\n\nAccepted current values remain Rarity `40` and Max Snails `2`. S1.42AD, S1.42AE and S1.42AF do not alter Immortal Snail tuning.\n\n## Change discipline\n\nItem/enemy balance values are gameplay state. Future retunes require an explicit gameplay scope/build rather than a documentation-only commit. The immediate Functional Microwave work is the S1.42AF runtime gate; no later successor is armed.\n''', encoding='utf-8')

          # Live roadmap canonical topic.
          Path('Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md').write_text(f'''# Live Roadmap and Deferred Scopes\n\n**Status:** CURRENT / CANONICAL TOPIC  \n**Authority:** live selected/deferred-scope list only; historical build sequencing remains in chronology/lineage  \n**Canonical-For:** `roadmap_and_deferred_scopes`  \n**Evidence:** `Current/CURRENT_STATE.json`, `Knowledge/CURRENT_LIFECYCLE.md`, `Current/04_OPEN_ISSUES_AND_NEXT_TESTS.md`, `Current/118_S1.42AC_RUNTIME_ACCEPTANCE_CORRECTED_BCMER_EVENTTYPE_EQUAL_DISTRIBUTION.md`, `{AF_CANDIDATE}`, `{AF_DECISION}`  \n**Related:** `Knowledge/BCMER.md`, `Knowledge/INTERIORS_AND_LLL.md`, `Knowledge/BLACK_MESA_PIKMIN_ROUTING.md`, `Knowledge/ITEM_TUNING.md`, `Knowledge/CODEREBIRTH.md`, `Knowledge/REPOSITORY_OVERHAUL.md`  \n**Last-Validated:** 2026-09-05\n\n## Current position\n\nAccepted gameplay baseline: **S1.42AC — BCMER EventType Equal Distribution**. Latest built artifact and active gameplay candidate: **S1.42AF — Path-Length-Safe Microwave Packaging — BUILD PASS / RUNTIME VALIDATION OUTSTANDING / NOT ACCEPTED**. Runtime test outstanding: **yes**. Successor armed: **no**. `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AF`; `BuildSpecs/current.json` is disabled and guards S1.42AF.\n\nS1.42AD remains runtime-rejected historical provider-contract evidence. S1.42AE's corrected provider code was never reached; it is superseded for packaging after the physically present SoundAPI binding failed through a 262-character runtime path. S1.42AF preserves the same functional source contract but shortens only the Gale profile identity.\n\n## Exact next scope\n\nThe selected work is the **S1.42AF runtime acceptance gate**. Import through v2.4, require both SoundAPI materialization proofs, confirm the shortened binding path is below 260, start normally, play one ordinary run far enough for moon/interior generation, upload the fresh S1.42AF log with `{AF_CANDIDATE}`, then accept or reject from deterministic provider and regression evidence. A single normal run is sufficient for this technical gate; it is not expected to statistically demonstrate an exact 50% observed Microwave count.\n\n## Remaining deferred independent gameplay/compatibility scopes\n\n- CullFactory disable-culling exceptions for exact IDs `junkrooms` / `shatteredrooms`;\n- MelanieMausoleum fog reduction only for that interior;\n- Black Mesa/interior/Pikmin route recovery;\n- isolated evaluation of `woah25-LethalEscapeUpdated 2.5.0`;\n- final long full-stack acceptance;\n- AdditionalNetworking repair only with reproducible user-facing evidence;\n- LethalMin teardown/despawn repair only with stronger evidence.\n\n## BCMER scope boundary\n\nS1.42AC remains the accepted BCMER 1.71.0 static EventType-probability implementation. Exact long-run executed EventType frequency after runtime eligibility filters is a broader algorithm-design scope and is not armed.\n\n## Interior scope boundary\n\nThe inherited S1.42AB implementation already equalizes effective rarity for LLL-viable interiors after viability filtering. S1.42AC and S1.42AF do not alter that path. Author/technical viability restrictions, CullFactory compatibility, Mausoleum fog and route/NavMesh recovery remain separate.\n\n## Repository-overhaul boundary\n\nThe overhaul is closed and validated. Future repository-architecture changes remain separate from gameplay changes and must continue to pass `.github/workflows/knowledge-architecture.yml`.\n\n## Historical roadmap warning\n\n`Current/07_FUTURE_ROADMAP_BCMER_INTERIORS.md` preserves historical planning/package research only. This file plus `Current/CURRENT_STATE.json` and `Knowledge/CURRENT_LIFECYCLE.md` are the live roadmap/lifecycle authorities.\n''', encoding='utf-8')

          # Concise current work queue.
          Path('Current/04_OPEN_ISSUES_AND_NEXT_TESTS.md').write_text(f'''# 04 — Open Issues and Next Tests\n\n**Status:** CURRENT / LIVE WORK QUEUE  \n**Authority:** concise current work queue only  \n**Machine state:** `Current/CURRENT_STATE.json`  \n**Topic router:** `Current/PROJECT_KNOWLEDGE_MAP.md`  \n**Last-Validated:** 2026-09-05\n\n## Current gameplay gate\n\nAccepted baseline remains **S1.42AC — BCMER EventType Equal Distribution**, `{AC_PROFILE}`, SHA-256 `{AC_SHA}`. Acceptance: `Current/118_S1.42AC_RUNTIME_ACCEPTANCE_CORRECTED_BCMER_EVENTTYPE_EQUAL_DISTRIBUTION.md`.\n\nActive runtime candidate is **S1.42AF — Path-Length-Safe Microwave Packaging — BUILD PASS / RUNTIME VALIDATION OUTSTANDING / NOT ACCEPTED**. Profile `{AF_PROFILE}`, SHA-256 `{AF_SHA}`, build run `{AF_RUN}`, build commit `{AF_BUILD_COMMIT}`, DLL SHA-256 `{AF_DLL_SHA}`. Candidate authority: `{AF_CANDIDATE}`.\n\nS1.42AE is superseded for packaging/path-length reasons, not gameplay-rejected. Its provider code never ran; the exact SoundAPI LC-binding DLL remained physically present at 40960 bytes before and after the failed launch, while the full path measured 262 characters and BepInEx/Mono failed before chainloader startup. Decision: `{AF_DECISION}`.\n\n## Exact next action\n\nImport S1.42AF through `RuntimeTools/ReplaceActiveGaleProfileV24.ps1`, require the positive export plus two-SoundAPI materialization proof, confirm the shortened LC-binding path is below 260, then start the game. If startup is healthy, play one normal run far enough for ordinary moon/interior generation and upload the complete fresh S1.42AF `LogOutput.log` with the exact uploader in `{AF_CANDIDATE}`. Evaluate the intentionally preserved `S1.42AE CodeRebirth Microwave Spawn Tuning 1.0.0` marker, CodeRebirth 1.6.9 / DawnLib-Dusk 0.9.25, `PrioritiseMoons=true, MoonCurves=18, InteriorCurves=18`, both keysets, final 18 Moon curves x0.5 / 18 Interior validation-only marker, and regression/fatal markers before lifecycle promotion.\n\nCurrent controllers: `BuildSpecs/current.json` disabled with id `IDLE_AFTER_S1.42AF_BUILD_AWAITING_RUNTIME_VALIDATION`, guarded base S1.42AF, and `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AF`. No successor is armed.\n\n## Remaining open/deferred work\n\nRoute scope decisions through `Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md`. Deferred items remain CullFactory junkrooms/shatteredrooms exceptions, Mausoleum fog, Black Mesa/Pikmin routing, isolated LethalEscapeUpdated evaluation, final long full-stack acceptance, evidence-driven AdditionalNetworking repair, and evidence-driven LethalMin teardown repair.\n''', encoding='utf-8')
