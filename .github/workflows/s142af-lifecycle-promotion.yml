name: S1.42AF lifecycle promotion one-shot

on:
  push:
    branches:
      - chatgpt/s142af-lifecycle-promotion

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout promotion branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/s142af-lifecycle-promotion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply S1.42AF lifecycle promotion
        run: python RepositoryTools/one_shot_s142af_promotion.py

      - name: Stamp canonical Gale v2.4 lifecycle route
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Knowledge/CURRENT_LIFECYCLE.md')
          text = p.read_text(encoding='utf-8')
          stamp = "Canonical Gale helper: `RuntimeTools/ReplaceActiveGaleProfileV24.ps1`, revision `2026-09-05-import-uia-v2.4-export-read-fail-closed-materialization-proof`.\n\n"
          marker = '## Exact next project action\n\n'
          if stamp not in text:
              if marker not in text:
                  raise SystemExit('lifecycle next-action marker missing')
              text = text.replace(marker, marker + stamp, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate promotion state
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/validator_selftest.py

      - name: Remove one-shot tooling and commit promotion
        shell: bash
        run: |
          rm .github/workflows/s142af-lifecycle-promotion.yml
          rm RepositoryTools/one_shot_s142af_promotion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Tendas240@users.noreply.github.com"
          git add -A
          git commit -m "Promote S1.42AF to active runtime candidate"
          git push origin HEAD:chatgpt/s142af-lifecycle-promotion
