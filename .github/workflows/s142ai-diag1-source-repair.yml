name: Repair S1.42AI-DIAG1 static validator assembly binding

on:
  push:
    branches: [work/s142ai-diag1-implementation]
    paths:
      - '.github/workflows/s142ai-diag1-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s142ai-diag1-implementation
          fetch-depth: 1

      - name: Bind exact owner namespaces to exact profile assembly basenames
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('AnalysisTools/validate_s142ai_diag1_static.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''    def list_one\(record\):.*?    source_cache: dict\[tuple\[str, str\], str\] = \{\}\n''',
              re.S,
          )
          replacement = '''    owner_assembly_names = {
        "SlendermanMod.": "SlendermanMod.dll",
        "Kittenji.FootballEntity.": "FootballEntity.dll",
        "Kittenji.HerobrineMod.": "HerobrineMod.dll",
        "MoreShipUpgrades.": "MoreShipUpgrades.dll",
        "PremiumScraps.": "PremiumScraps.dll",
        "ChillaxScraps.": "ChillaxScraps.dll",
        "JLL.": "JLL.dll",
        "KenjiLib.": "KenjiLib.dll",
        "itolib.": "itolib.dll",
        "CodeRebirth.": "CodeRebirth.dll",
        "LethalMin.": "LethalMin.dll",
    }

    by_basename: dict[str, list[tuple[str, Path, str]]] = {}
    for record in dll_records:
        archive_name, path, digest = record
        by_basename.setdefault(Path(archive_name).name.casefold(), []).append(record)

    type_to_assembly = {}
    type_names = sorted({t[0] for t in TARGETS})
    for type_name in type_names:
        assembly_name = next(
            (dll for prefix, dll in owner_assembly_names.items() if type_name.startswith(prefix)),
            None,
        )
        if assembly_name is None:
            fail(f"No exact profile assembly binding declared for target type {type_name}")
        matches = by_basename.get(assembly_name.casefold(), [])
        if len(matches) != 1:
            fail(
                f"Expected exactly one base-profile assembly named {assembly_name} for {type_name}, "
                f"found {len(matches)}"
            )
        type_to_assembly[type_name] = matches[0]

    source_cache: dict[tuple[str, str], str] = {}
'''
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise RuntimeError(f'{path}: expected exactly one locator block match, got {count}')
          path.write_text(updated, encoding='utf-8')
          print(f'repaired {path}')
          PY

      - name: Verify repair diff is validator-only
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'AnalysisTools/validate_s142ai_diag1_static.py'
          git diff --check
          git diff -- AnalysisTools/validate_s142ai_diag1_static.py

      - name: Commit exact validator repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnalysisTools/validate_s142ai_diag1_static.py
          git commit -m 'Bind DIAG1 owner types to exact profile assemblies'
          git push origin HEAD:work/s142ai-diag1-implementation
