name: Repair S1.42AI-DIAG1 HarmonyX overloads

on:
  push:
    branches: [work/s142ai-diag1-implementation]
    paths:
      - '.github/workflows/s142ai-diag1-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s142ai-diag1-implementation
          fetch-depth: 1

      - name: Apply exact HarmonyX 2.10.2 six-argument Patch repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          repairs = [
              (
                  Path('Patches/S142AIDiag1Isolation/Plugin.cs'),
                  'harmony.Patch(original, prefix, postfix, null, finalizer);',
                  'harmony.Patch(original, prefix, postfix, null, finalizer, null);',
              ),
              (
                  Path('Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs'),
                  '''harmony.Patch(\n                        target.Original,\n                        prefix: target.Prefix,\n                        postfix: null,\n                        transpiler: target.Transpiler,\n                        finalizer: null);''',
                  '''harmony.Patch(\n                        target.Original,\n                        prefix: target.Prefix,\n                        postfix: null,\n                        transpiler: target.Transpiler,\n                        finalizer: null,\n                        ilmanipulator: null);''',
              ),
          ]

          for path, old, new in repairs:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one repair match, got {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'repaired {path}')
          PY

      - name: Verify repair diff is limited to the two DIAG1 source files
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = $'Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs\nPatches/S142AIDiag1Isolation/Plugin.cs'
          git diff --check
          git diff -- Patches/S142AIDiag1Isolation/Plugin.cs Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs

      - name: Commit exact source repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Patches/S142AIDiag1Isolation/Plugin.cs Patches/S142AIDiag1Isolation/ComplexOwnerGuardInstaller.cs
          git commit -m 'Use HarmonyX six-argument Patch overloads'
          git push origin HEAD:work/s142ai-diag1-implementation
