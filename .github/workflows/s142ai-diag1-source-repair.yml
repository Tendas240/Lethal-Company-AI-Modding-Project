name: Repair S1.42AI-DIAG1 static validator extraction

on:
  push:
    branches: [work/s142ai-diag1-implementation]
    paths:
      - '.github/workflows/s142ai-diag1-source-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s142ai-diag1-implementation
          fetch-depth: 1

      - name: Preserve original archive paths for exact DLL inspection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('AnalysisTools/validate_s142ai_diag1_static.py')
          text = path.read_text(encoding='utf-8')
          old = '''        dest = dll_root / f"{idx:04d}-{Path(name).name}"\n        dest.write_bytes(data)'''
          new = '''        dest = dll_root / Path(name)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_bytes(data)'''
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'{path}: expected exactly one extraction repair match, got {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print(f'repaired {path}')
          PY

      - name: Verify repair diff is validator-only
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = 'AnalysisTools/validate_s142ai_diag1_static.py'
          git diff --check
          git diff -- AnalysisTools/validate_s142ai_diag1_static.py

      - name: Commit exact validator repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AnalysisTools/validate_s142ai_diag1_static.py
          git commit -m 'Preserve profile DLL paths in DIAG1 validator'
          git push origin HEAD:work/s142ai-diag1-implementation
