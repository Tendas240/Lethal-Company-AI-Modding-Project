name: Finalize S1.42AI-DIAG1 build-ready source state

on:
  push:
    branches: [work/s142ai-diag1-implementation]
    paths:
      - '.github/workflows/s142ai-diag1-source-repair.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/s142ai-diag1-implementation
          fetch-depth: 1

      - name: Activate post-static-gate safety latch and final gate expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one occurrence of {old!r}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          plugin = Path('Patches/S142AIDiag1Isolation/Plugin.cs')
          replace_once(plugin, '        // Work-branch safety latch. Keep false until the approved DIAG1 config overlay,', '        // Build-ready safety latch. This may be true only after the approved DIAG1 config')
          replace_once(plugin, '        // config assertions and repository-native compile/static build gate are complete.', '        // overlay, config assertions and repository-native compile/static gate have passed.')
          replace_once(plugin, '        // A manually copied intermediate DLL therefore cannot install any Harmony hooks.', '        // Diagnostic activation still remains default-off and config-gated at runtime.')
          replace_once(plugin, '        private const bool ImplementationComplete = false;', '        private const bool ImplementationComplete = true;')

          validator = Path('AnalysisTools/validate_s142ai_diag1_static.py')
          replace_once(validator, '    if "private const bool ImplementationComplete = false;" not in source:', '    if "private const bool ImplementationComplete = true;" not in source:')
          replace_once(validator, '        fail("Work-branch ImplementationComplete safety latch is not false")', '        fail("Post-static-gate ImplementationComplete safety latch is not true")')
          replace_once(validator, '        "implementation_complete_latch": False,', '        "implementation_complete_latch": True,')
          PY

      - name: Remove completed one-shot finalizer
        run: git rm .github/workflows/s142ai-diag1-source-repair.yml

      - name: Verify exact finalization diff
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/s142ai-diag1-source-repair.yml',
              'AnalysisTools/validate_s142ai_diag1_static.py',
              'Patches/S142AIDiag1Isolation/Plugin.cs',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD'], text=True).splitlines())
          if actual != expected:
              raise RuntimeError(f'unexpected finalization diff: {sorted(actual)}')
          PY
          git diff --check
          git diff -- AnalysisTools/validate_s142ai_diag1_static.py Patches/S142AIDiag1Isolation/Plugin.cs

      - name: Commit build-ready source state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize DIAG1 build-ready safety latch'
          git push origin HEAD:work/s142ai-diag1-implementation
