name: Canonicalize Tier-G branch evidence

on:
  push:
    branches:
      - analysis/s142ai-tier-g-exact
    paths:
      - '.github/workflows/tier-g-canonicalize-branch.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transient workflow execution
        run: echo "Tier-G canonicalization helper is executable"
