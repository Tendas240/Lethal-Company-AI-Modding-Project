name: Canonicalize Tier-G branch evidence

on:
  push:
    branches:
      - analysis/s142ai-tier-g-exact
    paths:
      - '.github/workflows/tier-g-canonicalize-branch.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply atomic Tier-G plan checkpoint
        run: python AnalysisTools/canonicalize_tier_g_branch.py
      - name: Commit Tier-G canonicalization and remove transient helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only
          git commit -m 'Canonicalize Tier-G exact review'
          git push origin HEAD:analysis/s142ai-tier-g-exact
