name: Reconcile BMGHDIAG3 publication lifecycle state

"on":
  push:
    branches:
      - "reconcile/bmghdiag3-publication-lifecycle"
    paths:
      - ".github/workflows/bmghdiag3-publication-lifecycle-reconcile.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/bmghdiag3-publication-lifecycle
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify exact main ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "b40a497d9956993bc5d183bad36037e9175d9635"

      - name: Reconcile canonical lifecycle state
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/reconcile_bmghdiag3_publication_lifecycle.py

      - name: Regenerate protected current navigation
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Verify reconciliation boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('.')
          state = json.loads((root / 'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          spec = json.loads((root / 'BuildSpecs/current.json').read_text(encoding='utf-8'))
          assert state['selected_scope']['status'].endswith('PROFILE_INDEX_RECONCILIATION_NEXT')
          assert 'profile-index reconciliation' in state['next_action'].lower()
          assert state['selected_scope']['phase_c']['bmgdiag3_publication_main_integration_commit'] == 'b40a497d9956993bc5d183bad36037e9175d9635'
          assert state['selected_scope']['phase_c']['bmgdiag3_profile_indexed'] is False
          assert spec['enabled'] is False and spec['build_id'] == 'IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert (root / 'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'
          assert not (root / 'ProfileSources/S1.42AK-BMGHDIAG3/PROFILE_INDEX_RESULT.json').exists()
          assert 'profile-index reconciliation' in (root / 'Current/00_CURRENT_STATE.md').read_text(encoding='utf-8').lower()
          assert 'BMGHDIAG3 exact-byte publication — integrated / not indexed' in (root / 'Knowledge/CURRENT_LIFECYCLE.md').read_text(encoding='utf-8')
          print('PASS: lifecycle advanced; gameplay/build/runtime controllers unchanged.')
          PY
          git diff --check

      - name: Commit atomic reconciliation and remove temporary transport
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bmghdiag3-publication-lifecycle-reconcile.yml
          rm RepositoryTools/reconcile_bmghdiag3_publication_lifecycle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No reconciliation changes staged"; exit 1; }
          git commit -m "Reconcile BMGHDIAG3 publication lifecycle state"
          git push origin HEAD:reconcile/bmghdiag3-publication-lifecycle
