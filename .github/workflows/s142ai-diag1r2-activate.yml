name: Activate validated S1.42AI-DIAG1R2 candidate

on:
  push:
    branches:
      - activate/s142ai-diag1r2
    paths:
      - '.github/workflows/s142ai-diag1r2-activate.yml'
      - 'RepositoryTools/activate_s142ai_diag1r2.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: s142ai-diag1r2-candidate-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/s142ai-diag1r2
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed on exact pre-activation branch state
        shell: bash
        run: |
          set -euo pipefail
          BASE='6abc1185d47bd6667d972473d6d7f04fe59d1930'
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          expected=(
            '.github/workflows/s142ai-diag1r2-activate.yml'
            'RepositoryTools/activate_s142ai_diag1r2.py'
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}"); then
            echo 'Unexpected branch drift before R2 activation' >&2
            exit 1
          fi
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"

      - name: Bind exact canonical R2 validation run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/runs/34990530260)"
          test "$(jq -r '.status' <<<"$run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = 9db05738922978b31f9d942bb4fe60352e67f5bf
          build_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/runs/34958254886)"
          test "$(jq -r '.status' <<<"$build_json")" = completed
          test "$(jq -r '.conclusion' <<<"$build_json")" = success

      - name: Apply exact coordinated R2 activation
        run: python RepositoryTools/activate_s142ai_diag1r2.py

      - name: Preserve canonical Gale v2.4 lifecycle routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Knowledge/CURRENT_LIFECYCLE.md')
          text = path.read_text(encoding='utf-8')
          needle = '\n## Exact runtime gate\n'
          route = (
              '\nCanonical Gale runtime replacement/import route: '
              '`RuntimeTools/ReplaceActiveGaleProfileV24.ps1`, pinned helper revision '
              '`2026-09-05-import-uia-v2.4-export-read-fail-closed-materialization-proof`.\n'
          )
          if text.count(needle) != 1:
              raise RuntimeError('Could not locate exact lifecycle runtime-gate insertion point')
          text = text.replace(needle, route + needle, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-shot activation tooling
        shell: bash
        run: |
          rm RepositoryTools/activate_s142ai_diag1r2.py
          rm .github/workflows/s142ai-diag1r2-activate.yml

      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate exact activated state before commit
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/state_neutral_authority_validator.py --self-test
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          test "$(cat RuntimeInbox/ACTIVE_BUILD.txt)" = 'S1.42AI-DIAG1R2'
          python - <<'PY'
          import json
          s=json.load(open('Current/CURRENT_STATE.json', encoding='utf-8'))
          b=json.load(open('BuildSpecs/current.json', encoding='utf-8'))
          a=json.load(open('Current/AUTO_BUILD_RESULT.json', encoding='utf-8'))
          assert s['accepted_baseline']['build_id']=='S1.42AH'
          assert s['latest_built_artifact']['build_id']=='S1.42AI-DIAG1R2'
          assert s['active_candidate']['build_id']=='S1.42AI-DIAG1R2'
          assert s['runtime_test_outstanding'] is True
          assert s['controllers']['runtime_active_build']=='S1.42AI-DIAG1R2'
          assert s['controllers']['build_base_sha256']=='9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'
          assert b['enabled'] is False
          assert b['build_id']=='IDLE_AFTER_S1.42AI-DIAG1R2_BUILD_AWAITING_RUNTIME'
          assert b['base_sha256']=='9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'
          assert a['build_id']=='S1.42AI-DIAG1R2'
          assert a['output_sha256']=='9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'
          PY

      - name: Commit activated state and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          if git diff --cached --name-only | grep -E '^(.github/workflows/s142ai-diag1r2-activate.yml|RepositoryTools/activate_s142ai_diag1r2.py)$'; then
            echo 'One-shot activation tooling unexpectedly remains in final tree' >&2
            exit 1
          fi
          git commit -m 'Activate validated S1.42AI-DIAG1R2 runtime candidate'
          git push origin HEAD:activate/s142ai-diag1r2
