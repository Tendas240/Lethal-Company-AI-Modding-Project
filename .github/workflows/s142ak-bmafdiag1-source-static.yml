name: S1.42AK BMAFDIAG1 source static design gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKBMAFDiag1/**'
      - 'AnalysisTools/validate_s142ak_bmafdiag1_source.py'
      - 'BuildSpecs/S1.42AK-BMAFDIAG1_PLAN.md'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3F19_BMAFDIAG1/IMPLEMENTATION_FINDINGS.md'
      - '.github/workflows/s142ak-bmafdiag1-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded BMAFDIAG1 source/static design contract
        run: python AnalysisTools/validate_s142ak_bmafdiag1_source.py
