name: Index uploaded profile

on:
  push:
    branches:
      - main
    paths:
      - "Profiles/*.r2z"
      - "References/LegacyProfiles/**/*.r2z"
      - "BuildSystem/index_profile.py"
      - ".github/workflows/profile-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find and index changed profiles
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          files = subprocess.check_output(
              [
                  "git", "diff", "--name-only", "HEAD^", "HEAD", "--",
                  "Profiles", "References/LegacyProfiles",
              ],
              text=True,
          ).splitlines()
          files = [path for path in files if path.lower().endswith(".r2z")]

          # A workflow/indexer change may happen after a legacy reference profile
          # was uploaded. In that case, index all retained legacy references so
          # they become machine-readable without requiring a second binary commit.
          if not files:
              files = sorted(
                  str(path)
                  for path in Path("References/LegacyProfiles").glob("**/*.r2z")
              )

          if not files:
              print("No .r2z profiles require indexing.")
          else:
              print("Indexing:", files)
              subprocess.run(["python", "BuildSystem/index_profile.py", *files], check=True)
          PY

      - name: Commit readable profile snapshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No profile snapshot changes to commit."
          else
            git commit -m "Index uploaded profile [skip ci]"
            git push
          fi
