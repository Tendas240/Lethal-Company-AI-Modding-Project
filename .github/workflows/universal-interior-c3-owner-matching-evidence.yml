name: Capture C3 owner matching assets

on:
  pull_request:
    paths:
      - 'AnalysisTools/inspect_universal_interior_owner_matching.py'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3OwnerMatching/**'
      - 'Current/164_S1.42AK_UNIVERSAL_INTERIOR_PHASE_A_REGISTERED_OWNER_INVENTORY.md'
      - 'ProfileSources/S1.42AK/export.r2x'
      - '.github/workflows/universal-interior-c3-owner-matching-evidence.yml'
  # A source capture is an independent, separately authorized operation.
  # pull_request runs execute only stdlib source/static validation.
  workflow_dispatch:
    inputs:
      package:
        description: One pinned owner-matching package per authorized invocation
        required: true
        type: choice
        options:
          - Piggy-LC_Office
          - BLB_Thunderstore_Mods_LOL-Lead_Interiors
      expected_head_sha:
        description: Exact reviewed 40-character workflow/code commit SHA
        required: true
        type: string
      source_capture_authorization:
        description: Explicit independent source-capture approval, not a PR approval
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # No package installs, Thunderstore requests or capture artifacts on PRs.
      - name: Compile and self-test bounded owner-matching probe
        run: |
          python -m py_compile AnalysisTools/inspect_universal_interior_owner_matching.py
          python AnalysisTools/inspect_universal_interior_owner_matching.py --self-test

  capture:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed on missing independent authorization or exact-head mismatch
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head_sha }}
          CAPTURE_APPROVAL: ${{ inputs.source_capture_authorization }}
          TARGET_PACKAGE: ${{ inputs.package }}
        run: |
          test "$CAPTURE_APPROVAL" = "I_AUTHORIZE_ONE_PINNED_C3_OWNER_SOURCE_CAPTURE"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$GITHUB_SHA" = "$EXPECTED_HEAD"
          case "$TARGET_PACKAGE" in
            Piggy-LC_Office|BLB_Thunderstore_Mods_LOL-Lead_Interiors) ;;
            *) exit 1 ;;
          esac
      # Network dependencies and exact original download are manual-dispatch only.
      - run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 PyYAML==6.0.2
      - name: Acquire exact package and capture bounded static evidence
        id: capture
        continue-on-error: true
        env:
          TARGET_PACKAGE: ${{ inputs.package }}
        run: |
          test -f SourceEvidence/UniversalInteriorViability/PhaseC3OwnerMatching/PACKAGE_LOCK.json
          mkdir -p c3-owner-output
          python AnalysisTools/inspect_universal_interior_owner_matching.py --package "$TARGET_PACKAGE" --out c3-owner-output
      - name: Upload derived JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-owner-${{ inputs.package }}-${{ github.sha }}
          path: c3-owner-output/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce fail-closed capture
        if: steps.capture.outcome != 'success'
        run: exit 1
