name: Inspect LethalMin MouthDog source contract

on:
  push:
    branches:
      - analysis/s142af-mouthdog-source-contract
    paths:
      - ".github/workflows/lethalmin-mouthdog-inspect.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install ILSpy command line
        run: dotnet tool install --global ilspycmd

      - name: Download and extract exact LethalMinNightly 1.1.108 assembly
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            "https://gcdn.thunderstore.io/live/repository/packages/NotezyTeam-LethalMinNightly-1.1.108.zip" \
            --output /tmp/LethalMinNightly-1.1.108.zip

          python - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          package = Path("/tmp/LethalMinNightly-1.1.108.zip")
          out = Path("/tmp/mouthdog-inspect")
          out.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(package, "r") as z:
              matches = [n for n in z.namelist() if n.lower().endswith("lethalmin.dll")]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one LethalMin.dll, got {matches}")
              member = matches[0]
              dll = out / "LethalMin.dll"
              dll.write_bytes(z.read(member))
              Path("/tmp/lethalmin_member.txt").write_text(member + "\n", encoding="utf-8")
              Path("/tmp/lethalmin_sha.txt").write_text(hashlib.sha256(dll.read_bytes()).hexdigest() + "\n", encoding="utf-8")
              print(member)
              print(Path("/tmp/lethalmin_sha.txt").read_text().strip())
          PY

      - name: Decompile exact assembly
        shell: bash
        run: |
          mkdir -p /tmp/lethalmin-mouthdog-decompiled
          ~/.dotnet/tools/ilspycmd -p -o /tmp/lethalmin-mouthdog-decompiled /tmp/mouthdog-inspect/LethalMin.dll

      - name: Build focused MouthDog source-contract report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/lethalmin-mouthdog-decompiled")
          member = Path("/tmp/lethalmin_member.txt").read_text(encoding="utf-8").strip()
          dll_sha = Path("/tmp/lethalmin_sha.txt").read_text(encoding="utf-8").strip()

          patterns = [
              "mouthdog",
              "mouth dog",
              "eyeless",
              "enemyattackmouth",
              "biting ",
              "bitepikmin",
              "grabpikmin",
              "bite cooldown",
              "bite limit",
          ]

          files = sorted(root.rglob("*.cs"))
          matched = []
          for p in files:
              text = p.read_text(encoding="utf-8", errors="replace")
              lower = text.lower()
              hits = [pat for pat in patterns if pat in lower]
              if hits:
                  matched.append((p, text, hits))

          lines = [
              "# LethalMinNightly 1.1.108 MouthDog / EyelessDog focused decompile",
              "",
              f"Embedded profile member: {member}",
              f"DLL SHA-256: {dll_sha}",
              "",
              "Generated from the exact NotezyTeam-LethalMinNightly-1.1.108 package used by the repository's established decompile workflow.",
              "The report is evidence-only: it does not modify gameplay code, config, controllers, or build state.",
              "",
              f"Matched C# files: {len(matched)}",
          ]

          for p, text, hits in matched:
              src = text.splitlines()
              hit_lines = [i for i, line in enumerate(src) if any(pat in line.lower() for pat in patterns)]

              windows = []
              for i in hit_lines:
                  a = max(0, i - 80)
                  b = min(len(src), i + 140)
                  if windows and a <= windows[-1][1] + 10:
                      windows[-1] = (windows[-1][0], max(windows[-1][1], b))
                  else:
                      windows.append((a, b))

              lines += [
                  "",
                  "=" * 110,
                  f"FILE: {p.relative_to(root)}",
                  f"MATCHES: {', '.join(hits)}",
                  "=" * 110,
              ]

              declaration_lines = []
              for n, line in enumerate(src, start=1):
                  if re.search(r"\b(class|struct|interface)\s+\w+", line):
                      declaration_lines.append(f"{n:5d}: {line}")
              if declaration_lines:
                  lines.append("--- TYPE DECLARATIONS ---")
                  lines.extend(declaration_lines)

              for a, b in windows:
                  lines.append(f"--- SOURCE lines {a+1}-{b} ---")
                  for n in range(a, b):
                      lines.append(f"{n+1:5d}: {src[n]}")

          out = Path("Current/130_LETHALMIN_1.1.108_MOUTHDOG_SOURCE_CONTRACT_DECOMPILE.txt")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Wrote {out} ({out.stat().st_size} bytes)")
          PY

      - name: Commit focused report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898230+github-actions[bot]@users.noreply.github.com"
          git add Current/130_LETHALMIN_1.1.108_MOUTHDOG_SOURCE_CONTRACT_DECOMPILE.txt
          if git diff --cached --quiet; then
            echo "No report changes."
          else
            git commit -m "Inspect LethalMin 1.1.108 MouthDog source contract [skip ci]"
            git push
          fi
