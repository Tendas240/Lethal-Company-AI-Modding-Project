name: Apply NestFix SpawnCycle review to plan
on:
  push:
    branches: [analysis/s142ai-nest-spawncycle-exact]
    paths:
      - 'AnalysisTools/apply_nest_spawncycle_review_to_plan.py'
      - '.github/workflows/nest-spawncycle-plan-amend.yml'
permissions:
  contents: write
jobs:
  amend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/s142ai-nest-spawncycle-exact
      - name: Apply exact bounded plan amendment
        run: python AnalysisTools/apply_nest_spawncycle_review_to_plan.py
      - name: Commit canonical plan amendment
        run: |
          git diff --check
          git diff --exit-code -- BuildSpecs/S1.42AI_PLAN.md && { echo 'Expected plan change missing'; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuildSpecs/S1.42AI_PLAN.md
          git commit -m 'Record exact NestFix and SpawnCycleFixes review in diagnostic plan'
          git push origin HEAD:analysis/s142ai-nest-spawncycle-exact
