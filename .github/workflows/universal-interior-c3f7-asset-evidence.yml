name: Capture C3F7 GlobalProp asset evidence

on:
  pull_request:
    paths:
      - 'AnalysisTools/inspect_universal_interior_c3f7.py'
      - 'AnalysisTools/test_universal_interior_c3f7.py'
      - 'AnalysisTools/inspect_universal_interior_c3f2.py'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3F7/**'
      - 'Current/164_S1.42AK_UNIVERSAL_INTERIOR_PHASE_A_REGISTERED_OWNER_INVENTORY.md'
      - 'ProfileSources/S1.42AK/export.r2x'
      - '.github/workflows/universal-interior-c3f7-asset-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 PyYAML==6.0.2
      - name: Test fail-closed proof and provenance boundaries
        run: python -m unittest discover -s AnalysisTools -p 'test_universal_interior_c3f7.py' -v

  capture:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - Generic_GMD-Generic_Interiors
          - LethalMatt-Bozoros
          - Magic_Wesley-WesleysInteriors
          - Tolian-Scoopy_Castle
          - Nikki-Slaughterhouse
          - Beaniebe-Storage_Complex
          - Plastered_Crab-Black_Mesa_Half_Life_Moon_Interior
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check UnityPy==1.25.3 PyYAML==6.0.2
      - name: Bind checked-out commit and CI run
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          mkdir -p c3f7-output
          python - <<'PY'
          import json, os
          from pathlib import Path
          keys = ['EXPECTED_HEAD', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_REPOSITORY']
          Path('c3f7-output/CI_PROVENANCE.json').write_text(json.dumps({k: os.environ[k] for k in keys}, indent=2) + '\n')
          PY
      - name: Acquire exact pinned package and capture serialized assets
        id: capture
        continue-on-error: true
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        run: python AnalysisTools/inspect_universal_interior_c3f7.py --package "$TARGET_PACKAGE" --out c3f7-output
      - name: Upload derived JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3f7-${{ matrix.package }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: c3f7-output/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce fail-closed capture
        if: steps.capture.outcome != 'success'
        run: exit 1
