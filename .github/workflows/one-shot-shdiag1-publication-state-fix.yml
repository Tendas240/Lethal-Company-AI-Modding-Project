name: One-shot SHDIAG1 publication state fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-shdiag1-publication-state-fix.yml'
      - 'RepositoryTools/temp_fix_shdiag1_publication_analysis_contract.py'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'publish/s142ak-shdiag1-exact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix publication analysis contract
        run: python RepositoryTools/temp_fix_shdiag1_publication_analysis_contract.py
      - name: Commit fix and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Current/CURRENT_STATE.json
          git rm -- .github/workflows/one-shot-shdiag1-publication-state-fix.yml RepositoryTools/temp_fix_shdiag1_publication_analysis_contract.py
          git commit -m "Fix SHDIAG1 publication analysis contract"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
