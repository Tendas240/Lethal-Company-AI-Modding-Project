name: Canonicalize Tier-B S1.42AI review

on:
  push:
    branches:
      - analysis/s142ai-tier-b-exact
    paths:
      - 'AnalysisTools/canonicalize_tier_b_plan_temp.py'
      - '.github/workflows/tier-b-canonicalize-temp.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update exact S1.42AI planning checkpoint
        run: python AnalysisTools/canonicalize_tier_b_plan_temp.py
      - name: Commit bounded canonical plan update
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BuildSpecs/S1.42AI_PLAN.md
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Update S1.42AI plan after Tier-B exact review'
          git push
