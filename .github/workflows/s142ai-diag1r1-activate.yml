## Repair proven before runtime

The predecessor DIAG1 failed before isolation armed because owner prevalidation used the known-bad hardcoded CLR assumption `LethalMin.PikminType`. R1 does not replace that with another guessed namespace. It derives the actual generic argument from the declared `LethalMin.Onion.WithdrawPikminFromOnion` CLR signature and uses the resulting real `Type` object. The exact materialized DLL proof identifies that argument as `LethalMin.Pikmin.PikminType`, confirms same-assembly coherence, and the canonical R1 DLL itself contains no known-bad hardcoded resolver.

The exact .NET 8 post-build run also re-passed the full static gate and proved the canonical plugin has identical class inventory, decompiled C# and normalized IL to the green-gate rebuild. All other profile members are byte-bound; `export.r2x` differs only in the intended profile name.

## Runtime diagnostic gate

Test **this R1 profile**, not the failed predecessor DIAG1. During one normal diagnostic gameplay run:

1. confirm startup reaches `[DIAG1_OWNER_TYPE_DERIVED]` and all required identity/config/owner/complex/transpiler install markers;
2. treat any `[DIAG1_OWNER_TARGET_INVALID]`, `[DIAG1_INVALID]`, `[DIAG1_INSTALL_ROLLED_BACK]` or target-install failure as an immediate diagnostic failure;
3. no `[DIAG1_ISOLATION_BYPASS]` may identify a live non-ShyGuy `EnemyAI`;
4. no unexpected non-ShyGuy enemy should be observed while the diagnostic isolation is armed;
5. exact Shy Guy must remain observable and must not be suppressed merely for being exterior;
6. exercised owner-prevention markers must remain bounded with no exception/retry flood or broad shared spawn/network regression.

After the run, upload the fresh complete R1 `LogOutput.log`. Do not repeat the failed predecessor DIAG1 profile.

## Exact ready-to-test commands

Repository-driven Gale v2.4 replacement/import one-liner:

```powershell
{gale}
```

Exact R1 runtime-log uploader:

```powershell
{uploader}
```

