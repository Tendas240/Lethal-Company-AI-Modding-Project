          VALIDATION_ARTIFACT = 10338433359
          VALIDATION_ARTIFACT_DIGEST = 'd849de39ddfe0398bbdbdd25d2f26def27af7f36f7bc304e4b337085a2f67c23'
          GREEN_GATE_PLUGIN_SHA = '557f4e44385570b898f302e2e984f34263cdff3d00f8db68d30dcb25556faf2a'
