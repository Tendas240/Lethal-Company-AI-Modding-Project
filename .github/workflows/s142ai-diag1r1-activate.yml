name: Activate validated S1.42AI-DIAG1R1 candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1r1-activate.yml'

permissions:
  contents: write
  actions: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind exact successful post-build validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/runs/34822644436)"
          test "$(jq -r '.status' <<<"$run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = d0ac354c0fb1be88cfa58577b67bfca7bb4b21d7
          artifact_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/artifacts/10338433359)"
          test "$(jq -r '.name' <<<"$artifact_json")" = s142ai-diag1r1-materialized-validation
          test "$(jq -r '.expired' <<<"$artifact_json")" = false
          test "$(jq -r '.digest' <<<"$artifact_json")" = sha256:d849de39ddfe0398bbdbdd25d2f26def27af7f36f7bc304e4b337085a2f67c23

      - name: Apply atomic canonical candidate activation
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import re
          import zipfile
          from pathlib import Path

          ROOT = Path('.')
          BUILD = 'S1.42AI-DIAG1R1'
          PROFILE = 'Profiles/LC V1 S1.42AI-DIAG1R1 ShyGuy Isolation Repair.r2z'
          PROFILE_NAME = 'LC V1 S1.42AI-DIAG1R1 ShyGuy Isolation Repair'
          PROFILE_SHA = 'b83165ae27d9fa3b926c3f66701ba5c7a5db57b29f6136ab212c0fa2d2cfecdd'
          PLUGIN_PATH = 'BepInEx/plugins/Tendas-S142AIDiag1Isolation/S142AIDiag1Isolation.dll'
          PLUGIN_SHA = '2d1b6e8a002eb55e0e6d935e36c0a619d1c875651b94afb9e748663af93c1de0'
          BASE_PROFILE = 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z'
          BASE_SHA = 'd993bc0fca265fe7a2b069bd654b5e2c1f590623eaf7f4fabb325f8b4d863cb2'
          BUILD_RUN = 34822019162
          BUILD_COMMIT = '8329579d3481ab27db6407d2659ceb467eebd203'
