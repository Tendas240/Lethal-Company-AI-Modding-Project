name: Activate validated S1.42AI-DIAG1R1 candidate

on:
  push:
    branches:
      - 'activate/s142ai-diag1r1'
    paths:
      - '.github/workflows/s142ai-diag1r1-activate.yml'

permissions:
  contents: write
  actions: read

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind exact successful post-build validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'activate/s142ai-diag1r1'
          run_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/runs/34822644436)"
          test "$(jq -r '.status' <<<"$run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = d0ac354c0fb1be88cfa58577b67bfca7bb4b21d7
          artifact_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/artifacts/10338433359)"
          test "$(jq -r '.name' <<<"$artifact_json")" = s142ai-diag1r1-materialized-validation
          test "$(jq -r '.expired' <<<"$artifact_json")" = false
          test "$(jq -r '.digest' <<<"$artifact_json")" = sha256:d849de39ddfe0398bbdbdd25d2f26def27af7f36f7bc304e4b337085a2f67c23

      - name: Stage exact candidate activation
        run: |
          python RepositoryTools/activate_s142ai_diag1r1.py
          python RepositoryTools/activate_s142ai_diag1r1_lineage.py

      - name: Render generated live navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate final staged repository state
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/state_neutral_authority_validator.py --self-test
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          git diff --check

      - name: Commit validated candidate activation to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START_HERE_ChatGPT_Masterprompt.txt Current Knowledge BuildSpecs RuntimeInbox AnalysisEvidence
          if git diff --cached --quiet; then
            echo 'No activation changes staged; refusing silent success.' >&2
            exit 1
          fi
          git diff --cached --check
          git commit -m 'Activate validated S1.42AI-DIAG1R1 runtime candidate'
          git push origin HEAD:activate/s142ai-diag1r1
