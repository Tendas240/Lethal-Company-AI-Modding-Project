          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def write_json(rel: str, obj: dict) -> None:
              path = ROOT / rel
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          profile_path = ROOT / PROFILE
          if not profile_path.is_file() or sha256_file(profile_path) != PROFILE_SHA:
              raise RuntimeError('Canonical DIAG1R1 profile bytes/SHA are not exact')
          result = json.loads((ROOT / 'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          if result.get('build_id') != BUILD or result.get('output_profile') != PROFILE or result.get('output_sha256') != PROFILE_SHA:
              raise RuntimeError('AUTO_BUILD_RESULT is not exact DIAG1R1')
          if result.get('zip_members') != 337 or result.get('snapshot_dir') != 'ProfileSources/S1.42AI-DIAG1R1':
              raise RuntimeError('AUTO_BUILD_RESULT materialization metadata drift')
          for rel in ('ProfileSources/S1.42AI-DIAG1R1/FILE_INDEX.json', 'ProfileSources/S1.42AI-DIAG1R1/export.r2x'):
              if not (ROOT / rel).is_file():
                  raise RuntimeError(f'Missing readable DIAG1R1 snapshot artifact: {rel}')

          with zipfile.ZipFile(profile_path) as z:
              names = z.namelist()
              if len(names) != len(set(names)) or len(names) != 337:
                  raise RuntimeError('Canonical DIAG1R1 ZIP member identity/count invalid')
              plugin_bytes = z.read(PLUGIN_PATH)
              if sha256_bytes(plugin_bytes) != PLUGIN_SHA:
                  raise RuntimeError('Canonical DIAG1R1 plugin SHA mismatch')
              cfg = z.read('BepInEx/config/tendas.s142ai.diag1.isolation.cfg').decode('utf-8-sig')
              if 'S1.42AI-DIAG1 Enabled = true' not in cfg:
                  raise RuntimeError('Canonical DIAG1R1 diagnostic config is not enabled')
              export = z.read('export.r2x').decode('utf-8-sig')
              if f'profileName: {PROFILE_NAME}' not in export:
                  raise RuntimeError('Canonical DIAG1R1 export profileName mismatch')

          source = (ROOT / 'Patches/S142AIDiag1Isolation/PackageOwnerGuards.cs').read_text(encoding='utf-8')
          if 'ResolveRequiredType("LethalMin.PikminType")' in source:
              raise RuntimeError('Known-bad hardcoded LethalMin.PikminType resolver reappeared')
          if 'ResolveLethalMinWithdrawPikminContract' not in source or '[DIAG1_OWNER_TYPE_DERIVED]' not in source:
              raise RuntimeError('Metadata-bound owner-type-resolution repair markers missing')

          evidence_dir = ROOT / 'AnalysisEvidence/S1.42AI-DIAG1R1'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          (ROOT / CONTRACT).write_text(r'''# S1.42AI-DIAG1R1 Minimal Guard Contract

**Status:** CURRENT RUNTIME CONTRACT FOR REPAIRED DIAGNOSTIC SUCCESSOR  
**Parent contract:** `AnalysisEvidence/S1.42AI-DIAG1/MINIMAL_GUARD_CONTRACT.md`  
**Owner-resolution repair authority:** `Current/145_S1.42AI-DIAG1_RUNTIME_FAILURE_OWNER_TYPE_RESOLUTION.md` plus the repaired `Patches/S142AIDiag1Isolation/PackageOwnerGuards.cs` and strengthened `AnalysisTools/validate_s142ai_diag1_static.py`.

S1.42AI-DIAG1R1 preserves the exact DIAG1 isolation/gameplay contract. The only intended diagnostic revision is the fail-closed owner-type-resolution repair: `LethalMin.Onion.WithdrawPikminFromOnion` is resolved declared-only, the real `List<T>` argument is derived from CLR method metadata, `T` must identify `PikminType` in the same LethalMin assembly as exact `LethalMin.Onion` / `LethalMin.Leader`, and that exact `Type` object is used for the owner lookup.

The materialized static gate proves the actual generic argument is `LethalMin.Pikmin.PikminType`; this string is evidence, not a new runtime hardcoding.

## Runtime success boundary

A successful R1 diagnostic run must show the repaired owner contract arms rather than rolls back, all approved DIAG1 isolation layers install, no isolation-bypass marker identifies a live non-ShyGuy `EnemyAI`, no unexpected non-ShyGuy enemy is observed, and the exact Shy Guy identity remains observable. Any owner-target invalidation, DIAG1 invalidation/rollback, target-install failure, non-ShyGuy bypass, or broad shared-spawn/network regression fails the diagnostic.

This diagnostic cannot accept the deferred full-normal S1.42AI gate. S1.42AH remains the sole accepted gameplay baseline until an explicit later runtime decision changes that state.
''', encoding='utf-8')

