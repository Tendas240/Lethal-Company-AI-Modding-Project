name: S1.42AJ Runtime Evidence Handover Sync

on:
  push:
    branches:
      - handover/s142aj-runtime-evidence-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update live authorities from ingested runtime evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          state_path = root / 'Current/CURRENT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))

          assert state['accepted_baseline']['build_id'] == 'S1.42AI'
          assert state['latest_built_artifact']['build_id'] == 'S1.42AJ'
          assert state['active_candidate']['build_id'] == 'S1.42AJ'
          assert state['runtime_test_outstanding'] is True
          assert state['controllers']['build_enabled'] is False
          assert state['controllers']['runtime_active_build'] == 'S1.42AJ'

          evidence = 'RuntimeEvidence/S1.42AJ/20260917T171109Z/'
          log_sha = 'b5267cd62a222929c117bae52371229d4fe0dcf510248ee80d1f4c1a51e67c12'
          finding = (
              'S1.42AJ was built from exact accepted S1.42AI and passed the static gate. The exported delta is exactly the three LC Office additions plus DungeonGenerationPlus 1.5.0 -> 1.5.1; every other package block and every non-export profile member is unchanged, IAmBatby LLL 1.7.12 remains the sole LLL owner, the deprecated fork is absent, and the accepted Interior Weight Normalization DLL is byte-identical. '
              f'The first full-normal S1.42AJ runtime evidence is ingested at {evidence} (LogOutput.log SHA-256 {log_sha}). On Offense, modern LLL returned LC Office as viable at author rarity 65 and the accepted Interior Weight Normalization produced final effective LC Office(100); the run selected Facility, so actual LC Office generation/traversal/elevator/power/enemy-navigation coverage remains outstanding.'
          )
          analysis_contract = (
              'Preserve the ingested S1.42AJ full-normal proof: exact modern IAmBatby LLL ownership, LC Office viable on Offense at author rarity 65, and final effective rarity 100. Complete only the missing generation coverage with a strictly diagnostic S1.42AJ-DIAG1 derived from exact S1.42AJ that force-selects LC Office on Offense after normal viability determination; validate actual generation/traversal, elevator and breaker/power where available, enemy navigation, scrap generation, inherited accepted contracts, and no new critical regression/error flood. The diagnostic must not alter or replace balanced S1.42AJ and must not introduce universal-moon availability or another deferred Interior scope.'
          )
          next_action = (
              'Prepare a strictly diagnostic S1.42AJ-DIAG1 from exact S1.42AJ to force-select LC Office on Offense only after normal LLL viability has been established, then build/static-validate that diagnostic and runtime-test the missing LC Office generation/traversal/elevator/power/enemy-navigation/scrap coverage. Keep balanced S1.42AJ unchanged and not accepted until the full acceptance gate is complete.'
          )
          state['selected_scope']['finding'] = finding
          state['selected_scope']['analysis_contract'] = analysis_contract
          state['selected_scope']['next_action'] = next_action
          state['next_action'] = next_action
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def replace_exact(rel, old, new):
              p = root / rel
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text missing in {rel}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          lifecycle = root / 'Knowledge/CURRENT_LIFECYCLE.md'
          text = lifecycle.read_text(encoding='utf-8')
          old_evidence = '**Evidence:** `Current/152_S1.42AI_RUNTIME_ACCEPTANCE_BCMER_SHYGUY_INTERIOR_ONLY.md`, `Current/153_S1.42AJ_BUILD_CANDIDATE_LC_OFFICE_V81_INTEGRATION.md`, `BuildSpecs/S1.42AJ_BUILD_EVIDENCE/STATIC_VERIFICATION.md`  '
          new_evidence = '**Evidence:** `Current/152_S1.42AI_RUNTIME_ACCEPTANCE_BCMER_SHYGUY_INTERIOR_ONLY.md`, `Current/153_S1.42AJ_BUILD_CANDIDATE_LC_OFFICE_V81_INTEGRATION.md`, `BuildSpecs/S1.42AJ_BUILD_EVIDENCE/STATIC_VERIFICATION.md`, `RuntimeEvidence/S1.42AJ/20260917T171109Z/`'
          if old_evidence not in text:
              raise SystemExit('CURRENT_LIFECYCLE evidence anchor missing')
          text = text.replace(old_evidence, new_evidence, 1)
          old_static = 'The static gate proves the exact compatibility-first package delta, sole modern IAmBatby LLL ownership, absence of the deprecated fork, no unrelated package drift, and byte-identical accepted Interior Weight Normalization.'
          new_static = old_static + '\n\nThe first full-normal S1.42AJ runtime evidence is ingested at `RuntimeEvidence/S1.42AJ/20260917T171109Z/` (`LogOutput.log` SHA-256 `b5267cd62a222929c117bae52371229d4fe0dcf510248ee80d1f4c1a51e67c12`). On Offense, LLL returned `LC Office (65)` and the accepted post-viability normalizer produced final `LC Office(100)`, proving default viability plus equal effective weighting. That run selected `Facility`, so actual LC Office generation/traversal/elevator/power/enemy-navigation coverage is still outstanding.'
          if old_static not in text:
              raise SystemExit('CURRENT_LIFECYCLE static anchor missing')
          text = text.replace(old_static, new_static, 1)
          old_next = 'Import S1.42AJ with the canonical Gale v2.4 replacement helper, execute the full-normal LC Office runtime acceptance gate from `Current/153_S1.42AJ_BUILD_CANDIDATE_LC_OFFICE_V81_INTEGRATION.md` and `BuildSpecs/DEFERRED_LC_OFFICE_V81_PLAN.md`, then upload the complete fresh S1.42AJ `LogOutput.log`. Do not accept S1.42AJ from static/build success alone.'
          new_next = 'Prepare a strictly diagnostic **S1.42AJ-DIAG1** from exact S1.42AJ that force-selects LC Office on Offense only after normal LLL viability determination. Build/static-validate that diagnostic, then use it only to obtain the still-missing actual LC Office generation/traversal/elevator/power/enemy-navigation/scrap coverage. Preserve the ingested unforced S1.42AJ viability/weight proof, keep balanced S1.42AJ unchanged, and do not accept it until the complete runtime gate is satisfied.'
          if old_next not in text:
              raise SystemExit('CURRENT_LIFECYCLE next-action anchor missing')
          lifecycle.write_text(text.replace(old_next, new_next, 1), encoding='utf-8')

          replace_exact(
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              '`BuildSpecs/current.json` is disabled at `IDLE_AFTER_S1.42AJ_BUILD_AWAITING_RUNTIME_VALIDATION`. `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AJ` is runtime-evidence attribution only. Full-normal LC Office runtime validation is outstanding.\n\nThe next action is to import exact S1.42AJ via the canonical Gale v2.4 workflow, execute the LC Office acceptance gate, and upload the complete fresh S1.42AJ runtime log. Universal-moon availability and all unrelated Interior scopes remain deferred.',
              '`BuildSpecs/current.json` is disabled at `IDLE_AFTER_S1.42AJ_BUILD_AWAITING_RUNTIME_VALIDATION`. `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AJ` is runtime-evidence attribution only. Full-normal LC Office runtime validation remains outstanding, but `RuntimeEvidence/S1.42AJ/20260917T171109Z/` already proves unforced Offense viability (`LC Office (65)`) and final normalized effective rarity `100`; that run selected Facility rather than LC Office.\n\nThe next action is to prepare a strictly diagnostic `S1.42AJ-DIAG1` from exact S1.42AJ that force-selects LC Office on Offense after normal viability determination, solely to obtain actual generation/traversal/elevator/power/enemy-navigation/scrap coverage. Balanced S1.42AJ remains unchanged and not accepted. Universal-moon availability and all unrelated Interior scopes remain deferred.'
          )

          replace_exact(
              'Knowledge/INTERIORS_AND_LLL.md',
              'The active compatibility candidate does not force LC Office onto all moons. Runtime must now prove registration, default/modern-LLL viability, effective normalization to `100`, actual dungeon generation, traversal, elevator/power behavior and ordinary enemy navigation. Any later universal-availability tuning is a separate balance/configuration scope.',
              'The active compatibility candidate does not force LC Office onto all moons. The first ingested full-normal S1.42AJ evidence at `RuntimeEvidence/S1.42AJ/20260917T171109Z/` proves modern-LLL viability on Offense at author rarity `65` and final project-local normalized rarity `100`; that run selected Facility. The remaining compatibility coverage is actual LC Office generation, traversal, elevator/power behavior, ordinary enemy navigation and scrap generation. Obtain that coverage with a strictly diagnostic S1.42AJ-DIAG1 force-selection derived from exact S1.42AJ, without changing the balanced candidate. Any later universal-availability tuning remains a separate balance/configuration scope.'
          )
          PY

      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate repaired live state
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          git diff --check

      - name: Remove one-shot workflow and commit repaired state
        shell: bash
        run: |
          rm -f .github/workflows/s142aj-runtime-evidence-handover-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/CURRENT_STATE.json Current/PROJECT_KNOWLEDGE_MAP.md Knowledge/CURRENT_LIFECYCLE.md Knowledge/INTERIORS_AND_LLL.md README.md START_HERE_ChatGPT_Masterprompt.txt Current/00_CURRENT_STATE.md Current/01_HANDOVER_CORE.md .github/workflows/s142aj-runtime-evidence-handover-sync.yml
          git diff --cached --check
          git commit -m 'Sync S1.42AJ partial runtime evidence state'
          git push
