name: Atomic build S1.42AI candidate artifact v2

on:
  push:
    branches:
      - build/s1.42ai-atomic-candidate
    paths:
      - ".github/workflows/atomic-build-s142ai-v2.yml"

permissions:
  contents: write

concurrency:
  group: atomic-build-s142ai-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout atomic build branch
        uses: actions/checkout@v4
        with:
          ref: build/s1.42ai-atomic-candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write transient exact S1.42AI build specification
        shell: bash
        run: |
          cat > /tmp/S1.42AI.json <<'JSON'
          {
            "enabled": true,
            "build_id": "S1.42AI",
            "base_profile": "Profiles/LC V1 S1.42AH Mouth Dog Fix.r2z",
            "base_sha256": "06e07fe6805e5e41786c16b5c1ea2132c4f65b385517c902f8aa566ccf49cd4e",
            "output_profile": "Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z",
            "profile_name": "LC V1 S1.42AI ShyGuy Interior Only",
            "overwrite": false,
            "mod_state_changes": [],
            "mod_additions": [],
            "mod_removals": [],
            "file_injections": [],
            "config_patches": [
              {
                "path": "BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg",
                "section": "ShyGuy",
                "key": "ShyGuyDef OutsideEnemyRarity",
                "value": "0, 0, 0, 0"
              },
              {
                "path": "BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg",
                "section": "ShyGuy",
                "key": "ShyGuyDef MinOutsideEnemy",
                "value": "0, 0, 0, 0"
              },
              {
                "path": "BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg",
                "section": "ShyGuy",
                "key": "ShyGuyDef MaxOutsideEnemy",
                "value": "0, 0, 0, 0"
              }
            ],
            "local_plugin_builds": [],
            "text_assertions": [
              {
                "path": "BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg",
                "regex": "(?ms)^\\[ShyGuy\\]\\s*$.*?^Event Type = VeryBad\\s*$.*?^Event Enabled\\? = true\\s*$.*?^ShyGuyDef InsideEnemyRarity = 20, 0\\.8, 20, 100\\s*$.*?^ShyGuyDef OutsideEnemyRarity = 0, 0, 0, 0\\s*$.*?^ShyGuyDef MinInsideEnemy = 2, 0\\.04, 2, 6\\s*$.*?^ShyGuyDef MaxInsideEnemy = 2, 0\\.04, 2, 6\\s*$.*?^ShyGuyDef MinOutsideEnemy = 0, 0, 0, 0\\s*$.*?^ShyGuyDef MaxOutsideEnemy = 0, 0, 0, 0\\s*$.*?^\\["
              },
              {
                "path": "BepInEx/config/Scopophobia.cfg",
                "contains": "## Settings file was created by plugin Scopophobia v1.3.4"
              },
              {
                "path": "BepInEx/config/Scopophobia.cfg",
                "contains": "SpawnOutside = false"
              },
              {
                "path": "BepInEx/config/Scopophobia.cfg",
                "not_contains": "SpawnOutside = true"
              }
            ]
          }
          JSON

      - name: Build S1.42AI profile
        run: python BuildSystem/profile_builder.py /tmp/S1.42AI.json

      - name: Verify exact archive and semantic delta
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          expected_changed = {
              'export.r2x',
              'BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg',
          }
          assert result['build_id'] == 'S1.42AI'
          assert result['base_profile'] == 'Profiles/LC V1 S1.42AH Mouth Dog Fix.r2z'
          assert result['base_sha256'] == '06e07fe6805e5e41786c16b5c1ea2132c4f65b385517c902f8aa566ccf49cd4e'
          assert result['output_profile'] == 'Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z'
          assert set(result.get('changed_existing_members', [])) == expected_changed, result.get('changed_existing_members')
          assert result.get('added_members', []) == []
          assert result.get('mod_state_changes', []) == []
          assert result.get('mod_additions', []) == []
          assert result.get('mod_removals', []) == []

          old = Path('ProfileSources/S1.42AH/BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg').read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n').split('\n')
          new = Path('ProfileSources/S1.42AI/BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg').read_text(encoding='utf-8-sig').replace('\r\n','\n').replace('\r','\n').split('\n')
          assert len(old) == len(new), (len(old), len(new))
          diffs = [(i + 1, a, b) for i, (a, b) in enumerate(zip(old, new)) if a != b]
          expected = {
              ('ShyGuyDef OutsideEnemyRarity = 10, 0.4, 10, 50', 'ShyGuyDef OutsideEnemyRarity = 0, 0, 0, 0'),
              ('ShyGuyDef MinOutsideEnemy = 1, 0.02, 1, 3', 'ShyGuyDef MinOutsideEnemy = 0, 0, 0, 0'),
              ('ShyGuyDef MaxOutsideEnemy = 2, 0.04, 2, 6', 'ShyGuyDef MaxOutsideEnemy = 0, 0, 0, 0'),
          }
          assert {(a, b) for _, a, b in diffs} == expected, diffs
          assert len(diffs) == 3, diffs

          old_index = json.loads(Path('ProfileSources/S1.42AH/FILE_INDEX.json').read_text(encoding='utf-8'))
          new_index = json.loads(Path('ProfileSources/S1.42AI/FILE_INDEX.json').read_text(encoding='utf-8'))
          oi = {x['path']: x for x in old_index}
          ni = {x['path']: x for x in new_index}
          assert set(oi) == set(ni)
          for path in oi:
              if path not in expected_changed:
                  assert oi[path]['sha256'] == ni[path]['sha256'], path
          assert oi['BepInEx/config/Scopophobia.cfg']['sha256'] == ni['BepInEx/config/Scopophobia.cfg']['sha256']

          evidence_dir = Path('BuildSpecs/S1.42AI_BUILD_EVIDENCE')
          evidence_dir.mkdir(parents=True, exist_ok=True)
          (evidence_dir / 'AUTO_BUILD_RESULT.json').write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          lines = [
              '# S1.42AI Static Build Verification',
              '',
              '**Status:** BUILD PASS / STATIC DELTA VERIFIED / NOT YET RUNTIME CANDIDATE',
              '',
              f"- Output profile: `{result['output_profile']}`",
              f"- Output SHA-256: `{result['output_sha256']}`",
              '- Parent: `S1.42AH`',
              '- Changed existing archive members: exactly `export.r2x` and `BepInEx/config/BrutalCompanyMinusExtraReborn/ModdedEvents.cfg`',
              '- Added archive members: none',
              '- Package state/add/remove changes: none',
              '- `ModdedEvents.cfg` semantic line delta: exactly three `[ShyGuy]` exterior values',
              '- Every other archive member SHA-256 is byte-identical to S1.42AH, including `BepInEx/config/Scopophobia.cfg`.',
              '',
              'No runtime test is authorized by this static verification alone.',
              ''
          ]
          (evidence_dir / 'STATIC_VERIFICATION.md').write_text('\n'.join(lines), encoding='utf-8')
          print('S1.42AI static delta verification: PASS')
          print('S1.42AI output SHA-256:', result['output_sha256'])
          PY

      - name: Restore canonical current build-result pointer
        shell: bash
        run: |
          git checkout HEAD -- Current/AUTO_BUILD_RESULT.json Current/AUTO_BUILD_RESULT.md

      - name: Remove temporary build workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/atomic-build-s142ai.yml
          rm -f .github/workflows/atomic-build-s142ai-v2.yml

      - name: Commit verified artifact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check -- BuildSpecs/S1.42AI_BUILD_EVIDENCE/STATIC_VERIFICATION.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build S1.42AI ShyGuy interior-only artifact"

      - name: Verify lifecycle remains isolated
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          spec = json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
          auto = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          evidence = json.loads(Path('BuildSpecs/S1.42AI_BUILD_EVIDENCE/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert state['accepted_baseline']['build_id'] == 'S1.42AH'
          assert state['active_candidate'] is None
          assert state['runtime_test_outstanding'] is False
          assert spec['enabled'] is False
          assert auto['build_id'] == 'S1.42AH'
          assert evidence['build_id'] == 'S1.42AI'
          assert not Path('.github/workflows/atomic-build-s142ai.yml').exists()
          assert not Path('.github/workflows/atomic-build-s142ai-v2.yml').exists()
          print('S1.42AI build-only checkpoint lifecycle isolation: PASS')
          PY
          test -z "$(git status --porcelain)"

      - name: Push verified S1.42AI artifact checkpoint
        run: git push origin HEAD:build/s1.42ai-atomic-candidate
