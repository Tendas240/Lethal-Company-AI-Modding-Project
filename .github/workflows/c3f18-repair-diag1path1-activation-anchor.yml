name: C3F18 repair DIAG1PATH1 activation anchor

on:
  push:
    branches:
      - c3f18-bmdsfix1-diag1path1-runtime-activation
    paths:
      - '.github/workflows/c3f18-repair-diag1path1-activation-anchor.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f18-bmdsfix1-diag1path1-runtime-activation
          fetch-depth: 0

      - name: Repair exact canonical text anchor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('RepositoryTools/c3f18_activate_bmdsfix1_diag1path1_runtime.py')
          text=path.read_text(encoding='utf-8')
          old='Canonical indexing is recorded by `ProfileSources/S1.42AK-BMDSFIX1-DIAG1PATH1/PROFILE_INDEX_RESULT.json`: build ID `S1.42AK-BMDSFIX1-DIAG1PATH1`, profile identity `LC V1 S1.42AK-D1P1`, 338 archive members, resolution through `EXPECTED_HASHES`. DIAG1PATH1 remains **not runtime-armed / diagnostic support only / never acceptable as gameplay**.'
          new='Canonical indexing is recorded by `ProfileSources/S1.42AK-BMDSFIX1-DIAG1PATH1/PROFILE_INDEX_RESULT.json`: build ID `S1.42AK-BMDSFIX1-DIAG1PATH1`, profile identity `LC V1 S1.42AK-D1P1`, 338 archive members, resolution through `EXPECTED_HASHES`. DIAG1PATH1 remains **not runtime-armed / diagnostic support only / never accept**.'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one PATH1 lifecycle text anchor, found {count}')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          rm .github/workflows/c3f18-repair-diag1path1-activation-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair DIAG1PATH1 activation canonical text anchor'
          git push origin HEAD:c3f18-bmdsfix1-diag1path1-runtime-activation