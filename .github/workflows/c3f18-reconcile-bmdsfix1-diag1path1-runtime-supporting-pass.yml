name: C3F18 reconcile BMDSFIX1-DIAG1PATH1 supporting pass

on:
  push:
    branches:
      - c3f18-bmdsfix1-diag1path1-runtime-supporting-pass

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c3f18-bmdsfix1-diag1path1-runtime-supporting-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile exact PATH1 supporting runtime evidence
        run: python RepositoryTools/c3f18_reconcile_bmdsfix1_diag1path1_runtime_supporting_pass.py

      - name: Regenerate and verify protected current navigation
        run: |
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Validate canonical state and repository contracts
        run: |
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Verify exact supporting-pass decision and bounded routing reset
        shell: python
        run: |
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path('.')
          state = json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert state['accepted_baseline']['build_id'] == 'S1.42AK'
          assert state['active_candidate']['build_id'] == 'S1.42AK-BMDSFIX1'
          assert state['active_candidate']['status'] == 'ACTIVE_RUNTIME_CANDIDATE_NOT_ACCEPTED'
          assert state['active_candidate']['sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert state['runtime_test_outstanding'] is True
          assert state['controllers']['runtime_active_build'] == 'S1.42AK-BMDSFIX1'
          assert (root/'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'
          scope = state['selected_scope']
          assert scope['status'] == 'PHASE_C3F18_DIAG1PATH1_SUPPORTING_PASS_BMDSFIX1_EXACT_TARGET_QUALIFICATION_OUTSTANDING'
          diag = scope['diagnostic_revision']
          assert diag['build_id'] == 'S1.42AK-BMDSFIX1-DIAG1PATH1'
          assert diag['classification'] == 'DIAGNOSTIC_SUPPORT_ONLY_NEVER_ACCEPT'
          assert diag['status'] == 'PUBLISHED_DIAGNOSTIC_RUNTIME_EVIDENCE_INGESTED_SUPPORTING_PASS_NOT_ACCEPTED'
          assert diag['runtime_armed'] is False
          assert diag['supporting_result'] == 'PASS'
          assert diag['runtime_log_sha256'] == 'ec7631dc6baa3ef6cff502767d56356fe62943b362271f45add8807381a63ae4'
          assert diag['runtime_decision'] == 'Current/186_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_SUPPORTING_PASS.md'
          evidence = root/'RuntimeEvidence/S1.42AK-BMDSFIX1-DIAG1PATH1/20260925T085104Z/raw/LogOutput.log'
          assert hashlib.sha256(evidence.read_bytes()).hexdigest() == 'ec7631dc6baa3ef6cff502767d56356fe62943b362271f45add8807381a63ae4'
          record = (root/'Current/186_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_SUPPORTING_PASS.md').read_text(encoding='utf-8')
          for needle in ['SUPPORTING DIAGNOSTIC PASS', 'NEVER ACCEPT', 'BMDSFIX1 EXACT GAMEPLAY TARGET GATE OUTSTANDING', '4.875->1', 'Entering the atmosphere']:
              assert needle in record, needle
          status = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          changed = []
          for line in status:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ',1)[1]
              changed.append(path)
          forbidden = [p for p in changed if p.startswith(('Profiles/','ProfileSources/','BuildSpecs/','RuntimeEvidence/','SourceEvidence/'))]
          assert not forbidden, f'forbidden artifact/source delta: {forbidden}'
          assert 'RuntimeInbox/ACTIVE_BUILD.txt' in changed
          assert 'Current/CURRENT_STATE.json' in changed
          assert 'Current/186_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_SUPPORTING_PASS.md' in changed

      - name: Remove one-shot reconciliation machinery
        run: |
          rm RepositoryTools/c3f18_reconcile_bmdsfix1_diag1path1_runtime_supporting_pass.py
          rm .github/workflows/c3f18-reconcile-bmdsfix1-diag1path1-runtime-supporting-pass.yml

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Commit atomic canonical reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Reconcile DIAG1PATH1 supporting runtime pass"
          git push origin HEAD:c3f18-bmdsfix1-diag1path1-runtime-supporting-pass
