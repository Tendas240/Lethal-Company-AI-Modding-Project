name: One-shot DIAG1PATH1 handover lifecycle reconcile

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'handover/diag1path1-lifecycle-reconcile'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply bounded lifecycle reconciliation
        run: python RepositoryTools/_handover_diag1path1_lifecycle_reconcile.py

      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Remove one-shot machinery
        run: |
          rm -f RepositoryTools/_handover_diag1path1_lifecycle_reconcile.py
          rm -f .github/workflows/_handover-diag1path1-lifecycle-reconcile.yml

      - name: Validate generated navigation and live-state semantics
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          git diff --check

      - name: Commit atomic reconciliation to PR branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No reconciliation changes to commit.'
            exit 0
          fi
          git commit -m 'Reconcile DIAG1 launch block and DIAG1PATH1 next gate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
