name: C3 validate BMAFR1 partial runtime reconciliation

on:
  push:
    branches:
      - c3-bmafr1-partial-id2-supplemental

permissions:
  contents: write

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: c3-bmafr1-partial-id2-supplemental

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact partial runtime evidence
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          root=Path('.')
          raw=(root/'RuntimeEvidence/S1.42AK-BMAFR1/20261002T154834Z/raw/LogOutput.log').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='3113a1c9df2e1db231cf6aa0e7dc20699894a8646da3eaf7fd1ce0c3d89ac42b'
          log=raw.decode('utf-8',errors='replace')
          for n in ['[BMAFDIAG1] ARMED','[BMAFDIAG1] SELECTED Black Mesa Abandoned Foundry / FoundryFlow; pre-reduction viable wrapper confirmed; normalized rarity=100; pool=32->1','[BMAFDIAG1] TOPOLOGY_OK ids=0,1,2,3 uniqueOppositePairs=4','Players finished generating the new floor']:
              assert n in log, n
          for i in (0,1,3):
              assert f'[BMAFDIAG1] TRAVERSED id={i} sourceSide=outside targetSide=inside' in log
              assert f'[BMAFDIAG1] TRAVERSED id={i} sourceSide=inside targetSide=outside' in log
          assert '[BMAFDIAG1] TRAVERSED id=2 sourceSide=outside targetSide=inside' not in log
          assert '[BMAFDIAG1] TRAVERSED id=2 sourceSide=inside targetSide=outside' not in log
          for n in ('[BMAFDIAG1] REFUSED','TOPOLOGY_INCONCLUSIVE','TRAVERSAL_INCONCLUSIVE','OBSERVER_INCONCLUSIVE'):
              assert n not in log, n
          s=json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert s['accepted_baseline']['build_id']=='S1.42AK'
          assert s['active_candidate']['build_id']=='S1.42AK-BMDSFIX1'
          assert s['controllers']['runtime_active_build']=='S1.42AK-BMAFR1'
          assert s['runtime_test_outstanding'] is True
          d=s['selected_scope']['diagnostic_revision']
          assert d['runtime_log_sha256']=='3113a1c9df2e1db231cf6aa0e7dc20699894a8646da3eaf7fd1ce0c3d89ac42b'
          assert d['supplemental_required_id']==2
          assert d['supplemental_required_outside_object']=='EntranceTeleportC'
          assert d['supplemental_run_status']=='AUTHORIZED_AFTER_MAIN_INTEGRATION_AND_EXACT_HEAD_CI'
          assert (root/'Current/225_S1.42AK_BMAFR1_PARTIAL_RUNTIME_EVIDENCE_ID2_SUPPLEMENTAL_AUTHORIZATION.md').exists()

      - name: Regenerate and verify protected current navigation
        run: |
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Validate canonical repository contracts
        run: |
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Verify bounded delta
        shell: python
        run: |
          import subprocess
          changed=[]
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              p=line[3:]
              if ' -> ' in p: p=p.split(' -> ',1)[1]
              changed.append(p)
          forbidden=('Profiles/','ProfileSources/','BuildSpecs/','RuntimeEvidence/','SourceEvidence/','Patches/')
          assert not [p for p in changed if p.startswith(forbidden)], changed

      - name: Remove one-shot workflow
        run: rm .github/workflows/c3-bmafr1-partial-runtime-id2-validation.yml

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Commit renderer outputs and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Finalize BMAFR1 partial runtime reconciliation"
          git push origin HEAD:c3-bmafr1-partial-id2-supplemental
