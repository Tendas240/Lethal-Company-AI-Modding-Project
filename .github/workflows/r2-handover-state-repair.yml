          selected['finding'] = (
              'S1.42AI-DIAG1R2 was rebuilt directly from the exact S1.42AI full-normal base after the landed '
              'kite.ZelevatorCode EndlessElevator applicability repair. Canonical post-build validation now proves the exact R2 profile '
              'passes the DIAG1 static gate, the materialized dependency-absent NOT_APPLICABLE contract, and semantic DLL equivalence '
              'to the repaired green-gate build. R2 is built and verified but is not yet an active runtime candidate; runtime attribution '
              'remains on failed R1 until a separate coordinated lifecycle transition explicitly arms R2.'
          )
