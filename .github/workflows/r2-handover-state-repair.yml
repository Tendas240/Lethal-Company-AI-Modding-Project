name: Repair canonical R2 post-build handover state

on:
  push:
    branches:
      - work/r2-handover-state-repair
    paths:
      - '.github/workflows/r2-handover-state-repair.yml'

permissions:
  contents: write

concurrency:
  group: r2-handover-state-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed on exact handover-repair base
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          BASE = 'aa78a0f6c7da14f9caa8bacd1e0f2d2a0d2b709c'
          DRIVER = '.github/workflows/r2-handover-state-repair.yml'
          R2 = Path('Profiles/LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair.r2z')
          R2_SHA = '9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'

          subprocess.run(['git', 'merge-base', '--is-ancestor', BASE, 'HEAD'], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', BASE, 'HEAD'], text=True).splitlines())
          if changed != {DRIVER}:
              raise RuntimeError(f'Unexpected branch drift before repair: {sorted(changed)}')

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          state = json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          if state.get('active_candidate') is not None or state.get('runtime_test_outstanding') is not False:
              raise RuntimeError('Repair requires no active candidate and no outstanding runtime test')
          if state.get('accepted_baseline', {}).get('build_id') != 'S1.42AH':
              raise RuntimeError('Accepted baseline drifted')
          if Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() != 'S1.42AI-DIAG1R1':
              raise RuntimeError('Runtime attribution moved before handover repair')
          auto = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          if auto.get('build_id') != 'S1.42AI-DIAG1R2' or auto.get('output_sha256') != R2_SHA:
              raise RuntimeError('AUTO_BUILD_RESULT is not exact R2')
          if not R2.is_file() or sha(R2) != R2_SHA:
              raise RuntimeError('Canonical R2 artifact missing or SHA drifted')
          validation = json.loads(Path('AnalysisEvidence/S1.42AI-DIAG1R2/MATERIALIZED_VALIDATION.json').read_text(encoding='utf-8'))
          if validation.get('status') != 'PASS_CANONICAL_DIAG1R2_MATERIALIZED_APPLICABILITY_EQUIVALENCE':
              raise RuntimeError('R2 materialized validation is not PASS')
          if validation.get('canonical_profile_sha256') != R2_SHA or validation.get('validation_workflow_run') != 34990530260:
              raise RuntimeError('R2 materialized validation binding drifted')
          PY

      - name: Canonize R2 post-build pre-runtime state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          R2_ID = 'S1.42AI-DIAG1R2'
          R2_PROFILE = 'Profiles/LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair.r2z'
          R2_SHA = '9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'
          R2_REQUEST = 'BuildSpecs/S1.42AI-DIAG1R2_REQUEST.md'
          R2_VALIDATION = 'AnalysisEvidence/S1.42AI-DIAG1R2/MATERIALIZED_VALIDATION.json'
          R2_VALIDATION_MD = 'AnalysisEvidence/S1.42AI-DIAG1R2/MATERIALIZED_VALIDATION.md'
          R2_APPLICABILITY = 'AnalysisEvidence/S1.42AI-DIAG1R2/ENDLESS_ELEVATOR_MATERIALIZED_APPLICABILITY.json'
          ACCEPTED_PROFILE = 'Profiles/LC V1 S1.42AH Mouth Dog Fix.r2z'
          ACCEPTED_SHA = '06e07fe6805e5e41786c16b5c1ea2132c4f65b385517c902f8aa566ccf49cd4e'
          IDLE_ID = 'IDLE_AFTER_S1.42AI-DIAG1R2_MATERIALIZED_VALIDATION_AWAITING_RUNTIME_CANDIDATE_ACTIVATION'
          MARKER = '<!-- LIVE_STATE: accepted=S1.42AH latest=S1.42AI-DIAG1R2 candidate=none runtime_test_outstanding=false -->'

          state_path = Path('Current/CURRENT_STATE.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated'] = '2026-09-15'
          state['latest_built_artifact'] = {
              'build_id': R2_ID,
              'title': 'ShyGuy Isolation Diagnostic EndlessElevator Applicability Repair',
