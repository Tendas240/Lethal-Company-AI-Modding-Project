name: Repair canonical R2 post-build handover state

on:
  push:
    branches:
      - work/r2-handover-state-repair
    paths:
      - '.github/workflows/r2-handover-state-repair.yml'

permissions:
  contents: write

concurrency:
  group: r2-handover-state-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed on exact handover-repair base
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          BASE = 'aa78a0f6c7da14f9caa8bacd1e0f2d2a0d2b709c'
          allowed = {
              '.github/workflows/r2-handover-state-repair.yml',
              'RepositoryTools/r2_handover_state_repair.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', BASE, 'HEAD'], text=True).splitlines())
          if changed != allowed:
              raise RuntimeError(f'Unexpected branch drift before repair: {sorted(changed)}')

          state = json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          if state.get('accepted_baseline', {}).get('build_id') != 'S1.42AH':
              raise RuntimeError('Accepted baseline drifted')
          if state.get('active_candidate') is not None or state.get('runtime_test_outstanding') is not False:
              raise RuntimeError('Repair requires no active candidate and no outstanding runtime test')
          if Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() != 'S1.42AI-DIAG1R1':
              raise RuntimeError('Runtime attribution moved before handover repair')

          r2 = Path('Profiles/LC V1 S1.42AI-DIAG1R2 ShyGuy Isolation Applicability Repair.r2z')
          expected_sha = '9dd67d6ea015274596e11651a8c1a842d50c7f7b913332794cce43d389169d15'
          h = hashlib.sha256()
          with r2.open('rb') as f:
              for chunk in iter(lambda: f.read(1024 * 1024), b''):
                  h.update(chunk)
          if h.hexdigest() != expected_sha:
              raise RuntimeError('Canonical R2 profile SHA drifted')

          auto = json.loads(Path('Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          if auto.get('build_id') != 'S1.42AI-DIAG1R2' or auto.get('output_sha256') != expected_sha:
              raise RuntimeError('AUTO_BUILD_RESULT is not exact R2')
          validation = json.loads(Path('AnalysisEvidence/S1.42AI-DIAG1R2/MATERIALIZED_VALIDATION.json').read_text(encoding='utf-8'))
          if validation.get('status') != 'PASS_CANONICAL_DIAG1R2_MATERIALIZED_APPLICABILITY_EQUIVALENCE':
              raise RuntimeError('R2 materialized validation is not PASS')
          if validation.get('canonical_profile_sha256') != expected_sha or validation.get('validation_workflow_run') != 34990530260:
              raise RuntimeError('R2 validation binding drifted')
          PY

      - name: Canonize R2 post-build pre-runtime state
        run: python RepositoryTools/r2_handover_state_repair.py

      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate repaired live state before commit
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          test "$(cat RuntimeInbox/ACTIVE_BUILD.txt)" = "S1.42AI-DIAG1R1"
          test "$(python -c 'import json; print(json.load(open("Current/CURRENT_STATE.json"))["runtime_test_outstanding"])')" = "False"

      - name: Commit repaired state and self-delete
        shell: bash
        run: |
          rm .github/workflows/r2-handover-state-repair.yml RepositoryTools/r2_handover_state_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/r2-handover-state-repair.yml',
              'BuildSpecs/current.json',
              'Current/00_CURRENT_STATE.md',
              'Current/01_HANDOVER_CORE.md',
              'Current/ARTIFACT_EVIDENCE_INTEGRITY.md',
              'Current/BUILD_LINEAGE.json',
              'Current/BUILD_LINEAGE.md',
              'Current/CURRENT_STATE.json',
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              'Knowledge/CURRENT_LIFECYCLE.md',
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
              'README.md',
              'RepositoryTools/r2_handover_state_repair.py',
              'START_HERE_ChatGPT_Masterprompt.txt',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise RuntimeError(f'Unexpected staged state-repair paths: {sorted(actual)}')
          if 'RuntimeInbox/ACTIVE_BUILD.txt' in actual:
              raise RuntimeError('Refusing runtime attribution mutation during handover repair')
          PY
          git commit -m 'Canonize verified R2 pre-runtime handover state'
          git push origin HEAD:work/r2-handover-state-repair
