        run: python RepositoryTools/render_current_navigation.py

      - name: Validate repaired live state before commit
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          test "$(cat RuntimeInbox/ACTIVE_BUILD.txt)" = "S1.42AI-DIAG1R1"
          test "$(python -c 'import json; print(json.load(open("Current/CURRENT_STATE.json"))["runtime_test_outstanding"])')" = "False"

      - name: Commit repaired state and self-delete
        shell: bash
        run: |
          rm .github/workflows/r2-handover-state-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md START_HERE_ChatGPT_Masterprompt.txt Current Knowledge BuildSpecs/current.json .github/workflows/r2-handover-state-repair.yml
          if git diff --cached --name-only | grep -qx 'RuntimeInbox/ACTIVE_BUILD.txt'; then
            echo 'Refusing runtime attribution mutation during handover state repair' >&2
            exit 1
          fi
          git commit -m 'Canonize verified R2 pre-runtime handover state'
          git push origin HEAD:work/r2-handover-state-repair
