name: S1.42AK BMAFDIAG1PATH1 source static gate

on:
  pull_request:
    paths:
      - 'BuildSpecs/S1.42AK-BMAFDIAG1PATH1.json'
      - 'BuildSpecs/S1.42AK-BMAFDIAG1PATH1_PLAN.md'
      - 'AnalysisTools/validate_s142ak_bmafdiag1path1_source.py'
      - 'RepositoryTools/gale_profile_path_length_guard.py'
      - 'Current/212_S1.42AK_BMAFDIAG1_PATH_LENGTH_BLOCK_AND_GUARD_RECONCILIATION.md'
      - '.github/workflows/s142ak-bmafdiag1path1-source-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate BMAFDIAG1PATH1 identity-only source/static contract
        run: python AnalysisTools/validate_s142ak_bmafdiag1path1_source.py
      - name: Validate proposed profile identity against permanent Gale path budget
        run: python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-BMAFDIAG1PATH1.json
