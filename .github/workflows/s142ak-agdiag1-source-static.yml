name: S1.42AK AGDIAG1 source and pure static gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKAGDiag1/**'
      - 'AnalysisTools/validate_s142ak_agdiag1_source.py'
      - 'SourceEvidence/UniversalInteriorViability/AGDIAG1SourceStatic/**'
      - 'Current/255_S1.42AK_PHASE_C_ART_GALLERY_AGDIAG1_SOURCE_STATIC_IMPLEMENTATION_CHECKPOINT.md'
      - 'Current/CURRENT_STATE.json'
      - 'Current/00_CURRENT_STATE.md'
      - 'Knowledge/INTERIORS_AND_LLL.md'
      - '.github/workflows/s142ak-agdiag1-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test pure Art Gallery fail-closed selection policy
        run: dotnet run --project Patches/S142AKAGDiag1/Tests/Policy.Tests.csproj -c Release
      - name: Compile diagnostic plugin source only
        working-directory: Patches/S142AKAGDiag1
        run: dotnet build S142AKAGDiag1.csproj -c Release
      - name: Verify source-only one-patch fail-closed contract and controller preservation
        run: python AnalysisTools/validate_s142ak_agdiag1_source.py
