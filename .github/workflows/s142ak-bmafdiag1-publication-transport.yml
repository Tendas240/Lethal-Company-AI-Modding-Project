name: Transport exact reviewed S1.42AK-BMAFDIAG1 publication

on:
  push:
    branches:
      - c3-bmafdiag1-exact-publication
    paths:
      - '.github/workflows/s142ak-bmafdiag1-publication-transport.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: s142ak-bmafdiag1-publication-transport
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact publication branch
        uses: actions/checkout@v4
        with:
          ref: c3-bmafdiag1-exact-publication
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/bmafdiag1-publication"
          mkdir -p "$work/extracted"
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11106178288/zip" \
            -o "$work/review.zip"
          echo 'e96b8de8084f051d74fcb06b05aa06ed3355419602c813b6021acb8a5b9f78b0  '"$work/review.zip" | sha256sum -c -
          unzip -q "$work/review.zip" -d "$work/extracted"

      - name: Revalidate exact reviewed bytes, Foundry delta and controller boundary
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, sys, unicodedata, zipfile
          from pathlib import Path

          root = Path('.')
          src = Path(os.environ['RUNNER_TEMP']) / 'bmafdiag1-publication' / 'extracted'
          reviewed = src / 'Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z'
          parent = root / 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z'
          reviewed_index_path = src / 'ProfileSources/S1.42AK-BMAFDIAG1/FILE_INDEX.json'
          reviewed_static_path = src / 'BuildSpecs/S1.42AK-BMAFDIAG1_BUILD_EVIDENCE/STATIC_VERIFICATION.json'
          owner_evidence_path = root / 'RuntimeEvidence/S1.42A/20260902T224318Z/extracted/config/config/LethalLevelLoader.cfg'
          reconstructed = Path(os.environ['RUNNER_TEMP']) / 'bmafdiag1-publication-snapshot'
          output = root / 'Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z'
          output_sources = root / 'ProfileSources/S1.42AK-BMAFDIAG1'

          BASE_SHA = 'b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee'
          PROFILE_SHA = 'b8611f58678890065f214f788051c203f4d72c59040e53e51c64c89c5958fdc2'
          DIAG_SHA = 'c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1'
          NORMALIZER_SHA = '901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'
          LLL_SHA = 'b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c'
          EXPECTED_NAME = 'LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic'
          DIAG = 'BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll'
          NORMALIZER = 'BepInEx/plugins/S142ABInteriorWeightNormalization/S142ABInteriorWeightNormalization.dll'
          LLL_CONFIG = 'BepInEx/config/LethalLevelLoader.cfg'
          FOUNDRY_SECTION = 'Custom Dungeon:  Abandoned Foundry'
          MANUAL_LEVEL_KEY = 'Dungeon Injection Settings - Manual Level Names List'
          ENABLE_KEY = 'Enable Content Configuration'

          def sha(data): return hashlib.sha256(data).hexdigest()
          def file_sha(path): return sha(path.read_bytes())
          def require(ok, msg):
              if not ok: raise RuntimeError(msg)
          def read_zip(path):
              with zipfile.ZipFile(path) as z:
                  names = z.namelist()
                  require(len(names) == len(set(names)), f'duplicate members in {path}')
                  return names, {n: z.read(n) for n in names}
          def normalized_text(data):
              return data.decode('utf-8-sig').replace('\r\n', '\n').replace('\r', '\n')
          def visible(text):
              return ''.join(ch for ch in text if unicodedata.category(ch) != 'Cf')
          def is_target_header(line):
              return visible(line.strip()).casefold() == f'[{FOUNDRY_SECTION}]'.casefold()
          def section_values(text):
              lines = text.replace('\r\n', '\n').replace('\r', '\n').split('\n')
              starts = [i for i, line in enumerate(lines) if is_target_header(line)]
              require(len(starts) == 1, 'Expected exactly one canonical Abandoned Foundry section')
              start = starts[0]
              end = len(lines)
              for i in range(start + 1, len(lines)):
                  stripped = visible(lines[i].strip())
                  if stripped.startswith('[') and stripped.endswith(']'):
                      end = i
                      break
              values = {}
              for line in lines[start + 1:end]:
                  stripped = line.strip()
                  if not stripped or stripped.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  key, value = key.strip(), value.strip()
                  require(key not in values, 'Duplicate Foundry config key: ' + key)
                  values[key] = value
              return lines, start, end, values
          def stable_export(data):
              text = normalized_text(data)
              require(len(re.findall(r'(?m)^profileName:.*$', text)) == 1, 'profileName normalization count mismatch')
              return re.sub(r'(?m)^profileName:.*$', 'profileName: <identity>', text).rstrip('\n')
          def profile_name(data):
              names = [line[len('profileName:'):].strip() for line in normalized_text(data).splitlines() if line.startswith('profileName:')]
              require(len(names) == 1, f'profileName count mismatch: {len(names)}')
              return names[0]
          def trim_blank_tail(items):
              out = list(items)
              while out and out[-1].strip() == '': out.pop()
              return out

          require(file_sha(parent) == BASE_SHA, 'accepted S1.42AK parent SHA mismatch')
          require(reviewed.is_file() and file_sha(reviewed) == PROFILE_SHA, 'reviewed BMAFDIAG1 profile SHA mismatch')
          require(reviewed_index_path.is_file(), 'reviewed FILE_INDEX missing from frozen artifact')
          require(reviewed_static_path.is_file(), 'reviewed STATIC_VERIFICATION missing from frozen artifact')
          require(owner_evidence_path.is_file(), 'canonical owner-default Foundry evidence missing')
          require(not output.exists() and not output_sources.exists(), 'BMAFDIAG1 publication output already exists before transport')

          pn, pm = read_zip(parent)
          rn, rm = read_zip(reviewed)
          require(len(rn) == 337, f'reviewed archive member count drift: {len(rn)}')
          require(set(rn) - set(pn) == {DIAG}, 'reviewed added-member contract violated')
          require(set(pn) - set(rn) == set(), 'reviewed archive member removal detected')
          changed = [n for n in pn if pm[n] != rm[n]]
          require(len(changed) == 2 and set(changed) == {'export.r2x', LLL_CONFIG}, 'reviewed existing-member delta violated: ' + repr(changed))
          require(stable_export(pm['export.r2x']) == stable_export(rm['export.r2x']), 'export.r2x differs beyond profile identity')
          require(profile_name(rm['export.r2x']) == EXPECTED_NAME, 'reviewed profile identity mismatch')
          require('LethalLevelLoaderUpdated' not in normalized_text(rm['export.r2x']), 'forbidden alternate LLL fork present')
          require(sha(rm[DIAG]) == DIAG_SHA, 'BMAFDIAG1 DLL SHA mismatch')
          require(NORMALIZER in pm and NORMALIZER in rm, 'accepted normalizer missing')
          require(sha(pm[NORMALIZER]) == NORMALIZER_SHA and sha(rm[NORMALIZER]) == NORMALIZER_SHA and pm[NORMALIZER] == rm[NORMALIZER], 'accepted normalizer drift')

          owner_text = owner_evidence_path.read_text(encoding='utf-8-sig')
          _, _, _, owner_values = section_values(owner_text)
          expected_owner_keys = {
              ENABLE_KEY,
              'General Settings - Enable Dynamic Dungeon Size Restriction',
              'General Settings - Minimum Dungeon Size Multiplier',
              'General Settings - Maximum Dungeon Size Multiplier',
              'General Settings - Restrict Dungeon Size Scaler',
              'Dungeon Injection Settings - Manual Mod Names List',
              MANUAL_LEVEL_KEY,
              'Dungeon Injection Settings - Dynamic Level Tags List',
              'Dungeon Injection Settings - Dynamic Route Price List',
          }
          require(set(owner_values) == expected_owner_keys, 'Owner-default Foundry key set drift')
          require(owner_values[ENABLE_KEY] == 'false', 'Owner-default Foundry enable value drift')
          require(owner_values['General Settings - Enable Dynamic Dungeon Size Restriction'] == 'false', 'Owner dynamic-size enable drift')
          require(owner_values['General Settings - Minimum Dungeon Size Multiplier'] == '1', 'Owner minimum-size drift')
          require(owner_values['General Settings - Maximum Dungeon Size Multiplier'] == '1', 'Owner maximum-size drift')
          require(owner_values['General Settings - Restrict Dungeon Size Scaler'] == '1', 'Owner size-scaler drift')
          require(owner_values['Dungeon Injection Settings - Manual Mod Names List'] == 'Default Values Were Empty', 'Owner Manual Mod Names drift')
          require(owner_values['Dungeon Injection Settings - Dynamic Level Tags List'] == 'Murica:300,Canyon:50,Wasteland:150', 'Owner Dynamic Level Tags drift')
          require(owner_values['Dungeon Injection Settings - Dynamic Route Price List'] == 'Default Values Were Empty', 'Owner Route Price drift')
          owner_manual_levels = owner_values[MANUAL_LEVEL_KEY]
          require('Black Mesa:' not in owner_manual_levels, 'Owner default unexpectedly already contains Black Mesa')
          expected_review_values = dict(owner_values)
          expected_review_values[ENABLE_KEY] = 'true'
          expected_review_values[MANUAL_LEVEL_KEY] = owner_manual_levels + ',Black Mesa:100'

          base_config_text = normalized_text(pm[LLL_CONFIG])
          review_config_text = normalized_text(rm[LLL_CONFIG])
          require([line for line in base_config_text.split('\n') if is_target_header(line)] == [], 'Accepted S1.42AK unexpectedly contains direct Abandoned Foundry section')
          review_lines, review_start, review_end, actual_review_values = section_values(review_config_text)
          require(actual_review_values == expected_review_values, 'Materialized Foundry owner values / authorized Black Mesa delta mismatch')
          require(actual_review_values[MANUAL_LEVEL_KEY].count('Black Mesa:100') == 1, 'Black Mesa:100 must occur exactly once')
          require('External:100' not in actual_review_values[MANUAL_LEVEL_KEY], 'Unauthorized External:100 delta')
          require(trim_blank_tail(review_lines[:review_start]) == trim_blank_tail(base_config_text.split('\n')), 'LLL config content before materialized Foundry section drifted')
          require(review_end == len(review_lines), 'Foundry review section must be the only appended section at file tail')
          for key in expected_owner_keys - {ENABLE_KEY, MANUAL_LEVEL_KEY}:
              require(actual_review_values[key] == owner_values[key], 'Owner-default value changed: ' + key)

          reviewed_index = json.loads(reviewed_index_path.read_text(encoding='utf-8'))
          require(len(reviewed_index) == 337, 'reviewed FILE_INDEX row-count mismatch')
          for i, rec in enumerate(reviewed_index):
              require(rec['index'] == i and rec['path'] == rn[i], f'FILE_INDEX order mismatch at {i}')
              require(rec['size'] == len(rm[rn[i]]) and rec['sha256'] == sha(rm[rn[i]]), f'FILE_INDEX identity mismatch: {rn[i]}')

          reviewed_static = json.loads(reviewed_static_path.read_text(encoding='utf-8'))
          require(reviewed_static['status'] == 'STATIC_BUILD_PASS_REVIEW_ARTIFACT_NOT_PUBLISHED_NOT_ARMED', 'reviewed static status mismatch')
          require(reviewed_static['build_id'] == 'S1.42AK-BMAFDIAG1', 'reviewed static build ID mismatch')
          require(reviewed_static['base_sha256'] == BASE_SHA, 'reviewed static base SHA mismatch')
          require(reviewed_static['output_sha256'] == PROFILE_SHA, 'reviewed static profile SHA mismatch')
          require(reviewed_static['diagnostic_dll_sha256'] == DIAG_SHA, 'reviewed static diagnostic DLL SHA mismatch')
          require(reviewed_static['lll_dll_sha256'] == LLL_SHA, 'reviewed static LLL provenance SHA mismatch')
          require(reviewed_static['normalizer_sha256'] == NORMALIZER_SHA, 'reviewed static normalizer SHA mismatch')
          require(reviewed_static['archive_members_verified'] == 337, 'reviewed static member count mismatch')
          require(reviewed_static['added_members'] == [DIAG], 'reviewed static added-member mismatch')
          require(set(reviewed_static['changed_existing_members']) == {'export.r2x', LLL_CONFIG}, 'reviewed static changed-member mismatch')
          require(reviewed_static['removed_members'] == [], 'reviewed static removal mismatch')
          require(reviewed_static['package_changes'] == 0 and reviewed_static['config_changes'] == 1, 'reviewed static package/config drift')
          require(reviewed_static['foundry_section_materialized'] is True, 'reviewed static Foundry materialization mismatch')
          require(reviewed_static['foundry_content_configuration_enabled'] is True, 'reviewed static Foundry enable mismatch')
          require(reviewed_static['foundry_manual_level_names_delta'] == 'Black Mesa:100', 'reviewed static Foundry availability delta mismatch')
          require(reviewed_static['foundry_owner_values_preserved'] is True, 'reviewed static Foundry owner-value preservation mismatch')
          require(reviewed_static['published'] is False and reviewed_static['runtime_armed'] is False, 'review artifact lifecycle status drift')

          spec = json.loads((root / 'BuildSpecs/current.json').read_text(encoding='utf-8'))
          state = json.loads((root / 'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          auto = json.loads((root / 'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          require(spec['enabled'] is False and spec['build_id'] == 'IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS', 'BuildSpecs/current.json drift')
          require(spec['base_sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0', 'idle BuildSpecs base SHA drift')
          require((root / 'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1', 'ACTIVE_BUILD drift')
          require(state['accepted_baseline']['build_id'] == 'S1.42AK' and state['accepted_baseline']['sha256'] == BASE_SHA, 'accepted baseline drift')
          require(state['latest_built_artifact']['build_id'] == 'S1.42AK-BMDSFIX1', 'latest gameplay artifact drift')
          require(state['active_candidate']['build_id'] == 'S1.42AK-BMDSFIX1' and state['active_candidate']['sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0', 'active candidate drift')
          require(state['runtime_test_outstanding'] is True, 'BMDSFIX1 passive runtime gate lost')
          require(state['controllers']['runtime_active_build'] == 'S1.42AK-BMDSFIX1', 'machine runtime controller drift')
          require('S1.42AK-BMAFDIAG1' in state['selected_scope']['next_action'] and 'exact-byte publication' in state['selected_scope']['next_action'].lower(), 'current lifecycle no longer authorizes BMAFDIAG1 exact-byte publication')
          require(auto['build_id'] == 'S1.42AK-BMDSFIX1' and auto['output_sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0', 'AUTO_BUILD_RESULT drift')

          sys.path.insert(0, str(root))
          from BuildSystem.profile_builder import read_zip as builder_read_zip, snapshot
          if reconstructed.exists(): shutil.rmtree(reconstructed)
          summary = snapshot(builder_read_zip(reviewed), reconstructed)
          require(summary.get('entries') == 337, f'snapshot entry count mismatch: {summary!r}')
          require(json.loads((reconstructed / 'FILE_INDEX.json').read_text(encoding='utf-8')) == reviewed_index, 'reconstructed FILE_INDEX mismatch')
          print('PASS: exact reviewed BMAFDIAG1 bytes, Foundry delta and unchanged lifecycle controllers confirmed before publication.')
          PY

      - name: Materialize exact reviewed bytes
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/bmafdiag1-publication/extracted"
          cp "$src/Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z" "Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z"
          cp -a "$RUNNER_TEMP/bmafdiag1-publication-snapshot" "ProfileSources/S1.42AK-BMAFDIAG1"
          cat > BuildSpecs/S1.42AK-BMAFDIAG1_BUILD_EVIDENCE/PUBLICATION_VERIFICATION.md <<'MD'
          # S1.42AK-BMAFDIAG1 exact reviewed-artifact publication verification

          **Status:** EXACT REVIEWED BYTES PUBLISHED ON WORKING BRANCH / NOT INDEXED / NOT RUNTIME ARMED / DIAGNOSTIC ONLY / NEVER ACCEPT
          **Date:** 2026-09-30
          **Reviewed source/build head:** `47f2beca815c4d726fec8b85f4e9aac129519486`
          **Review workflow run:** `36735131025` (run `2`)
          **Frozen Actions artifact:** `11106178288`
          **Artifact ZIP SHA-256:** `e96b8de8084f051d74fcb06b05aa06ed3355419602c813b6021acb8a5b9f78b0`
          **Published profile SHA-256:** `b8611f58678890065f214f788051c203f4d72c59040e53e51c64c89c5958fdc2`
          **Diagnostic DLL SHA-256:** `c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1`
          **Profile identity:** `LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic`

          The `.r2z` is copied byte-for-byte from frozen Actions artifact `11106178288`; no profile or DLL rebuild occurs during publication. The artifact ZIP digest, exact profile digest, exact embedded `S142AKBMAFDiag1.dll` digest, archive delta, owner-default Foundry configuration delta and controller boundary were revalidated before materialization.

          Relative to exact accepted S1.42AK (`b39aa550a517ec727de6eb1ae825383933047d3c556cb6e8d4aa7611c9f89dee`), the published diagnostic profile has 337 members, adds only `BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll`, removes none, and changes existing bytes only at `BepInEx/config/LethalLevelLoader.cfg` and `export.r2x`. Package changes remain `0`, config changes remain `1`, accepted normalizer SHA-256 remains `901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06`, and reviewed LLL 1.7.12 provenance remains `b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c`.

          The LLL delta materializes exactly one owner-default `Abandoned Foundry` section at file tail, changes only `Enable Content Configuration` from owner-default `false` to `true`, appends exactly `Black Mesa:100` once to the preserved owner Manual Level Names mapping, preserves all other owner values, and adds no `External:100`, foreign pairing or size-rule change.

          `ProfileSources/S1.42AK-BMAFDIAG1/` is reconstructed from those exact reviewed profile bytes with repository snapshot semantics, and its `FILE_INDEX.json` is data-identical to the reviewed artifact index. No `PROFILE_INDEX_RESULT.json` exists yet; indexing is intentionally a later gate.

          Publication intentionally leaves `BuildSpecs/current.json`, `Current/AUTO_BUILD_RESULT.*`, `Current/CURRENT_STATE.json` and `RuntimeInbox/ACTIVE_BUILD.txt` unchanged. S1.42AK remains accepted. S1.42AK-BMDSFIX1 remains active gameplay candidate / not accepted with its regular Black Mesa x `DeepSewersFlow` qualification outstanding/passive. `RuntimeInbox/ACTIVE_BUILD.txt` remains `S1.42AK-BMDSFIX1`. BMAFDIAG1 is not Gale-imported, not runtime-armed, not a gameplay/acceptance candidate, and remains **DIAGNOSTIC ONLY / NEVER ACCEPT**. Black Mesa x Abandoned Foundry remains `NOT_YET_PROVEN`; no gameplay run is authorized by this publication checkpoint.
          MD

      - name: Verify materialized publication
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          profile = Path('Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z')
          assert hashlib.sha256(profile.read_bytes()).hexdigest() == 'b8611f58678890065f214f788051c203f4d72c59040e53e51c64c89c5958fdc2'
          with zipfile.ZipFile(profile) as z:
              assert len(z.infolist()) == 337
              assert hashlib.sha256(z.read('BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll')).hexdigest() == 'c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1'
              cfg = z.read('BepInEx/config/LethalLevelLoader.cfg').decode('utf-8-sig')
              assert cfg.count('Black Mesa:100') == 1
              assert 'External:100' not in cfg[cfg.find('Abandoned Foundry'):]
          index = json.loads(Path('ProfileSources/S1.42AK-BMAFDIAG1/FILE_INDEX.json').read_text(encoding='utf-8'))
          assert len(index) == 337
          assert not Path('ProfileSources/S1.42AK-BMAFDIAG1/PROFILE_INDEX_RESULT.json').exists()
          assert json.loads(Path('BuildSpecs/current.json').read_text(encoding='utf-8'))['enabled'] is False
          assert Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'
          print('PASS: exact BMAFDIAG1 publication materialized, unindexed and unarmed.')
          PY

      - name: Commit exact publication using established transport pattern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'No publication changes staged.' >&2; exit 1; }
          git commit -m 'Publish exact reviewed S1.42AK-BMAFDIAG1 artifact [skip ci]'
          git push origin HEAD:c3-bmafdiag1-exact-publication
