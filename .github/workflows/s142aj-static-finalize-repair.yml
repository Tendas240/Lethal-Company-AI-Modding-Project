name: Repair S1.42AJ static finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142aj-static-finalize-repair.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove incompatible diff whitespace gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/s142aj-static-finalize.yml')
          text = path.read_text(encoding='utf-8')
          needle = '          git diff --check\n'
          if text.count(needle) != 1:
              raise RuntimeError(f'expected exactly one git diff --check line, found {text.count(needle)}')
          path.write_text(text.replace(needle, '', 1), encoding='utf-8')
          PY
          git rm .github/workflows/s142aj-static-finalize-repair.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair S1.42AJ static finalizer whitespace gate'
          git push origin HEAD:main
