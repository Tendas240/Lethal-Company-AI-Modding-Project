name: Activate validated S1.42AJ runtime candidate

on:
  push:
    branches:
      - activate/s142aj-runtime
    paths:
      - '.github/workflows/s142aj-runtime-activate.yml'
      - 'RepositoryTools/activate_s142aj_runtime.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: s142aj-runtime-candidate-activation
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/s142aj-runtime
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fail closed on exact pre-activation branch state
        shell: bash
        run: |
          set -euo pipefail
          BASE='95107ab39c0d93b3e37d4edde61cc1db7ae1c334'
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD | sort)
          expected=(
            '.github/workflows/s142aj-runtime-activate.yml'
            'RepositoryTools/activate_s142aj_runtime.py'
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${changed[@]}"); then
            echo 'Unexpected branch drift before S1.42AJ activation' >&2
            exit 1
          fi
          test "$(git rev-parse "$BASE^{commit}")" = "$BASE"

      - name: Bind exact S1.42AJ canonical build run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api repos/Tendas240/Lethal-Company-AI-Modding-Project/actions/runs/35222275686)"
          test "$(jq -r '.status' <<<"$run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$run_json")" = success
          test "$(jq -r '.head_sha' <<<"$run_json")" = cbf25e05a75b8d6f3153cfa3a6bca0df396ad677

      - name: Apply exact coordinated S1.42AJ activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('RepositoryTools/activate_s142aj_runtime.py')
          s=p.read_text(encoding='utf-8')
          old='if "ready for runtime arming" not in state.get("next_action", "").lower():'
          new='if "arm s1.42aj as the sole runtime candidate" not in state.get("next_action", "").lower():'
          if old not in s:
              raise SystemExit('expected transient next-action guard not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python RepositoryTools/activate_s142aj_runtime.py

      - name: Remove one-shot activation tooling
        shell: bash
        run: |
          rm RepositoryTools/activate_s142aj_runtime.py
          rm .github/workflows/s142aj-runtime-activate.yml

      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate exact activated state before commit
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/state_neutral_authority_validator.py --self-test
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          test "$(cat RuntimeInbox/ACTIVE_BUILD.txt)" = 'S1.42AJ'
          python - <<'PY'
          import json
          s=json.load(open('Current/CURRENT_STATE.json', encoding='utf-8'))
          b=json.load(open('BuildSpecs/current.json', encoding='utf-8'))
          a=json.load(open('Current/AUTO_BUILD_RESULT.json', encoding='utf-8'))
          i=json.load(open('Current/ARTIFACT_EVIDENCE_INTEGRITY.json', encoding='utf-8'))
          l=json.load(open('Current/BUILD_LINEAGE.json', encoding='utf-8'))
          p=json.load(open('Current/Projektstatus_S1.42AJ_CANDIDATE.json', encoding='utf-8'))
          assert s['accepted_baseline']['build_id']=='S1.42AI'
          assert s['latest_built_artifact']['build_id']=='S1.42AJ'
          assert s['active_candidate']['build_id']=='S1.42AJ'
          assert s['runtime_test_outstanding'] is True
          assert s['controllers']['runtime_active_build']=='S1.42AJ'
          assert s['controllers']['build_id']=='IDLE_AFTER_S1.42AJ_BUILD_AWAITING_RUNTIME_VALIDATION'
          assert s['controllers']['build_base_sha256']=='7c1441aeb0732208bb8e910d89348c2e0129ce202422103a025e8f8aea707dba'
          assert b['enabled'] is False
          assert b['build_id']=='IDLE_AFTER_S1.42AJ_BUILD_AWAITING_RUNTIME_VALIDATION'
          assert b['base_profile']=='Profiles/LC V1 S1.42AJ LC Office V81 Integration.r2z'
          assert b['base_sha256']=='7c1441aeb0732208bb8e910d89348c2e0129ce202422103a025e8f8aea707dba'
          assert a['build_id']=='S1.42AJ'
          assert a['output_sha256']=='7c1441aeb0732208bb8e910d89348c2e0129ce202422103a025e8f8aea707dba'
          pending={x['build_id']:x for x in i['pending_profiles']}
          assert pending['S1.42AJ']['role']=='ACTIVE_RUNTIME_CANDIDATE_PENDING'
          assert pending['S1.42AJ']['profile_sha256']=='7c1441aeb0732208bb8e910d89348c2e0129ce202422103a025e8f8aea707dba'
          assert l['current_accepted_build_id']=='S1.42AI'
          assert l['latest_built_artifact_id']=='S1.42AJ'
          assert l['active_candidate_build_id']=='S1.42AJ'
          assert p['active_runtime_candidate']['build_id']=='S1.42AJ'
          assert p['runtime_gate']['final_effective_rarity_when_viable']==100
          candidate=open('Current/153_S1.42AJ_BUILD_CANDIDATE_LC_OFFICE_V81_INTEGRATION.md', encoding='utf-8').read()
          assert 'ReplaceActiveGaleProfileV24.ps1' in candidate
          assert 'Upload S1.42AJ runtime log' in candidate
          assert 'LC V1 S1.42AJ LC Office V81 Integration' in candidate
          PY

      - name: Commit activated state and push branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          test ! -e .github/workflows/s142aj-runtime-activate.yml
          test ! -e RepositoryTools/activate_s142aj_runtime.py
          git commit -m 'Activate validated S1.42AJ runtime candidate'
          git push origin HEAD:activate/s142aj-runtime
