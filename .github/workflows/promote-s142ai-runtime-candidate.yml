name: Promote S1.42AI runtime candidate

on:
  push:
    branches:
      - build/s1.42ai-atomic-candidate
    paths:
      - ".github/workflows/promote-s142ai-runtime-candidate.yml"

permissions:
  contents: write

concurrency:
  group: promote-s142ai-runtime-candidate
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: build/s1.42ai-atomic-candidate
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write atomic S1.42AI candidate state
        run: python RepositoryTools/_tmp_promote_s142ai.py

      - name: Pin canonical Gale v2.4 revision in lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Knowledge/CURRENT_LIFECYCLE.md')
          text = p.read_text(encoding='utf-8')
          needle = 'implemented by `RuntimeTools/ReplaceActiveGaleProfileV24.ps1`. For this candidate'
          replacement = 'implemented by `RuntimeTools/ReplaceActiveGaleProfileV24.ps1` at canonical helper revision `2026-09-05-import-uia-v2.4-export-read-fail-closed-materialization-proof`. For this candidate'
          assert needle in text
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Render generated current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Validate complete repository state before commit
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          git diff --check -- Current/143_S1.42AI_BUILD_CANDIDATE_BCMER_SHYGUY_INTERIOR_ONLY.md Current/Projektstatus_S1.42AI_CANDIDATE.json Current/CURRENT_STATE.json BuildSpecs/current.json

      - name: Commit validated candidate promotion and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/promote-s142ai-runtime-candidate.yml
          rm RepositoryTools/_tmp_promote_s142ai.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Promote S1.42AI to active runtime candidate"
          git push origin HEAD:build/s1.42ai-atomic-candidate
