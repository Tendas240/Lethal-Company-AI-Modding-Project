name: Temporary MouthDog successor source apply

on:
  push:
    branches:
      - mouthedog-successor-implementation

permissions:
  contents: write

jobs:
  apply-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: mouthedog-successor-implementation
          fetch-depth: 0

      - name: Apply exact reviewed MouthDog successor delta
        run: python RepositoryTools/_temporary_apply_mouthdog_successor.py

      - name: Verify source diff hygiene
        run: |
          git diff --check
          git diff -- Patches/S139CompatibilityFixes/Plugin.cs

      - name: Compile compatibility plugin
        run: dotnet build Patches/S139CompatibilityFixes/S139CompatibilityFixes.csproj -c Release

      - name: Commit validated source and remove temporary machinery
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Patches/S139CompatibilityFixes/Plugin.cs
          git rm .github/workflows/_temporary-mouthdog-successor-source-apply.yml
          git rm RepositoryTools/_temporary_apply_mouthdog_successor.py
          git commit -m 'Implement MouthDog successor dual prevention contract'
          git push origin HEAD:mouthedog-successor-implementation
