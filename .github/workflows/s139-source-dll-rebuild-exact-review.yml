name: S1.42AI S139 Compiler Reference Provenance Inventory

on:
  push:
    branches:
      - analysis/s142ai-s139-source-dll-rebuild-exact
    paths:
      - ".github/workflows/s139-source-dll-rebuild-exact-review.yml"

permissions:
  contents: read

concurrency:
  group: s142ai-s139-source-dll-rebuild-exact
  cancel-in-progress: false

jobs:
  compiler-reference-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate historical setup-dotnet resolution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Build historical S139 context and inventory compiler inputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s139-compiler-reference-provenance"
          PRE="af415c8d6fdb69b0b7c88102e714764f3dc24b57"
          HISTORICAL_BRANCH="build/s142ah-mouthdog-dual-prevention"
          EXPECTED_SDK="10.0.400"
          EXPECTED_RUNTIME_SHA="bf86f338dba1428327088f0aaa2af8d9816f647c3b3c12214a5fc52db8e34573"
          PROFILE="Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z"
          MEMBER="BepInEx/plugins/Tendas-S139CompatibilityFixes/S139CompatibilityFixes.dll"
          PROJECT="Patches/S139CompatibilityFixes/S139CompatibilityFixes.csproj"
          PROJECT_DIR="Patches/S139CompatibilityFixes"
          OBJ="$PROJECT_DIR/obj/Release/netstandard2.1"
          REBUILT="$PROJECT_DIR/bin/Release/netstandard2.1/S139CompatibilityFixes.dll"
          ANALYSIS_HEAD="$(git rev-parse HEAD)"
          rm -rf "$OUT"
          mkdir -p "$OUT/reference" "$OUT/rebuilt" "$OUT/generated"

          restore_checkout() {
            rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
            git checkout --detach "$ANALYSIS_HEAD" >/dev/null 2>&1 || true
            git update-ref -d "refs/remotes/origin/$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
            git branch -D "$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
          }
          trap restore_checkout EXIT

          test "$PWD" = "$GITHUB_WORKSPACE"
          test ! -e global.json

          python - "$PROFILE" "$MEMBER" "$OUT/reference/S139CompatibilityFixes.dll" "$EXPECTED_RUNTIME_SHA" <<'PY'
          import hashlib, sys, zipfile
          profile, member, target, expected = sys.argv[1:]
          with zipfile.ZipFile(profile) as z:
              data = z.read(member)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"runtime DLL SHA mismatch: {actual}")
          open(target, "wb").write(data)
          PY

          dotnet --list-sdks > "$OUT/HOST_DOTNET_SDKS.txt"
          git update-ref "refs/remotes/origin/$HISTORICAL_BRANCH" "$PRE"
          git checkout --force -B "$HISTORICAL_BRANCH" "refs/remotes/origin/$HISTORICAL_BRANCH"
          git branch --set-upstream-to="origin/$HISTORICAL_BRANCH" "$HISTORICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$PRE"
          test "$(git symbolic-ref --short HEAD)" = "$HISTORICAL_BRANCH"
          test ! -e global.json

          SELECTED_SDK="$(dotnet --version)"
          test "$SELECTED_SDK" = "$EXPECTED_SDK"
          printf '%s\n' "$SELECTED_SDK" > "$OUT/SELECTED_DOTNET_SDK.txt"
          dotnet --info > "$OUT/DOTNET_INFO.txt"

          rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
          dotnet build "$PROJECT" -c Release -v:diag > "$OUT/BUILD_DIAGNOSTIC.txt" 2> "$OUT/BUILD_STDERR.txt"
          test -f "$REBUILT"
          cp "$REBUILT" "$OUT/rebuilt/S139CompatibilityFixes.dll"

          for f in \
            "$OBJ/S139CompatibilityFixes.sourcelink.json" \
            "$OBJ/S139CompatibilityFixes.GeneratedMSBuildEditorConfig.editorconfig" \
            "$OBJ/S139CompatibilityFixes.AssemblyInfo.cs" \
            "$OBJ/.NETStandard,Version=v2.1.AssemblyAttributes.cs" \
            "$PROJECT_DIR/obj/project.assets.json" \
            "$PROJECT_DIR/obj/S139CompatibilityFixes.csproj.nuget.dgspec.json"
          do
            test -f "$f"
            cp "$f" "$OUT/generated/$(basename "$f")"
          done

          python - "$OUT" "$EXPECTED_RUNTIME_SHA" "$SELECTED_SDK" <<'PY'
          import hashlib, json, os, pathlib, re, sys

          out = pathlib.Path(sys.argv[1])
          expected_runtime_sha, selected_sdk = sys.argv[2:]
          diag = (out / "BUILD_DIAGNOSTIC.txt").read_text(encoding="utf-8", errors="replace")
          lines = diag.splitlines()
          h = lambda b: hashlib.sha256(b).hexdigest()

          runtime = (out / "reference/S139CompatibilityFixes.dll").read_bytes()
          rebuilt = (out / "rebuilt/S139CompatibilityFixes.dll").read_bytes()
          if h(runtime) != expected_runtime_sha:
              raise SystemExit("runtime reference hash changed")

          start = next(i for i, line in enumerate(lines) if 'Task "Csc"' in line)
          end = next(i for i in range(start + 1, len(lines)) if 'Done executing task "Csc"' in lines[i])
          csc = lines[start:end + 1]
          refs = []
          in_refs = False
          for line in csc:
              stripped = line.strip()
              if stripped == "References=":
                  in_refs = True
                  continue
              if in_refs and stripped.startswith("Task Parameter:"):
                  break
              if in_refs and stripped.startswith("/") and stripped.endswith(".dll"):
                  refs.append(stripped)
          refs = list(dict.fromkeys(refs))
          if not refs:
              raise SystemExit("no Csc reference paths captured")

          def classify(path):
              p = path.replace('\\', '/')
              nuget = '/.nuget/packages/'
              packs = '/dotnet/packs/'
              if nuget in p:
                  tail = p.split(nuget, 1)[1]
                  parts = tail.split('/')
                  return {"kind": "nuget", "package_id": parts[0], "package_version": parts[1] if len(parts) > 1 else None}
              if packs in p:
                  tail = p.split(packs, 1)[1]
                  parts = tail.split('/')
                  return {"kind": "dotnet_pack", "pack_id": parts[0], "pack_version": parts[1] if len(parts) > 1 else None}
              return {"kind": "other"}

          reference_inventory = []
          for raw in refs:
              p = pathlib.Path(raw)
              if not p.is_file():
                  raise SystemExit(f"Csc reference missing: {raw}")
              item = {"path": raw, "size": p.stat().st_size, "sha256": h(p.read_bytes())}
              item.update(classify(raw))
              reference_inventory.append(item)

          sdk_root = pathlib.Path('/usr/share/dotnet/sdk') / selected_sdk
          compiler_rel = [
              'Roslyn/bincore/csc.dll',
              'Roslyn/bincore/Microsoft.CodeAnalysis.dll',
              'Roslyn/bincore/Microsoft.CodeAnalysis.CSharp.dll',
              'Roslyn/bincore/VBCSCompiler.dll',
              'Roslyn/bincore/csc.runtimeconfig.json',
              'MSBuild.dll',
              'Microsoft.Build.dll',
              'Microsoft.Build.Framework.dll',
              'Microsoft.Build.Tasks.Core.dll',
              'Microsoft.Build.Utilities.Core.dll',
          ]
          compiler_inventory = []
          for rel in compiler_rel:
              p = sdk_root / rel
              if not p.is_file():
                  raise SystemExit(f"compiler/SDK file missing: {p}")
              compiler_inventory.append({"path": str(p), "size": p.stat().st_size, "sha256": h(p.read_bytes())})

          assets = json.loads((out / 'generated/project.assets.json').read_text(encoding='utf-8'))
          packages = []
          package_root = pathlib.Path('/home/runner/.nuget/packages')
          for key, value in sorted(assets.get('libraries', {}).items()):
              if value.get('type') != 'package':
                  continue
              package_id, version = key.rsplit('/', 1)
              pdir = package_root / package_id.lower() / version.lower()
              sha_file = pdir / f"{package_id.lower()}.{version.lower()}.nupkg.sha512"
              sha_text = sha_file.read_text(encoding='utf-8').strip() if sha_file.is_file() else None
              packages.append({
                  "id": package_id,
                  "version": version,
                  "assets_sha512": value.get('sha512'),
                  "cache_sha512": sha_text,
                  "sha512_match": sha_text == value.get('sha512') if sha_text is not None else None,
                  "package_path": value.get('path'),
              })

          def aggregate(items):
              blob = ''.join(f"{x['path']}\0{x['size']}\0{x['sha256']}\n" for x in sorted(items, key=lambda x: x['path'])).encode()
              return h(blob)

          host_version = None
          info = (out / 'DOTNET_INFO.txt').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'^ Host:\s*\n\s*Version:\s*([^\s]+)', info, re.M)
          if m:
              host_version = m.group(1)

          verification = {
              "schema_version": 8,
              "status": "COMPILER_REFERENCE_PROVENANCE_CAPTURED_BYTE_DIFF_REMAINS" if runtime != rebuilt else "PASS_BYTE_IDENTICAL",
              "historical_prebuild_commit": "af415c8d6fdb69b0b7c88102e714764f3dc24b57",
              "selected_sdk": selected_sdk,
              "dotnet_host_version": host_version,
              "reference_count": len(reference_inventory),
              "reference_aggregate_sha256": aggregate(reference_inventory),
              "compiler_file_count": len(compiler_inventory),
              "compiler_aggregate_sha256": aggregate(compiler_inventory),
              "package_count": len(packages),
              "all_package_sha512_cache_matches_assets": all(x['sha512_match'] is True for x in packages),
              "runtime_sha256": h(runtime),
              "rebuilt_sha256": h(rebuilt),
              "byte_identical": runtime == rebuilt,
          }
          (out / 'CSC_REFERENCE_INVENTORY.json').write_text(json.dumps(reference_inventory, indent=2) + '\n')
          (out / 'COMPILER_SDK_FILE_INVENTORY.json').write_text(json.dumps(compiler_inventory, indent=2) + '\n')
          (out / 'NUGET_PACKAGE_PROVENANCE.json').write_text(json.dumps(packages, indent=2) + '\n')
          (out / 'VERIFICATION.json').write_text(json.dumps(verification, indent=2) + '\n')
          (out / 'SUMMARY.md').write_text(
              '# S139 Compiler Reference Provenance Inventory\n\n'
              f"- Status: `{verification['status']}`\n"
              f"- Selected SDK: `{selected_sdk}`\n"
              f"- .NET host runtime: `{host_version}`\n"
              f"- Actual Csc references: `{len(reference_inventory)}`\n"
              f"- Reference aggregate SHA-256: `{verification['reference_aggregate_sha256']}`\n"
              f"- Compiler/SDK files hashed: `{len(compiler_inventory)}`\n"
              f"- Compiler aggregate SHA-256: `{verification['compiler_aggregate_sha256']}`\n"
              f"- NuGet packages: `{len(packages)}`\n"
              f"- All package cache SHA512 values match project.assets.json: `{verification['all_package_sha512_cache_matches_assets']}`\n"
              f"- Runtime DLL SHA-256: `{verification['runtime_sha256']}`\n"
              f"- Rebuild DLL SHA-256: `{verification['rebuilt_sha256']}`\n\n"
              'Analysis evidence only; source-to-DLL byte provenance remains open while the rebuilt DLL differs.\n',
              encoding='utf-8'
          )
          print(json.dumps(verification, indent=2))
          if runtime != rebuilt:
              raise SystemExit(2)
          PY

      - name: Verify analysis checkout restored cleanly
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload compiler reference provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-s139-compiler-reference-provenance
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/s139-compiler-reference-provenance
