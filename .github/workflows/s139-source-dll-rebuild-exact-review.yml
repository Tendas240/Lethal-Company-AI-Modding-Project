name: S1.42AI S139 Historical .NET Host 10.0.11 Review

on:
  push:
    branches:
      - analysis/s142ai-s139-source-dll-rebuild-exact
    paths:
      - ".github/workflows/s139-source-dll-rebuild-exact-review.yml"

permissions:
  contents: read

concurrency:
  group: s142ai-s139-source-dll-rebuild-exact
  cancel-in-progress: false

jobs:
  historical-dotnet-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate historical setup-dotnet request
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Force historical .NET 10.0.11 host selection
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s139-historical-dotnet-host"
          mkdir -p "$OUT"
          INSTALLER="$(dirname "$RUNNER_WORKSPACE")/_actions/actions/setup-dotnet/v4/externals/install-dotnet.sh"
          test -x "$INSTALLER"

          dotnet --info > "$OUT/BEFORE_DOTNET_INFO.txt"
          dotnet --list-runtimes > "$OUT/BEFORE_DOTNET_RUNTIMES.txt"
          dotnet --list-sdks > "$OUT/BEFORE_DOTNET_SDKS.txt"

          # The historical runner already had Microsoft.NETCore.App/hostfxr 10.0.11.
          # Install that exact patch into the same shared root used historically.
          "$INSTALLER" --skip-non-versioned-files --runtime dotnet --version 10.0.11

          # Current setup-dotnet installs 10.0.12. Hide only that newer patch on this
          # ephemeral runner so SDK 10.0.400 resolves through the historical 10.0.11
          # host/runtime while all SDK/pack absolute paths remain /usr/share/dotnet.
          mkdir -p "$RUNNER_TEMP/dotnet-hidden-10.0.12"
          if [ -d /usr/share/dotnet/host/fxr/10.0.12 ]; then
            sudo mv /usr/share/dotnet/host/fxr/10.0.12 "$RUNNER_TEMP/dotnet-hidden-10.0.12/hostfxr-10.0.12"
          fi
          if [ -d /usr/share/dotnet/shared/Microsoft.NETCore.App/10.0.12 ]; then
            sudo mv /usr/share/dotnet/shared/Microsoft.NETCore.App/10.0.12 "$RUNNER_TEMP/dotnet-hidden-10.0.12/Microsoft.NETCore.App-10.0.12"
          fi

          dotnet --info > "$OUT/AFTER_DOTNET_INFO.txt"
          dotnet --list-runtimes > "$OUT/AFTER_DOTNET_RUNTIMES.txt"
          dotnet --list-sdks > "$OUT/AFTER_DOTNET_SDKS.txt"
          test "$(dotnet --version)" = "10.0.400"
          python - "$OUT/AFTER_DOTNET_INFO.txt" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          m = re.search(r'Host:\s*\n\s*Version:\s*([^\s]+)', text)
          if not m:
              raise SystemExit('Could not parse dotnet Host Version')
          print('Selected Host Version:', m.group(1))
          if m.group(1) != '10.0.11':
              raise SystemExit(f'Expected Host 10.0.11, got {m.group(1)}')
          PY

      - name: Rebuild historical S139 under Host 10.0.11 and compare identities
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s139-historical-dotnet-host"
          PRE="af415c8d6fdb69b0b7c88102e714764f3dc24b57"
          HISTORICAL_BRANCH="build/s142ah-mouthdog-dual-prevention"
          EXPECTED_SDK="10.0.400"
          EXPECTED_RUNTIME_SHA="bf86f338dba1428327088f0aaa2af8d9816f647c3b3c12214a5fc52db8e34573"
          CURRENT_REBUILD_SHA="912e097ae61d3af394f0132115327478b714ee83a4b5b73bbacba7c86dff8de7"
          PROFILE="Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z"
          MEMBER="BepInEx/plugins/Tendas-S139CompatibilityFixes/S139CompatibilityFixes.dll"
          PROJECT="Patches/S139CompatibilityFixes/S139CompatibilityFixes.csproj"
          PROJECT_DIR="Patches/S139CompatibilityFixes"
          OBJ="$PROJECT_DIR/obj/Release/netstandard2.1"
          REBUILT="$PROJECT_DIR/bin/Release/netstandard2.1/S139CompatibilityFixes.dll"
          ANALYSIS_HEAD="$(git rev-parse HEAD)"
          mkdir -p "$OUT/reference" "$OUT/rebuilt" "$OUT/generated"

          restore_checkout() {
            rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
            git checkout --detach "$ANALYSIS_HEAD" >/dev/null 2>&1 || true
            git update-ref -d "refs/remotes/origin/$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
            git branch -D "$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
          }
          trap restore_checkout EXIT

          test "$PWD" = "$GITHUB_WORKSPACE"
          test ! -e global.json

          python - "$PROFILE" "$MEMBER" "$OUT/reference/S139CompatibilityFixes.dll" "$EXPECTED_RUNTIME_SHA" <<'PY'
          import hashlib, sys, zipfile
          profile, member, target, expected = sys.argv[1:]
          with zipfile.ZipFile(profile) as z:
              data = z.read(member)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"runtime DLL SHA mismatch: {actual}")
          open(target, "wb").write(data)
          PY

          git update-ref "refs/remotes/origin/$HISTORICAL_BRANCH" "$PRE"
          git checkout --force -B "$HISTORICAL_BRANCH" "refs/remotes/origin/$HISTORICAL_BRANCH"
          git branch --set-upstream-to="origin/$HISTORICAL_BRANCH" "$HISTORICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$PRE"
          test "$(git symbolic-ref --short HEAD)" = "$HISTORICAL_BRANCH"
          test ! -e global.json
          test "$(dotnet --version)" = "$EXPECTED_SDK"

          dotnet --info > "$OUT/BUILD_DOTNET_INFO.txt"
          python - "$OUT/BUILD_DOTNET_INFO.txt" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          m = re.search(r'Host:\s*\n\s*Version:\s*([^\s]+)', text)
          if not m or m.group(1) != '10.0.11':
              raise SystemExit(f"Build did not retain Host 10.0.11: {m.group(1) if m else 'unparsed'}")
          PY

          rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
          dotnet build "$PROJECT" -c Release -v:diag > "$OUT/BUILD_DIAGNOSTIC.txt" 2> "$OUT/BUILD_STDERR.txt"
          test -f "$REBUILT"
          cp "$REBUILT" "$OUT/rebuilt/S139CompatibilityFixes.dll"

          for f in \
            "$OBJ/S139CompatibilityFixes.sourcelink.json" \
            "$OBJ/S139CompatibilityFixes.GeneratedMSBuildEditorConfig.editorconfig" \
            "$OBJ/S139CompatibilityFixes.AssemblyInfo.cs" \
            "$OBJ/.NETStandard,Version=v2.1.AssemblyAttributes.cs" \
            "$PROJECT_DIR/obj/project.assets.json"
          do
            test -f "$f"
            cp "$f" "$OUT/generated/$(basename "$f")"
          done

          grep -Ei 'Task "Csc"|csc\.dll|sourcelink:|debug:|deterministic|pathmap|References=' \
            "$OUT/BUILD_DIAGNOSTIC.txt" > "$OUT/COMPILER_INPUT_LINES.txt" || true

          # Decompile after the build; the tool restore cannot affect the tested build.
          TOOL_DIR="$RUNNER_TEMP/s139-ilspy"
          rm -rf "$TOOL_DIR"
          dotnet tool install ilspycmd --tool-path "$TOOL_DIR" --version 11.0.0.9375 >/dev/null
          "$TOOL_DIR/ilspycmd" --ilcode "$OUT/reference/S139CompatibilityFixes.dll" > "$OUT/reference/FULL_IL.txt"
          "$TOOL_DIR/ilspycmd" --ilcode "$OUT/rebuilt/S139CompatibilityFixes.dll" > "$OUT/rebuilt/FULL_IL.txt"

          python - "$OUT" "$EXPECTED_RUNTIME_SHA" "$CURRENT_REBUILD_SHA" <<'PY'
          import hashlib, json, pathlib, struct, sys, uuid

          out = pathlib.Path(sys.argv[1])
          expected_runtime_sha, prior_rebuild_sha = sys.argv[2:]
          runtime = (out / 'reference/S139CompatibilityFixes.dll').read_bytes()
          rebuilt = (out / 'rebuilt/S139CompatibilityFixes.dll').read_bytes()
          runtime_il = (out / 'reference/FULL_IL.txt').read_bytes()
          rebuilt_il = (out / 'rebuilt/FULL_IL.txt').read_bytes()
          h = lambda b: hashlib.sha256(b).hexdigest()

          if h(runtime) != expected_runtime_sha:
              raise SystemExit('runtime reference hash changed')

          def pe_identity(data):
              u16 = lambda o: struct.unpack_from('<H', data, o)[0]
              u32 = lambda o: struct.unpack_from('<I', data, o)[0]
              pe = u32(0x3c)
              if data[pe:pe+4] != b'PE\0\0':
                  raise ValueError('not PE')
              sections_n = u16(pe + 6)
              coff_timestamp = u32(pe + 8)
              opt = pe + 24
              opt_size = u16(pe + 20)
              magic = u16(opt)
              dd = opt + (96 if magic == 0x10b else 112)
              cli_rva = u32(dd + 14 * 8)
              sec = opt + opt_size
              sections = []
              for i in range(sections_n):
                  s = sec + i * 40
                  sections.append((u32(s+12), u32(s+8), u32(s+20), u32(s+16)))
              def rva_off(rva):
                  for va, vsz, raw, rsz in sections:
                      if va <= rva < va + max(vsz, rsz):
                          return raw + (rva - va)
                  raise ValueError(f'RVA not mapped: {rva:#x}')
              cli = rva_off(cli_rva)
              metadata_rva = u32(cli + 8)
              md = rva_off(metadata_rva)
              if data[md:md+4] != b'BSJB':
                  raise ValueError('metadata root missing')
              version_len = u32(md + 12)
              cursor = md + 16 + version_len
              cursor = (cursor + 3) & ~3
              stream_count = u16(cursor + 2)
              cursor += 4
              guid_bytes = None
              streams = {}
              for _ in range(stream_count):
                  rel = u32(cursor); size = u32(cursor + 4); cursor += 8
                  end = data.index(0, cursor)
                  name = data[cursor:end].decode('ascii')
                  cursor = (end + 1 + 3) & ~3
                  streams[name] = {'offset': md + rel, 'size': size}
              if '#GUID' in streams and streams['#GUID']['size'] >= 16:
                  go = streams['#GUID']['offset']
                  guid_bytes = data[go:go+16]
              rsds = data.find(b'RSDS')
              codeview_guid = None; codeview_age = None; pdb_path = None
              if rsds >= 0 and rsds + 24 <= len(data):
                  codeview_guid = str(uuid.UUID(bytes_le=data[rsds+4:rsds+20]))
                  codeview_age = u32(rsds+20)
                  pend = data.find(b'\0', rsds+24)
                  pdb_path = data[rsds+24:pend].decode('utf-8', errors='replace') if pend >= 0 else None
              sha_marker = data.find(b'SHA256\0')
              pdb_checksum = data[sha_marker+7:sha_marker+39].hex() if sha_marker >= 0 and sha_marker + 39 <= len(data) else None
              return {
                  'coff_reproducible_timestamp_hex': f'{coff_timestamp:08x}',
                  'mvid': str(uuid.UUID(bytes_le=guid_bytes)) if guid_bytes else None,
                  'codeview_guid': codeview_guid,
                  'codeview_age': codeview_age,
                  'pdb_path': pdb_path,
                  'pdb_sha256_checksum': pdb_checksum,
                  'metadata_streams': streams,
              }

          def diff_ranges(a, b):
              idx = [i for i in range(min(len(a), len(b))) if a[i] != b[i]]
              if len(a) != len(b):
                  idx.extend(range(min(len(a), len(b)), max(len(a), len(b))))
              if not idx:
                  return []
              ranges=[]; start=prev=idx[0]
              for i in idx[1:]:
                  if i == prev + 1:
                      prev = i
                  else:
                      ranges.append({'start_hex':hex(start),'end_hex':hex(prev),'length':prev-start+1})
                      start=prev=i
              ranges.append({'start_hex':hex(start),'end_hex':hex(prev),'length':prev-start+1})
              return ranges

          rid = pe_identity(runtime)
          bid = pe_identity(rebuilt)
          result = {
              'schema_version': 10,
              'status': 'PASS_HISTORICAL_HOST_BYTE_IDENTICAL' if runtime == rebuilt else (
                  'HISTORICAL_HOST_CHANGED_BINARY_BYTE_DIFF_REMAINS' if h(rebuilt) != prior_rebuild_sha else
                  'HISTORICAL_HOST_NO_BINARY_EFFECT_BYTE_DIFF_REMAINS'
              ),
              'selected_sdk': '10.0.400',
              'selected_host_runtime': '10.0.11',
              'runtime_sha256': h(runtime),
              'rebuilt_sha256': h(rebuilt),
              'prior_host_10_0_12_rebuild_sha256': prior_rebuild_sha,
              'byte_identical': runtime == rebuilt,
              'rebuilt_changed_vs_host_10_0_12': h(rebuilt) != prior_rebuild_sha,
              'runtime_il_sha256': h(runtime_il),
              'rebuilt_il_sha256': h(rebuilt_il),
              'il_identical': runtime_il == rebuilt_il,
              'runtime_identity': rid,
              'rebuilt_identity': bid,
              'differing_byte_count': sum(1 for a,b in zip(runtime,rebuilt) if a != b) + abs(len(runtime)-len(rebuilt)),
              'differing_ranges': diff_ranges(runtime, rebuilt),
          }
          (out / 'PE_DEBUG_IDENTITY.json').write_text(json.dumps({'runtime':rid,'rebuilt':bid}, indent=2) + '\n')
          (out / 'VERIFICATION.json').write_text(json.dumps(result, indent=2) + '\n')
          (out / 'SUMMARY.md').write_text(
              '# S139 Historical .NET Host 10.0.11 Review\n\n' +
              '\n'.join(f'- {k}: `{v}`' for k,v in result.items() if k not in {'runtime_identity','rebuilt_identity','differing_ranges'}) + '\n',
              encoding='utf-8')
          print(json.dumps(result, indent=2))
          if runtime != rebuilt:
              raise SystemExit(2)
          PY

      - name: Verify analysis checkout restored cleanly
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload historical host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-s139-historical-dotnet-host-10-0-11
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/s139-historical-dotnet-host
