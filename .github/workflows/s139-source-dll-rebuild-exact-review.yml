name: S1.42AI S139 Source-DLL Exact Rebuild Review

on:
  push:
    branches:
      - analysis/s142ai-s139-source-dll-rebuild-exact
    paths:
      - "AnalysisTools/inspect_s139_source_dll_rebuild_exact.py"
      - ".github/workflows/s139-source-dll-rebuild-exact-review.yml"

permissions:
  contents: read

concurrency:
  group: s142ai-s139-source-dll-rebuild-exact
  cancel-in-progress: false

jobs:
  exact-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure bounded SDK candidate is installed
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.425"

      - name: Install pinned ILSpy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375
          ./.tools/ilspycmd --version

      - name: Rebuild historical S139 head with bounded SDK candidate and compare runtime DLL
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s139-source-dll-rebuild-exact"
          TMP_ANALYZER="AnalysisTools/.inspect_s139_source_dll_rebuild_sdk_candidate.py"
          rm -rf "$OUT" "$RUNNER_TEMP/s139-historical-prebuild-worktree"
          rm -f "$TMP_ANALYZER"
          trap 'rm -f "$TMP_ANALYZER"' EXIT
          python - <<'PY'
          from pathlib import Path
          src = Path("AnalysisTools/inspect_s139_source_dll_rebuild_exact.py")
          dst = Path("AnalysisTools/.inspect_s139_source_dll_rebuild_sdk_candidate.py")
          text = src.read_text(encoding="utf-8")
          replacements = [
              ('HISTORICAL_SDK = "8.0.424"', 'HISTORICAL_SDK = "8.0.425"'),
              ('- Historical SDK: `{HISTORICAL_SDK}`', '- Rebuild SDK candidate: `{HISTORICAL_SDK}`'),
              ('"observed_dotnet_sdk": HISTORICAL_SDK,', '"rebuild_sdk_candidate": HISTORICAL_SDK,\n            "historical_setup_dotnet_observation": "8.0.424 reported installed; original run did not log dotnet --version",'),
              ('selects the exact SDK observed in the successful historical Actions run', 'selects SDK 8.0.425 as a bounded reproduction candidate because the earlier current-head rebuild produced runtime-identical IL; the historical Actions run did not log dotnet --version'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one analyzer marker: {old!r}")
              text = text.replace(old, new, 1)
          dst.write_text(text, encoding="utf-8")
          PY
          python "$TMP_ANALYZER" \
            --output-dir "$OUT" \
            --ilspy .tools/ilspycmd

      - name: Verify analysis did not mutate tracked repository state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload exact rebuild evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-s139-source-dll-rebuild-exact
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/s139-source-dll-rebuild-exact
