name: S1.42AI S139 Clean-Room NuGet Restore Review

on:
  push:
    branches:
      - analysis/s142ai-s139-source-dll-rebuild-exact
    paths:
      - ".github/workflows/s139-source-dll-rebuild-exact-review.yml"

permissions:
  contents: read

concurrency:
  group: s142ai-s139-source-dll-rebuild-exact
  cancel-in-progress: false

jobs:
  clean-room-nuget-restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recreate historical setup-dotnet resolution
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.424"

      - name: Compare warm-cache and clean-room restores
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/s139-clean-room-nuget"
          PRE="af415c8d6fdb69b0b7c88102e714764f3dc24b57"
          HISTORICAL_BRANCH="build/s142ah-mouthdog-dual-prevention"
          EXPECTED_SDK="10.0.400"
          EXPECTED_RUNTIME_SHA="bf86f338dba1428327088f0aaa2af8d9816f647c3b3c12214a5fc52db8e34573"
          PROFILE="Profiles/LC V1 S1.42AI ShyGuy Interior Only.r2z"
          MEMBER="BepInEx/plugins/Tendas-S139CompatibilityFixes/S139CompatibilityFixes.dll"
          PROJECT="Patches/S139CompatibilityFixes/S139CompatibilityFixes.csproj"
          PROJECT_DIR="Patches/S139CompatibilityFixes"
          REBUILT="$PROJECT_DIR/bin/Release/netstandard2.1/S139CompatibilityFixes.dll"
          PACKAGES="$HOME/.nuget/packages"
          ANALYSIS_HEAD="$(git rev-parse HEAD)"

          rm -rf "$OUT"
          mkdir -p "$OUT/reference" "$OUT/warm" "$OUT/clean"

          restore_checkout() {
            rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
            git checkout --detach "$ANALYSIS_HEAD" >/dev/null 2>&1 || true
            git update-ref -d "refs/remotes/origin/$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
            git branch -D "$HISTORICAL_BRANCH" >/dev/null 2>&1 || true
          }
          trap restore_checkout EXIT

          test "$PWD" = "$GITHUB_WORKSPACE"
          test ! -e global.json

          python - "$PROFILE" "$MEMBER" "$OUT/reference/S139CompatibilityFixes.dll" "$EXPECTED_RUNTIME_SHA" <<'PY'
          import hashlib, sys, zipfile
          profile, member, target, expected = sys.argv[1:]
          with zipfile.ZipFile(profile) as z:
              data = z.read(member)
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f"runtime DLL SHA mismatch: {actual}")
          open(target, "wb").write(data)
          PY

          git update-ref "refs/remotes/origin/$HISTORICAL_BRANCH" "$PRE"
          git checkout --force -B "$HISTORICAL_BRANCH" "refs/remotes/origin/$HISTORICAL_BRANCH"
          git branch --set-upstream-to="origin/$HISTORICAL_BRANCH" "$HISTORICAL_BRANCH"
          test "$(git rev-parse HEAD)" = "$PRE"
          test "$(git symbolic-ref --short HEAD)" = "$HISTORICAL_BRANCH"
          test ! -e global.json
          test "$(dotnet --version)" = "$EXPECTED_SDK"
          dotnet --info > "$OUT/DOTNET_INFO.txt"
          dotnet --list-sdks > "$OUT/HOST_DOTNET_SDKS.txt"

          # Phase A: reproduce the current warm global-packages-cache build.
          rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
          dotnet build "$PROJECT" -c Release -v:diag > "$OUT/warm/BUILD_DIAGNOSTIC.txt" 2> "$OUT/warm/BUILD_STDERR.txt"
          test -f "$REBUILT"
          cp "$REBUILT" "$OUT/warm/S139CompatibilityFixes.dll"
          cp "$PROJECT_DIR/obj/project.assets.json" "$OUT/warm/project.assets.json"

          python - "$OUT/warm" "$PACKAGES" <<'PY'
          import hashlib, json, pathlib, sys
          out, package_root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          h = lambda b: hashlib.sha256(b).hexdigest()
          diag = (out / 'BUILD_DIAGNOSTIC.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          start = next(i for i, line in enumerate(diag) if 'Task "Csc"' in line)
          end = next(i for i in range(start + 1, len(diag)) if 'Done executing task "Csc"' in diag[i])
          refs, active = [], False
          for line in diag[start:end + 1]:
              s = line.strip()
              if s == 'References=':
                  active = True
                  continue
              if active and s.startswith('Task Parameter:'):
                  break
              if active and s.startswith('/') and s.endswith('.dll'):
                  refs.append(s)
          refs = list(dict.fromkeys(refs))
          inventory = []
          for raw in refs:
              p = pathlib.Path(raw)
              if not p.is_file(): raise SystemExit(f'missing reference: {raw}')
              inventory.append({'path': raw, 'size': p.stat().st_size, 'sha256': h(p.read_bytes())})
          assets = json.loads((out / 'project.assets.json').read_text())
          packages = []
          for key, value in sorted(assets.get('libraries', {}).items()):
              if value.get('type') != 'package': continue
              package_id, version = key.rsplit('/', 1)
              pdir = package_root / package_id.lower() / version.lower()
              sha_file = pdir / f'{package_id.lower()}.{version.lower()}.nupkg.sha512'
              meta_file = pdir / '.nupkg.metadata'
              cache_sha = sha_file.read_text().strip() if sha_file.is_file() else None
              meta = json.loads(meta_file.read_text()) if meta_file.is_file() else {}
              packages.append({
                  'id': package_id, 'version': version,
                  'assets_sha512': value.get('sha512'), 'cache_sha512': cache_sha,
                  'sha512_match': cache_sha == value.get('sha512') if cache_sha is not None else None,
                  'metadata_contentHash': meta.get('contentHash'), 'metadata_source': meta.get('source'),
              })
          (out / 'CSC_REFERENCE_INVENTORY.json').write_text(json.dumps(inventory, indent=2) + '\n')
          (out / 'NUGET_PACKAGE_PROVENANCE.json').write_text(json.dumps(packages, indent=2) + '\n')
          PY

          # Phase B: erase the global package cache and restore from the repository's exact NuGet.Config.
          rm -rf "$PROJECT_DIR/bin" "$PROJECT_DIR/obj"
          rm -rf "$PACKAGES"
          mkdir -p "$PACKAGES"
          dotnet restore "$PROJECT" --force --no-cache -v:diag > "$OUT/clean/RESTORE_DIAGNOSTIC.txt" 2> "$OUT/clean/RESTORE_STDERR.txt"
          cp "$PROJECT_DIR/obj/project.assets.json" "$OUT/clean/project.assets.json"
          dotnet build "$PROJECT" -c Release --no-restore -v:diag > "$OUT/clean/BUILD_DIAGNOSTIC.txt" 2> "$OUT/clean/BUILD_STDERR.txt"
          test -f "$REBUILT"
          cp "$REBUILT" "$OUT/clean/S139CompatibilityFixes.dll"

          python - "$OUT/clean" "$PACKAGES" <<'PY'
          import hashlib, json, pathlib, sys
          out, package_root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          h = lambda b: hashlib.sha256(b).hexdigest()
          diag = (out / 'BUILD_DIAGNOSTIC.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          start = next(i for i, line in enumerate(diag) if 'Task "Csc"' in line)
          end = next(i for i in range(start + 1, len(diag)) if 'Done executing task "Csc"' in diag[i])
          refs, active = [], False
          for line in diag[start:end + 1]:
              s = line.strip()
              if s == 'References=':
                  active = True
                  continue
              if active and s.startswith('Task Parameter:'):
                  break
              if active and s.startswith('/') and s.endswith('.dll'):
                  refs.append(s)
          refs = list(dict.fromkeys(refs))
          inventory = []
          for raw in refs:
              p = pathlib.Path(raw)
              if not p.is_file(): raise SystemExit(f'missing reference: {raw}')
              inventory.append({'path': raw, 'size': p.stat().st_size, 'sha256': h(p.read_bytes())})
          assets = json.loads((out / 'project.assets.json').read_text())
          packages = []
          for key, value in sorted(assets.get('libraries', {}).items()):
              if value.get('type') != 'package': continue
              package_id, version = key.rsplit('/', 1)
              pdir = package_root / package_id.lower() / version.lower()
              sha_file = pdir / f'{package_id.lower()}.{version.lower()}.nupkg.sha512'
              meta_file = pdir / '.nupkg.metadata'
              cache_sha = sha_file.read_text().strip() if sha_file.is_file() else None
              meta = json.loads(meta_file.read_text()) if meta_file.is_file() else {}
              packages.append({
                  'id': package_id, 'version': version,
                  'assets_sha512': value.get('sha512'), 'cache_sha512': cache_sha,
                  'sha512_match': cache_sha == value.get('sha512') if cache_sha is not None else None,
                  'metadata_contentHash': meta.get('contentHash'), 'metadata_source': meta.get('source'),
              })
          (out / 'CSC_REFERENCE_INVENTORY.json').write_text(json.dumps(inventory, indent=2) + '\n')
          (out / 'NUGET_PACKAGE_PROVENANCE.json').write_text(json.dumps(packages, indent=2) + '\n')
          PY

          # Install ILSpy only after both package-cache build phases so it cannot perturb either restore.
          mkdir -p .tools
          dotnet tool install ilspycmd --tool-path .tools --version 11.0.0.9375 >/dev/null
          ./.tools/ilspycmd --ilcode "$OUT/reference/S139CompatibilityFixes.dll" > "$OUT/reference/FULL_IL.txt"
          ./.tools/ilspycmd --ilcode "$OUT/warm/S139CompatibilityFixes.dll" > "$OUT/warm/FULL_IL.txt"
          ./.tools/ilspycmd --ilcode "$OUT/clean/S139CompatibilityFixes.dll" > "$OUT/clean/FULL_IL.txt"

          python - "$OUT" "$EXPECTED_RUNTIME_SHA" <<'PY'
          import hashlib, json, pathlib, sys
          out = pathlib.Path(sys.argv[1]); expected = sys.argv[2]
          h = lambda b: hashlib.sha256(b).hexdigest()
          runtime = (out/'reference/S139CompatibilityFixes.dll').read_bytes()
          warm = (out/'warm/S139CompatibilityFixes.dll').read_bytes()
          clean = (out/'clean/S139CompatibilityFixes.dll').read_bytes()
          if h(runtime) != expected: raise SystemExit('runtime SHA changed')
          warm_refs = json.loads((out/'warm/CSC_REFERENCE_INVENTORY.json').read_text())
          clean_refs = json.loads((out/'clean/CSC_REFERENCE_INVENTORY.json').read_text())
          warm_pkgs = json.loads((out/'warm/NUGET_PACKAGE_PROVENANCE.json').read_text())
          clean_pkgs = json.loads((out/'clean/NUGET_PACKAGE_PROVENANCE.json').read_text())
          wr = {x['path']: x for x in warm_refs}; cr = {x['path']: x for x in clean_refs}
          changed_refs = []
          for path in sorted(set(wr)|set(cr)):
              a,b = wr.get(path),cr.get(path)
              if a is None or b is None or a['sha256'] != b['sha256'] or a['size'] != b['size']:
                  changed_refs.append({'path':path,'warm':a,'clean':b})
          wp = {(x['id'],x['version']):x for x in warm_pkgs}; cp = {(x['id'],x['version']):x for x in clean_pkgs}
          changed_pkgs = []
          for key in sorted(set(wp)|set(cp)):
              a,b=wp.get(key),cp.get(key)
              if a != b: changed_pkgs.append({'id':key[0],'version':key[1],'warm':a,'clean':b})
          runtime_il=(out/'reference/FULL_IL.txt').read_bytes(); warm_il=(out/'warm/FULL_IL.txt').read_bytes(); clean_il=(out/'clean/FULL_IL.txt').read_bytes()
          status = ('PASS_CLEAN_RESTORE_BYTE_IDENTICAL' if clean == runtime else
                    'CLEAN_RESTORE_CHANGED_BUILD_BYTE_DIFF_REMAINS' if clean != warm else
                    'CLEAN_RESTORE_NO_BUILD_EFFECT_BYTE_DIFF_REMAINS')
          result={
            'schema_version':9,'status':status,
            'runtime_sha256':h(runtime),'warm_sha256':h(warm),'clean_sha256':h(clean),
            'warm_equals_clean':warm==clean,'clean_equals_runtime':clean==runtime,
            'runtime_il_sha256':h(runtime_il),'warm_il_sha256':h(warm_il),'clean_il_sha256':h(clean_il),
            'warm_il_equals_runtime':warm_il==runtime_il,'clean_il_equals_runtime':clean_il==runtime_il,
            'warm_reference_count':len(warm_refs),'clean_reference_count':len(clean_refs),
            'changed_reference_count':len(changed_refs),'changed_package_provenance_count':len(changed_pkgs),
            'warm_package_sha512_all_match':all(x['sha512_match'] is True for x in warm_pkgs),
            'clean_package_sha512_all_match':all(x['sha512_match'] is True for x in clean_pkgs),
          }
          (out/'CHANGED_REFERENCES.json').write_text(json.dumps(changed_refs,indent=2)+'\n')
          (out/'CHANGED_PACKAGE_PROVENANCE.json').write_text(json.dumps(changed_pkgs,indent=2)+'\n')
          (out/'VERIFICATION.json').write_text(json.dumps(result,indent=2)+'\n')
          (out/'SUMMARY.md').write_text(
            '# S139 Clean-Room NuGet Restore Review\n\n'+
            '\n'.join(f'- {k}: `{v}`' for k,v in result.items())+'\n')
          print(json.dumps(result,indent=2))
          if clean != runtime: raise SystemExit(2)
          PY

      - name: Verify analysis checkout restored cleanly
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload clean-room NuGet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-s139-clean-room-nuget
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/s139-clean-room-nuget
