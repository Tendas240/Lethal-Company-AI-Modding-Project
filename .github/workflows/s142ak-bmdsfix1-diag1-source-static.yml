name: S1.42AK BMDSFIX1-DIAG1 source and pure static gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKBMDSFix1Diag1/**'
      - 'AnalysisTools/validate_s142ak_bmdsfix1_diag1_source.py'
      - 'BuildSpecs/S1.42AK-BMDSFIX1-DIAG1_PLAN.md'
      - '.github/workflows/s142ak-bmdsfix1-diag1-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test pure Deep Sewers fail-closed selection policy
        run: dotnet run --project Patches/S142AKBMDSFix1Diag1/Tests/Policy.Tests.csproj -c Release
      - name: Compile diagnostic plugin source only
        working-directory: Patches/S142AKBMDSFix1Diag1
        run: dotnet build S142AKBMDSFix1Diag1.csproj -c Release
      - name: Verify source-only one-patch fail-closed contract and controller preservation
        run: python AnalysisTools/validate_s142ak_bmdsfix1_diag1_source.py
