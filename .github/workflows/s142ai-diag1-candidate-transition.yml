name: Finalize S1.42AI-DIAG1 runtime candidate transition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/s142ai-diag1-candidate-transition.yml'

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply atomic DIAG1 lifecycle transition
        run: python RepositoryTools/tmp_s142ai_diag1_candidate_transition.py

      - name: Render generated current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Remove temporary transition infrastructure
        run: git rm .github/workflows/s142ai-diag1-candidate-transition.yml RepositoryTools/tmp_s142ai_diag1_candidate_transition.py

      - name: Validate atomic transitioned repository
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert s['latest_built_artifact']['build_id']=='S1.42AI-DIAG1'
          assert s['active_candidate']['build_id']=='S1.42AI-DIAG1'
          assert s['controllers']['runtime_active_build']=='S1.42AI-DIAG1'
          assert Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text().strip()=='S1.42AI-DIAG1'
          PY

      - name: Commit atomic DIAG1 runtime candidate transition
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Activate S1.42AI-DIAG1 runtime diagnostic candidate'
          git push origin HEAD:main
