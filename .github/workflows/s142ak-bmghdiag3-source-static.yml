      - 'Patches/S142AKBMGHDiag3/**'
      - 'AnalysisTools/validate_s142ak_bmghdiag3_source.py'
      - 'BuildSpecs/S1.42AK-BMGHDIAG3_PLAN.md'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3F18_BMGHDIAG3/IMPLEMENTATION_FINDINGS.md'
      - '.github/workflows/s142ak-bmghdiag3-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded BMGHDIAG3 source/static design contract
        run: python AnalysisTools/validate_s142ak_bmghdiag3_source.py
