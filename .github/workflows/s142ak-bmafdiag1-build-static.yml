name: S1.42AK BMAFDIAG1 inactive review-build archive-config-delta gate

on:
  pull_request:
    paths:
      - 'Patches/S142AKBMAFDiag1/**'
      - 'AnalysisTools/S142AKBMAFDiag1PolicyTests/**'
      - 'BuildSpecs/S1.42AK-BMAFDIAG1.json'
      - 'BuildSpecs/S1.42AK-BMAFDIAG1_REVIEW_BUILD_PLAN.md'
      - 'AnalysisTools/verify_s142ak_lll_1712_provenance.py'
      - 'AnalysisTools/validate_s142ak_bmafdiag1_build.py'
      - 'BuildSystem/profile_builder.py'
      - 'Profiles/LC V1 S1.42AK LC Office Camera Enemy Balance.r2z'
      - 'ProfileSources/S1.42AK/**'
      - 'RuntimeEvidence/S1.42A/20260902T224318Z/extracted/config/config/LethalLevelLoader.cfg'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3F19_BMAFDIAG1/REVIEW_BUILD_INFRASTRUCTURE.md'
      - '.github/workflows/s142ak-bmafdiag1-build-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect already-published historical BMAFDIAG1 profile
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          profile='Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z'
          if git ls-files --error-unmatch -- "$profile" >/dev/null 2>&1; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            echo 'BMAFDIAG1 review artifact is already published and frozen; skip historical reconstruction.'
          else
            echo 'published=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.archive.outputs.published != 'true'
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v4
        if: steps.archive.outputs.published != 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Test BMAFDIAG1 provenance, runtime identity, Foundry selection and observation policies
        if: steps.archive.outputs.published != 'true'
        run: dotnet run --project AnalysisTools/S142AKBMAFDiag1PolicyTests/Policy.Tests.csproj -c Release

      - name: Freshly verify exact S1.42AK LLL 1.7.12 provenance
        if: steps.archive.outputs.published != 'true'
        run: python AnalysisTools/verify_s142ak_lll_1712_provenance.py

      - name: Build isolated inactive BMAFDIAG1 review artifact
        if: steps.archive.outputs.published != 'true'
        run: python BuildSystem/profile_builder.py BuildSpecs/S1.42AK-BMAFDIAG1.json

      - name: Verify exact archive/config delta and current inactive lifecycle
        if: steps.archive.outputs.published != 'true'
        run: python AnalysisTools/validate_s142ak_bmafdiag1_build.py

      - name: Upload inactive BMAFDIAG1 review artifact
        if: steps.archive.outputs.published != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-BMAFDIAG1-review-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            Profiles/LC V1 S1.42AK-BMAFDIAG1 Black Mesa Abandoned Foundry Diagnostic.r2z
            ProfileSources/S1.42AK-BMAFDIAG1/
            BuildSpecs/S1.42AK-BMAFDIAG1_BUILD_EVIDENCE/
            c3f17-4-s142ak-lll-provenance-output/
