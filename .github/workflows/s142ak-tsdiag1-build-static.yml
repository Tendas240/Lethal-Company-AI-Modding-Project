name: S1.42AK TSDIAG1 inactive compile and archive review

on:
  pull_request:
    paths:
      - 'Patches/S142AKTSDiag1/**'
      - 'BuildSpecs/S1.42AK-TSDIAG1.json'
      - 'BuildSpecs/S1.42AK-TSDIAG1_PLAN.md'
      - 'BuildSpecs/S1.42AK-TSDIAG1_BUILD_EVIDENCE/**'
      - 'BuildSystem/tsdiag1_review_build.py'
      - 'AnalysisTools/validate_s142ak_tsdiag1_build.py'
      - 'AnalysisTools/validate_s142ak_tsdiag1_source.py'
      - '.github/workflows/s142ak-tsdiag1-build-static.yml'

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Refuse repeat review build after independently frozen TSDIAG1 bytes
        id: frozen
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          path = pathlib.Path('BuildSpecs/S1.42AK-TSDIAG1_BUILD_EVIDENCE/REVIEW_BUILD_CHECKPOINT.json')
          frozen = path.exists()
          if frozen:
              state = json.loads(path.read_text(encoding='utf-8'))
              assert state['status'] == 'PASS_INACTIVE_REVIEW_BUILD_INDEPENDENTLY_REHASHED'
              assert state['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
              assert state['independent_artifact_rehash_match'] is True
              assert isinstance(state['artifact_id'], int) and state['artifact_id'] > 0
              head = state['build_head']
              assert re.fullmatch(r'[0-9a-f]{40}', head)
              for key in ('zip_sha256', 'profile_sha256', 'dll_sha256'):
                  assert re.fullmatch(r'[0-9a-f]{64}', state[key]), key
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', head], check=True)
              protected = [
                  'Patches/S142AKTSDiag1',
                  'BuildSpecs/S1.42AK-TSDIAG1.json',
                  'BuildSpecs/S1.42AK-TSDIAG1_PLAN.md',
                  'BuildSystem/tsdiag1_review_build.py',
                  'AnalysisTools/validate_s142ak_tsdiag1_build.py',
                  'AnalysisTools/validate_s142ak_tsdiag1_source.py',
                  '.github/workflows/s142ak-tsdiag1-build-static.yml',
                  '.github/workflows/s142ak-tsdiag1-source-static.yml',
                  'SourceEvidence/UniversalInteriorViability/TSDIAG1SourceStatic/FINDINGS.md',
                  'RepositoryTools/gale_profile_path_length_guard.py',
              ]
              subprocess.run(['git', 'diff', '--exit-code', head, 'HEAD', '--', *protected], check=True)
              current = json.loads(pathlib.Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
              phase = current['selected_scope']['phase_c']
              assert phase['toy_store_tsdiag1_source_static_validated'] is True
              assert phase['toy_store_tsdiag1_review_build_authorized'] is True
              assert current['accepted_baseline']['build_id'] == 'S1.42AK'
              assert current['active_candidate']['build_id'] == 'S1.42AK-BMDSFIX1'
              assert current['controllers']['runtime_active_build'] == 'S1.42AK-BMDSFIX1'
              assert pathlib.Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'
              build = json.loads(pathlib.Path('BuildSpecs/current.json').read_text(encoding='utf-8'))
              assert build['enabled'] is False and build['build_id'] == 'IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
              assert phase['toy_store_runtime_test_authorized'] is False
              assert phase['toy_store_tsdiag1_runtime_armed'] is False
              print('Frozen TSDIAG1 review artifact pin verified; no recompilation or re-upload')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('exists=' + str(frozen).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.frozen.outputs.exists != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: steps.frozen.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned PE metadata parser
        if: steps.frozen.outputs.exists != 'true'
        run: 'python -m pip install --only-binary=:all: dnfile==0.15.1'
      - name: Re-run pure Toy Store fail-closed selection policy
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet run --project Patches/S142AKTSDiag1/Tests/Policy.Tests.csproj -c Release
      - name: Re-verify accepted TSDIAG1 source/static contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_tsdiag1_source.py
      - name: Compile exact integrated source
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet build Patches/S142AKTSDiag1/S142AKTSDiag1.csproj -c Release
      - name: Construct isolated review archive
        if: steps.frozen.outputs.exists != 'true'
        run: python BuildSystem/tsdiag1_review_build.py
      - name: Independently verify assembly and archive contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_tsdiag1_build.py --self-test
      - name: Verify short profile path budget
        if: steps.frozen.outputs.exists != 'true'
        run: python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-TSDIAG1.json --self-test
      - name: Freeze successful inactive review artifact
        if: steps.frozen.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-TSDIAG1-review-${{ github.event.pull_request.head.sha }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure evidence without publishing a profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-TSDIAG1-failure-${{ github.event.pull_request.head.sha }}
          path: review-output/Evidence/
          if-no-files-found: ignore
          retention-days: 90
