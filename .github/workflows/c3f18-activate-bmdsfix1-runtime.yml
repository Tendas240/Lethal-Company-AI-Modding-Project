name: C3F18 activate BMDSFIX1 runtime candidate

on:
  push:
    branches:
      - c3f18-bmdsfix1-runtime-activation
    paths:
      - 'RepositoryTools/c3f18_activate_bmdsfix1_runtime.py'
      - '.github/workflows/c3f18-activate-bmdsfix1-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f18-bmdsfix1-runtime-activation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact BMDSFIX1 runtime activation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          profile=Path('Profiles/LC V1 S1.42AK-BMDSFIX1 Black Mesa Deep Sewers Size Fix.r2z')
          member='BepInEx/plugins/S142AKBMDSFix1/S142AKBMDSFix1.dll'
          target=Path('ProfileSources/S1.42AK-BMDSFIX1')/member
          target.parent.mkdir(parents=True, exist_ok=True)
          with ZipFile(profile) as z:
              target.write_bytes(z.read(member))
          PY
          python RepositoryTools/c3f18_activate_bmdsfix1_runtime.py
          rm -f ProfileSources/S1.42AK-BMDSFIX1/BepInEx/plugins/S142AKBMDSFix1/S142AKBMDSFix1.dll

      - name: Regenerate protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Verify generated current navigation
        run: python RepositoryTools/render_current_navigation.py --check

      - name: Validate current live-state semantics
        run: python RepositoryTools/current_state_semantic_validator.py

      - name: Validate repository knowledge architecture
        run: python RepositoryTools/knowledge_architecture_validator.py

      - name: Validate exact artifact bytes and pending candidate evidence
        run: python RepositoryTools/artifact_byte_integrity_validator.py

      - name: Validate repository integrity and Gale helper contract
        run: |
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Validate BMDSFIX1 source/static contract
        run: python AnalysisTools/validate_s142ak_bmdsfix1_source.py

      - name: Verify exact runtime-candidate activation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('.')
          state=json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          candidate=state['active_candidate']
          assert state['accepted_baseline']['build_id']=='S1.42AK'
          assert state['latest_built_artifact']['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['status']=='ACTIVE_RUNTIME_CANDIDATE_NOT_ACCEPTED'
          assert state['runtime_test_outstanding'] is True
          assert state['controllers']['runtime_active_build']=='S1.42AK-BMDSFIX1'
          assert (root/'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()=='S1.42AK-BMDSFIX1'
          current=json.loads((root/'BuildSpecs/current.json').read_text(encoding='utf-8'))
          assert current['enabled'] is False
          assert current['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert current['base_profile']==candidate['profile']
          assert current['base_sha256']==candidate['sha256']
          auto=json.loads((root/'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert auto['build_id']=='S1.42AK-BMDSFIX1'
          assert auto['output_profile']==candidate['profile']
          assert auto['output_sha256']==candidate['sha256']
          assert auto['base_sha256']==state['accepted_baseline']['sha256']
          lineage=json.loads((root/'Current/BUILD_LINEAGE.json').read_text(encoding='utf-8'))
          assert lineage['current_accepted_build_id']=='S1.42AK'
          assert lineage['active_candidate_build_id']=='S1.42AK-BMDSFIX1'
          assert lineage['latest_built_artifact_id']=='S1.42AK-BMDSFIX1'
          entry=next(x for x in lineage['builds'] if x.get('id')=='S1.42AK-BMDSFIX1')
          assert entry['parent']=='S1.42AK' and entry['safe_as_gameplay_base'] is False
          profile=root/candidate['profile']
          assert hashlib.sha256(profile.read_bytes()).hexdigest()=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          with ZipFile(profile) as z:
              dll_bytes=z.read('BepInEx/plugins/S142AKBMDSFix1/S142AKBMDSFix1.dll')
          assert hashlib.sha256(dll_bytes).hexdigest()=='f337da49f4a0e75bf2753e17e3abc52cdbea56ba37eddec5f1065b17f4d75a92'
          hashes=json.loads((root/'Profiles/EXPECTED_HASHES.json').read_text(encoding='utf-8'))
          assert hashes[candidate['profile']]['sha256']==candidate['sha256']
          activation=(root/'Current/174_S1.42AK_BMDSFIX1_RUNTIME_ACTIVATION.md').read_text(encoding='utf-8')
          assert 'ReplaceActiveGaleProfileV24.ps1' in activation
          assert 'RuntimeInbox/Current/LogOutput.log' in activation
          assert '[BMDSFIX1]' in activation
          assert 'ACTIVE GAMEPLAY RUNTIME CANDIDATE / TEST OUTSTANDING / NOT ACCEPTED' in activation
          print('PASS: exact BMDSFIX1 gameplay candidate armed; S1.42AK acceptance preserved')
          PY
          git diff --check

      - name: Commit atomic activation and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm RepositoryTools/c3f18_activate_bmdsfix1_runtime.py
          rm .github/workflows/c3f18-activate-bmdsfix1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Arm exact BMDSFIX1 runtime candidate'
          git push origin HEAD:c3f18-bmdsfix1-runtime-activation
