name: Canonicalize BCMER execution plan checkpoint

on:
  push:
    branches:
      - analysis/s142ai-bcmer-execution-exact
    paths:
      - 'AnalysisTools/canonicalize_bcmer_execution_plan.py'
      - '.github/workflows/bcmer-execution-canonicalize-plan.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded BCMER execution plan checkpoint
        run: |
          python AnalysisTools/canonicalize_bcmer_execution_plan.py
          git diff --check
          test "$(git diff --name-only)" = "BuildSpecs/S1.42AI_PLAN.md"
      - name: Commit plan and remove transient helpers
        run: |
          git config user.name "Tendas240"
          git config user.email "71498430+Tendas240@users.noreply.github.com"
          git add BuildSpecs/S1.42AI_PLAN.md
          git rm AnalysisTools/canonicalize_bcmer_execution_plan.py .github/workflows/bcmer-execution-canonicalize-plan.yml
          git commit -m "Update S1.42AI plan after BCMER execution review"
          git push origin HEAD:analysis/s142ai-bcmer-execution-exact
