name: S1.42AI DIAG1 Exact Callsite Coverage Review

on:
  push:
    branches:
      - analysis/s142ai-diag1-callsite-coverage
    paths:
      - AnalysisTools/s142ai_diag1_callsite_coverage.py
      - .github/workflows/s142ai-diag1-callsite-coverage-review.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  exact-callsite-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact analysis head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert clean analysis lineage from canonical main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='f058f8ff40d05bbcab691321b27b2164971b8b70'
          git fetch origin main --no-tags
          test "$(git merge-base "$EXPECTED_BASE" HEAD)" = "$EXPECTED_BASE"
          test "$(git rev-parse "$EXPECTED_BASE^{commit}")" = "$EXPECTED_BASE"
          echo "analysis_head=$(git rev-parse HEAD)"
          echo "canonical_base=$EXPECTED_BASE"

      - name: Download exact prior source-review artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .analysis-artifacts
          runs=(
            34529045495
            34614454120
            34616289395
            34705834727
            34708556035
            34709775849
            34710724733
            34711742173
            34713018420
            34714066827
            34714900794
            34716488701
          )
          for run in "${runs[@]}"; do
            mkdir -p ".analysis-artifacts/$run"
            echo "Downloading exact source artifact(s) from run $run"
            gh run download "$run" --repo "${GITHUB_REPOSITORY}" --dir ".analysis-artifacts/$run"
            find ".analysis-artifacts/$run" -type f -maxdepth 3 -printf '%P\n' | sort
          done

      - name: Build machine-verifiable callsite matrix
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .analysis-output
          python3 AnalysisTools/s142ai_diag1_callsite_coverage.py \
            --artifacts-root .analysis-artifacts \
            --repo-root . \
            --out-dir .analysis-output
          sha256sum .analysis-output/* | tee .analysis-output/SHA256SUMS.txt

      - name: Verify repository checkout stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload callsite coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-diag1-exact-callsite-coverage
          path: .analysis-output/
          if-no-files-found: error
          retention-days: 30
