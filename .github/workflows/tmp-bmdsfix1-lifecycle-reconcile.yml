name: Temporary BMDSFIX1 lifecycle reconciliation

on:
  push:
    branches: [ reconcile/bmdsfix1-source-integrated ]
    paths:
      - '.github/workflows/tmp-bmdsfix1-lifecycle-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/bmdsfix1-source-integrated
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile BMDSFIX1 source integration lifecycle
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          state_path = root / 'Current/CURRENT_STATE.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))

          next_action = (
              'Prepare a separately versioned inactive S1.42AK-BMDSFIX1 review build directly from exact accepted S1.42AK '
              'under the normal build/review gates. Do not publish, runtime-arm or accept BMDSFIX1 in the review-build step, '
              'and do not change BuildSpecs/current.json or RuntimeInbox/ACTIVE_BUILD.txt yet. Black Mesa x Greenhouse '
              'successor-diagnostic repair remains a separate task.'
          )

          scope = state['selected_scope']
          scope['status'] = 'PHASE_C3F18_BMGHDIAG2_RUNTIME_INCONCLUSIVE_BMDSFIX1_SOURCE_INTEGRATED_REVIEW_BUILD_NEXT'
          scope['finding'] = (
              'S1.42AK-BMGHDIAG2 runtime evidence remains completed failed diagnostic evidence at '
              'RuntimeEvidence/S1.42AK-BMGHDIAG2/20260924T124542Z/ with raw LogOutput.log SHA-256 '
              '5c7931cbf68414c76ea4cc0950d23b592497a2daa2b0f4d8e49986cc13c863d9; Black Mesa x Greenhouse remains '
              'NOT_YET_PROVEN and the exact BMGHDIAG2 bytes must not be rerun as though they could qualify the pair. '
              'The separate Black Mesa x Deep Sewers incident remains evidenced by LLL 4.875 sizing and repeated DunGenPlus '
              'placement failures without a later generation-complete marker in the captured post-selection portion. '
              'The pair-scoped S1.42AK-BMDSFIX1 source/static repair is now integrated into main through PR #146. '
              'Its synchronized exact source head efa1d612594281aa519c1df5e35b06e569c50453 passed Knowledge Architecture '
              'run 36011893656 and BMDSFIX1 source/static run 36011893689; main integration commit is '
              'bbda8c934d7108eac2f5346d1d817fd548c3f687. No BMDSFIX1 profile is built, armed or accepted.'
          )
          scope['analysis_contract'] = (
              'Treat BMGHDIAG2 as completed failed diagnostic evidence, not an active target. Preserve exact accepted '
              'S1.42AK, accepted S1.42AB normalization, Dawn/native Black Mesa ownership, Greenhouse availability, the B3 '
              'matrix, Shatteredrooms exclusions and the separate Black-Mesa/Pikmin routing scope. Do not infer Greenhouse '
              'incompatibility from diagnostic refusal. Keep the Black Mesa x Deep Sewers generation-size incident separate '
              'from Greenhouse qualification. BMDSFIX1 source/static integration is complete; the next gate is a separately '
              'versioned inactive review build directly over exact accepted S1.42AK. Do not runtime-arm or accept BMDSFIX1 '
              'during review-build preparation.'
          )
          scope['next_action'] = next_action
          repair = scope['bmdsfix1_source_repair']
          repair['status'] = 'SOURCE_STATIC_INTEGRATED_NOT_BUILT_NOT_ARMED'
          repair['source_pr'] = 146
          repair['exact_head'] = 'efa1d612594281aa519c1df5e35b06e569c50453'
          repair['knowledge_architecture_run'] = 36011893656
          repair['source_static_run'] = 36011893689
          repair['main_integration_commit'] = 'bbda8c934d7108eac2f5346d1d817fd548c3f687'
          repair['runtime_built'] = False
          repair['runtime_armed'] = False
          repair['accepted'] = False
          state['next_action'] = next_action
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          def replace_once(rel, old, new):
              p = root / rel
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{rel}: expected exactly one replacement target, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              'The same normal-fallback BMGHDIAG2 session separately exposed Black Mesa x Deep Sewers generation pressure: LLL logged `3.25 -> 4.875`, normal selection chose Deep Sewers, and DunGenPlus emitted repeated placement failures without a later generation-complete marker in the captured post-selection evidence. The pair-scoped `S1.42AK-BMDSFIX1` source/static repair is isolated in draft PR #146, head `3e95889588031197dd8051ca27be02754794969d`, with Knowledge Architecture run `36004798426` and BMDSFIX1 source/static run `36004798422` green on that source head. It is **not built, not runtime-armed and not accepted**.',
              'The same normal-fallback BMGHDIAG2 session separately exposed Black Mesa x Deep Sewers generation pressure: LLL logged `3.25 -> 4.875`, normal selection chose Deep Sewers, and DunGenPlus emitted repeated placement failures without a later generation-complete marker in the captured post-selection evidence. The pair-scoped `S1.42AK-BMDSFIX1` source/static repair is now integrated into `main` through PR #146. Its synchronized exact source head `efa1d612594281aa519c1df5e35b06e569c50453` passed Knowledge Architecture run `36011893656` and BMDSFIX1 source/static run `36011893689`; source integration commit is `bbda8c934d7108eac2f5346d1d817fd548c3f687`. It remains **not built, not runtime-armed and not accepted**.'
          )
          replace_once(
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              '`BuildSpecs/current.json` remains disabled and `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AK`; no runtime test is outstanding. The exact next action is to synchronize draft PR #146 against repaired main, revalidate the resulting integration state and merge only the source/static repair if green. A later inactive review build is a separate step. Black Mesa x Greenhouse successor-diagnostic repair remains separate from BMDSFIX1.',
              '`BuildSpecs/current.json` remains disabled and `RuntimeInbox/ACTIVE_BUILD.txt = S1.42AK`; no runtime test is outstanding. BMDSFIX1 source/static integration is complete. The exact next action is to prepare a separately versioned inactive BMDSFIX1 review build directly from exact accepted S1.42AK under the normal build/review gates. Runtime arming remains a later gate, and Black Mesa x Greenhouse successor-diagnostic repair remains separate from BMDSFIX1.'
          )

          lifecycle = root / 'Knowledge/CURRENT_LIFECYCLE.md'
          text = lifecycle.read_text(encoding='utf-8')
          start = text.index('## BMDSFIX1 source/static repair — draft PR open, not built')
          end = text.index('## Live execution state', start)
          block = '''## BMDSFIX1 source/static repair — integrated, not built\n\nThe pair-scoped Deep Sewers mitigation `S1.42AK-BMDSFIX1` is now source/static integrated into `main` through PR **#146**. The synchronized exact source head is `efa1d612594281aa519c1df5e35b06e569c50453`; Knowledge Architecture run `36011893656` and BMDSFIX1 source/static run `36011893689` both succeeded on that head. Main integration commit: `bbda8c934d7108eac2f5346d1d817fd548c3f687`.\n\nBMDSFIX1 remains source/static only. No BMDSFIX1 profile has been built, published, runtime-armed or accepted. The next gate is a separately versioned inactive review build directly over exact accepted S1.42AK; runtime activation is explicitly later.\n\n'''
          text = text[:start] + block + text[end:]
          text = text.replace(
              '- Selected scope: **Universal Interior Viability / Equal Availability — BMGHDIAG2 runtime decided inconclusive; BMDSFIX1 source repair open**.',
              '- Selected scope: **Universal Interior Viability / Equal Availability — BMGHDIAG2 runtime decided inconclusive; BMDSFIX1 source integrated; inactive review build next**.'
          )
          old_next = '''Synchronize draft PR #146 (`S1.42AK-BMDSFIX1` source/static repair) against the repaired `main`, require fresh applicable CI for the resulting integration state, and merge only the source/static repair if green. Do not build, publish, arm or accept a BMDSFIX1 profile in that step.\n\nAfter source integration, prepare a separately versioned inactive review build directly from exact accepted S1.42AK under the normal build/review gates. Black Mesa x Greenhouse diagnostic repair remains a separate successor-diagnostic task.'''
          new_next = '''Prepare a separately versioned inactive `S1.42AK-BMDSFIX1` review build directly from exact accepted S1.42AK under the normal build/review gates. Do not publish, runtime-arm or accept BMDSFIX1 in the review-build step, and do not change `BuildSpecs/current.json` or `RuntimeInbox/ACTIVE_BUILD.txt` yet.\n\nBlack Mesa x Greenhouse diagnostic repair remains a separate successor-diagnostic task.'''
          if text.count(old_next) != 1:
              raise SystemExit('Knowledge/CURRENT_LIFECYCLE.md: exact next-action block drift')
          text = text.replace(old_next, new_next)
          lifecycle.write_text(text, encoding='utf-8')

          replace_once(
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
              '**Universal Interior Viability / Equal Availability — SELECTED / PHASE C3F18 BMGHDIAG2 DECIDED INCONCLUSIVE / BMDSFIX1 SOURCE REPAIR OPEN.**',
              '**Universal Interior Viability / Equal Availability — SELECTED / PHASE C3F18 BMGHDIAG2 DECIDED INCONCLUSIVE / BMDSFIX1 SOURCE INTEGRATED / INACTIVE REVIEW BUILD NEXT.**'
          )
          replace_once(
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
              'A pair-scoped `S1.42AK-BMDSFIX1` source/static repair exists in draft PR #146. Its source head `3e95889588031197dd8051ca27be02754794969d` has green Knowledge Architecture run `36004798426` and BMDSFIX1 source/static run `36004798422`, but the branch must be synchronized against repaired main before source integration. No BMDSFIX1 profile has been built or armed.',
              'The pair-scoped `S1.42AK-BMDSFIX1` source/static repair is integrated into `main` through PR #146. Its synchronized exact source head `efa1d612594281aa519c1df5e35b06e569c50453` has green Knowledge Architecture run `36011893656` and BMDSFIX1 source/static run `36011893689`; source integration commit is `bbda8c934d7108eac2f5346d1d817fd548c3f687`. No BMDSFIX1 profile has been built or armed.'
          )
          replace_once(
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
              'Synchronize draft PR #146 against repaired main, require fresh applicable CI for the resulting integration state, and merge only the BMDSFIX1 source/static repair if green. Do not build, publish, arm or accept a BMDSFIX1 profile in that step.\n\nAfter source integration, a separately versioned inactive review build from exact accepted S1.42AK may be prepared under the normal build/review gates. Runtime testing is a later gate. Black Mesa x Greenhouse successor-diagnostic repair remains separate from BMDSFIX1.',
              'Prepare a separately versioned inactive `S1.42AK-BMDSFIX1` review build directly from exact accepted S1.42AK under the normal build/review gates. Do not publish, runtime-arm or accept BMDSFIX1 in that review-build step. Runtime testing remains a later gate. Black Mesa x Greenhouse successor-diagnostic repair remains separate from BMDSFIX1.'
          )
          PY

          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py

      - name: Commit reconciled lifecycle atomically through Git Data API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          branch = 'reconcile/bmdsfix1-source-integrated'
          files = [
              'Current/CURRENT_STATE.json',
              'Current/00_CURRENT_STATE.md',
              'Current/PROJECT_KNOWLEDGE_MAP.md',
              'Knowledge/CURRENT_LIFECYCLE.md',
              'Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md',
          ]

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'bmdsfix1-lifecycle-reconcile',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode('utf-8'))

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          commit_obj = request('GET', f'/git/commits/{head}')
          base_tree = commit_obj['tree']['sha']
          entries = []
          for rel in files:
              content = Path(rel).read_text(encoding='utf-8')
              blob = request('POST', '/git/blobs', {'content': content, 'encoding': 'utf-8'})
              entries.append({'path': rel, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})

          tree = request('POST', '/git/trees', {'base_tree': base_tree, 'tree': entries})
          commit = request('POST', '/git/commits', {
              'message': 'Reconcile lifecycle after BMDSFIX1 source integration',
              'tree': tree['sha'],
              'parents': [head],
          })
          request('PATCH', f'/git/refs/heads/{branch}', {'sha': commit['sha'], 'force': False})
          print('atomic lifecycle commit:', commit['sha'])
          PY
