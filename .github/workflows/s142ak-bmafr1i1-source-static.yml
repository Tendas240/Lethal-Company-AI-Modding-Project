name: S1.42AK BMAFR1I1 source static contract gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKBMAFR1I1/**'
      - 'AnalysisTools/*s142ak_bmafr1i1*'
      - 'SourceEvidence/BMAFR1Instrumentation/**'
      - 'BuildSpecs/S1.42AK-BMAFR1I1_PLAN.md'
      - '.github/workflows/s142ak-bmafr1i1-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install binary-only source parsers
        run: 'python -m pip install --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1 PyYAML==6.0.2'
      - name: Check generated exact dependency constants
        run: python AnalysisTools/generate_s142ak_bmafr1i1_contract_data.py --check
      - name: Validate observational source and symbolic stack preservation
        run: python AnalysisTools/validate_s142ak_bmafr1i1_source.py --self-test
