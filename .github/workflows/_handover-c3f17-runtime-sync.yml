name: Temporary C3F17 handover runtime sync

on:
  push:
    branches:
      - handover/c3f17-bmghdiag1-inconclusive-sync

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handover/c3f17-bmghdiag1-inconclusive-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and validate canonical runtime sync
        run: |
          python RepositoryTools/_handover_c3f17_live_marker_patch.py
          python RepositoryTools/_handover_c3f17_runtime_sync.py
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
      - name: Remove temporary transformer and workflow
        run: |
          git rm RepositoryTools/_handover_c3f17_live_marker_patch.py RepositoryTools/_handover_c3f17_runtime_sync.py .github/workflows/_handover-c3f17-runtime-sync.yml
      - name: Commit canonical handover repair
        run: |
          if git diff --quiet --cached && git diff --quiet; then
            echo 'No changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Canonicalize BMGHDIAG1 inconclusive runtime evidence'
          git push origin HEAD:handover/c3f17-bmghdiag1-inconclusive-sync
