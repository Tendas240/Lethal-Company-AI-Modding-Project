name: BMAFDIAG1 state semantic fix temp

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/bmafdiag1-state-semantic-fix-temp.yml'
      - 'Current/CURRENT_STATE.json'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Tighten active-candidate identity in analysis contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('Current/CURRENT_STATE.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          c = s['selected_scope']['analysis_contract']
          old = 'Keep BMAFDIAG1 diagnostic-only/never-accept, keep BMDSFIX1 unaccepted'
          new = 'Keep BMAFDIAG1 diagnostic-only/never-accept, keep S1.42AK-BMDSFIX1 unaccepted'
          if old not in c:
              if new in c:
                  raise SystemExit(0)
              raise SystemExit('analysis-contract patch anchor missing')
          s['selected_scope']['analysis_contract'] = c.replace(old, new, 1)
          p.write_text(json.dumps(s, indent=2) + '\n', encoding='utf-8')
          PY
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check
      - name: Commit semantic fix when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No semantic fix required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Current/CURRENT_STATE.json Current/00_CURRENT_STATE.md Current/01_HANDOVER_CORE.md README.md START_HERE_ChatGPT_Masterprompt.txt
          git commit -m 'Tighten BMAFDIAG1 active candidate identity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
