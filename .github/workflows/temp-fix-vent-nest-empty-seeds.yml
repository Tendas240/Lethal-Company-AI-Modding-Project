name: Temporary vent/nest empty-seeds binding repair

on:
  push:
    branches:
      - fix/vent-nest-empty-seeds-binding

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vent-nest-empty-seeds-binding
          fetch-depth: 0
      - name: Apply exact PowerShell empty-collection repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('AnalysisTools/InspectVentNestLifecycleV81.ps1')
          s = p.read_text(encoding='utf-8')
          old = "param([Parameter(Mandatory = $true)]$Model, [Parameter(Mandatory = $true)][object[]]$Seeds, [int]$MaxLines = 1600)"
          new = "param([Parameter(Mandatory = $true)]$Model, [Parameter(Mandatory = $true)][AllowEmptyCollection()][object[]]$Seeds, [int]$MaxLines = 1600)"
          if s.count(old) != 1:
              raise SystemExit(f'expected one Get-IlOneHopContext parameter signature, found {s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = "    if ($nestLifecycle.AwakeCount -ne 0 -or $null -ne $nestLifecycle.AwakeSignature) { throw 'Declared Awake absence was not retained as valid evidence.' }\n"
          insert = anchor + "    $emptyContext = @(Get-IlOneHopContext -Model $nest -Seeds @())\n    if ($emptyContext.Count -ne 0) { throw 'Empty lifecycle seed set must return empty context without parameter-binding failure.' }\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one declared-Awake self-test anchor, found {s.count(anchor)}')
          s = s.replace(anchor, insert, 1)
          old_pass = "    Write-Host 'PASS: IL exact overloads, valid declared-Awake absence, base lifecycle parsing, duplicate-Awake rejection, one-hop context, limits and two-file publication.'"
          new_pass = "    Write-Host 'PASS: IL exact overloads, valid declared-Awake absence, empty-seed binding, base lifecycle parsing, duplicate-Awake rejection, one-hop context, limits and two-file publication.'"
          if s.count(old_pass) != 1:
              raise SystemExit(f'expected one extractor PASS line, found {s.count(old_pass)}')
          s = s.replace(old_pass, new_pass, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          Path('.github/workflows/temp-fix-vent-nest-empty-seeds.yml').unlink()
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow empty lifecycle seed evidence"
          git push origin HEAD:fix/vent-nest-empty-seeds-binding
