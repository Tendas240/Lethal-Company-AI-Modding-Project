name: Temporary S1.42AJ-DIAG1 runtime validator transition

on:
  push:
    branches:
      - runtime/s142aj-diag1-activation
    paths:
      - '.github/workflows/tmp-s142aj-diag1-runtime-validator-transition.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: runtime/s142aj-diag1-activation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch validator for explicit diagnostic runtime targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('RepositoryTools/knowledge_architecture_validator.py')
          text = p.read_text(encoding='utf-8')
          old1 = '''    if active_build and active_build not in lineage_ids:\n        fail(f"ACTIVE_BUILD references unknown build lineage id: {active_build!r}")\n    if controllers.get("runtime_active_build") != active_build:\n        fail("CURRENT_STATE controller runtime_active_build mismatch")\n\n    candidate_id = candidate.get("build_id") if isinstance(candidate, dict) else None\n'''
          new1 = '''    candidate_id = candidate.get("build_id") if isinstance(candidate, dict) else None\n    selected_scope = state.get("selected_scope", {})\n    diagnostic = selected_scope.get("diagnostic_revision", {}) if isinstance(selected_scope, dict) else {}\n    diagnostic_id = diagnostic.get("build_id") if isinstance(diagnostic, dict) else None\n    diagnostic_is_runtime_target = bool(\n        active_build\n        and diagnostic_id == active_build\n        and candidate_id\n        and diagnostic.get("base_build_id") == candidate_id\n        and diagnostic.get("status") == "PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED"\n        and diagnostic.get("profile")\n        and diagnostic.get("sha256")\n        and diagnostic.get("publication_evidence")\n    )\n\n    if active_build and active_build not in lineage_ids and not diagnostic_is_runtime_target:\n        fail(f"ACTIVE_BUILD references unknown build lineage id or explicit diagnostic runtime target: {active_build!r}")\n    if controllers.get("runtime_active_build") != active_build:\n        fail("CURRENT_STATE controller runtime_active_build mismatch")\n    if diagnostic_is_runtime_target:\n        for key in ("profile", "file_index", "build_result", "static_evidence", "publication_evidence"):\n            require_path(str(diagnostic.get(key, "")), f"CURRENT_STATE.selected_scope.diagnostic_revision.{key}")\n\n'''
          old2 = '''        if active_build != candidate_id:\n            fail("ACTIVE_BUILD must identify the active runtime candidate")\n'''
          new2 = '''        if active_build != candidate_id and not diagnostic_is_runtime_target:\n            fail("ACTIVE_BUILD must identify the active runtime candidate or its explicit diagnostic runtime target")\n'''
          if old1 not in text:
              raise SystemExit('first validator patch anchor not found')
          if old2 not in text:
              raise SystemExit('second validator patch anchor not found')
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate transitioned repository
        shell: bash
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/knowledge_architecture_validator.py

      - name: Remove temporary workflow and publish patch
        shell: bash
        run: |
          git rm .github/workflows/tmp-s142aj-diag1-runtime-validator-transition.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add RepositoryTools/knowledge_architecture_validator.py
          git commit -m 'Allow explicit diagnostic runtime evidence targets'
          git push origin HEAD:runtime/s142aj-diag1-activation
