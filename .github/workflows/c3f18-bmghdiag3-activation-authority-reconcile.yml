name: C3F18 reconcile BMGHDIAG3 activation authorities

on:
  push:
    branches:
      - activate/s142ak-bmghdiag3-runtime
    paths:
      - '.github/workflows/c3f18-bmghdiag3-activation-authority-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: activate/s142ak-bmghdiag3-runtime
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconcile stale current activation prose
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle=Path('Knowledge/CURRENT_LIFECYCLE.md')
          text=lifecycle.read_text(encoding='utf-8')
          old="`RuntimeInbox/ACTIVE_BUILD.txt` still points to `S1.42AK-BMDSFIX1`, so the launcher currently resolves the exact regular gameplay profile `Profiles/LC V1 S1.42AK-BMDSFIX1 Black Mesa Deep Sewers Size Fix.r2z` / SHA-256 `3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0` through the normal active-build path. BMGHDIAG3 is indexed but not yet runtime-armed or imported. DIAG1PATH1 is historical supporting evidence only and must not be imported for the BMDSFIX1 qualification run. Re-import remains a recovery/identity-verification action; no dedicated BMDSFIX1 reroll session is currently released."
          new="`RuntimeInbox/ACTIVE_BUILD.txt` now points to exact `S1.42AK-BMGHDIAG3`, so the launcher resolves the active diagnostic through `CURRENT_STATE.selected_scope.diagnostic_revision` and binds its direct base exactly to accepted S1.42AK by build ID/profile/SHA while `AUTO_BUILD_RESULT` remains the separate BMDSFIX1 gameplay candidate. BMGHDIAG3 is runtime-armed but not yet Gale-imported for this released test. DIAG1PATH1 is historical supporting evidence only and must not be imported. The BMDSFIX1 Deep Sewers gate remains passive/outstanding; no dedicated BMDSFIX1 reroll session is released."
          assert text.count(old)==1, 'stale permanent Gale lifecycle paragraph drift'
          lifecycle.write_text(text.replace(old,new,1),encoding='utf-8')

          integrity=Path('Current/ARTIFACT_EVIDENCE_INTEGRITY.json')
          text=integrity.read_text(encoding='utf-8')
          old_note='Exact published/indexed DIAG1PATH1 bytes are runtime-armed only as the short-identity deterministic Black Mesa x DeepSewersFlow selector over the still-unaccepted BMDSFIX1 gameplay candidate. Supporting diagnostic evidence cannot satisfy or waive regular exact-byte BMDSFIX1 qualification.'
          new_note='Exact published/indexed DIAG1PATH1 bytes are retained as completed supporting Black Mesa x DeepSewersFlow diagnostic evidence and are no longer runtime-active. Supporting diagnostic evidence cannot satisfy or waive regular exact-byte BMDSFIX1 qualification.'
          assert text.count(old_note)==1, 'stale DIAG1PATH1 integrity note drift'
          text=text.replace(old_note,new_note,1)
          old_summary='S1.42AK-BMDSFIX1-DIAG1PATH1 exact profile SHA-256 0d4fc0b2031099617a43770b29ab1908a2be18a262df70a3322904f458cff5c6 is the active diagnostic-only runtime/evidence target; it differs from DIAG1 only by export.r2x profile identity and cannot accept or waive BMDSFIX1.'
          new_summary='S1.42AK-BMDSFIX1-DIAG1PATH1 exact profile SHA-256 0d4fc0b2031099617a43770b29ab1908a2be18a262df70a3322904f458cff5c6 is retained as completed supporting diagnostic evidence and is no longer runtime-active; it differs from DIAG1 only by export.r2x profile identity and cannot accept or waive BMDSFIX1.'
          assert text.count(old_summary)==1, 'stale DIAG1PATH1 integrity summary drift'
          integrity.write_text(text.replace(old_summary,new_summary,1),encoding='utf-8')
          PY

      - name: Validate reconciled authorities
        run: |
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          git diff --check

      - name: Verify exact active routing and stale-text removal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          assert state['controllers']['runtime_active_build']=='S1.42AK-BMGHDIAG3'
          assert Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()=='S1.42AK-BMGHDIAG3'
          assert state['active_candidate']['build_id']=='S1.42AK-BMDSFIX1'
          assert state['selected_scope']['diagnostic_revision']['build_id']=='S1.42AK-BMGHDIAG3'
          assert state['selected_scope']['diagnostic_revision']['base_build_id']=='S1.42AK'
          lifecycle=Path('Knowledge/CURRENT_LIFECYCLE.md').read_text(encoding='utf-8')
          assert 'BMGHDIAG3 is indexed but not yet runtime-armed' not in lifecycle
          assert '`RuntimeInbox/ACTIVE_BUILD.txt` still points to `S1.42AK-BMDSFIX1`' not in lifecycle
          integrity=Path('Current/ARTIFACT_EVIDENCE_INTEGRITY.json').read_text(encoding='utf-8')
          assert 'DIAG1PATH1 bytes are runtime-armed only' not in integrity
          assert 'DIAG1PATH1 exact profile SHA-256 0d4fc0b2031099617a43770b29ab1908a2be18a262df70a3322904f458cff5c6 is the active diagnostic-only runtime/evidence target' not in integrity
          PY

      - name: Commit reconciliation and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/c3f18-bmghdiag3-activation-authority-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Reconcile BMGHDIAG3 activation authorities'
          git push origin HEAD:activate/s142ak-bmghdiag3-runtime
