name: Runtime pipeline self-test

on:
  pull_request:
    paths:
      - "BuildSystem/runtime_ingest.py"
      - "BuildSystem/runtime_large_ingest.py"
      - "BuildSystem/runtime_pipeline_selftest.py"
      - ".github/workflows/runtime-pipeline-selftest.yml"
      - "RepositoryTools/artifact_byte_integrity_validator.py"
      - "Current/S1.42AK_OFFENSE_MINESHAFT_ONE_SHOT_INGEST_V1.json"
      - "Current/S1.42AK_OFFENSE_RANDOM_BATCH_V2_INGEST_V1.json"
      - "Current/S1.42AK_OFFENSE_EXPLORATORY_V3_INGEST_V1.json"
      - "Knowledge/BUILD_AND_RUNTIME_PIPELINE.md"
      - "RuntimeInbox/README.md"
  push:
    branches:
      - main
    paths:
      - "BuildSystem/runtime_log_analyzer.py"
      - "BuildSystem/runtime_ingest.py"
      - "BuildSystem/runtime_large_ingest.py"
      - "BuildSystem/runtime_log_query.py"
      - "BuildSystem/prepare_large_runtime_log.py"
      - "BuildSystem/runtime_pipeline_selftest.py"
      - ".github/workflows/runtime-pipeline-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-pipeline-selftest
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run synthetic end-to-end runtime pipeline test
        run: python BuildSystem/runtime_pipeline_selftest.py
