name: Exact review Tier-D S1.42AI spawn candidates

on:
  push:
    branches:
      - analysis/s142ai-tier-d-exact
    paths:
      - 'AnalysisTools/inspect_tier_d_spawn_candidates_exact.py'
      - '.github/workflows/tier-d-spawn-candidates-exact-review.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned ILSpy
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375
      - name: Capture exact Tier-D full-source review evidence
        run: python AnalysisTools/inspect_tier_d_spawn_candidates_exact.py
      - name: Preserve exact Tier-D review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-tier-d-spawn-candidates-exact
          path: tier-d-spawn-candidates-output/
          if-no-files-found: error
          retention-days: 90
