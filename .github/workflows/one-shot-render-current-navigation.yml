name: One-shot render current navigation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-render-current-navigation.yml'

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.ref == 'publish/s142ak-shdiag1-exact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render protected current navigation
        run: python RepositoryTools/render_current_navigation.py
      - name: Commit generated navigation and remove one-shot renderer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md START_HERE_ChatGPT_Masterprompt.txt Current/00_CURRENT_STATE.md Current/01_HANDOVER_CORE.md
          git rm -- .github/workflows/one-shot-render-current-navigation.yml
          git commit -m "Regenerate current navigation from publication state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
