name: S1.42AK BMAFR1I1 inactive compile and archive review

on:
  pull_request:
    paths:
      - 'Patches/S142AKBMAFR1I1/**'
      - 'BuildSpecs/S1.42AK-BMAFR1I1.json'
      - 'BuildSystem/bmafr1i1_review_build.py'
      - 'AnalysisTools/validate_s142ak_bmafr1i1_review.py'
      - '.github/workflows/s142ak-bmafr1i1-inactive-review.yml'

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned source and PE metadata parsers
        run: python -m pip install --only-binary=:all: tree-sitter==0.25.2 tree-sitter-c-sharp==0.23.1 PyYAML==6.0.2 dnfile==0.15.1
      - name: Compile exact integrated source and construct isolated review archive
        run: python BuildSystem/bmafr1i1_review_build.py
      - name: Independently verify archive and exercise rejection cases
        run: python AnalysisTools/validate_s142ak_bmafr1i1_review.py --self-test
      - name: Verify short profile path budget
        run: python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-BMAFR1I1.json --self-test
      - name: Freeze successful inactive review artifact
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-BMAFR1I1-review-${{ github.event.pull_request.head.sha }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure evidence without publishing a profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-BMAFR1I1-failure-${{ github.event.pull_request.head.sha }}
          path: review-output/Evidence/
          if-no-files-found: ignore
          retention-days: 90
