name: C3F18 activate BMDSFIX1-DIAG1 runtime diagnostic

on:
  push:
    branches:
      - c3f18-bmdsfix1-diag1-runtime-activation
    paths:
      - 'RepositoryTools/c3f18_activate_bmdsfix1_diag1_runtime.py'
      - '.github/workflows/c3f18-activate-bmdsfix1-diag1-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f18-bmdsfix1-diag1-runtime-activation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact DIAG1 diagnostic runtime activation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('RepositoryTools/c3f18_activate_bmdsfix1_diag1_runtime.py')
          text=path.read_text(encoding='utf-8')
          repairs=(
              ('state["selected_scope"]["bmdsfix1_target_status"]','state["selected_scope"]["phase_c"]["bmdsfix1_target_status"]','phase-C target guard'),
              ('    "profile_sha256": PROFILE_SHA,\n    "diagnostic_dll_sha256": DLL_SHA,','    "profile_sha256": PROFILE_SHA,\n    "sha256": PROFILE_SHA,\n    "diagnostic_dll_sha256": DLL_SHA,','canonical diagnostic SHA alias'),
          )
          for old,new,label in repairs:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one repair target, found {text.count(old)}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
          python RepositoryTools/c3f18_activate_bmdsfix1_diag1_runtime.py

      - name: Regenerate protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Verify generated current navigation
        run: python RepositoryTools/render_current_navigation.py --check

      - name: Validate current live-state semantics
        run: python RepositoryTools/current_state_semantic_validator.py

      - name: Validate repository knowledge architecture
        run: python RepositoryTools/knowledge_architecture_validator.py

      - name: Validate exact artifact bytes and pending evidence
        run: python RepositoryTools/artifact_byte_integrity_validator.py

      - name: Validate repository integrity and Gale helper contract
        run: |
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Verify exact runtime controller activation
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.')
          state=json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          candidate=state['active_candidate']
          diag=state['selected_scope']['diagnostic_revision']
          assert state['accepted_baseline']['build_id']=='S1.42AK'
          assert state['latest_built_artifact']['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['status']=='ACTIVE_RUNTIME_CANDIDATE_NOT_ACCEPTED'
          assert candidate['sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert state['runtime_test_outstanding'] is True
          assert state['selected_scope']['phase_c']['bmdsfix1_target_status']=='OUTSTANDING_BLACK_MESA_DEEP_SEWERS'
          assert state['controllers']['runtime_active_build']=='S1.42AK-BMDSFIX1-DIAG1'
          assert (root/'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()=='S1.42AK-BMDSFIX1-DIAG1'
          current=json.loads((root/'BuildSpecs/current.json').read_text(encoding='utf-8'))
          assert current['enabled'] is False
          assert current['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert current['base_sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert diag['build_id']=='S1.42AK-BMDSFIX1-DIAG1'
          assert diag['status']=='PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED'
          assert diag['base_build_id']=='S1.42AK-BMDSFIX1'
          assert diag['base_sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert diag['sha256']=='31c24a3752aefe040b74c5dc2c3b7f677c17068a91f8c8e2893ace615050b78e'
          assert diag['diagnostic_dll_sha256']=='3b9954b21fc2f1214e73b4021c8ab278f71420583e0e2e9f478f981fc64b20e1'
          assert diag['runtime_armed'] is True
          assert hashlib.sha256((root/diag['profile']).read_bytes()).hexdigest()==diag['sha256']
          auto=json.loads((root/'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert auto['build_id']==diag['base_build_id']
          assert auto['output_profile']==diag['base_profile']
          assert auto['output_sha256']==diag['base_sha256']
          build=json.loads((root/diag['build_result']).read_text(encoding='utf-8'))
          assert build['build_id']==diag['build_id']
          assert build['output_profile']==diag['profile'] and build['output_sha256']==diag['sha256']
          assert build['base_profile']==diag['base_profile'] and build['base_sha256']==diag['base_sha256']
          hashes=json.loads((root/'Profiles/EXPECTED_HASHES.json').read_text(encoding='utf-8'))
          assert hashes[diag['profile']]['build_id']==diag['build_id']
          assert hashes[diag['profile']]['sha256']==diag['sha256']
          integrity=json.loads((root/'Current/ARTIFACT_EVIDENCE_INTEGRITY.json').read_text(encoding='utf-8'))
          pending={x['build_id']:x for x in integrity['pending_profiles']}
          assert pending['S1.42AK-BMDSFIX1']['role']=='ACTIVE_RUNTIME_CANDIDATE_PENDING'
          assert pending['S1.42AK-BMDSFIX1-DIAG1']['role']=='ACTIVE_RUNTIME_DIAGNOSTIC_PENDING'
          activation=(root/'Current/180_S1.42AK_BMDSFIX1_DIAG1_RUNTIME_ACTIVATION.md').read_text(encoding='utf-8')
          assert 'ReplaceActiveGaleProfileV24.ps1' in activation
          assert 'RuntimeInbox/Current/LogOutput.log' in activation
          assert '[BMDSFIX1-DIAG1]' in activation
          assert '[BMDSFIX1] APPLIED' in activation
          assert 'NEVER ACCEPT' in activation
          assert 'cannot waive or replace the regular exact-byte BMDSFIX1' in activation
          print('PASS: exact BMDSFIX1-DIAG1 diagnostic runtime target armed; BMDSFIX1 gameplay candidate and regular qualification preserved')
          PY
          git diff --check

      - name: Commit atomic activation and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('Current/180_S1.42AK_BMDSFIX1_DIAG1_RUNTIME_ACTIVATION.md')
          lines=path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          PY
          rm RepositoryTools/c3f18_activate_bmdsfix1_diag1_runtime.py
          rm .github/workflows/c3f18-activate-bmdsfix1-diag1-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Arm exact BMDSFIX1-DIAG1 runtime diagnostic'
          git push origin HEAD:c3f18-bmdsfix1-diag1-runtime-activation
