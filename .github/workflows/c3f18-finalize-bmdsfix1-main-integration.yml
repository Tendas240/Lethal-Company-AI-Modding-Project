name: C3F18 finalize BMDSFIX1 main integration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/c3f18-finalize-bmdsfix1-main-integration.yml'

permissions:
  contents: write
  actions: read
  pull-requests: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact PR merge and permanent main gate provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merge='21138185f1ab377660b61120f1d07733d4180672'
          pr_head='24713dfc93a24f5e65ae5f223d3ea9c164da785e'
          git cat-file -e "${merge}^{commit}"
          [[ "$(git rev-parse "${merge}^2")" == "$pr_head" ]]
          git merge-base --is-ancestor "$merge" HEAD

          pr_json="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/150")"
          jq -e '
            .merged == true and
            .head.sha == "24713dfc93a24f5e65ae5f223d3ea9c164da785e" and
            .merge_commit_sha == "21138185f1ab377660b61120f1d07733d4180672"
          ' <<<"$pr_json" >/dev/null

          for spec in \
            '36023454162|Knowledge Architecture|pull_request|24713dfc93a24f5e65ae5f223d3ea9c164da785e' \
            '36023454260|S1.42AK BMDSFIX1 source and pure static gate|pull_request|24713dfc93a24f5e65ae5f223d3ea9c164da785e' \
            '36023454215|S1.42AK BMDSFIX1 review/published archive-delta gate|pull_request|24713dfc93a24f5e65ae5f223d3ea9c164da785e' \
            '36024694126|Knowledge Architecture|push|21138185f1ab377660b61120f1d07733d4180672'
          do
            IFS='|' read -r run_id run_name run_event run_head <<<"$spec"
            run_json="$(curl -fsSL \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e \
              --arg name "$run_name" \
              --arg event "$run_event" \
              --arg head "$run_head" \
              '.name == $name and .event == $event and .head_sha == $head and .status == "completed" and .conclusion == "success"' \
              <<<"$run_json" >/dev/null
          done
          echo 'PASS: PR #150 exact merge and all pinned PR/main gates are successful'

      - name: Canonicalize completed BMDSFIX1 main integration
        run: python RepositoryTools/c3f18_finalize_bmdsfix1_main_integration.py

      - name: Regenerate protected current navigation
        run: python RepositoryTools/render_current_navigation.py

      - name: Verify generated current navigation
        run: python RepositoryTools/render_current_navigation.py --check

      - name: Validate current live-state semantics
        run: python RepositoryTools/current_state_semantic_validator.py

      - name: Validate repository knowledge architecture
        run: python RepositoryTools/knowledge_architecture_validator.py

      - name: Validate published artifact and runtime bytes
        run: python RepositoryTools/artifact_byte_integrity_validator.py

      - name: Re-run BMDSFIX1 source/static contract in main-integrated state
        run: python AnalysisTools/validate_s142ak_bmdsfix1_source.py

      - name: Verify main integration state and live controllers remain inactive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('Current/CURRENT_STATE.json').read_text())
          current=json.loads(Path('BuildSpecs/current.json').read_text())
          selected=state['selected_scope']
          review=selected['bmdsfix1_review']
          assert state['active_candidate'] is None
          assert state['runtime_test_outstanding'] is False
          assert current['enabled'] is False
          assert current['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text().strip()=='S1.42AK'
          assert state['controllers']['runtime_active_build']=='S1.42AK'
          assert selected['status']=='PHASE_C3F18_BMGHDIAG2_RUNTIME_INCONCLUSIVE_BMDSFIX1_MAIN_INTEGRATION_PASS_RUNTIME_ACTIVATION_NEXT'
          assert review['published'] is True
          assert review['main_integrated'] is True
          assert review['runtime_armed'] is False
          assert review['integration_pr']==150
          assert review['integration_pr_head']=='24713dfc93a24f5e65ae5f223d3ea9c164da785e'
          assert review['main_integration_commit']=='21138185f1ab377660b61120f1d07733d4180672'
          assert review['main_knowledge_architecture_run']==36024694126
          print('PASS: BMDSFIX1 main integration canonicalized with every runtime controller inactive')
          PY

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit canonical main-integration checkpoint and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm RepositoryTools/c3f18_finalize_bmdsfix1_main_integration.py
          rm .github/workflows/c3f18-finalize-bmdsfix1-main-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No main-integration canonicalization changes staged.' >&2; exit 1; }
          git commit -m 'Canonicalize BMDSFIX1 main integration checkpoint'
          git push origin HEAD:main
