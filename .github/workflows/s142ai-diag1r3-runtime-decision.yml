          MARKER = '<!-- LIVE_STATE: accepted=S1.42AH latest=S1.42AI-DIAG1R3 candidate=S1.42AI runtime_test_outstanding=true -->'

          def load(rel):
              return json.loads((ROOT/rel).read_text(encoding='utf-8'))
          def dump(rel, obj):
              (ROOT/rel).write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          def write(rel, text):
              (ROOT/rel).write_text(text.rstrip() + '\n', encoding='utf-8')
          def replace_section(rel, start, end, replacement):
              p = ROOT/rel
              s = p.read_text(encoding='utf-8')
              pattern = re.escape(start) + r'.*?(?=' + re.escape(end) + r')'
              out, n = re.subn(pattern, replacement.rstrip() + '\n\n', s, count=1, flags=re.S)
              assert n == 1, (rel, start, end, n)
