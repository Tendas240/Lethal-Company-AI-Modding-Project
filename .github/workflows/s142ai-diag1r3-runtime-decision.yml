name: S1.42AI-DIAG1R3 Runtime Decision

on:
  push:
    branches:
      - decision/s142ai-diag1r3-runtime-pass
    paths:
      - '.github/workflows/s142ai-diag1r3-runtime-decision.yml'

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact decision branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: decision/s142ai-diag1r3-runtime-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact decision base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "8a88771eb998ebfa999097c88106fee8e44a4b98"

      - name: Apply decision transition
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/apply_s142ai_diag1r3_runtime_decision.py
          python RepositoryTools/normalize_s142ai_live_head.py
          python RepositoryTools/render_current_navigation.py

      - name: Validate transitioned repository state
        shell: bash
        run: |
          set -euo pipefail
          python RepositoryTools/render_current_navigation.py --check
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/state_neutral_authority_validator.py
          python RepositoryTools/state_neutral_authority_validator.py --self-test
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/handover_workflow_validator.py
          python RepositoryTools/segmented_execution_policy_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py
          python RepositoryTools/runtime_sha_provenance_validator.py
          python RepositoryTools/phase_checkpoint_validator.py
          python RepositoryTools/overhaul_contract_validator.py
          python RepositoryTools/answerability_regression.py
          python RepositoryTools/cold_history_storage_validator.py
          python RepositoryTools/validator_selftest.py
          python - <<'PY'
          import json
          s=json.load(open('Current/CURRENT_STATE.json', encoding='utf-8'))
          a=json.load(open('Current/AUTO_BUILD_RESULT.json', encoding='utf-8'))
          c=json.load(open('BuildSpecs/current.json', encoding='utf-8'))
          assert s['accepted_baseline']['build_id']=='S1.42AH'
          assert s['latest_built_artifact']['build_id']=='S1.42AI'
          assert s['active_candidate']['build_id']=='S1.42AI'
          assert s['runtime_test_outstanding'] is True
          assert s['controllers']['runtime_active_build']=='S1.42AI'
          assert a['build_id']=='S1.42AI'
          assert c['enabled'] is False and c['build_id']=='IDLE_AFTER_S1.42AI_BUILD_AWAITING_RUNTIME_VALIDATION'
          assert open('RuntimeInbox/ACTIVE_BUILD.txt', encoding='utf-8').read().strip()=='S1.42AI'
          print('PASS: R3 decision recorded and full-normal S1.42AI runtime gate atomically active')
          PY
          git diff --check

      - name: Commit atomic transition and self-delete one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/s142ai-diag1r3-runtime-decision.yml
          rm -f RepositoryTools/apply_s142ai_diag1r3_runtime_decision.py
          rm -f RepositoryTools/normalize_s142ai_live_head.py
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'ERROR: no transition changes'; exit 1; }
          git commit -m "Record R3 diagnostic pass and reactivate S1.42AI full-normal gate"
          git push origin HEAD:decision/s142ai-diag1r3-runtime-pass
