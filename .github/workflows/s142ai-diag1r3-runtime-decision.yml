        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: decision/s142ai-diag1r3-runtime-pass

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact decision base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "8a88771eb998ebfa999097c88106fee8e44a4b98"

      - name: Apply R3 runtime decision and reactivate full-normal S1.42AI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re

          ROOT = Path('.')
          R3 = 'S1.42AI-DIAG1R3'
          AI = 'S1.42AI'
          AH = 'S1.42AH'
          R3_SHA = '13d73d8aa1b651bccfb80d8b242efe63eae7def3639df1ad949bfdf724424768'
