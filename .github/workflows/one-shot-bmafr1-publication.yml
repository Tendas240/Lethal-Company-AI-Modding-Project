name: One-shot BMAFR1 exact-byte publication

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-bmafr1-publication.yml'
      - 'Profiles/LC V1 S1.42AK-BMAFR1.r2z'
      - 'ProfileSources/S1.42AK-BMAFR1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'publish/s142ak-bmafr1-exact')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_ID: '11218000891'
      ARTIFACT_SHA256: '49e9402bb2521a2a56c3634563f1ed6a9d8bb3fc98895dd23ad936ec5ca2ad4c'
      PROFILE_PATH: 'Profiles/LC V1 S1.42AK-BMAFR1.r2z'
      PROFILE_SHA256: '8607a022e83304b473e7327ce5644141212a697fb8dffa210c58e02e5caafba5'
      SNAPSHOT_PATH: 'ProfileSources/S1.42AK-BMAFR1'
      DIAG_DLL_SHA256: 'c079368dd3736decadee00125a42319f5da29907aad207d7b82a6494f19a7ce1'
      LLL_CONFIG_SHA256: 'd2a01df4829623ef3dcbacf8c09e98a9c6a72b0885f9302502da2bcb91b31b68'
      LLL_DLL_SHA256: 'b95aad3813dd7dc1d50aa29c9606660022b149790905a1589180e19d7c157c8c'
      NORMALIZER_SHA256: '901c02a8e85d33af24d0aa906faa6052a7de33faa7dfbeeca590bbd8a8f59a06'

    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify publication boundary before transport
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code origin/main --             BuildSpecs/current.json             RuntimeInbox/ACTIVE_BUILD.txt             Current/CURRENT_STATE.json             Current/AUTO_BUILD_RESULT.json             Current/AUTO_BUILD_RESULT.md
          python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-BMAFR1.json

      - name: Download and validate frozen review artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .publication-artifact
          mkdir -p .publication-artifact/extracted
          curl --fail --silent --show-error --location             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o .publication-artifact/review.zip
          echo "${ARTIFACT_SHA256}  .publication-artifact/review.zip" | sha256sum --check --strict
          unzip -q .publication-artifact/review.zip -d .publication-artifact/extracted
          echo "${PROFILE_SHA256}  .publication-artifact/extracted/${PROFILE_PATH}" | sha256sum --check --strict
          python - <<'PY'
          import hashlib, json, os, pathlib, re, unicodedata, zipfile

          root = pathlib.Path(".publication-artifact/extracted")
          profile = root / os.environ["PROFILE_PATH"]

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          with zipfile.ZipFile(profile) as z:
              names = z.namelist()
              if len(names) != 337 or len(names) != len(set(names)):
                  raise SystemExit(f"unexpected review archive members: {len(names)} / {len(set(names))}")
              if z.read("export.r2x").decode("utf-8-sig").splitlines()[0] != "profileName: LC V1 S1.42AK-BMAFR1":
                  raise SystemExit("review profile identity mismatch")
              protected = {
                  "BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll": os.environ["DIAG_DLL_SHA256"],
                  "BepInEx/config/LethalLevelLoader.cfg": os.environ["LLL_CONFIG_SHA256"],
                  "BepInEx/plugins/LethalLevelLoader/LethalLevelLoader.dll": os.environ["LLL_DLL_SHA256"],
                  "BepInEx/plugins/S142ABInteriorWeightNormalization/S142ABInteriorWeightNormalization.dll": os.environ["NORMALIZER_SHA256"],
              }
              for path, expected in protected.items():
                  actual = sha(z.read(path))
                  if actual != expected:
                      raise SystemExit(f"protected member SHA mismatch: {path}: {actual}")

              cfg = z.read("BepInEx/config/LethalLevelLoader.cfg").decode("utf-8-sig")
              header = "\u200b" * 9 + "Custom Dungeon:  Abandoned Foundry"
              exact_marker = f"[{header}]"
              plain_marker = "[Custom Dungeon:  Abandoned Foundry]"
              if cfg.count(exact_marker) != 1:
                  raise SystemExit(f"raw nine-U+200B Foundry header count mismatch: {cfg.count(exact_marker)}")
              if plain_marker in cfg:
                  raise SystemExit("plain visible-equivalent Foundry header present")
              headers = [line[1:-1] for line in cfg.splitlines() if line.startswith("[") and line.endswith("]")]
              visible = []
              for h in headers:
                  stripped = "".join(ch for ch in h if unicodedata.category(ch) != "Cf")
                  if stripped == "Custom Dungeon:  Abandoned Foundry":
                      visible.append(h)
              if len(visible) != 1 or visible[0] != header:
                  raise SystemExit(f"visible-equivalent Foundry header mismatch: {visible!r}")

              lines = cfg.splitlines()
              start = lines.index(exact_marker)
              end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("[") and lines[i].endswith("]")), len(lines))
              section = [line for line in lines[start + 1:end] if " = " in line]
              kv = dict(line.split(" = ", 1) for line in section)
              expected = {
                  "Enable Content Configuration": "true",
                  "General Settings - Enable Dynamic Dungeon Size Restriction": "false",
                  "General Settings - Minimum Dungeon Size Multiplier": "1",
                  "General Settings - Maximum Dungeon Size Multiplier": "1",
                  "General Settings - Restrict Dungeon Size Scaler": "1",
                  "Dungeon Injection Settings - Manual Mod Names List": "Default Values Were Empty",
                  "Dungeon Injection Settings - Manual Level Names List": "Experimentation:100,Assurance:150,Offense:250,Vow:25,March:25,Adamance:25,Rend:0,Dine:0,Titan:175,Embrion:200,Artifice:300,Halation:50,Makron:300,Pandoramus:300,Silence:250,Condemned:150,Pareidolia:25,Acheron:225,Deadlock:50,Terra:175,Veld:25,Oldred:300,Infernis:200,Descent:50,Trite:150,Sierra:300,Victory:100,Black Mesa:100",
                  "Dungeon Injection Settings - Dynamic Level Tags List": "Murica:300,Canyon:50,Wasteland:150",
                  "Dungeon Injection Settings - Dynamic Route Price List": "Default Values Were Empty",
              }
              if kv != expected:
                  raise SystemExit(f"Foundry owner-binding section mismatch: {kv!r}")
              if kv["Dungeon Injection Settings - Manual Level Names List"].split(",").count("Black Mesa:100") != 1:
                  raise SystemExit("Black Mesa:100 multiplicity mismatch")

          snapshot = root / os.environ["SNAPSHOT_PATH"]
          index_path = snapshot / "FILE_INDEX.json"
          if not index_path.is_file():
              raise SystemExit("review snapshot FILE_INDEX missing")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          if len(index) != 337:
              raise SystemExit(f"review snapshot FILE_INDEX rows: {len(index)}")
          index_paths = [row["path"] for row in index]
          if index_paths != names:
              raise SystemExit("review snapshot FILE_INDEX order/member set differs from review profile")
          if (snapshot / "PROFILE_INDEX_RESULT.json").exists():
              raise SystemExit("review artifact unexpectedly contains profile-index result")

          build_result = json.loads((root / "BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/BUILD_RESULT.json").read_text(encoding="utf-8"))
          static = json.loads((root / "BuildSpecs/S1.42AK-BMAFR1_BUILD_EVIDENCE/STATIC_VERIFICATION.json").read_text(encoding="utf-8"))
          expected_profile = os.environ["PROFILE_SHA256"]
          if build_result.get("output_sha256") != expected_profile or static.get("output_sha256") != expected_profile:
              raise SystemExit("artifact review evidence output SHA mismatch")
          if build_result.get("zip_members") != 337:
              raise SystemExit("artifact build-result member count mismatch")
          if build_result.get("changed_existing_members") != ["BepInEx/config/LethalLevelLoader.cfg", "export.r2x"]:
              raise SystemExit("artifact build-result changed-member delta mismatch")
          if build_result.get("added_members") != ["BepInEx/plugins/S142AKBMAFDiag1/S142AKBMAFDiag1.dll"]:
              raise SystemExit("artifact build-result added-member delta mismatch")
          required_static = {
              "diagnostic_dll_reused_byte_exact": True,
              "foundry_raw_section_u200b_count": 9,
              "foundry_plain_section_present": False,
              "foundry_visible_equivalent_section_count": 1,
              "foundry_content_configuration_enabled": True,
              "foundry_manual_level_names_delta": "Black Mesa:100",
              "foundry_owner_values_preserved": True,
              "runtime_armed": False,
              "published": False,
          }
          for key, expected_value in required_static.items():
              if static.get(key) != expected_value:
                  raise SystemExit(f"artifact static evidence mismatch: {key}={static.get(key)!r}")
          PY

      - name: Materialize exact reviewed bytes without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Profiles
          rm -rf "${SNAPSHOT_PATH}"
          cp -- ".publication-artifact/extracted/${PROFILE_PATH}" "${PROFILE_PATH}"
          cp -a -- ".publication-artifact/extracted/${SNAPSHOT_PATH}" "${SNAPSHOT_PATH}"
          echo "${PROFILE_SHA256}  ${PROFILE_PATH}" | sha256sum --check --strict
          test ! -e "${SNAPSHOT_PATH}/PROFILE_INDEX_RESULT.json"
          git diff --exit-code origin/main --             BuildSpecs/current.json             RuntimeInbox/ACTIVE_BUILD.txt             Current/CURRENT_STATE.json             Current/AUTO_BUILD_RESULT.json             Current/AUTO_BUILD_RESULT.md

      - name: Commit exact publication bytes to publication branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .publication-artifact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${PROFILE_PATH}" "${SNAPSHOT_PATH}"
          if git diff --cached --quiet; then
            echo "Exact publication bytes already materialized; no commit required."
            exit 0
          fi
          git commit -m "Publish exact reviewed BMAFR1 bytes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
