name: Inspect exact direct spawn owners
on:
  push:
    branches: [analysis/s142ai-direct-owners-native-gaps]
    paths:
      - 'AnalysisTools/inspect_direct_spawn_owners_exact.py'
      - '.github/workflows/direct-owner-exact-review.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore exact project V81 reference dependencies
        run: dotnet restore Patches/S139CompatibilityFixes/S139CompatibilityFixes.csproj --configfile Patches/S139CompatibilityFixes/NuGet.Config
      - name: Install pinned decompiler
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375
      - name: Capture exact direct-owner and native-reference evidence
        run: python AnalysisTools/inspect_direct_spawn_owners_exact.py
      - name: Upload exact review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-direct-owner-exact
          path: direct-owner-exact-output/
          if-no-files-found: error
          retention-days: 90
