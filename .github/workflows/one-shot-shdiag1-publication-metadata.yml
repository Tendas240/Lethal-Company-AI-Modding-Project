name: One-shot SHDIAG1 publication metadata reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-shdiag1-publication-metadata.yml'
      - 'RepositoryTools/temp_reconcile_shdiag1_publication.py'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'publish/s142ak-shdiag1-exact'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile exact publication metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a15be1f25f08b2a268a21f2fb53ef6aa12ad20ad"
          git diff --exit-code origin/main -- BuildSpecs/current.json RuntimeInbox/ACTIVE_BUILD.txt Profiles/EXPECTED_HASHES.json
          python RepositoryTools/temp_reconcile_shdiag1_publication.py
          test "$(cat RuntimeInbox/ACTIVE_BUILD.txt)" = "S1.42AK-BMDSFIX1"
      - name: Commit reconciled metadata and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Current/CURRENT_STATE.json Current/00_CURRENT_STATE.md
          git rm -- .github/workflows/one-shot-shdiag1-publication-metadata.yml RepositoryTools/temp_reconcile_shdiag1_publication.py
          git commit -m "Reconcile SHDIAG1 publication machine state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
