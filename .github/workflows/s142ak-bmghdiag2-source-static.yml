name: S1.42AK BMGHDIAG2 source and pure static gate
on:
  pull_request:
    paths:
      - 'Patches/S142AKBMGHDiag2/**'
      - 'AnalysisTools/validate_s142ak_bmghdiag2_source.py'
      - 'BuildSpecs/S1.42AK-BMGHDIAG2_PLAN.md'
      - 'SourceEvidence/UniversalInteriorViability/PhaseC3F18/**'
      - '.github/workflows/s142ak-bmghdiag2-source-static.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test provenance, runtime identity, selection and observation policies
        run: dotnet run --project Patches/S142AKBMGHDiag2/Tests/Policy.Tests.csproj -c Release
      - name: Compile diagnostic plugin source only
        working-directory: Patches/S142AKBMGHDiag2
        run: dotnet build S142AKBMGHDiag2.csproj -c Release
      - name: Verify source-only fail-closed successor contract
        run: python AnalysisTools/validate_s142ak_bmghdiag2_source.py
