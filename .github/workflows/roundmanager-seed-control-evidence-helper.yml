name: Validate V81 seed-control evidence helper
on:
  pull_request:
    paths:
      - 'AnalysisTools/InspectRoundManagerSeedControlV81.ps1'
      - 'AnalysisTools/InspectRoundManagerSeedControlV81_PROVENANCE_REVIEW.md'
      - '.github/workflows/roundmanager-seed-control-evidence-helper.yml'
  push:
    branches: [main]
    paths:
      - 'AnalysisTools/InspectRoundManagerSeedControlV81.ps1'
      - 'AnalysisTools/InspectRoundManagerSeedControlV81_PROVENANCE_REVIEW.md'
      - '.github/workflows/roundmanager-seed-control-evidence-helper.yml'
permissions:
  contents: read
jobs:
  powershell51:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate derived seed-control helper under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & ./AnalysisTools/InspectRoundManagerSeedControlV81.ps1 -SelfTest
          if (-not $?) { throw 'Seed-control helper self-test failed' }
  bootstrap51:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated bootstrap under Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & ./AnalysisTools/InspectRoundManagerSeedControlV81.ps1 -BootstrapSelfTest
          if (-not $?) { throw 'Seed-control bootstrap self-test failed' }
