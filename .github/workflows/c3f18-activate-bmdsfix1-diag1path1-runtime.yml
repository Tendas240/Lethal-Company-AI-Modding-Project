name: C3F18 activate BMDSFIX1-DIAG1PATH1 runtime diagnostic

on:
  push:
    branches:
      - c3f18-bmdsfix1-diag1path1-runtime-activation
    paths:
      - 'RepositoryTools/c3f18_activate_bmdsfix1_diag1path1_runtime.py'
      - '.github/workflows/c3f18-activate-bmdsfix1-diag1path1-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c3f18-bmdsfix1-diag1path1-runtime-activation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact DIAG1PATH1 diagnostic runtime activation
        run: python RepositoryTools/c3f18_activate_bmdsfix1_diag1path1_runtime.py

      - name: Regenerate and verify protected current navigation
        run: |
          python RepositoryTools/render_current_navigation.py
          python RepositoryTools/render_current_navigation.py --check

      - name: Validate canonical state and repository contracts
        run: |
          python RepositoryTools/current_state_semantic_validator.py
          python RepositoryTools/knowledge_architecture_validator.py
          python RepositoryTools/artifact_byte_integrity_validator.py
          python RepositoryTools/repository_integrity_guard.py
          python RepositoryTools/gale_import_helper_validator.py

      - name: Verify exact one-hop runtime activation and bounded delta
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root=Path('.')
          state=json.loads((root/'Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
          scope=state['selected_scope']
          candidate=state['active_candidate']
          diag=scope['diagnostic_revision']
          parent=scope['diagnostic_parent_revision']

          assert state['accepted_baseline']['build_id']=='S1.42AK'
          assert state['latest_built_artifact']['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['build_id']=='S1.42AK-BMDSFIX1'
          assert candidate['status']=='ACTIVE_RUNTIME_CANDIDATE_NOT_ACCEPTED'
          assert candidate['sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert state['runtime_test_outstanding'] is True
          assert scope['phase_c']['bmdsfix1_target_status']=='OUTSTANDING_BLACK_MESA_DEEP_SEWERS'
          assert state['controllers']['runtime_active_build']=='S1.42AK-BMDSFIX1-DIAG1PATH1'
          assert (root/'RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip()=='S1.42AK-BMDSFIX1-DIAG1PATH1'

          current=json.loads((root/'BuildSpecs/current.json').read_text(encoding='utf-8'))
          assert current['enabled'] is False
          assert current['build_id']=='IDLE_UNIVERSAL_INTERIOR_VIABILITY_ANALYSIS'
          assert current['base_sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'

          assert diag['build_id']=='S1.42AK-BMDSFIX1-DIAG1PATH1'
          assert diag['status']=='PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED'
          assert diag['classification']=='DIAGNOSTIC_SUPPORT_ONLY_NEVER_ACCEPT'
          assert diag['profile']=='Profiles/LC V1 S1.42AK-D1P1.r2z'
          assert diag['sha256']=='0d4fc0b2031099617a43770b29ab1908a2be18a262df70a3322904f458cff5c6'
          assert diag['profile_name']=='LC V1 S1.42AK-D1P1'
          assert diag['base_build_id']=='S1.42AK-BMDSFIX1-DIAG1'
          assert diag['base_sha256']=='31c24a3752aefe040b74c5dc2c3b7f677c17068a91f8c8e2893ace615050b78e'
          assert diag['runtime_armed'] is True and diag['indexed'] is True
          assert hashlib.sha256((root/diag['profile']).read_bytes()).hexdigest()==diag['sha256']

          assert parent['build_id']=='S1.42AK-BMDSFIX1-DIAG1'
          assert parent['status']=='PUBLISHED_DIAGNOSTIC_PARENT_RUNTIME_EVIDENCE_INGESTED_NOT_ACCEPTED'
          assert parent['profile']=='Profiles/LC V1 S1.42AK-BMDSFIX1-DIAG1 Deterministic Deep Sewers Selector.r2z'
          assert parent['sha256']=='31c24a3752aefe040b74c5dc2c3b7f677c17068a91f8c8e2893ace615050b78e'
          assert parent['base_build_id']=='S1.42AK-BMDSFIX1'
          assert parent['base_sha256']=='3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
          assert parent['runtime_armed'] is False
          assert hashlib.sha256((root/parent['profile']).read_bytes()).hexdigest()==parent['sha256']

          auto=json.loads((root/'Current/AUTO_BUILD_RESULT.json').read_text(encoding='utf-8'))
          assert auto['build_id']==parent['base_build_id']
          assert auto['output_profile']==parent['base_profile']
          assert auto['output_sha256']==parent['base_sha256']

          build=json.loads((root/diag['build_result']).read_text(encoding='utf-8'))
          assert build['build_id']==diag['build_id']
          assert build['output_profile']==diag['profile'] and build['output_sha256']==diag['sha256']
          assert build['base_profile']==diag['base_profile'] and build['base_sha256']==diag['base_sha256']
          assert build['zip_members']==338 and build['changed_existing_members']==['export.r2x'] and build['added_members']==[]

          parent_build=json.loads((root/parent['build_result']).read_text(encoding='utf-8'))
          assert parent_build['build_id']==parent['build_id']
          assert parent_build['output_profile']==parent['profile'] and parent_build['output_sha256']==parent['sha256']
          assert parent_build['base_profile']==parent['base_profile'] and parent_build['base_sha256']==parent['base_sha256']

          indexed=json.loads((root/'ProfileSources/S1.42AK-BMDSFIX1-DIAG1PATH1/PROFILE_INDEX_RESULT.json').read_text(encoding='utf-8'))
          assert indexed['build_id']==diag['build_id']
          assert indexed['profile_path']==diag['profile'] and indexed['sha256']==diag['sha256']
          assert indexed['zip_members']==338 and indexed['build_id_resolution']=='EXPECTED_HASHES'

          hashes=json.loads((root/'Profiles/EXPECTED_HASHES.json').read_text(encoding='utf-8'))
          assert hashes[diag['profile']]['build_id']==diag['build_id']
          assert hashes[diag['profile']]['sha256']==diag['sha256']

          integrity=json.loads((root/'Current/ARTIFACT_EVIDENCE_INTEGRITY.json').read_text(encoding='utf-8'))
          pending={x['build_id']:x for x in integrity['pending_profiles']}
          assert pending['S1.42AK-BMDSFIX1']['role']=='ACTIVE_RUNTIME_CANDIDATE_PENDING'
          assert pending['S1.42AK-BMDSFIX1-DIAG1PATH1']['role']=='ACTIVE_RUNTIME_DIAGNOSTIC_PENDING'
          assert pending['S1.42AK-BMDSFIX1-DIAG1PATH1']['profile_sha256']==diag['sha256']

          activation=(root/'Current/185_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_ACTIVATION.md').read_text(encoding='utf-8')
          for required in ('ReplaceActiveGaleProfileV24.ps1','S1.42AK-BMDSFIX1-DIAG1PATH1','LC V1 S1.42AK-D1P1','[BMDSFIX1-DIAG1]','[BMDSFIX1] APPLIED','NEVER ACCEPT','cannot waive or replace the regular exact-byte BMDSFIX1'):
              assert required in activation

          allowed={
              'README.md','START_HERE_ChatGPT_Masterprompt.txt','Current/00_CURRENT_STATE.md','Current/01_HANDOVER_CORE.md',
              'Current/185_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_ACTIVATION.md','Current/ARTIFACT_EVIDENCE_INTEGRITY.json',
              'Current/ARTIFACT_EVIDENCE_INTEGRITY.md','Current/CURRENT_STATE.json','Current/PROJECT_KNOWLEDGE_MAP.md',
              'Knowledge/CURRENT_LIFECYCLE.md','Knowledge/ROADMAP_AND_DEFERRED_SCOPES.md','RuntimeInbox/ACTIVE_BUILD.txt'
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          unexpected=sorted(changed-allowed)
          assert not unexpected, f'Unexpected activation delta: {unexpected}'
          required_delta={'Current/CURRENT_STATE.json','Current/185_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_ACTIVATION.md','RuntimeInbox/ACTIVE_BUILD.txt','Knowledge/CURRENT_LIFECYCLE.md'}
          missing=sorted(required_delta-changed)
          assert not missing, f'Required activation delta missing: {missing}'
          print('PASS: exact PATH1 one-hop activation and bounded controller/lifecycle delta verified')
          PY
          git diff --check

      - name: Commit atomic activation and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('Current/185_S1.42AK_BMDSFIX1_DIAG1PATH1_RUNTIME_ACTIVATION.md')
          lines=path.read_text(encoding='utf-8').splitlines()
          path.write_text('\n'.join(line.rstrip() for line in lines)+'\n',encoding='utf-8')
          PY
          rm RepositoryTools/c3f18_activate_bmdsfix1_diag1path1_runtime.py
          rm .github/workflows/c3f18-activate-bmdsfix1-diag1path1-runtime.yml
          rm -f .github/workflows/c3f18-repair-diag1path1-activation-anchor.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Arm exact BMDSFIX1-DIAG1PATH1 runtime diagnostic'
          git push origin HEAD:c3f18-bmdsfix1-diag1path1-runtime-activation