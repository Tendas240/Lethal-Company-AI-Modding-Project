name: S1.42AK SCDIAG1 inactive compile and archive review

on:
  pull_request:
    paths:
      - 'Patches/S142AKSCDiag1/**'
      - 'BuildSpecs/S1.42AK-SCDIAG1.json'
      - 'BuildSpecs/S1.42AK-SCDIAG1_PLAN.md'
      - 'BuildSpecs/S1.42AK-SCDIAG1_BUILD_EVIDENCE/**'
      - 'BuildSystem/scdiag1_review_build.py'
      - 'AnalysisTools/validate_s142ak_scdiag1_build.py'
      - 'AnalysisTools/validate_s142ak_scdiag1_source.py'
      - '.github/workflows/s142ak-scdiag1-build-static.yml'

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Refuse repeat review build after independently frozen SCDIAG1 bytes
        id: frozen
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          path = pathlib.Path('BuildSpecs/S1.42AK-SCDIAG1_BUILD_EVIDENCE/REVIEW_BUILD_CHECKPOINT.json')
          frozen = path.exists()
          if frozen:
              state = json.loads(path.read_text(encoding='utf-8'))
              assert state['status'] == 'PASS_INACTIVE_REVIEW_BUILD_INDEPENDENTLY_REHASHED'
              assert state['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
              assert state['independent_artifact_rehash_match'] is True
              assert isinstance(state['artifact_id'], int) and state['artifact_id'] > 0
              head = state['build_head']
              assert re.fullmatch('[0-9a-f]{40}', head)
              for key in ('zip_sha256', 'profile_sha256', 'dll_sha256'):
                  assert re.fullmatch('[0-9a-f]{64}', state[key]), key
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', head], check=True)
              protected = [
                  'Patches/S142AKSCDiag1',
                  'BuildSpecs/S1.42AK-SCDIAG1.json',
                  'BuildSpecs/S1.42AK-SCDIAG1_PLAN.md',
                  'BuildSystem/scdiag1_review_build.py',
                  'AnalysisTools/validate_s142ak_scdiag1_build.py',
                  'AnalysisTools/validate_s142ak_scdiag1_source.py',
                  '.github/workflows/s142ak-scdiag1-build-static.yml',
                  '.github/workflows/s142ak-scdiag1-source-static.yml',
                  'SourceEvidence/UniversalInteriorViability/SCDIAG1SourceStatic/FINDINGS.md',
                  'RepositoryTools/gale_profile_path_length_guard.py',
              ]
              state_now = json.loads(pathlib.Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
              phase = state_now['selected_scope']['phase_c']
              activation = phase.get('storage_complex_scdiag1_runtime_armed') is True
              if activation:
                  # Only the exact reviewed source remains frozen; stage-aware validators/workflow
                  # are independently pinned to the new Git object IDs. No rebuilding is allowed.
                  assert phase.get('storage_complex_scdiag1_runtime_activation_checkpoint_authorized_conditional') is True
                  assert phase.get('storage_complex_scdiag1_runtime_activation') == 'Current/355_S1.42AK_SCDIAG1_RUNTIME_ACTIVATION.md'
                  assert phase.get('storage_complex_runtime_test_authorized') is True
                  assert state_now['controllers']['runtime_active_build'] == 'S1.42AK-SCDIAG1'
                  assert pathlib.Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-SCDIAG1'
                  diag = state_now['selected_scope']['diagnostic_revision']
                  assert diag['build_id'] == 'S1.42AK-SCDIAG1' and diag['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
                  assert diag['sha256'] == '6be6865a7fde205280439503680ac910401c20b997f757ffbedbddc963c704f4' and diag['base_sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
                  assert subprocess.check_output(['git', 'hash-object', 'AnalysisTools/validate_s142ak_scdiag1_source.py'], text=True).strip() == 'db92613bae89bc183b5bba1c0caf8a740ff14b09', 'unapproved source validator change'
                  assert subprocess.check_output(['git', 'hash-object', '.github/workflows/s142ak-scdiag1-source-static.yml'], text=True).strip() == '5d4c07e17fd17e5f4f55f66cdef2f0e48b0d4926', 'unapproved source workflow change'
                  assert subprocess.check_output(['git', 'hash-object', 'AnalysisTools/validate_s142ak_scdiag1_activation.py'], text=True).strip() == '3529e8b8ec648b7e2aeef0d2a24813669bdcb0e7', 'unapproved activation gate change'
                  assert "if: steps.runtime_stage.outputs.runtime != 'true'" in pathlib.Path('.github/workflows/s142ak-scdiag1-source-static.yml').read_text(encoding='utf-8')
                  protected = [name for name in protected if name not in (
                      'AnalysisTools/validate_s142ak_scdiag1_source.py', '.github/workflows/s142ak-scdiag1-source-static.yml', '.github/workflows/s142ak-scdiag1-build-static.yml')]
              elif phase.get('storage_complex_target_generation_status') == 'PASS_DIAGNOSTIC_GENERATED_STORAGECOMPLEX_GENERATION_MATERIALIZATION_PROOF_NATURAL_SELECTION_NOT_PROVEN':
                  # This is a completed, already-ingested runtime proof, not a new
                  # review or activation. Permit ONLY the pinned source gate's
                  # narrowly stage-aware evidence check and this guard's change.
                  # Freeze all C# source, recipes, packaging, and review builder bytes.
                  assert activation is False
                  assert phase.get('storage_complex_runtime_test_authorized') is False
                  assert phase.get('storage_complex_scdiag1_runtime_attempts_consumed') == 1
                  assert phase.get('storage_complex_scdiag1_runtime_attempts_authorized') == 1
                  assert phase.get('storage_complex_scdiag1_runtime_status') == 'RUNTIME_COMPLETE_PASS_DIAGNOSTIC_GENERATION_MATERIALIZATION_PROOF_NEVER_ACCEPT'
                  assert phase.get('storage_complex_scdiag1_runtime_evidence') == 'RuntimeEvidence/S1.42AK-SCDIAG1/20261009T093411Z/'
                  assert phase.get('storage_complex_scdiag1_runtime_log_sha256') == '39dfe45721befd6e256a341497100534c45d37868de14dc29ba6a58c08ce207e'
                  assert state_now['controllers']['runtime_active_build'] == 'S1.42AK-BMDSFIX1'
                  assert pathlib.Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-BMDSFIX1'
                  assert state_now['selected_scope']['diagnostic_revision']['runtime_armed'] is False
                  assert subprocess.check_output(['git', 'hash-object', 'AnalysisTools/validate_s142ak_scdiag1_source.py'], text=True).strip() == '8606dd816185a6b0872d6e2288d133c29db8312c', 'unreviewed completed-runtime source validator drift'
                  assert subprocess.check_output(['git', 'hash-object', '.github/workflows/s142ak-scdiag1-source-static.yml'], text=True).strip() == '5d4c07e17fd17e5f4f55f66cdef2f0e48b0d4926', 'changed original source workflow'
                  assert subprocess.check_output(['git', 'hash-object', 'AnalysisTools/validate_s142ak_scdiag1_activation.py'], text=True).strip() == '3529e8b8ec648b7e2aeef0d2a24813669bdcb0e7', 'changed original activation gate'
                  assert "if: steps.frozen.outputs.exists != 'true'" in pathlib.Path('.github/workflows/s142ak-scdiag1-build-static.yml').read_text(encoding='utf-8')
                  assert pathlib.Path('RuntimeEvidence/S1.42AK-SCDIAG1/20261009T093411Z/INDEX.json').is_file()
                  protected = [name for name in protected if name not in (
                      'AnalysisTools/validate_s142ak_scdiag1_source.py', '.github/workflows/s142ak-scdiag1-build-static.yml')]
              subprocess.run(['git', 'diff', '--exit-code', head, 'HEAD', '--', *protected], check=True)
              print('Frozen SCDIAG1 review bytes preserved; no recompilation or re-upload')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('exists=' + str(frozen).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.frozen.outputs.exists != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: steps.frozen.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned PE metadata parser
        if: steps.frozen.outputs.exists != 'true'
        run: 'python -m pip install --only-binary=:all: dnfile==0.15.1'
      - name: Re-run pure Storage Complex fail-closed selection policy
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet run --project Patches/S142AKSCDiag1/Tests/Policy.Tests.csproj -c Release
      - name: Re-verify accepted SCDIAG1 source/static contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_scdiag1_source.py
      - name: Compile exact integrated source
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet build Patches/S142AKSCDiag1/S142AKSCDiag1.csproj -c Release
      - name: Construct isolated review archive
        if: steps.frozen.outputs.exists != 'true'
        run: python BuildSystem/scdiag1_review_build.py
      - name: Independently verify assembly and archive contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_scdiag1_build.py --self-test
      - name: Verify short profile path budget
        if: steps.frozen.outputs.exists != 'true'
        run: python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-SCDIAG1.json --self-test
      - name: Freeze successful inactive review artifact
        if: steps.frozen.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-SCDIAG1-review-${{ github.event.pull_request.head.sha }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure evidence without publishing a profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-SCDIAG1-failure-${{ github.event.pull_request.head.sha }}
          path: review-output/Evidence/
          if-no-files-found: ignore
          retention-days: 90
