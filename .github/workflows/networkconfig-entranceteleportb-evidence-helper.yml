name: Validate V81 NetworkConfig EntranceTeleportB evidence helper

on:
  pull_request:
    paths:
      - 'AnalysisTools/InspectNetworkConfigEntranceTeleportBV81.ps1'
      - 'AnalysisTools/inspect_v81_networkconfig_prefab.py'
      - '.github/workflows/networkconfig-entranceteleportb-evidence-helper.yml'
  push:
    branches: [main]
    paths:
      - 'AnalysisTools/InspectNetworkConfigEntranceTeleportBV81.ps1'
      - 'AnalysisTools/inspect_v81_networkconfig_prefab.py'
      - '.github/workflows/networkconfig-entranceteleportb-evidence-helper.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned static parsers
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check --no-input UnityPy==1.25.3 dnfile==0.18.0 dncil==1.0.2 TypeTreeGeneratorAPI==0.0.10
      - name: Compile and self-test Python scanner including independent raw NetworkConfig diagnostics
        shell: powershell
        run: |
          python -m py_compile AnalysisTools/inspect_v81_networkconfig_prefab.py
          python AnalysisTools/inspect_v81_networkconfig_prefab.py --self-test
          if (-not $?) { throw 'Python scanner self-test failed' }
      - name: Validate PowerShell fail-closed publication contract
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & ./AnalysisTools/InspectNetworkConfigEntranceTeleportBV81.ps1 -SelfTest
          if (-not $?) { throw 'PowerShell helper self-test failed' }

  isolated-dependencies:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate isolated pinned dependency bootstrap
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & ./AnalysisTools/InspectNetworkConfigEntranceTeleportBV81.ps1 -DependencySelfTest
          if (-not $?) { throw 'Isolated dependency self-test failed' }


  python-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate hash-pinned portable CPython bootstrap without setup-python
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell 5.1' }
          & ./AnalysisTools/InspectNetworkConfigEntranceTeleportBV81.ps1 -PythonBootstrapSelfTest
          if (-not $?) { throw 'Temporary CPython bootstrap self-test failed' }
