name: S1.42AK FXDIAG1 inactive compile and archive review

on:
  pull_request:
    paths:
      - 'Patches/S142AKFXDiag1/**'
      - 'BuildSpecs/S1.42AK-FXDIAG1.json'
      - 'BuildSpecs/S1.42AK-FXDIAG1_PLAN.md'
      - 'BuildSpecs/S1.42AK-FXDIAG1_BUILD_EVIDENCE/**'
      - 'BuildSystem/fxdiag1_review_build.py'
      - 'AnalysisTools/validate_s142ak_fxdiag1_build.py'
      - 'AnalysisTools/validate_s142ak_fxdiag1_source.py'
      - '.github/workflows/s142ak-fxdiag1-build-static.yml'

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Reject rebuild once an independently verified frozen FXDIAG1 artifact exists
        id: frozen
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          checkpoint = pathlib.Path('BuildSpecs/S1.42AK-FXDIAG1_BUILD_EVIDENCE/REVIEW_BUILD_CHECKPOINT.json')
          frozen = checkpoint.exists()
          if frozen:
              record = json.loads(checkpoint.read_text(encoding='utf-8'))
              assert record['status'] == 'PASS_INACTIVE_REVIEW_BUILD_INDEPENDENTLY_REHASHED'
              assert record['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
              assert record['independent_artifact_rehash_match'] is True
              assert isinstance(record['artifact_id'], int) and record['artifact_id'] > 0
              head = record['build_head']
              assert re.fullmatch(r'[0-9a-f]{40}', head)
              for name in ('zip_sha256', 'profile_sha256', 'dll_sha256'):
                  assert re.fullmatch(r'[0-9a-f]{64}', record[name]), name
              subprocess.run(['git', 'fetch', '--no-tags', '--depth=1', 'origin', head], check=True)
              # Exact-byte publication may ONLY extend the static source
              # validator with a pinned profile-byte presence guard; it must
              # never reopen compilation/archive creation or mutate the
              # original source, recipe, builder, or compiled artifact.
              phase = json.loads(pathlib.Path('Current/CURRENT_STATE.json').read_text(
                  encoding='utf-8'))['selected_scope']['phase_c']
              publication = phase.get('fractured_complex_fxdiag1_publication_branch_materialized') is True
              protected = [
                  'Patches/S142AKFXDiag1',
                  'BuildSpecs/S1.42AK-FXDIAG1.json',
                  'BuildSpecs/S1.42AK-FXDIAG1_PLAN.md',
                  'BuildSystem/fxdiag1_review_build.py',
                  'AnalysisTools/validate_s142ak_fxdiag1_build.py',
                  '.github/workflows/s142ak-fxdiag1-source-static.yml',
                  'SourceEvidence/UniversalInteriorViability/FXDIAG1SourceStatic/FINDINGS.md',
                  'RepositoryTools/gale_profile_path_length_guard.py']
              if publication:
                  import hashlib
                  assert phase.get('fractured_complex_fxdiag1_publication_pr') == 362
                  assert phase.get('fractured_complex_fxdiag1_publication_authorized_artifact_id') == 11561251337
                  profile = pathlib.Path('Profiles/LC V1 S1.42AK-FXD1.r2z')
                  assert profile.is_file()
                  assert hashlib.sha256(profile.read_bytes()).hexdigest() == 'b2491e10811310661de76b71e7bf42cf259065e4b363e36d18abfa8457a14435'
                  # Canonical index stage is a metadata-only successor to publication.
                  # No profile or compiled plugin bytes may be reconstructed.
                  index_path = pathlib.Path('ProfileSources/S1.42AK-FXDIAG1/PROFILE_INDEX_RESULT.json')
                  if phase.get('fractured_complex_fxdiag1_indexed') is True:
                      assert phase.get('fractured_complex_fxdiag1_published') is True
                      registry = json.loads(pathlib.Path('Profiles/EXPECTED_HASHES.json').read_text(encoding='utf-8'))
                      meta = registry['Profiles/LC V1 S1.42AK-FXD1.r2z']
                      assert meta['build_id'] == 'S1.42AK-FXDIAG1'
                      assert meta['sha256'] == 'b2491e10811310661de76b71e7bf42cf259065e4b363e36d18abfa8457a14435'
                      assert json.loads(index_path.read_text(encoding='utf-8')) == {
                          'build_id': 'S1.42AK-FXDIAG1',
                          'profile_path': 'Profiles/LC V1 S1.42AK-FXD1.r2z',
                          'profile_name': 'LC V1 S1.42AK-FXD1',
                          'sha256': 'b2491e10811310661de76b71e7bf42cf259065e4b363e36d18abfa8457a14435',
                          'zip_members': 338,
                          'snapshot_dir': 'ProfileSources/S1.42AK-FXDIAG1',
                          'snapshot': {'entries': 338, 'text_entries': 331},
                          'build_id_resolution': 'EXPECTED_HASHES',
                      }, 'canonical index result drift'
                  else:
                      assert phase.get('fractured_complex_fxdiag1_indexed') is False
                      assert not index_path.exists(), 'unexpected canonical index before authorization'
                  validator_blob = subprocess.check_output(
                      ['git', 'hash-object', 'AnalysisTools/validate_s142ak_fxdiag1_source.py'],
                      text=True).strip()
                  if phase.get('fractured_complex_fxdiag1_runtime_authorized') is True:
                      assert phase.get('fractured_complex_fxdiag1_runtime_armed') is True
                      runtime_state = json.loads(pathlib.Path('Current/CURRENT_STATE.json').read_text(encoding='utf-8'))
                      diag = runtime_state['selected_scope']['diagnostic_revision']
                      assert runtime_state['controllers']['runtime_active_build'] == 'S1.42AK-FXDIAG1'
                      assert pathlib.Path('RuntimeInbox/ACTIVE_BUILD.txt').read_text(encoding='utf-8').strip() == 'S1.42AK-FXDIAG1'
                      assert diag['build_id'] == 'S1.42AK-FXDIAG1'
                      assert diag['status'] == 'PUBLISHED_ACTIVE_DIAGNOSTIC_RUNTIME_TARGET_NOT_ACCEPTED'
                      assert diag['classification'] == 'DIAGNOSTIC_ONLY_NEVER_ACCEPT'
                      assert diag['sha256'] == 'b2491e10811310661de76b71e7bf42cf259065e4b363e36d18abfa8457a14435'
                      assert diag['base_sha256'] == '3f9c7fd5c21c532528db1ddae36764ada73236b7527c6ab2ae1b982c3976b7b0'
                      result = json.loads(pathlib.Path('BuildSpecs/S1.42AK-FXDIAG1_BUILD_EVIDENCE/BUILD_RESULT.json').read_text(encoding='utf-8'))
                      assert result['build_id'] == diag['build_id']
                      assert result['output_profile'] == diag['profile'] and result['output_sha256'] == diag['sha256']
                      assert result['base_profile'] == diag['base_profile'] and result['base_sha256'] == diag['base_sha256']
                      assert validator_blob == '062f3ce79b00b657dcb49ff4b536ddb5c7bfa812', 'unapproved activation source-validator modification'
                  else:
                      assert phase.get('fractured_complex_fxdiag1_runtime_authorized') is False
                      assert phase.get('fractured_complex_fxdiag1_runtime_armed') is False
                      assert validator_blob == '1d4571351007bc7dcef199bf094221839a06fc4a', 'unapproved source-validator modification'
                  # This frozen-review guard is changed ONLY to recognize
                  # the publication stage; every other original reviewed
                  # source/recipe/build input remains byte-identical.
              else:
                  protected.extend([
                      'AnalysisTools/validate_s142ak_fxdiag1_source.py',
                      '.github/workflows/s142ak-fxdiag1-build-static.yml'])
              subprocess.run(['git', 'diff', '--exit-code', head, 'HEAD', '--', *protected], check=True)
              print('Exact reviewed FXDIAG1 source/recipe frozen; no repeat compilation, review-profile reconstruction, or artifact upload.')
              print('This lock is not a substitute for the recorded independent artifact download and SHA-256 verification.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('exists=' + str(frozen).lower() + '\n')
          PY
      - uses: actions/setup-python@v5
        if: steps.frozen.outputs.exists != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        if: steps.frozen.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install pinned PE metadata parser
        if: steps.frozen.outputs.exists != 'true'
        run: 'python -m pip install --only-binary=:all: dnfile==0.15.1'
      - name: Re-run pure Fractured Complex fail-closed selection policy
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet run --project Patches/S142AKFXDiag1/Tests/Policy.Tests.csproj -c Release
      - name: Re-verify accepted FXDIAG1 source/static contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_fxdiag1_source.py
      - name: Compile exact integrated source
        if: steps.frozen.outputs.exists != 'true'
        run: dotnet build Patches/S142AKFXDiag1/S142AKFXDiag1.csproj -c Release
      - name: Construct isolated review archive
        if: steps.frozen.outputs.exists != 'true'
        run: python BuildSystem/fxdiag1_review_build.py
      - name: Independently verify assembly and archive contract
        if: steps.frozen.outputs.exists != 'true'
        run: python AnalysisTools/validate_s142ak_fxdiag1_build.py --self-test
      - name: Verify short profile path budget
        if: steps.frozen.outputs.exists != 'true'
        run: python RepositoryTools/gale_profile_path_length_guard.py --spec BuildSpecs/S1.42AK-FXDIAG1.json --self-test
      - name: Freeze successful inactive review artifact
        if: steps.frozen.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-FXDIAG1-review-${{ github.event.pull_request.head.sha }}
          path: review-output/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failure evidence without publishing a profile
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: S1.42AK-FXDIAG1-failure-${{ github.event.pull_request.head.sha }}
          path: review-output/Evidence/
          if-no-files-found: ignore
          retention-days: 90
