name: Exact review BCMER event execution for S1.42AI

on:
  push:
    branches:
      - analysis/s142ai-bcmer-execution-exact
    paths:
      - 'AnalysisTools/inspect_bcmer_execution_exact.py'
      - '.github/workflows/bcmer-execution-exact-review.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned ILSpy
        run: dotnet tool install --global ilspycmd --version 11.0.0.9375
      - name: Capture exact BCMER event-execution evidence
        run: python AnalysisTools/inspect_bcmer_execution_exact.py
      - name: Preserve exact BCMER execution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s142ai-bcmer-execution-exact
          path: bcmer-execution-exact-output/
          if-no-files-found: error
          retention-days: 90
