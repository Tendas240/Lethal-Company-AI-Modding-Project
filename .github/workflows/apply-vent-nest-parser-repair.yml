name: Apply one-shot V81 vent/nest parser repair
on:
  push:
    branches:
      - work/v81-vent-nest-class-header-fix
    paths:
      - '.github/workflows/apply-vent-nest-parser-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply exact class-header parser repair and regression fixture
        shell: python
        run: |
          from pathlib import Path

          path = Path('AnalysisTools/InspectVentNestLifecycleV81.ps1')
          text = path.read_text(encoding='utf-8')

          old_header = r'''    $headerMatch = [regex]::Match($Il, '(?ms)^[\t ]*\.class\b.*?\b' + [regex]::Escape($simpleName) + '\b.*?^[\t ]*\{')
              if (-not $headerMatch.Success) { throw ($TypeName + ': exact IL class header was not found.') }
              $header = $headerMatch.Value.TrimEnd('{').Trim()'''.replace('              ', '    ')

          new_header = r'''    $classMatches = [regex]::Matches($Il, '(?ms)^[\t ]*\.class\b(?<header>(?:(?!^[\t ]*\.class\b).)*?)^[\t ]*\{')
              $headers = @()
              foreach ($classMatch in $classMatches) {
                  $candidate = $classMatch.Value.TrimEnd('{').Trim()
                  $nameMatch = [regex]::Match($candidate, '(?ms)(?<name>[^\s]+)\s+extends\b')
                  if (-not $nameMatch.Success) { continue }
                  $declaredName = $nameMatch.Groups['name'].Value.Trim("'")
                  if ($declaredName -ceq $simpleName) { $headers += $candidate }
              }
              if ($headers.Count -ne 1) { throw ($TypeName + ': expected exactly one exact IL class header, found ' + $headers.Count + '.') }
              $header = $headers[0]'''.replace('              ', '    ')

          old_anchor = r'''    $baseRef = Get-IlBaseTypeReference -Model $nest
              if ($null -eq $baseRef -or $baseRef.AssemblyName -cne 'GameBase' -or $baseRef.TypeName -cne 'Example.NestBase') { throw 'Nest IL base-type reference parsing failed.' }'''.replace('              ', '    ')

          new_anchor = old_anchor + r'''

              $prefixedHeaderFixture = @'
          .class public auto ansi sealed beforefieldinit NoiseAttribute extends [netstandard]System.Attribute
          {
              .method public hidebysig specialname rtspecialname instance void .ctor () cil managed
              {
                  IL_0000: ret
              } // end of method NoiseAttribute::.ctor
          }
          .class public auto ansi beforefieldinit MonoBehaviour extends [UnityEngine.CoreModule]UnityEngine.Behaviour
          {
              .method family hidebysig instance void Awake () cil managed
              {
                  IL_0000: ret
              } // end of method MonoBehaviour::Awake
          }
          '@
              $prefixedHeader = Get-IlTypeModel -Il $prefixedHeaderFixture -TypeName 'UnityEngine.MonoBehaviour'
              $prefixedBaseRef = Get-IlBaseTypeReference -Model $prefixedHeader
              if ($null -eq $prefixedBaseRef -or $prefixedBaseRef.AssemblyName -cne 'UnityEngine.CoreModule' -or $prefixedBaseRef.TypeName -cne 'UnityEngine.Behaviour') { throw 'Prefixed foreign-class header isolation failed.' }'''.replace('              ', '    ').replace('          .', '.', 1)

          old_pass = "    Write-Host 'PASS: IL exact overloads, valid declared-Awake absence, empty-seed binding, base lifecycle parsing, duplicate-Awake rejection, one-hop context, limits and two-file publication.'"
          new_pass = "    Write-Host 'PASS: IL exact overloads, exact class-header isolation, valid declared-Awake absence, empty-seed binding, base lifecycle parsing, duplicate-Awake rejection, one-hop context, limits and two-file publication.'"

          for label, old in [('header parser', old_header), ('regression anchor', old_anchor), ('PASS marker', old_pass)]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one source match, found {count}')

          text = text.replace(old_header, new_header, 1)
          text = text.replace(old_anchor, new_anchor, 1)
          text = text.replace(old_pass, new_pass, 1)
          path.write_text(text, encoding='utf-8', newline='')
      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          git diff -- AnalysisTools/InspectVentNestLifecycleV81.ps1
          test -n "$(git status --porcelain -- AnalysisTools/InspectVentNestLifecycleV81.ps1)"
      - name: Commit repaired helper
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AnalysisTools/InspectVentNestLifecycleV81.ps1
          git commit -m 'Fix exact IL class header selection for V81 base chain'
          git push origin HEAD:${{ github.ref_name }}
