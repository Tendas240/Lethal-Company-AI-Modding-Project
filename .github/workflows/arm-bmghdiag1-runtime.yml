name: Arm BMGHDIAG1 runtime lifecycle

on:
  push:
    branches:
      - lifecycle/bmghdiag1-runtime-arming
    paths:
      - RepositoryTools/arm_bmghdiag1_runtime.py
      - .github/workflows/arm-bmghdiag1-runtime.yml

permissions:
  contents: write

jobs:
  arm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lifecycle/bmghdiag1-runtime-arming
          fetch-depth: 0
      - name: Apply exact runtime arming transition
        run: python RepositoryTools/arm_bmghdiag1_runtime.py
      - name: Commit atomic transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No transition changes were produced.' >&2
            exit 1
          fi
          git commit -m 'Arm S1.42AK-BMGHDIAG1 runtime diagnostic'
          git push origin HEAD:lifecycle/bmghdiag1-runtime-arming
