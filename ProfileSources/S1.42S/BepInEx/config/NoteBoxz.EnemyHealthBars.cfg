## Settings file was created by plugin EnemyHealthBars v1.4.0
## Plugin GUID: NoteBoxz.EnemyHealthBars

[Settings]

## The way the HP Bar will look
# Setting type: HPLayoutEnum
# Default value: Bar
# Acceptable values: Bar, Circle, Text
HP Layout = Bar

# Setting type: VisibiltySettings
# Default value: OnlyShowWhenDamaged
# Acceptable values: AlwaysShow, OnlyShowWhenDamaged
Visibilty Settings = OnlyShowWhenDamaged

## Shows the HP Text ontop of the bar no matter the layout
# Setting type: Boolean
# Default value: true
Show Text On Top = true

# Setting type: Single
# Default value: 35
Visibilty Distance = 12

## Distance at which the health bar begins to fade out. The bar is fully visible closer than this value, and fully invisible at Visibility Distance.
# Setting type: Single
# Default value: 12
Distance Fade Range = 12

# Setting type: Single
# Default value: 5
Visibilty Duration = 5

## The list of enemy names that wont have Health Bars (separated by commas, no spaces in between) (item1,item2,item3...)
# Setting type: String
# Default value: Pikmin,Puffmin,Docile Locust Bees,Manticoil
Enemy Blacklist = Pikmin,Docile Locust Bees,Manticoil

## The Y offset for the defult HealthBar Offset (Will not take affect if Override Offset is set)
# Setting type: Single
# Default value: 0.5
Defult Y Offset = 0.5

## The offset position of the health bar on an enemy. The top of an enemy's hitbox is defult (sperated by spaces, no commas, no brackets) 0 4 0
# Setting type: String
# Default value: 
Override Offset = 

## The size of the Health Bar
# Setting type: Single
# Default value: 1
Scale = 1

## Whether to smoothly interpolate the HP bar or snap directly to the values
# Setting type: Boolean
# Default value: true
Tween HP = true

## Whether to show decimal values in the HP text
# Setting type: Boolean
# Default value: true
Show Decimals = true

## Renders the health bars on top of all world geometry (visible through walls). Disable to let walls occlude them.
# Setting type: Boolean
# Default value: true
Render In Front = true

## The primary color of the Health Bar, (With parentheses, seperated by commas, no spaces, 255 max value, RGBA) (0,255,0,255)
# Setting type: String
# Default value: (0,255,0,255)
Primary Color = (0,255,0,255)

## The secondary color of the Health Bar, (With parentheses, seperated by commas, no spaces, 255 max value, RGBA) (255,0,0,255)
# Setting type: String
# Default value: (255,0,0,255)
Secondary Color = (255,0,0,255)

## The background color of the Health Bar, (With parentheses, seperated by commas, no spaces, 255 max value, RGBA) (0,0,0,200)
# Setting type: String
# Default value: (0,0,0,200)
Background Color = (0,0,0,255)

