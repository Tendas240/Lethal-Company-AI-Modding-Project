[OutOfBounds]

## prevent items from falling below the ship
# Setting type: Boolean
# Default value: true
enabled = true

## vertical offset to apply to objects on load to prevent them from clipping into the floor
# Setting type: Single
# Default value: 0.01
# Acceptable value range: From 0.001 to 1
vertical_offset = 0.01

## Fix items generating inside furniture ( eg: lamps inside the kitchen counter )
# Setting type: Boolean
# Default value: true
spawn_in_furniture = true

[Particles]

## change rendering of the Lightning particles:
## - Vanilla   : no changes!
## - Shape     : show lightning particles as dev intended! (in the shape of the object) 
## - Alternate : particles will show in a sphere around the item
# Setting type: LightningType
# Default value: Shape
# Acceptable values: Vanilla, Shape, Alternate
lightning = Shape

## show crawling bugs particles as dev intended! ( affects Ear, Hand and Thigh )
# Setting type: Boolean
