## Settings file was created by plugin MoreBattery v1.2.6
## Plugin GUID: MoreBattery

[Debug]

## [TESTING ONLY] If true, forces the anti-cheat fallback as if you are in a vanilla lobby (multiplier locked to 1.0x). Leave false for normal gameplay.
# Setting type: Boolean
# Default value: false
ForceAntiCheatTest = false

[General]

## The multiplier applied to the battery life (duration in seconds) of flashlights and light sources. 1.0 keeps it vanilla.
# Setting type: Single
# Default value: 1.5
BatteryMultiplier = 2

## If true, automatically applies the battery multiplier to all items inheriting from FlashlightItem.
# Setting type: Boolean
# Default value: true
ApplyToAllFlashlights = true

## A comma-separated list of additional item names (case-insensitive) to apply the battery multiplier to.
# Setting type: String
# Default value: Lantern,Elite Flashlight,EliteFlashlight
CustomItemNames = Lantern

## A comma-separated list of item names to exclude from receiving the battery multiplier.
# Setting type: String
# Default value: 
ExcludedItemNames = 

## If true, shows a basic text overlay on the screen when holding or using a battery-operated item.
# Setting type: Boolean
# Default value: false
ShowDebugUI = false

